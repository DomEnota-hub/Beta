name: Android black-box baseline

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-blackbox-baseline.yml'
      - 'qa/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blackbox:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout dev18 source snapshot
        uses: actions/checkout@v4
        with:
          repository: DomEnota-hub/Test-
          ref: a3c9861f5d00c4c2993eb405541694ecead7e83a
          path: source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK 34 build tools
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Prepare canonical project
        shell: bash
        run: |
          set -euo pipefail
          cd source
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cp -a patch/. buildsrc/RailBrakeCalculator/
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts

      - name: Build baseline debug APK
        working-directory: source/buildsrc/RailBrakeCalculator
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --console=plain

      - name: Drive dev18 in emulator and capture evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK="$GITHUB_WORKSPACE/source/buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk"
            OUT="$GITHUB_WORKSPACE/qa-output"
            mkdir -p "$OUT"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n ru.railbrake.calculator/.MainActivity
            sleep 2

            dump_ui() {
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml "$1" >/dev/null
            }

            capture() {
              name="$1"
              adb exec-out screencap -p > "$OUT/${name}.png"
              dump_ui "$OUT/${name}.xml"
              adb shell dumpsys activity activities > "$OUT/${name}-activity.txt"
            }

            tap_text() {
              target="$1"
              dump_ui /tmp/window.xml
              coords=$(TARGET="$target" python3 - <<'PY'
            import os,re,xml.etree.ElementTree as ET
            target=os.environ['TARGET']
            root=ET.parse('/tmp/window.xml').getroot()
            nodes=list(root.iter('node'))
            def label(n):
                return (n.attrib.get('text') or n.attrib.get('content-desc') or '').strip()
            matches=[n for n in nodes if label(n)==target]
            if not matches:
                matches=[n for n in nodes if target in label(n)]
            if not matches:
                raise SystemExit(f'UI target not found: {target}')
            b=matches[0].attrib.get('bounds','')
            m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',b)
            if not m:
                raise SystemExit(f'No bounds for {target}: {b}')
            x1,y1,x2,y2=map(int,m.groups())
            print((x1+x2)//2,(y1+y2)//2)
            PY
              )
              read -r x y <<< "$coords"
              adb shell input tap "$x" "$y"
              sleep 1
            }

            open_drawer() {
              tap_text '☰'
            }

            capture home
            open_drawer
            capture drawer_home

            tap_text 'Локомотивы / атлас'
            capture locomotives_root
            open_drawer
            tap_text 'Диагностика'
            capture diagnostics_root
            open_drawer
            tap_text 'Приёмка'
            capture acceptance_root
            open_drawer
            tap_text 'Справочник'
            capture knowledge_root
            open_drawer
            tap_text 'Первая помощь'
            capture first_aid_root
            open_drawer
            tap_text 'Расчёты'
            capture calculations_root
            open_drawer
            tap_text 'История'
            capture history_root
            open_drawer
            tap_text 'Палитра'
            capture palette_root

            adb logcat -d > "$OUT/logcat.txt"

      - name: Upload black-box evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev18-blackbox-baseline
          path: qa-output/
          if-no-files-found: warn
          retention-days: 14
