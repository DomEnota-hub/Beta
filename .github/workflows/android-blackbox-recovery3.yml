name: Android black-box recovery 3

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-blackbox-recovery3.yml'
      - 'qa/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Beta QA files
        uses: actions/checkout@v4
        with:
          path: beta

      - name: Checkout dev18 source snapshot
        uses: actions/checkout@v4
        with:
          repository: DomEnota-hub/Test-
          ref: a3c9861f5d00c4c2993eb405541694ecead7e83a
          path: source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK 34 build tools
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Prepare canonical project
        shell: bash
        run: |
          set -euo pipefail
          cd source
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Apply recovery passes 1-3
        shell: bash
        run: |
          python3 beta/qa/apply_recovery_patch.py source/buildsrc/RailBrakeCalculator
          python3 beta/qa/apply_recovery_patch2.py source/buildsrc/RailBrakeCalculator
          python3 beta/qa/apply_recovery_patch3.py source/buildsrc/RailBrakeCalculator

      - name: Run unit tests
        working-directory: source/buildsrc/RailBrakeCalculator
        shell: bash
        run: gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Build recovery3 debug APK
        working-directory: source/buildsrc/RailBrakeCalculator
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --console=plain

      - name: Drive recovery3 acceptance flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/beta/qa/blackbox_acceptance.sh"

      - name: Upload recovery3 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-beta-recovery3-debug
          path: source/buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-recovery3-blackbox-evidence
          path: qa-output/
          if-no-files-found: warn
          retention-days: 14
