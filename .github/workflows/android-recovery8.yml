name: Android recovery 8 canonical completeness

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-recovery8.yml'
      - 'recovery8/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery8:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Beta recovery files
        uses: actions/checkout@v4
        with:
          path: beta
      - name: Checkout dev18 source snapshot
        uses: actions/checkout@v4
        with:
          repository: DomEnota-hub/Test-
          ref: a3c9861f5d00c4c2993eb405541694ecead7e83a
          path: source
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK build tools
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Prepare project and apply recovery 1-8
        shell: bash
        run: |
          set -euo pipefail
          cd source
          rm -rf buildsrc && mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cp -a patch/. buildsrc/RailBrakeCalculator/
          cd "$GITHUB_WORKSPACE"
          ROOT=source/buildsrc/RailBrakeCalculator
          python3 beta/qa/apply_recovery_patch.py "$ROOT"
          python3 beta/qa/apply_recovery_patch2.py "$ROOT"
          python3 beta/qa/apply_recovery_patch3.py "$ROOT"
          python3 beta/qa/apply_recovery_patch4.py "$ROOT"
          python3 beta/.github/scripts/apply_startup_patch.py "$ROOT"
          python3 beta/qa/apply_recovery_patch5.py "$ROOT"
          python3 beta/recovery6/apply_recovery_patch6.py "$ROOT"
          python3 beta/recovery7/apply_recovery_patch7.py "$ROOT"
          python3 beta/recovery8/apply_recovery_patch8.py "$ROOT"
      - name: Verify recovery8 content is represented
        shell: bash
        run: |
          set -euo pipefail
          CORE=source/buildsrc/RailBrakeCalculator/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          grep -F 'referenceBenchmarks' "$CORE"
          grep -F 'Критические межсистемные связи' "$CORE"
          grep -F 'criticalLinks' "$CORE"
          grep -F 'VL-PN-REF-' "$CORE"
      - name: Run unit tests
        working-directory: source/buildsrc/RailBrakeCalculator
        shell: bash
        run: gradle :app:testDebugUnitTest --stacktrace --console=plain
      - name: Build recovery8 debug APK
        working-directory: source/buildsrc/RailBrakeCalculator
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --console=plain
      - name: Upload recovery8 APK
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-beta-recovery8-debug
          path: source/buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
