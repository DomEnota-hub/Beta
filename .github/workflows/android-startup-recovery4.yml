name: Android startup recovery 4

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-startup-recovery4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Beta recovery files
        uses: actions/checkout@v4
        with:
          path: beta

      - name: Checkout dev18 source snapshot
        uses: actions/checkout@v4
        with:
          repository: DomEnota-hub/Test-
          ref: a3c9861f5d00c4c2993eb405541694ecead7e83a
          path: source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK build tools
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Prepare canonical dev18 project
        shell: bash
        run: |
          set -euo pipefail
          cd source
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cp -a patch/. buildsrc/RailBrakeCalculator/
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts

      - name: Apply recovery passes 1-4
        shell: bash
        run: |
          set -euo pipefail
          python3 beta/qa/apply_recovery_patch.py source/buildsrc/RailBrakeCalculator
          python3 beta/qa/apply_recovery_patch2.py source/buildsrc/RailBrakeCalculator
          python3 beta/qa/apply_recovery_patch3.py source/buildsrc/RailBrakeCalculator
          python3 beta/qa/apply_recovery_patch4.py source/buildsrc/RailBrakeCalculator

      - name: Remove heavy diagnostic catalog initialization from first frame
        shell: bash
        run: python3 beta/.github/scripts/apply_startup_patch.py source/buildsrc/RailBrakeCalculator

      - name: Run unit tests
        working-directory: source/buildsrc/RailBrakeCalculator
        shell: bash
        run: gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Build recovery4 debug APK
        working-directory: source/buildsrc/RailBrakeCalculator
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --console=plain

      - name: Prepare persistent startup smoke script
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/startup-smoke.sh" <<'BASH'
          #!/usr/bin/env bash
          set -uo pipefail
          APK="$GITHUB_WORKSPACE/source/buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk"
          OUT="$GITHUB_WORKSPACE/startup-evidence"
          mkdir -p "$OUT"
          adb install -r "$APK" > "$OUT/install.txt" 2>&1 || exit 21
          adb logcat -c
          adb shell am force-stop ru.railbrake.calculator || true
          adb shell am start -n ru.railbrake.calculator/.MainActivity > "$OUT/start.txt" 2>&1 || true

          ready=0
          for i in $(seq 1 18); do
            adb exec-out screencap -p > "$OUT/frame-$(printf '%02d' "$i").png" 2>/dev/null || true
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "$OUT/window-$(printf '%02d' "$i").xml" >/dev/null 2>&1 || true
            {
              echo "===== sample $i ====="
              adb shell dumpsys meminfo ru.railbrake.calculator 2>/dev/null | head -80 || true
            } >> "$OUT/memory-timeline.txt"
            if grep -qE 'ВЛ80С|Железнодорожный помощник|Диагностические сценарии' "$OUT/window-$(printf '%02d' "$i").xml" 2>/dev/null; then
              ready=1
              echo "$i" > "$OUT/first-ui-sample.txt"
              break
            fi
            sleep 3
          done
          adb shell dumpsys activity activities > "$OUT/activity.txt" 2>&1 || true
          adb logcat -d > "$OUT/logcat.txt" 2>&1 || true
          if [ "$ready" -ne 1 ]; then
            echo 'Main Compose UI did not become observable within smoke window' > "$OUT/result.txt"
            exit 31
          fi
          echo 'Main Compose UI became observable' > "$OUT/result.txt"
          BASH
          chmod +x "$GITHUB_WORKSPACE/startup-smoke.sh"

      - name: Smoke-test cold startup on lighter emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 1536
          script: bash "$GITHUB_WORKSPACE/startup-smoke.sh"

      - name: Upload recovery4 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-beta-recovery4-debug
          path: source/buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-recovery4-startup-evidence
          path: startup-evidence/
          if-no-files-found: warn
          retention-days: 14
