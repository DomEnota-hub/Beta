name: Apply Beta17 Ermak atlas UI

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/apply-beta17-ermak-atlas-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Ensure branch has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          remote_head="$(git rev-parse origin/dev14-integration)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "dev14-integration moved to $remote_head after this workflow was queued; refusing to overwrite it."
            exit 1
          fi

      - name: Apply atlas UI refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_paths = [
              Path("app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt"),
              Path("patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt"),
          ]
          test_paths = [
              Path("app/src/test/java/ru/railbrake/calculator/ui/InteractiveAtlasShortcutTest.kt"),
              Path("patch/app/src/test/java/ru/railbrake/calculator/ui/InteractiveAtlasShortcutTest.kt"),
          ]
          gradle_paths = [Path("app/build.gradle.kts"), Path("patch/app/build.gradle.kts")]

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          for path in source_paths:
              text = path.read_text()
              text = replace_once(
                  text,
                  "import androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.material3.Button",
                  "import androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.material3.AlertDialog\nimport androidx.compose.material3.Button",
                  f"{path}: AlertDialog import",
              )
              text = replace_once(
                  text,
                  '''    .minByOrNull { hotspot -> hotspot.width * hotspot.height }\n\n@Composable\nprivate fun ErmakInteractiveAtlas(''',
                  '''    .minByOrNull { hotspot -> hotspot.width * hotspot.height }\n\ninternal fun ermakAtlasWrapLabel(\n    label: String,\n    maxWidth: Float,\n    maxLines: Int,\n    measureText: (String) -> Float\n): List<String> {\n    val trimmed = label.trim()\n    if (trimmed.isEmpty() || maxWidth <= 0f || maxLines <= 0) return emptyList()\n\n    fun fittingPrefixLength(value: String, width: Float, suffix: String = ""): Int {\n        if (value.isEmpty()) return 0\n        var low = 1\n        var high = value.length\n        var best = 0\n        while (low <= high) {\n            val mid = (low + high) ushr 1\n            if (measureText(value.take(mid) + suffix) <= width) {\n                best = mid\n                low = mid + 1\n            } else {\n                high = mid - 1\n            }\n        }\n        return best\n    }\n\n    val lines = mutableListOf<String>()\n    var remaining = trimmed\n    while (remaining.isNotEmpty() && lines.size < maxLines) {\n        if (measureText(remaining) <= maxWidth) {\n            lines += remaining\n            break\n        }\n\n        val isLastLine = lines.size == maxLines - 1\n        if (isLastLine) {\n            val count = fittingPrefixLength(remaining, maxWidth, "…")\n            val visible = remaining.take(count.coerceAtLeast(1)).trimEnd()\n            lines += "$visible…"\n            break\n        }\n\n        val fitted = fittingPrefixLength(remaining, maxWidth).coerceAtLeast(1)\n        val prefix = remaining.take(fitted)\n        val preferredBreak = sequenceOf(\n            prefix.lastIndexOf(' ') + 1,\n            prefix.lastIndexOf('-') + 1,\n            prefix.lastIndexOf('/') + 1\n        )\n            .filter { it > fitted / 2 }\n            .maxOrNull()\n            ?: fitted\n\n        lines += remaining.take(preferredBreak).trim()\n        remaining = remaining.drop(preferredBreak).trimStart()\n    }\n    return lines\n}\n\n@Composable\nprivate fun ErmakInteractiveAtlas(''',
                  f"{path}: label wrapper helper",
              )
              text = replace_once(
                  text,
                  '''    var selectedId by rememberSaveable(entry.id) { mutableStateOf(entry.hotspots.firstOrNull()?.equipmentId) }\n    var query by rememberSaveable(entry.id) { mutableStateOf("") }''',
                  '''    var selectedId by rememberSaveable(entry.id) { mutableStateOf(entry.hotspots.firstOrNull()?.equipmentId) }\n    var query by rememberSaveable(entry.id) { mutableStateOf("") }\n    var detailsVisible by rememberSaveable(entry.id) { mutableStateOf(false) }''',
                  f"{path}: popup state",
              )
              text = replace_once(
                  text,
                  '''    ) {\n        val equipmentId = selectedId\n        value = if (equipmentId == null) {''',
                  '''    ) {\n        value = false to null\n        val equipmentId = selectedId\n        value = if (equipmentId == null) {''',
                  f"{path}: selected equipment reset",
              )
              text = replace_once(
                  text,
                  '''                                ermakAtlasHitTest(entry.hotspots, sourceX, sourceY)?.let { hotspot ->\n                                    selectedId = hotspot.equipmentId\n                                }''',
                  '''                                ermakAtlasHitTest(entry.hotspots, sourceX, sourceY)?.let { hotspot ->\n                                    selectedId = hotspot.equipmentId\n                                    detailsVisible = true\n                                }''',
                  f"{path}: canvas popup click",
              )
              text = replace_once(
                  text,
                  "                        textSize = 10.dp.toPx()",
                  "                        textSize = 9.dp.toPx()",
                  f"{path}: atlas label size",
              )
              text = replace_once(
                  text,
                  '''                        labelPaint.color = (if (isSelected) Color(0xFF071313) else Color(0xFFE7F0F2)).toArgb()\n                        val compactLabel = hotspot.label.let { label ->\n                            if (label.length <= 21) label else label.take(20).trimEnd() + "…"\n                        }\n                        drawContext.canvas.nativeCanvas.drawText(\n                            compactLabel,\n                            left + 5.dp.toPx(),\n                            top + (height / 2f) + (labelPaint.textSize * 0.35f),\n                            labelPaint\n                        )''',
                  '''                        labelPaint.color = (if (isSelected) Color(0xFF071313) else Color(0xFFE7F0F2)).toArgb()\n                        val horizontalTextPadding = 5.dp.toPx()\n                        val verticalTextPadding = 4.dp.toPx()\n                        val lineHeight = labelPaint.fontSpacing\n                        val maxTextWidth = (width - horizontalTextPadding * 2f).coerceAtLeast(1f)\n                        val maxLines = ((height - verticalTextPadding * 2f) / lineHeight)\n                            .toInt()\n                            .coerceIn(1, 5)\n                        val labelLines = ermakAtlasWrapLabel(\n                            label = hotspot.label,\n                            maxWidth = maxTextWidth,\n                            maxLines = maxLines,\n                            measureText = { value -> labelPaint.measureText(value) }\n                        )\n                        val metrics = labelPaint.fontMetrics\n                        val textBlockHeight = lineHeight * labelLines.size\n                        val firstBaseline = top + ((height - textBlockHeight) / 2f) - metrics.ascent\n                        labelLines.forEachIndexed { index, line ->\n                            drawContext.canvas.nativeCanvas.drawText(\n                                line,\n                                left + horizontalTextPadding,\n                                firstBaseline + index * lineHeight,\n                                labelPaint\n                            )\n                        }''',
                  f"{path}: multiline canvas labels",
              )
              text = replace_once(
                  text,
                  '''            selectedHotspot?.let { hotspot ->\n                Text(hotspot.label, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Black)\n                val equipment = selectedEquipment\n                when {\n                    !selectedEquipmentLoaded -> Text(\n                        "Карточка оборудования загружается…",\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                    equipment != null -> {\n                        technicalEntrySubtitle(equipment)?.let {\n                            Text(it, color = MaterialTheme.colorScheme.onSurfaceVariant)\n                        }\n                        OutlinedButton(\n                            onClick = { onOpen(equipment) },\n                            modifier = Modifier.fillMaxWidth(),\n                            border = BorderStroke(1.dp, Color.Black)\n                        ) { Text("Подробнее") }\n                    }\n                    else -> Text(\n                        "Для выбранной зоны отдельная карточка оборудования пока отсутствует.",\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                }\n            }\n''',
                  "",
                  f"{path}: remove below-map details",
              )
              text = replace_once(
                  text,
                  '''                    OutlinedButton(\n                        onClick = { selectedId = hotspot.equipmentId },\n                        modifier = Modifier.fillMaxWidth(),''',
                  '''                    OutlinedButton(\n                        onClick = {\n                            selectedId = hotspot.equipmentId\n                            detailsVisible = true\n                        },\n                        modifier = Modifier.fillMaxWidth(),''',
                  f"{path}: search popup click",
              )
              text = replace_once(
                  text,
                  '''        }\n    }\n}\n\n@Composable\nprivate fun ErmakSchemeDiagnostics(''',
                  '''        }\n    }\n\n    if (detailsVisible) {\n        selectedHotspot?.let { hotspot ->\n            val equipment = selectedEquipment\n            AlertDialog(\n                onDismissRequest = { detailsVisible = false },\n                title = {\n                    Text(hotspot.label, fontWeight = FontWeight.Black)\n                },\n                text = {\n                    Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                        when {\n                            !selectedEquipmentLoaded -> {\n                                LinearProgressIndicator(modifier = Modifier.fillMaxWidth())\n                                Text(\n                                    "Карточка оборудования загружается…",\n                                    color = MaterialTheme.colorScheme.onSurfaceVariant\n                                )\n                            }\n                            equipment != null -> {\n                                technicalEntrySubtitle(equipment)?.let { subtitle ->\n                                    Text(subtitle, color = MaterialTheme.colorScheme.onSurfaceVariant)\n                                } ?: Text(\n                                    "Для элемента доступна полная карточка оборудования.",\n                                    color = MaterialTheme.colorScheme.onSurfaceVariant\n                                )\n                            }\n                            else -> Text(\n                                "Для выбранной зоны отдельная карточка оборудования пока отсутствует.",\n                                color = MaterialTheme.colorScheme.onSurfaceVariant\n                            )\n                        }\n                    }\n                },\n                confirmButton = {\n                    if (selectedEquipmentLoaded) {\n                        equipment?.let { target ->\n                            TextButton(\n                                onClick = {\n                                    detailsVisible = false\n                                    onOpen(target)\n                                }\n                            ) {\n                                Text("Подробнее")\n                            }\n                        }\n                    }\n                },\n                dismissButton = {\n                    TextButton(onClick = { detailsVisible = false }) {\n                        Text("Закрыть")\n                    }\n                }\n            )\n        }\n    }\n}\n\n@Composable\nprivate fun ErmakSchemeDiagnostics(''',
                  f"{path}: popup dialog",
              )
              path.write_text(text)

          for path in test_paths:
              text = path.read_text()
              text = replace_once(
                  text,
                  '''        assertEquals(null, ermakAtlasHitTest(listOf(large, small), 250f, 200f))\n    }\n}''',
                  '''        assertEquals(null, ermakAtlasHitTest(listOf(large, small), 250f, 200f))\n    }\n\n    @Test\n    fun ermakAtlasLabelWrappingUsesReadableLines() {\n        val lines = ermakAtlasWrapLabel(\n            label = "Тяговый токовый датчик",\n            maxWidth = 10f,\n            maxLines = 3\n        ) { it.length.toFloat() }\n\n        assertEquals(listOf("Тяговый", "токовый", "датчик"), lines)\n    }\n\n    @Test\n    fun ermakAtlasLabelWrappingEllipsizesAtLineBudget() {\n        val lines = ermakAtlasWrapLabel(\n            label = "Оченьдлинноеназваниеаппарата",\n            maxWidth = 8f,\n            maxLines = 2\n        ) { it.length.toFloat() }\n\n        assertEquals(2, lines.size)\n        assertTrue(lines.last().endsWith("…"))\n    }\n}''',
                  f"{path}: wrapping tests",
              )
              path.write_text(text)

          for path in gradle_paths:
              text = path.read_text()
              text = replace_once(text, "versionCode = 161", "versionCode = 162", f"{path}: versionCode")
              text = replace_once(
                  text,
                  'versionName = "1.2.2-dev14-beta16"',
                  'versionName = "1.2.2-dev14-beta17"',
                  f"{path}: versionName",
              )
              path.write_text(text)

          if source_paths[0].read_text() != source_paths[1].read_text():
              raise SystemExit("TechnicalCatalogScreen source mirrors diverged")
          if test_paths[0].read_text() != test_paths[1].read_text():
              raise SystemExit("InteractiveAtlasShortcutTest mirrors diverged")
          if gradle_paths[0].read_text() != gradle_paths[1].read_text():
              raise SystemExit("build.gradle.kts mirrors diverged")
          PY

          git diff --check

      - name: Commit source changes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-beta17-ermak-atlas-ui.yml
          git add app/build.gradle.kts patch/app/build.gradle.kts \
            app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt \
            patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt \
            app/src/test/java/ru/railbrake/calculator/ui/InteractiveAtlasShortcutTest.kt \
            patch/app/src/test/java/ru/railbrake/calculator/ui/InteractiveAtlasShortcutTest.kt
          git diff --cached --check
          git config user.name "DomEnota-hub"
          git config user.email "domenota6212@gmail.com"
          git commit -m "Polish Ermak atlas labels and popup details"

      - name: Push only if branch is still ours
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          remote_head="$(git rev-parse origin/dev14-integration)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "dev14-integration moved to $remote_head while patching; refusing non-fast-forward push."
            exit 1
          fi
          git push origin HEAD:dev14-integration
