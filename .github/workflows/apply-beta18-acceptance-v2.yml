name: Apply Beta18 acceptance improvements v2

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/apply-beta18-acceptance-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Ensure branch has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse origin/dev14-integration)" = "$GITHUB_SHA"

      - name: Reuse verified Beta18 patch logic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-beta18-acceptance.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'beta18_acceptance_patch.py', 'exec'), {})
          PY2

          # The first workflow also strengthened the safe-build workflow. That change is
          # intentionally excluded here because Actions tokens cannot push workflow edits.
          git checkout -- .github/workflows/dev14-safe-build-v2.yml
          git diff --check
          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/java/ru/railbrake/calculator/data/AcceptanceStateRepository.kt patch/app/src/main/java/ru/railbrake/calculator/data/AcceptanceStateRepository.kt
          cmp app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt patch/app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git add app patch
          git diff --cached --check
          git config user.name "DomEnota-hub"
          git config user.email "domenota6212@gmail.com"
          git commit -m "Add Ermak acceptance and editable notes"

      - name: Push only if branch is still ours
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          remote_head="$(git rev-parse origin/dev14-integration)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "dev14-integration moved to $remote_head while patching; refusing non-fast-forward push."
            exit 1
          fi
          git push origin HEAD:dev14-integration
