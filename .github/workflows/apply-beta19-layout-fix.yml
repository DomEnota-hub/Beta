name: Apply Beta19 layout compile fix

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/apply-beta19-layout-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Ensure branch has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse origin/dev14-integration)" = "$GITHUB_SHA"

      - name: Fix acceptance settings row layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt'),
              Path('patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt'),
          ]
          for path in paths:
              text = path.read_text()
              text = text.replace('import androidx.compose.foundation.layout.weight\n', '', 1)
              old = 'Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(2.dp)) {'
              new = 'Column(Modifier.fillMaxWidth(0.78f), verticalArrangement = Arrangement.spacedBy(2.dp)) {'
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one weight layout, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1))
          if paths[0].read_text() != paths[1].read_text():
              raise SystemExit('TechnicalCatalogScreen mirrors diverged')
          PY
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git add app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt
          git diff --cached --check
          git config user.name "DomEnota-hub"
          git config user.email "domenota6212@gmail.com"
          git commit -m "Fix acceptance settings row layout"
          git fetch origin dev14-integration
          test "$(git rev-parse origin/dev14-integration)" = "$GITHUB_SHA"
          git push origin HEAD:dev14-integration
