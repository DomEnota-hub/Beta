name: Apply Beta19 nullability fix

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/apply-beta19-nullability-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Ensure branch has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse origin/dev14-integration)" = "$GITHUB_SHA"

      - name: Fix nullable active acceptance id
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for path in [
              Path('app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt'),
              Path('patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt'),
          ]:
              text = path.read_text()
              old = '''              AcceptanceStatusSelector(\n                  itemId = currentId!!,\n                  itemTitle = technicalEntryTitle(item),\n                  currentState = currentState,\n                  note = currentNote,\n                  onSelect = { option ->\n                      acceptanceRepository.setState(currentId, option)\n                      stateVersion++\n                  },\n                  onSaveNote = { text ->\n                      acceptanceRepository.setNote(currentId, text)\n                      acceptanceRepository.setState(currentId, AcceptanceCheckState.NOTE)\n                      stateVersion++\n                  }\n              )\n              OutlinedButton(\n                  onClick = {\n                      acceptanceRepository.setDisabled(familyKey, currentId, true)'''
              new = '''              val activeId = currentId ?: return@let\n              AcceptanceStatusSelector(\n                  itemId = activeId,\n                  itemTitle = technicalEntryTitle(item),\n                  currentState = currentState,\n                  note = currentNote,\n                  onSelect = { option ->\n                      acceptanceRepository.setState(activeId, option)\n                      stateVersion++\n                  },\n                  onSaveNote = { text ->\n                      acceptanceRepository.setNote(activeId, text)\n                      acceptanceRepository.setState(activeId, AcceptanceCheckState.NOTE)\n                      stateVersion++\n                  }\n              )\n              OutlinedButton(\n                  onClick = {\n                      acceptanceRepository.setDisabled(familyKey, activeId, true)'''
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one nullable-id block, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1))
          if Path('app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt').read_text() != Path('patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt').read_text():
              raise SystemExit('TechnicalCatalogScreen mirrors diverged')
          PY
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git add app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt
          git diff --cached --check
          git config user.name "DomEnota-hub"
          git config user.email "domenota6212@gmail.com"
          git commit -m "Fix acceptance active step nullability"
          git fetch origin dev14-integration
          test "$(git rev-parse origin/dev14-integration)" = "$GITHUB_SHA"
          git push origin HEAD:dev14-integration
