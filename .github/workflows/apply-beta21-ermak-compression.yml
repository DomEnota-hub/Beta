name: Apply Beta21 Ermak compaction

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/apply-beta21-ermak-compression.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev14-integration
          fetch-depth: 1

      - name: Apply patch script
        run: python3 .github/scripts/apply_beta21_ermak_compression.py

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          cmp app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt
          cmp app/build.gradle.kts patch/app/build.gradle.kts
          grep -q 'versionCode = 166' app/build.gradle.kts
          grep -q 'versionName = "1.2.2-dev14-beta21"' app/build.gradle.kts
          test -f app/src/test/java/ru/railbrake/calculator/ui/ErmakCompactPresentationTest.kt

      - name: Commit without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse origin/dev14-integration)" = "$(git rev-parse HEAD)"
          git config user.name "DomEnota-hub"
          git config user.email "domenota6212@gmail.com"
          git rm .github/workflows/apply-beta21-ermak-compression.yml .github/scripts/apply_beta21_ermak_compression.py
          git add app patch
          git commit -m "Compact Ermak technical cards"
          git push origin HEAD:dev14-integration
