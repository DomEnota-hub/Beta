name: Apply Beta22 light theme

on:
  workflow_dispatch:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/apply-beta22-light-theme.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev14-integration
          fetch-depth: 0

      - name: Verify expected base
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/scripts/apply_beta22_light_theme.py
          grep -Fq 'versionName = "1.2.2-dev14-beta21"' app/build.gradle.kts
          grep -Fq 'fun BrakeCalculatorApp(' app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          grep -Fq 'fun RailBrakeTheme' app/src/main/java/ru/railbrake/calculator/ui/theme/Theme.kt

      - name: Apply Beta22 patch
        run: python3 .github/scripts/apply_beta22_light_theme.py

      - name: Verify patch contract
        shell: bash
        run: |
          set -euo pipefail
          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/java/ru/railbrake/calculator/MainActivity.kt patch/app/src/main/java/ru/railbrake/calculator/MainActivity.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt patch/app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/theme/Theme.kt patch/app/src/main/java/ru/railbrake/calculator/ui/theme/Theme.kt
          grep -Fq 'versionName = "1.2.2-dev14-beta22"' app/build.gradle.kts
          grep -Fq 'versionCode = 167' app/build.gradle.kts
          grep -Fq 'AppThemeMode.LIGHT' app/src/main/java/ru/railbrake/calculator/MainActivity.kt
          grep -Fq 'theme_mode' app/src/main/java/ru/railbrake/calculator/MainActivity.kt
          grep -Fq 'lightColorScheme' app/src/main/java/ru/railbrake/calculator/ui/theme/Theme.kt
          grep -Fq 'SectionCard("Тема"' app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt

      - name: Commit Beta22 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app patch
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "Add light and dark app themes"
          git push origin HEAD:dev14-integration
