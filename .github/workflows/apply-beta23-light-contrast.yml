name: Apply Beta23 light contrast

on:
  workflow_dispatch:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/apply-beta23-light-contrast.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev14-integration
          fetch-depth: 0

      - name: Verify expected base
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/scripts/apply_beta23_light_contrast.py
          grep -Fq 'versionName = "1.2.2-dev14-beta22"' app/build.gradle.kts
          grep -Fq 'Интерактивный атлас «Ермак»' app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt
          grep -Fq 'InteractiveSchemeMuted' app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt

      - name: Apply Beta23 patch
        run: python3 .github/scripts/apply_beta23_light_contrast.py

      - name: Verify patch contract
        shell: bash
        run: |
          set -euo pipefail
          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt
          grep -Fq 'versionName = "1.2.2-dev14-beta23"' app/build.gradle.kts
          grep -Fq 'versionCode = 168' app/build.gradle.kts
          grep -Fq 'selectedLabelColor = InteractiveSchemeOnSurface' app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt
          grep -Fq 'focusedTextColor = InteractiveSchemeOnSurface' app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt
          grep -Fq 'unfocusedBorderColor = InteractiveSchemeMuted.copy(alpha = 0.62f)' app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt

      - name: Commit Beta23 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app patch
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "Improve interactive atlas contrast in light theme"
          git push origin HEAD:dev14-integration
