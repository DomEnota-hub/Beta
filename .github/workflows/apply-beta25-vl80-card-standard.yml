name: Apply Beta25 VL80S card standard

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta25-vl80-card-standard.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply VL80S first-batch enrichment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip
          import io
          import json
          from pathlib import Path

          ROOT = Path('.')
          ASSET_PATHS = [
              ROOT / 'app/src/main/assets/technical/vl80s_equipment.json.gz',
              ROOT / 'patch/app/src/main/assets/technical/vl80s_equipment.json.gz',
          ]
          REPO_PATHS = [
              ROOT / 'app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt',
              ROOT / 'patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt',
          ]
          GRADLE_PATHS = [
              ROOT / 'app/build.gradle.kts',
              ROOT / 'patch/app/build.gradle.kts',
          ]

          def read_gz(path):
              with gzip.open(path, 'rt', encoding='utf-8') as f:
                  return json.load(f)

          def write_gz(path, data):
              raw = (json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n').encode('utf-8')
              buf = io.BytesIO()
              with gzip.GzipFile(filename='', mode='wb', fileobj=buf, mtime=0, compresslevel=9) as f:
                  f.write(raw)
              path.write_bytes(buf.getvalue())

          data = read_gz(ASSET_PATHS[0])
          records = data['records']
          by_id = {r['id']: r for r in records}
          expected = {
              'VL-EQ-HV-005', 'VL-EQ-HV-007', 'VL-EQ-TR-012',
              'VL-EQ-PN-011', 'VL-EQ-SF-004', 'VL-EQ-CB-003', 'VL-EQ-HV-002'
          }
          missing = expected - set(by_id)
          if missing:
              raise SystemExit(f'missing equipment records: {sorted(missing)}')

          def set_fields(eid, **fields):
              by_id[eid].update(fields)

          # TPOF-25 current transformer.
          set_fields(
              'VL-EQ-HV-005',
              modelNames=['ТПОФ-25'],
              quantity='2 на двухсекционный электровоз',
              schemeDesignations=['ТТ'],
              principle='Работает в первичной высоковольтной цепи: формирует измерительный сигнал тока для защит и одновременно служит высоковольтным вводом цепи 25 кВ в кузов электровоза.',
              parameters=[
                  'Номинальное напряжение — 25 кВ',
                  'Номинальный первичный ток — 400 А',
                  'Номинальный ток вторичной обмотки — 25 А',
                  'Ток динамической устойчивости (амплитудное значение) — 25 кА',
                  'Ток термической стойкости за 0,1 с — 10 кА',
                  'Масса — 50 кг',
              ],
              normalState=[
                  'Нет повреждений аппарата, фарфорового изолятора, подводящих проводов и контактных соединений; крепления надёжны.',
              ],
              deviationSigns=[
                  'Срабатывает токовая/перегрузочная защита либо имеются признаки повреждения высоковольтной изоляции.',
                  'Ослаблены крепления или контактные соединения, повреждён изолятор или подводящие проводники.',
              ],
              relations=[
                  {'relationType':'works_with','targetId':'VL-EQ-HV-001','note':'работает совместно с главным выключателем в цепи защитного отключения'},
                  {'relationType':'upstream_of','targetId':'VL-EQ-TR-004','note':'находится во входной высоковольтной цепи перед тяговым трансформатором'},
              ],
              notes=['Точное исполнение и маркировку сверять с документацией конкретной секции.'],
              safetyNotes=['Высоковольтный аппарат 25 кВ; любые работы выполняются только по установленному порядку электробезопасности.'],
              sourceRefs=['VL-SRC-006','VL-SRC-014'],
          )

          # D-51 interference-suppression choke. Fix a real catalog error: L-13U1/L-14M1 are pantograph models.
          set_fields(
              'VL-EQ-HV-007',
              aliases=['Д-51','дроссель помех','дроссель помехоподавления'],
              modelNames=['Д-51'],
              quantity='2 на двухсекционный электровоз',
              schemeDesignations=['ДП'],
              principle='Включён в высоковольтную силовую цепь и снижает уровень радиопомех, создаваемых скользящим контактом токоприёмника.',
              parameters=[
                  'Номинальное напряжение относительно земли — 25 кВ',
                  'Номинальный ток — 400 А при скорости электровоза не менее 15 км/ч',
                  'Индуктивность — 200 ± 10 мкГн',
              ],
              normalState=[
                  'Опорный изолятор без трещин и недопустимых сколов; крепления и подводящие соединения надёжны.',
                  'В зимних условиях на дросселе нет снега и льда.',
              ],
              deviationSigns=[
                  'Трещины или сколы изолятора, следы перекрытия, ослабление креплений, загрязнение или обледенение.',
                  'Треск, следы пробоя или необычное свечение на крышевом оборудовании.',
              ],
              relations=[
                  {'relationType':'filters_noise_from','targetId':'VL-EQ-HV-002','note':'подавляет радиопомехи, возникающие при токосъёме'},
              ],
              notes=['Модели Л-13У1 и Л-14М1 относятся к токоприёмнику и удалены из алиасов этой карточки.'],
              safetyNotes=['Крышевое высоковольтное оборудование; осмотр и работы выполняются только при обеспеченном безопасном состоянии по действующим правилам.'],
              sourceRefs=['VL-SRC-006','VL-SRC-014'],
          )

          # Restore L-13U1/L-14M1 to their correct equipment identity.
          pantograph = by_id['VL-EQ-HV-002']
          pantograph['aliases'] = list(dict.fromkeys((pantograph.get('aliases') or []) + ['Л-13У1','Л-14М1']))
          pantograph['modelNames'] = ['Л-13У1','Л-14М1']
          pantograph['quantity'] = '2 на двухсекционный электровоз'

          # ISh-95 inductive shunt.
          set_fields(
              'VL-EQ-TR-012',
              modelNames=['ИШ-95'],
              quantity='8 на двухсекционный электровоз',
              schemeDesignations=['ИШ1…ИШ4 на секцию'],
              principle='Улучшает коммутацию тягового двигателя при переходных процессах и распределяет ток между цепью двигателя и шунтирующим резистором при ослаблении возбуждения.',
              parameters=[
                  'Номинальное напряжение изоляции — 2000 В',
                  'Номинальный ток ветви — 520 А',
                  'Начальная индуктивность при переменном токе до 100 А, 50 Гц — не менее 2 мГн',
                  'Индуктивность при подмагничивании током 520 А — не менее 1,5 мГн',
                  'Активное сопротивление при +20 °C — 0,0051 Ом',
                  'Тепловые потери при +20 °C — 1,4 кВт',
                  'Охлаждение — воздушное принудительное',
                  'Расход охлаждающего воздуха — 20 м³/мин',
                  'Масса — 110 кг',
              ],
              normalState=[
                  'Изоляционные поверхности, катушка, магнитопровод и резьбовые соединения без повреждений; подводящие провода и шины закреплены.',
                  'К шунту обеспечивается предусмотренное принудительное воздушное охлаждение.',
              ],
              deviationSigns=[
                  'Ослабление поля не включается, не подтверждается либо отключается с действием защиты.',
                  'Повреждение изоляции, катушки, магнитопровода, соединений или нарушение охлаждения.',
              ],
              relations=[
                  {'relationType':'works_with','targetId':'VL-EQ-TR-006','note':'работает в цепях ослабления возбуждения тяговых двигателей'},
                  {'relationType':'cooled_by','targetId':'VL-EQ-AU-002','note':'охлаждается системой принудительной вентиляции'},
              ],
              sourceRefs=['VL-SRC-006','VL-SRC-014'],
          )

          # Main-reservoir condensate collectors.
          set_fields(
              'VL-EQ-PN-011',
              aliases=['РС11','РС12','РС13','сборник конденсата'],
              schemeDesignations=['РС11','РС12','РС13'],
              principle='В них собирается конденсат, выделяющийся в главных резервуарах и змеевиках; затем он удаляется в атмосферу через клапаны дистанционной продувки.',
              normalState=[
                  'Конденсат удаляется при штатной продувке; разобщительные краны перед клапанами продувки находятся в нормальном открытом положении.',
              ],
              deviationSigns=[
                  'Конденсат не удаляется при продувке либо имеется утечка в узле.',
                  'Давление в главных резервуарах набирается медленно или быстро падает после остановки компрессоров.',
              ],
              relations=[
                  {'relationType':'collects_from','targetId':'VL-EQ-PN-001','note':'собирает конденсат из группы главных резервуаров и связанных участков'},
                  {'relationType':'drained_by','targetId':'VL-EQ-PN-012','note':'опорожняется через клапаны дистанционной продувки'},
              ],
              sourceRefs=['VL-SRC-004','VL-SRC-006'],
          )

          # Speed recorder / speed indication channel.
          set_fields(
              'VL-EQ-SF-004',
              modelNames=['3СЛ2М-150'],
              quantity='2 на двухсекционный электровоз',
              schemeDesignations=['СМ'],
              principle='Скоростемер получает механический привод от первой колёсной пары через червячный и конический редукторы и регистрирует скорость и связанные параметры движения.',
              parameters=[
                  'Передаточное отношение червячного редуктора — 9',
                  'Хвостовик счётчика — 30 оборотов на 1 км пути',
              ],
              normalState=[
                  'Показания скорости правдоподобны и соответствуют движению.',
                  'При отсоединении от червячного редуктора привод проворачивается свободно, без заеданий.',
              ],
              deviationSigns=[
                  'Показание скорости отсутствует, скачет или противоречит фактическому движению.',
                  'Привод имеет заедание, повреждение валов, редукторов или соединительных рукавов.',
              ],
              relations=[
                  {'relationType':'driven_by','targetId':'VL-EQ-MC-003','note':'получает механический привод от первой колёсной пары'},
              ],
              notes=['Модель в исторических сканах может распознаваться OCR как «ЗСЛ2М-150»; нормативное обозначение карточки сохранено как 3СЛ2М-150.'],
              sourceRefs=['VL-SRC-006','VL-SRC-014'],
          )

          # Horn / whistle.
          set_fields(
              'VL-EQ-CB-003',
              modelNames=['ТС-22','С-17'],
              principle='Звуковые сигналы формируются сжатым воздухом. Тифон имеет электропневматический и пневматический приводы; свисток — электропневматический привод.',
              normalState=[
                  'Тифон и свисток подают предусмотренный звуковой сигнал при штатной проверке.',
                  'Нет явной утечки воздуха и повреждения подводящей пневмолинии.',
              ],
              deviationSigns=[
                  'Нет требуемого звукового сигнала или не срабатывает соответствующий привод.',
                  'Наблюдается утечка воздуха либо повреждение сигнального устройства.',
              ],
              relations=[
                  {'relationType':'air_supplied_by','targetId':'VL-EQ-PN-004','note':'питается сжатым воздухом от вспомогательной пневматической цепи'},
              ],
              notes=['Состав и исполнение звуковых устройств сверять с документацией конкретной секции.'],
              sourceRefs=['VL-SRC-006','VL-SRC-014'],
          )

          data['catalogVersion'] = 'stage2-final-v1.3-vl80-card-standard'
          data['generatedAt'] = '2026-09-22'

          # Contract checks before writing.
          if len(records) != 89:
              raise SystemExit(f'unexpected VL80S equipment count: {len(records)}')
          if any(x in by_id['VL-EQ-HV-007']['aliases'] for x in ['Л-13У1','Л-14М1']):
              raise SystemExit('pantograph aliases still attached to D-51')
          for eid in expected - {'VL-EQ-HV-002'}:
              rec = by_id[eid]
              for key in ('principle','normalState','deviationSigns'):
                  if not rec.get(key):
                      raise SystemExit(f'{eid}: missing {key}')

          for path in ASSET_PATHS:
              write_gz(path, data)
          if ASSET_PATHS[0].read_bytes() != ASSET_PATHS[1].read_bytes():
              raise SystemExit('VL80S equipment mirrors differ')

          old = '''    private fun loadVl80sEquipment(): List<TechnicalEntry> =
        json("technical/vl80s_equipment.json").array("records").objects().map { item ->
            val equipmentId = item.optString("id")
            val canonicalSchemeIds = vl80sSchemeIdsByEquipment[equipmentId].orEmpty()
            val related = buildList {
                addAll(item.array("diagnosticScenarioIds").strings())
                addAll(item.array("relations").objects().mapNotNull { it.optString("targetId").takeIf(String::isNotBlank) })
                addAll(canonicalSchemeIds)
            }.distinct()
            entry(
                item, TechnicalFamily.VL80S, TechnicalSection.EQUIPMENT,
                title = item.optString("name"),
                subtitle = item.optString("purpose"),
                status = item.optString("evidenceStatus"),
                blocks = listOfNotEmpty(
                    block("Назначение", item.optString("purpose")),
                    block("Расположение", item.obj("location").summary()),
                    block("Функциональные связи", item.array("legacyConnections").strings()),
                    block("Обозначения", item.array("aliases").strings()),
                    block("Системы", item.array("systemIds").strings()),
                    block("Схемы", canonicalSchemeIds),
                    block("Диагностика", item.array("diagnosticScenarioIds").strings()),
                    block("Применимость", item.obj("applicability").summary()),
                    block("Особенности", item.array("featureRules").stringsOrSummaries()),
                    block("Источники", item.array("sourceRefs").stringsOrSummaries())
                ),
                relatedIds = related
            )
        }
'''
          new = '''    private fun loadVl80sEquipment(): List<TechnicalEntry> {
        val records = json("technical/vl80s_equipment.json").array("records").objects()
        val equipmentById = records.associateBy { it.optString("id") }

        fun relatedEquipmentLine(relation: JSONObject): String? {
            val targetId = relation.optString("targetId")
            if (targetId.isBlank()) return null
            val targetName = equipmentById[targetId]?.optString("name")?.takeIf(String::isNotBlank) ?: return null
            val note = relation.optString("note").trim()
            return if (note.isBlank()) targetName else "$targetName — $note"
        }

        return records.map { item ->
            val equipmentId = item.optString("id")
            val canonicalSchemeIds = vl80sSchemeIdsByEquipment[equipmentId].orEmpty()
            val relationObjects = item.array("relations").objects()
            val related = buildList {
                addAll(item.array("diagnosticScenarioIds").strings())
                addAll(relationObjects.mapNotNull { it.optString("targetId").takeIf(String::isNotBlank) })
                addAll(canonicalSchemeIds)
            }.distinct()
            entry(
                item, TechnicalFamily.VL80S, TechnicalSection.EQUIPMENT,
                title = item.optString("name"),
                subtitle = item.optString("purpose"),
                status = item.optString("evidenceStatus"),
                blocks = listOfNotEmpty(
                    block("Назначение", item.optString("purpose")),
                    block("Модель / исполнение", item.array("modelNames").strings()),
                    block("Количество", item.optString("quantity")),
                    block("Расположение", item.obj("location").summary()),
                    block("Схемные обозначения", item.array("schemeDesignations").strings()),
                    block("Обозначения и алиасы", item.array("aliases").strings()),
                    block("Как работает", item.optString("principle")),
                    block("Параметры", item.array("parameters").stringsOrSummaries()),
                    block("Нормальное состояние", item.array("normalState").strings()),
                    block("Признаки отклонения", item.array("deviationSigns").strings()),
                    block("Связанное оборудование", relationObjects.mapNotNull(::relatedEquipmentLine).distinct()),
                    block("Функциональные связи", item.array("legacyConnections").strings()),
                    block("Системы", item.array("systemIds").strings()),
                    block("Схемы", canonicalSchemeIds),
                    block("Диагностика", item.array("diagnosticScenarioIds").strings()),
                    block("Применимость", item.obj("applicability").summary()),
                    block("Особенности", item.array("featureRules").stringsOrSummaries()),
                    block("Примечания", item.array("notes").stringsOrSummaries()),
                    block("Безопасность", item.array("safetyNotes").stringsOrSummaries()),
                    block("Источники", item.array("sourceRefs").stringsOrSummaries())
                ),
                relatedIds = related
            )
        }
    }
'''
          for path in REPO_PATHS:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: old VL80 equipment loader not found exactly once')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          for path in GRADLE_PATHS:
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  '// Beta24: dedicated light-theme palette and semantic contrast tokens; helper repair verification build.',
                  '// Beta25: first VL80S equipment-card enrichment using the structured card standard.'
              )
              text = text.replace('versionCode = 169', 'versionCode = 170')
              text = text.replace('versionName = "1.2.2-dev14-beta24"', 'versionName = "1.2.2-dev14-beta25"')
              if 'versionCode = 170' not in text or 'versionName = "1.2.2-dev14-beta25"' not in text:
                  raise SystemExit(f'{path}: version update failed')
              path.write_text(text, encoding='utf-8')

          # Final source-mirror checks.
          if REPO_PATHS[0].read_text(encoding='utf-8') != REPO_PATHS[1].read_text(encoding='utf-8'):
              raise SystemExit('TechnicalDataRepository mirrors differ')
          if GRADLE_PATHS[0].read_text(encoding='utf-8') != GRADLE_PATHS[1].read_text(encoding='utf-8'):
              raise SystemExit('build.gradle mirrors differ')
          PY

          git diff --check
          git status --short

      - name: Commit Beta25 source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app patch
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'Enrich first VL80S equipment cards'
          git pull --rebase origin dev14-integration
          git push origin HEAD:dev14-integration
