name: Apply Beta27 VL80S protection and power-periphery standard

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta27-protection-periphery.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stale branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || {
            echo 'dev14-integration moved after this workflow was queued; aborting without source changes.' >&2
            exit 1
          }

      - name: Enrich Beta27 VL80S protection and power-periphery cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, io, json, re
          from pathlib import Path

          APP = Path('app/src/main/assets/technical/vl80s_equipment.json.gz')
          PATCH = Path('patch/app/src/main/assets/technical/vl80s_equipment.json.gz')
          BUILD_FILES = [Path('app/build.gradle.kts'), Path('patch/app/build.gradle.kts')]

          if APP.read_bytes() != PATCH.read_bytes():
              raise SystemExit('VL80S equipment app/patch mirrors differ before Beta27')

          with gzip.open(APP, 'rt', encoding='utf-8') as f:
              data = json.load(f)
          records = data.get('records', [])
          if len(records) != 89:
              raise SystemExit(f'unexpected VL80S equipment count: {len(records)}')
          by_id = {r.get('id'): r for r in records}

          targets = {
              'VL-EQ-PR-003','VL-EQ-PR-004','VL-EQ-PR-005','VL-EQ-TR-010',
              'VL-EQ-TR-011','VL-EQ-HV-004','VL-EQ-HV-006','VL-EQ-HV-008'
          }
          required_rel_targets = {
              'VL-EQ-HV-001','VL-EQ-HV-002','VL-EQ-PR-001','VL-EQ-TR-001',
              'VL-EQ-TR-002','VL-EQ-TR-003','VL-EQ-TR-004','VL-EQ-TR-006'
          }
          missing = (targets | required_rel_targets) - set(by_id)
          if missing:
              raise SystemExit(f'missing required equipment records: {sorted(missing)}')

          def merge_sources(rec, *refs):
              rec['sourceRefs'] = list(dict.fromkeys((rec.get('sourceRefs') or []) + list(refs)))

          def set_fields(eid, **fields):
              by_id[eid].update(fields)

          late_vu_rule = {
              'feature':'vu_protection_rp21_22',
              'condition':'section.variantBucket in [vl80s_2349_2653, vl80s_2654plus] unless actualEquipmentOverrides says otherwise',
              'affects':'configuration',
              'sourceRefs':['VL-SRC-009','VL-SRC-011'],
              'confidence':'secondary_crosschecked',
              'note':'С №2349 защита выпрямительной установки изменена: вместо дифференциальных реле 21/22 БРД применены токовые реле 21/22; фактическое исполнение сверять по секции.'
          }

          # Differential relay block BRD-356.
          set_fields(
              'VL-EQ-PR-003',
              modelNames=['БРД-356'],
              quantity='До изменения с №2349 — один блок на секцию, содержащий два дифференциальных реле 21 и 22; для более поздних секций конфигурация защиты выпрямительной установки иная.',
              location={'text':'На тяговом трансформаторе; элементы защитной цепи связаны с панелями защит','confidence':'source_confirmed'},
              schemeDesignations=['21','22'],
              purpose='До изменения с №2349 контролирует дифференциальные токи цепей выпрямительных установок и при аварийном небалансе формирует действие на отключение главного выключателя.',
              principle='Два дифференциальных реле сравнивают токовые условия соответствующих силовых ветвей. Аварийный небаланс, возникающий в том числе при повреждении выпрямительной установки или перекрытии в цепи тягового двигателя, приводит к срабатыванию защиты и отключению главного выключателя.',
              parameters=[
                  'БРД-356: два дифференциальных реле 21 и 22',
                  'Дифференциальный ток срабатывания по техническому описанию — около 500 А',
                  'Время срабатывания — до 0,01 с',
              ],
              normalState=[
                  'Реле не находится в сработавшем состоянии при исправной силовой цепи и отсутствии аварийного небаланса токов.',
                  'Крепление блока и доступные соединения без ослабления, повреждения и следов перегрева.',
              ],
              deviationSigns=[
                  'Срабатывание защиты с отключением главного выключателя при повреждении выпрямительной установки или связанном аварийном токовом небалансе.',
                  'Повторное действие защиты требует поиска причины в защищаемой силовой цепи; само срабатывание БРД не определяет единственное место повреждения.',
                  'Повреждение корпуса, соединений или следы перегрева самого блока требуют отдельной проверки аппарата.',
              ],
              relations=[
                  {'relationType':'protects','targetId':'VL-EQ-TR-003','note':'контролирует аварийный токовый небаланс, связанный с цепями выпрямительных установок'},
                  {'relationType':'acts_on','targetId':'VL-EQ-HV-001','note':'при срабатывании защиты формируется отключение главного выключателя'},
                  {'relationType':'mounted_on','targetId':'VL-EQ-TR-004','note':'блок БРД-356 размещён на тяговом трансформаторе'},
              ],
              notes=[
                  'С №2349 в защите выпрямительной установки реле 21 и 22 БРД заменены токовыми реле; БРД-356 нельзя считать неизменным аппаратом для всех секций ВЛ80С.',
              ],
              featureRules=[late_vu_rule],
          )
          merge_sources(by_id['VL-EQ-PR-003'], 'VL-SRC-006','VL-SRC-009','VL-SRC-011')

          # Main traction overload relays; keep rheostatic-braking and late rectifier relays distinct.
          set_fields(
              'VL-EQ-PR-004',
              modelNames=['РТ-253','РТ-255 (отдельные поздние функции защиты)'],
              quantity='Основная защита тяговых двигателей — четыре реле РП1–РП4 на секцию; на поздних секциях отдельные реле 21/22 защиты выпрямительных установок имеют другую функцию и исполнение.',
              location={'text':'РП1–РП2 — БСА1, РП3–РП4 — БСА2; другие токовые реле защиты размещаются согласно схеме конкретного исполнения','confidence':'source_confirmed'},
              schemeDesignations=['РП1','РП2','РП3','РП4'],
              purpose='Контролируют ток тяговых двигателей и при недопустимой перегрузке формируют защитное действие на отключение главного выключателя.',
              principle='Реле РП1–РП4 типа РТ-253 включены в соответствующие силовые ветви тяговых двигателей. При достижении тока уставки реле срабатывает и через цепи защиты вызывает отключение главного выключателя.',
              parameters=[
                  'РП1–РП4: тип РТ-253',
                  'Ток срабатывания РП1–РП4 по техническому описанию — 1500 ± 50 А',
              ],
              normalState=[
                  'РП1–РП4 не сработаны при штатных токах тяговых двигателей.',
                  'Корпуса, крепления и доступные соединения реле без следов перегрева и механических повреждений.',
              ],
              deviationSigns=[
                  'Срабатывание защиты при реальном росте тока тяговой ветви выше уставки.',
                  'Необоснованное или повторяющееся действие при нормальном токе требует разграничить неисправность силовой цепи, измерительного тракта и самого реле.',
                  'Отказ реле при фактической перегрузке является отдельной неисправностью аппарата защиты.',
              ],
              relations=[
                  {'relationType':'protects','targetId':'VL-EQ-TR-006','note':'РП1–РП4 контролируют токи соответствующих тяговых двигателей'},
                  {'relationType':'located_in','targetId':'VL-EQ-TR-002','note':'основные реле перегрузки размещены в блоках силовых аппаратов БСА1 и БСА2'},
                  {'relationType':'acts_on','targetId':'VL-EQ-HV-001','note':'срабатывание основной токовой защиты приводит к отключению главного выключателя'},
              ],
              notes=[
                  'Уставки РП1–РП4 нельзя переносить на реле перегрузки реостатного торможения или на поздние реле 21/22 защиты выпрямительных установок: это разные функции и аппараты.',
                  'Для реле 21/22 поздней защиты ВУ опубликованные источники дают различающиеся численные уставки, поэтому универсальное значение в карточку не внесено.',
              ],
              featureRules=[late_vu_rule],
          )
          merge_sources(by_id['VL-EQ-PR-004'], 'VL-SRC-006','VL-SRC-009','VL-SRC-011')

          # Earth relay.
          set_fields(
              'VL-EQ-PR-005',
              modelNames=['РЗ-303'],
              quantity='1 реле на секцию в базовой силовой схеме',
              location={'text':'Панель №4 цепей защиты силовой цепи','confidence':'source_confirmed'},
              schemeDesignations=['88'],
              purpose='Контролирует замыкание силовой цепи относительно корпуса и при действии защиты участвует в отключении главного выключателя.',
              principle='Реле РЗ-303 контролирует состояние силовой цепи относительно корпуса. При появлении тока, соответствующего нарушению изоляции на корпус, реле срабатывает; его контакты воздействуют на цепь удержания главного выключателя и сигнализацию РЗ.',
              parameters=[
                  'Тип — РЗ-303',
                  'Обозначение в базовой схеме — 88',
              ],
              normalState=[
                  'Реле не сработано, сигнализация РЗ отсутствует при исправной изоляции силовой цепи.',
                  'Крепление, корпус и доступные соединения реле без повреждений и следов перегрева.',
              ],
              deviationSigns=[
                  'Срабатывание реле и появление сигнализации РЗ указывают на действие защиты по цепи контроля замыкания на корпус.',
                  'Факт срабатывания не определяет место повреждения: причиной может быть любой контролируемый участок силовой цепи, поэтому локализация выполняется отдельно.',
                  'Повторное или необоснованное действие требует проверки как изоляции силовой цепи, так и самого реле/его цепей.',
              ],
              relations=[
                  {'relationType':'acts_on','targetId':'VL-EQ-HV-001','note':'контакт реле включён в защитную цепь главного выключателя'},
                  {'relationType':'part_of','targetId':'VL-EQ-PR-001','note':'входит в систему реле и цепей защит ВЛ80С'},
              ],
              notes=[
                  'Срабатывание РЗ — признак действия защиты, а не доказательство конкретного места замыкания на корпус.',
              ],
          )
          merge_sources(by_id['VL-EQ-PR-005'], 'VL-SRC-006')

          # Smoothing reactors.
          set_fields(
              'VL-EQ-TR-010',
              modelNames=['РС-53'],
              quantity='2 на секцию — аппараты 55 и 56',
              location={'text':'В силовой аппаратной зоне под выпрямительными установками ВУ1 и ВУ2; каждый реактор связан со своей ветвью','confidence':'source_confirmed'},
              schemeDesignations=['55','56'],
              principle='После выпрямительной установки реактор включён последовательно в тяговую ветвь и за счёт индуктивности уменьшает пульсации выпрямленного тока, улучшая условия коммутации тяговых двигателей.',
              parameters=[
                  'Тип — РС-53',
                  'Часовой ток — 1850 А',
                  'Номинальное напряжение — 1500 В',
                  'Число витков — 70',
                  'Масса — около 800 кг',
              ],
              normalState=[
                  'Нет запаха перегрева, дыма, следов повреждения изоляции или ослабления доступных силовых соединений.',
                  'Охлаждение соответствующей ветви работает штатно; нет выраженного локального перегрева корпуса и соединений.',
              ],
              deviationSigns=[
                  'Перегрев, запах изоляции, дым или видимое повреждение изоляции/соединений реактора.',
                  'Обрыв или нарушение соединения в ветви может сопровождаться ненормальным токораспределением и действием защит.',
                  'Необычный нагрев при нормальном токе требует проверки самого реактора и его охлаждения/соединений.',
              ],
              relations=[
                  {'relationType':'fed_from','targetId':'VL-EQ-TR-003','note':'получает выпрямленный тяговый ток от соответствующей выпрямительной установки'},
                  {'relationType':'feeds','targetId':'VL-EQ-TR-006','note':'сглаженный ток далее поступает в цепь тяговых двигателей'},
              ],
              notes=[
                  'В опубликованных технических описаниях встречаются различающиеся значения индуктивности и расхода охлаждающего воздуха РС-53; эти цифры намеренно не приведены как универсальные без привязки к исполнению.',
              ],
          )
          merge_sources(by_id['VL-EQ-TR-010'], 'VL-SRC-006','VL-SRC-008')

          # Transition reactor set.
          set_fields(
              'VL-EQ-TR-011',
              modelNames=['ПРА-48'],
              quantity='1 комплект на секцию; комплект содержит два реактора, работающих в соответствующих ветвях переходной схемы',
              location={'text':'На тяговом трансформаторе, под электропневматическим переключателем ступеней ЭКГ','confidence':'source_confirmed'},
              schemeDesignations=['25'],
              principle='При переходах ЭКГ реакторы участвуют в делении напряжения и ограничивают ток замыкания секций регулировочной обмотки, позволяя выполнять переход между ступенями без разрыва тока тяговых двигателей.',
              parameters=[
                  'Тип — ПРА-48',
                  'Длительный ток ветви — 1270 А',
                  'Индуктивное сопротивление — 0,12 Ом',
                  'Номинальное напряжение между выводами — 146 В',
                  'Масса комплекта — около 450 кг',
              ],
              normalState=[
                  'Нет следов перегрева, повреждения изоляции, ослабления креплений или силовых соединений.',
                  'Переходы ЭКГ проходят без признаков аномального затягивания или повторяющегося защитного действия, относимого к переходной силовой цепи.',
              ],
              deviationSigns=[
                  'Перегрев, запах изоляции или видимое повреждение реактора/соединений.',
                  'Нарушение переходного процесса ЭКГ может быть связано с реактором, но само по себе не доказывает его неисправность.',
                  'Обрыв или нарушение соединения ветви требует разграничения неисправности реактора, ЭКГ и силовой коммутационной цепи.',
              ],
              relations=[
                  {'relationType':'works_with','targetId':'VL-EQ-TR-001','note':'участвует в переходном процессе при переключении ступеней ЭКГ'},
                  {'relationType':'mounted_on','targetId':'VL-EQ-TR-004','note':'комплект расположен на тяговом трансформаторе под ЭКГ'},
              ],
              notes=[
                  'В разных технических источниках встречаются различающиеся значения часового тока ПРА-48; универсальная цифра для этого параметра в карточку не внесена.',
              ],
          )
          merge_sources(by_id['VL-EQ-TR-011'], 'VL-SRC-006','VL-SRC-008')

          # Roof disconnector RVN-2. No manual switching procedure is provided.
          set_fields(
              'VL-EQ-HV-004',
              modelNames=['РВН-2'],
              quantity='В базовой крышевой схеме используются разъединители 2 и 6; фактическое количество и назначение проверять по схеме конкретного исполнения.',
              location={'text':'На крыше; приводные рукоятки выведены в высоковольтную камеру над тяговым трансформатором','confidence':'source_confirmed'},
              schemeDesignations=['2','6'],
              principle='РВН-2 создаёт видимый электрический разрыв высоковольтной крышевой цепи в предусмотренной схемой конфигурации. Аппарат не предназначен для коммутации тока нагрузки и применяется только в обесточенной цепи.',
              parameters=[
                  'Тип — РВН-2',
                  'Номинальное напряжение — 25 кВ',
                  'Номинальный ток — 630 А',
                  'Дугогасительное устройство отсутствует',
                  'Масса — около 90 кг',
              ],
              normalState=[
                  'В поездной конфигурации предусмотренные схемой разъединители находятся во включённом положении.',
                  'Ножи, изоляторы и доступные соединения без трещин, следов перекрытия, оплавления, ослабления и ненормального нагрева.',
              ],
              deviationSigns=[
                  'Непредусмотренное положение разъединителя может разорвать высоковольтную цепь и препятствовать нормальному включению силовой схемы.',
                  'Следы дуги, оплавления, трещины изоляторов или ослабление силовых соединений являются признаками неисправности крышевого высоковольтного узла.',
              ],
              relations=[
                  {'relationType':'connects_to','targetId':'VL-EQ-HV-002','note':'разъединитель 2 используется в крышевой цепи токоприёмника'},
                  {'relationType':'connects_to','targetId':'VL-EQ-HV-008','note':'входит в систему крышевых высоковольтных шин и межсекционных соединений'},
                  {'relationType':'upstream_of','targetId':'VL-EQ-HV-001','note':'является частью высоковольтного пути до главного выключателя'},
              ],
              safetyNotes=[
                  'РВН-2 не предназначен для коммутации под током. Любые операции с крышевым высоковольтным оборудованием выполняются только по установленным правилам допуска и снятия напряжения.',
              ],
          )
          merge_sources(by_id['VL-EQ-HV-004'], 'VL-SRC-006','VL-SRC-008')

          # Roof atmospheric overvoltage protection. Correct the previous RVMK-IV misclassification.
          hv6 = by_id['VL-EQ-HV-006']
          hv6['name'] = 'Крышевой разрядник / ограничитель перенапряжений'
          hv6['aliases'] = ['РВЭ-25М','ОПН-25','ОПН-25УХЛ1','разрядник','ограничитель перенапряжений']
          set_fields(
              'VL-EQ-HV-006',
              modelNames=['РВЭ-25М','ОПН-25УХЛ1'],
              quantity='1 аппарат защиты от атмосферных перенапряжений в крышевой высоковольтной цепи секции; конкретный тип зависит от исполнения и периода выпуска',
              location={'text':'На крыше в высоковольтной цепи контактной сети','confidence':'source_confirmed'},
              schemeDesignations=['5'],
              purpose='Защищает крышевую высоковольтную цепь и подключённое оборудование от атмосферных перенапряжений со стороны контактной сети.',
              principle='При перенапряжении аппарат ограничивает напряжение относительно земли: в раннем исполнении эту функцию выполняет вентильный разрядник РВЭ-25М, в более позднем — нелинейный ограничитель перенапряжений ОПН-25УХЛ1. Их внутренний принцип действия различается, поэтому параметры одного исполнения нельзя переносить на другое.',
              parameters=[
                  'Раннее исполнение — вентильный разрядник РВЭ-25М',
                  'Позднее исполнение — ОПН-25УХЛ1 на основе нелинейных оксидно-цинковых элементов',
              ],
              normalState=[
                  'Корпус и изоляционная часть без трещин, сколов, следов перекрытия, оплавления и выраженного загрязнения.',
                  'Крепление и высоковольтные соединения без ослабления и следов ненормального нагрева.',
              ],
              deviationSigns=[
                  'Трещины, сколы, следы дуги или перекрытия, оплавление либо повреждение высоковольтных соединений.',
                  'Повторяющиеся признаки перекрытия крышевой изоляции требуют проверки всего высоковольтного крышевого тракта, а не только ограничителя.',
              ],
              relations=[
                  {'relationType':'connected_to','targetId':'VL-EQ-HV-008','note':'подключён к крышевой высоковольтной цепи для ограничения атмосферных перенапряжений'},
                  {'relationType':'protects_path_to','targetId':'VL-EQ-HV-001','note':'ограничивает перенапряжения на высоковольтном пути к главному выключателю и последующему оборудованию'},
              ],
              notes=[
                  'В технической литературе отмечена замена РВЭ-25М на ОПН-25УХЛ1 с №1187; для конкретной секции приоритет имеет фактическая комплектация.',
                  'РВМК-IV исключён из alias этой карточки: это отдельный аппарат защиты от коммутационных перенапряжений во вторичной силовой цепи у тягового трансформатора, а не крышевой разрядник. Новая отдельная карточка в Beta27 не создаётся, чтобы сохранить утверждённые 89 записей.',
              ],
              safetyNotes=[
                  'Аппарат находится в крышевой высоковольтной цепи 25 кВ; осмотр и работы выполняются только в рамках установленного допуска и мер электробезопасности.',
              ],
          )
          merge_sources(hv6, 'VL-SRC-006','VL-SRC-008','VL-SRC-009')
          if 'РВМК-IV' in hv6.get('aliases', []):
              raise SystemExit('RVMK-IV must not remain an alias of the roof surge-protection card')

          # Roof high-voltage buses.
          set_fields(
              'VL-EQ-HV-008',
              quantity='Комплект токоведущих шинных соединений на секцию; число отдельных участков определяется крышевой схемой конкретного исполнения',
              location={'text':'На крыше между токоприёмником, разъединителями и аппаратом высоковольтного ввода','confidence':'source_confirmed'},
              principle='Жёсткие шинные участки передают напряжение контактной сети между крышевыми аппаратами, а гибкие медные соединения и компенсирующие участки обеспечивают электрическую непрерывность при взаимных перемещениях и температурных деформациях.',
              parameters=[
                  'Основные жёсткие шины выполняются трубчатого стального сечения',
                  'В местах, где требуется подвижность соединения, применяются гибкие медные шунты',
                  'Контактные поверхности соединений защищаются от ухудшения электрического контакта',
              ],
              normalState=[
                  'Шины и гибкие соединения без деформации, трещин, обрыва жил, следов дуги и оплавления.',
                  'Изоляторы и опоры без трещин и следов перекрытия; силовые соединения не имеют видимых признаков ослабления или перегрева.',
              ],
              deviationSigns=[
                  'Следы дуги, оплавления или локального перегрева в месте соединения.',
                  'Ослабление крепления, деформация шины, повреждение гибкого шунта или изоляционной опоры.',
                  'Загрязнение и следы поверхностного перекрытия в высоковольтном крышевом тракте.',
              ],
              relations=[
                  {'relationType':'connects','targetId':'VL-EQ-HV-002','note':'принимает напряжение от токоприёмника'},
                  {'relationType':'connects','targetId':'VL-EQ-HV-004','note':'образует токоведущий путь через крышевые разъединители'},
                  {'relationType':'connects','targetId':'VL-EQ-HV-006','note':'связана с аппаратом ограничения атмосферных перенапряжений'},
                  {'relationType':'feeds','targetId':'VL-EQ-HV-001','note':'передаёт напряжение по крышевому высоковольтному тракту к главному выключателю'},
              ],
              notes=[
                  'Точный маршрут и компоновка шин зависят от исполнения крышевого оборудования; карточка не подменяет схему конкретной секции.',
              ],
              safetyNotes=[
                  'Крышевые шины относятся к высоковольтной цепи 25 кВ; любые работы выполняются только по установленному порядку допуска и снятия напряжения.',
              ],
          )
          merge_sources(by_id['VL-EQ-HV-008'], 'VL-SRC-006','VL-SRC-008')

          # Validate relation targets and required enrichment without inventing schemes.
          ids = set(by_id)
          for rec in records:
              for rel in rec.get('relations') or []:
                  if isinstance(rel, dict):
                      target = rel.get('targetId')
                      if isinstance(target, str) and target.startswith('VL-EQ-') and target not in ids:
                          raise SystemExit(f"broken equipment relation: {rec.get('id')} -> {target}")

          for eid in targets:
              rec = by_id[eid]
              for key in ('purpose','quantity','principle','normalState','deviationSigns','relations','sourceRefs'):
                  if not rec.get(key):
                      raise SystemExit(f'{eid}: missing required Beta27 field {key}')

          # No new equipment records, diagnostic scenarios, acceptance logic or scheme files.
          data['catalogVersion'] = 'stage2-final-v1.5-vl80-protection-periphery-standard'
          data['generatedAt'] = '2026-09-22'
          raw = (json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n').encode('utf-8')

          def write_gzip(path):
              buf = io.BytesIO()
              with gzip.GzipFile(filename='', mode='wb', fileobj=buf, mtime=0, compresslevel=9) as g:
                  g.write(raw)
              path.write_bytes(buf.getvalue())

          write_gzip(APP)
          write_gzip(PATCH)
          if APP.read_bytes() != PATCH.read_bytes():
              raise SystemExit('VL80S equipment app/patch mirrors differ after Beta27')

          for path in BUILD_FILES:
              text = path.read_text(encoding='utf-8')
              text, n_comment = re.subn(
                  r'// Beta26: second VL80S equipment-card enrichment — mechanical nodes\.',
                  '// Beta27: VL80S protection and power-periphery card enrichment.',
                  text,
                  count=1,
              )
              text, n_code = re.subn(r'versionCode = 171\b', 'versionCode = 172', text, count=1)
              text, n_name = re.subn(r'versionName = "1\.2\.2-dev14-beta26"', 'versionName = "1.2.2-dev14-beta27"', text, count=1)
              if n_comment != 1 or n_code != 1 or n_name != 1:
                  raise SystemExit(f'{path}: Beta26 build identity not found exactly once')
              path.write_text(text, encoding='utf-8')

          if BUILD_FILES[0].read_bytes() != BUILD_FILES[1].read_bytes():
              raise SystemExit('build.gradle.kts app/patch mirrors differ after Beta27')

          with gzip.open(APP, 'rt', encoding='utf-8') as f:
              check = json.load(f)
          if len(check.get('records', [])) != 89:
              raise SystemExit('VL80S equipment count changed during Beta27')
          check_by = {r['id']: r for r in check['records']}
          if 'РВМК-IV' in check_by['VL-EQ-HV-006'].get('aliases', []):
              raise SystemExit('RVMK-IV classification correction did not persist')
          PY

          git diff --check
          git status --short

      - name: Recheck branch immediately before source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || {
            echo 'dev14-integration moved while Beta27 patch was being prepared; aborting without commit.' >&2
            exit 1
          }

      - name: Commit Beta27 source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/assets/technical/vl80s_equipment.json.gz \
            patch/app/src/main/assets/technical/vl80s_equipment.json.gz \
            app/build.gradle.kts \
            patch/app/build.gradle.kts
          git diff --cached --quiet && { echo 'No Beta27 source changes to commit'; exit 1; }
          git commit -m 'Enrich VL80S protection and power-periphery cards'
          git push origin HEAD:dev14-integration

      - name: Verify pushed HEAD and dispatch Dev14 safe build v2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || {
            echo 'Branch moved immediately after Beta27 push; refusing to dispatch build for an ambiguous HEAD.' >&2
            exit 1
          }
          gh workflow run dev14-safe-build-v2.yml --repo DomEnota-hub/Beta --ref dev14-integration
