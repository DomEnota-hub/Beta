name: Apply Beta28 safety menu entry

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta28-safety-menu.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stale branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || {
            echo 'dev14-integration moved after this workflow was queued; aborting without source changes.' >&2
            exit 1
          }

      - name: Add dedicated Safety drawer entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          UI_FILES = [
              Path('app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt'),
              Path('patch/app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt'),
          ]
          BUILD_FILES = [Path('app/build.gradle.kts'), Path('patch/app/build.gradle.kts')]

          if UI_FILES[0].read_bytes() != UI_FILES[1].read_bytes():
              raise SystemExit('BrakeCalculatorApp app/patch mirrors differ before Beta28')
          if BUILD_FILES[0].read_bytes() != BUILD_FILES[1].read_bytes():
              raise SystemExit('build.gradle.kts app/patch mirrors differ before Beta28')

          for path in UI_FILES:
              text = path.read_text(encoding='utf-8')

              replacements = [
                  (
                      '    KNOWLEDGE("Справочник"),\n    FIRST_AID("Первая помощь"),',
                      '    KNOWLEDGE("Справочник"),\n    SAFETY("Охрана труда"),\n    FIRST_AID("Первая помощь"),',
                      'AppScreen enum',
                  ),
                  (
                      '    var knowledgeRootVersion by rememberSaveable { mutableIntStateOf(0) }\n    var firstAidRootVersion by rememberSaveable { mutableIntStateOf(0) }',
                      '    var knowledgeRootVersion by rememberSaveable { mutableIntStateOf(0) }\n    var safetyRootVersion by rememberSaveable { mutableIntStateOf(0) }\n    var firstAidRootVersion by rememberSaveable { mutableIntStateOf(0) }',
                      'safety root state',
                  ),
                  (
                      '                val mainItems = listOf(AppScreen.HOME, AppScreen.DIAGNOSTICS, AppScreen.LOCOMOTIVES, AppScreen.ACCEPTANCE, AppScreen.KNOWLEDGE, AppScreen.FIRST_AID)',
                      '                val mainItems = listOf(AppScreen.HOME, AppScreen.DIAGNOSTICS, AppScreen.LOCOMOTIVES, AppScreen.ACCEPTANCE, AppScreen.KNOWLEDGE, AppScreen.SAFETY, AppScreen.FIRST_AID)',
                      'drawer items',
                  ),
                  (
                      '                                AppScreen.FIRST_AID -> firstAidRootVersion++',
                      '                                AppScreen.SAFETY -> {\n                                    technicalFamilyName = TechnicalFamily.VL80S.name\n                                    technicalSectionName = TechnicalSection.SAFETY.name\n                                    technicalInitialEntryId = null\n                                    safetyRootVersion++\n                                }\n                                AppScreen.FIRST_AID -> firstAidRootVersion++',
                      'drawer click',
                  ),
                  (
                      '                AppScreen.FIRST_AID -> key(firstAidRootVersion) {',
                      '                AppScreen.SAFETY -> key(safetyRootVersion) {\n                    TechnicalCatalogScreen(\n                        initialFamily = runCatching { TechnicalFamily.valueOf(technicalFamilyName) }.getOrDefault(TechnicalFamily.VL80S),\n                        initialSection = TechnicalSection.SAFETY,\n                        sectionBackLabel = "Главная",\n                        onSectionBack = { screenName = AppScreen.HOME.name },\n                        lockFamily = false,\n                        lockSection = true\n                    )\n                }\n                AppScreen.FIRST_AID -> key(firstAidRootVersion) {',
                      'safety screen',
                  ),
              ]

              for old, new, label in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: {label} anchor count={text.count(old)}')
                  text = text.replace(old, new, 1)

              required = [
                  'SAFETY("Охрана труда")',
                  'AppScreen.KNOWLEDGE, AppScreen.SAFETY, AppScreen.FIRST_AID',
                  'technicalSectionName = TechnicalSection.SAFETY.name',
                  'initialSection = TechnicalSection.SAFETY',
                  'lockFamily = false',
                  'lockSection = true',
              ]
              for token in required:
                  if token not in text:
                      raise SystemExit(f'{path}: missing Beta28 contract token: {token}')

              path.write_text(text, encoding='utf-8')

          for path in BUILD_FILES:
              text = path.read_text(encoding='utf-8')
              old_comment = '// Beta27: VL80S protection and power-periphery card enrichment.'
              if text.count(old_comment) != 1:
                  raise SystemExit(f'{path}: Beta27 comment count={text.count(old_comment)}')
              text = text.replace(old_comment, '// Beta28: dedicated Occupational Safety entry in the navigation drawer.', 1)
              if text.count('versionCode = 172') != 1 or text.count('versionName = "1.2.2-dev14-beta27"') != 1:
                  raise SystemExit(f'{path}: Beta27 build identity is not unique')
              text = text.replace('versionCode = 172', 'versionCode = 173', 1)
              text = text.replace('versionName = "1.2.2-dev14-beta27"', 'versionName = "1.2.2-dev14-beta28"', 1)
              path.write_text(text, encoding='utf-8')

          if UI_FILES[0].read_bytes() != UI_FILES[1].read_bytes():
              raise SystemExit('BrakeCalculatorApp app/patch mirrors differ after Beta28')
          if BUILD_FILES[0].read_bytes() != BUILD_FILES[1].read_bytes():
              raise SystemExit('build.gradle.kts app/patch mirrors differ after Beta28')
          PY

          git diff --check
          git status --short

      - name: Recheck branch immediately before source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || {
            echo 'dev14-integration moved while Beta28 patch was being prepared; aborting without commit.' >&2
            exit 1
          }

      - name: Commit Beta28 source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt \
            patch/app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt \
            app/build.gradle.kts \
            patch/app/build.gradle.kts
          git diff --cached --quiet && { echo 'No Beta28 source changes to commit'; exit 0; }
          git commit -m 'Expose occupational safety in drawer'
          git push origin HEAD:dev14-integration

      - name: Dispatch Dev14 safe build v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dev14-safe-build-v2.yml --repo DomEnota-hub/Beta --ref dev14-integration
