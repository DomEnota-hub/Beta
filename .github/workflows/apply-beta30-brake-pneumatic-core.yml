name: Apply Beta30 VL80S brake pneumatic core

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta30-brake-pneumatic-core.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stale branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || {
            echo 'dev14-integration moved after this workflow was queued; aborting without source changes.' >&2
            exit 1
          }

      - name: Enrich Beta30 brake-pneumatic cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, io, json
          from pathlib import Path

          EQ=[
              Path('app/src/main/assets/technical/vl80s_equipment.json.gz'),
              Path('patch/app/src/main/assets/technical/vl80s_equipment.json.gz'),
          ]
          BUILD=[Path('app/build.gradle.kts'),Path('patch/app/build.gradle.kts')]
          if EQ[0].read_bytes()!=EQ[1].read_bytes(): raise SystemExit('equipment mirrors differ before Beta30')
          if BUILD[0].read_bytes()!=BUILD[1].read_bytes(): raise SystemExit('build mirrors differ before Beta30')

          with gzip.open(EQ[0],'rt',encoding='utf-8') as f: root=json.load(f)
          records=root.get('records',[])
          if len(records)!=89: raise SystemExit(f'unexpected VL80S equipment count: {len(records)}')
          by={r.get('id'):r for r in records}
          target_ids={
              'VL-EQ-BR-001','VL-EQ-BR-002','VL-EQ-BR-007','VL-EQ-BR-009',
              'VL-EQ-BR-010','VL-EQ-BR-011','VL-EQ-BR-012','VL-EQ-BR-005','VL-EQ-PN-014'
          }
          missing=target_ids-set(by)
          if missing: raise SystemExit(f'missing Beta30 records: {sorted(missing)}')

          def enrich(eid, **fields):
              by[eid].update(fields)
              by[eid]['relationCoverage']='documented_plus_system_text'

          enrich('VL-EQ-BR-001',
              modelNames=['Кран машиниста №395'],
              schemeDesignations=['КМ №395','КМ'],
              principle='Кран машиниста задаёт изменение давления в уравнительном резервуаре и через свою пневматическую часть преобразует его в соответствующее управление тормозной магистралью. Изменение давления ТМ воспринимают тормозные приборы локомотива и состава.',
              normalState=[
                  'Давление уравнительного резервуара изменяется плавно и предсказуемо в соответствии с положением органа управления.',
                  'Изменение давления УР вызывает согласованную реакцию тормозной магистрали без заметной задержки или самопроизвольного падения.',
                  'В доступной пневматической части нет выраженной утечки, а положение органа управления фиксируется штатно.'
              ],
              deviationSigns=[
                  'Тормозная магистраль не заряжается либо давление ТМ не следует за изменением давления УР.',
                  'Самопроизвольное снижение давления, выраженная утечка или нестабильность давления при неизменном положении управления.',
                  'Несогласованность показаний УР и ТМ, требующая разграничения неисправности крана, магистрали и приборных линий.'
              ],
              relations=[
                  {'type':'controls','targetId':'VL-EQ-BR-007','note':'задаёт давление в уравнительном резервуаре, используемое как управляющая величина'},
                  {'type':'controls','targetId':'VL-EQ-BR-003','note':'через пневматическую часть управляет зарядкой и разрядкой тормозной магистрали'},
                  {'type':'interlocked_by','targetId':'VL-EQ-BR-009','note':'работает через блокировку тормозов активной кабины'},
                  {'type':'safety_link','targetId':'VL-EQ-SF-002','note':'тормозная магистраль участвует в тормозном воздействии ЭПК; срабатывание ЭПК не следует автоматически считать неисправностью крана'}
              ],
              notes=['Конкретную модификацию аппарата серии 395 и её ремонтные регулировки следует сверять по документации фактически установленного крана; canonical-карточка не переносит параметры других исполнений автоматически.']
          )

          enrich('VL-EQ-BR-002',
              modelNames=['Кран вспомогательного тормоза №254'],
              schemeDesignations=['КВТ №254','КВТ'],
              principle='Кран вспомогательного тормоза формирует управляющее давление независимого тормоза локомотива. В схеме ВЛ80С это давление используется непосредственно в локомотивной тормозной цепи и как управляющий сигнал для реле-повторителя №304.',
              normalState=[
                  'При команде торможения давление тормозных цилиндров локомотива нарастает устойчиво, а при отпуске снижается без остаточного давления.',
                  'Нет выраженной пневматической утечки или самопроизвольного изменения давления при неизменном положении управления.',
                  'Действие первой и второй тележек согласовано с учётом повторительной цепи №304.'
              ],
              deviationSigns=[
                  'Команда КВТ не создаёт ожидаемого давления тормозных цилиндров либо тормоз не отпускает после команды отпуска.',
                  'Давление тележек заметно различается, что требует проверки как КВТ, так и повторительной цепи №304/№348.',
                  'Самопроизвольный набор или сохранение давления ТЦ при отсутствии соответствующей команды.'
              ],
              relations=[
                  {'type':'controls','targetId':'VL-EQ-BR-004','note':'управляет независимым тормозом локомотива и давлением тормозных цилиндров'},
                  {'type':'control_signal_to','targetId':'VL-EQ-BR-005','note':'управляющее давление используется реле №304 для повторительного действия второй тележки'},
                  {'type':'interlocked_by','targetId':'VL-EQ-BR-009','note':'работает в пневматической схеме активной кабины через блокировку тормозов'}
              ],
              notes=['Номер 254 обозначает семейство крана; конкретное исполнение и регулировочные параметры сверяются по установленному аппарату.']
          )

          enrich('VL-EQ-BR-007',
              schemeDesignations=['УР'],
              principle='Уравнительный резервуар служит пневматической ёмкостью управляющей части крана машиниста. Кран изменяет давление УР, а его пневматическая часть поддерживает соответствующее состояние тормозной магистрали.',
              normalState=[
                  'Давление УР изменяется плавно в соответствии с работой крана машиниста и сохраняется без выраженного самопроизвольного падения.',
                  'Реакция ТМ на изменение давления УР согласована и воспроизводима.',
                  'Показания давления не имеют необъяснимого расхождения с фактическим состоянием тормозной схемы.'
              ],
              deviationSigns=[
                  'Падение давления УР при неизменном положении крана либо невозможность удерживать заданное давление.',
                  'УР изменяется, но ТМ не реагирует ожидаемым образом, либо наоборот.',
                  'Несогласованные показания могут быть вызваны не только самим резервуаром, но и краном машиниста или импульсной линией манометра.'
              ],
              relations=[
                  {'type':'controlled_by','targetId':'VL-EQ-BR-001','note':'давление задаётся краном машиниста и используется как управляющая величина'},
                  {'type':'controls_via_valve','targetId':'VL-EQ-BR-003','note':'изменение давления УР используется для управления состоянием тормозной магистрали'},
                  {'type':'monitored_by','targetId':'VL-EQ-CB-001','note':'давление УР контролируется кабинным манометром через приборную линию'}
              ],
              notes=['Объём резервуара в Beta30 намеренно не указан: текущий canonical-набор источников не используется как достаточное основание для переноса числового значения между исполнениями.']
          )

          enrich('VL-EQ-BR-009',
              modelNames=['Блокировка тормозов №367М'],
              schemeDesignations=['№367М','БТ 367М'],
              principle='Блокировка №367М согласует пневматические и электрические цепи поста управления при выборе рабочей кабины. В рабочем состоянии она обеспечивает предусмотренное сообщение кранов с тормозной и питательной магистралями, а неактивный пост должен быть исключён из управления.',
              normalState=[
                  'Положение блокировки соответствует фактически активной кабине и согласовано с состоянием тормозной системы.',
                  'КМ и КВТ активной кабины получают предусмотренное пневматическое питание и управляют соответствующими цепями.',
                  'Неактивная кабина не создаёт непредусмотренного сообщения или утечки через свои органы управления.'
              ],
              deviationSigns=[
                  'После смены кабины ТМ не заряжается, не действует КВТ либо состояние тормозов не соответствует положению блокировки.',
                  'Наблюдается пневматическая утечка или сообщение через неактивный пост.',
                  'Электрическое подтверждение/связанная блокировка и фактическое пневматическое состояние не согласованы.'
              ],
              relations=[
                  {'type':'interlocks','targetId':'VL-EQ-BR-001','note':'включает кран машиниста в пневматическую схему активной кабины'},
                  {'type':'interlocks','targetId':'VL-EQ-BR-002','note':'включает кран вспомогательного тормоза в схему активной кабины'},
                  {'type':'connects','targetId':'VL-EQ-BR-003','note':'участвует в подключении поста управления к тормозной магистрали'},
                  {'type':'connects','targetId':'VL-EQ-PN-004','note':'участвует в подключении поста управления к питательной магистрали'}
              ],
              notes=['Карточка описывает штатное назначение блокировки и не является инструкцией по обходу или принудительному включению блокировочных цепей.']
          )

          enrich('VL-EQ-BR-010',
              modelNames=['Воздухораспределитель №483'],
              schemeDesignations=['ВР №483','ВР'],
              principle='Воздухораспределитель воспринимает изменение давления тормозной магистрали, заряжает связанный запасный резервуар и при тормозной команде формирует управляющее пневматическое воздействие локомотивной тормозной схемы. При восстановлении режима ТМ обеспечивает предусмотренный отпуск.',
              normalState=[
                  'При зарядке тормозной системы воздухораспределитель и запасный резервуар приходят в штатное заряженное состояние.',
                  'Снижение давления ТМ вызывает ожидаемое тормозное действие без самопроизвольного срабатывания.',
                  'При восстановлении режима тормозная схема отпускает без устойчивого остаточного давления, если остальные аппараты исправны.'
              ],
              deviationSigns=[
                  'Тормозное действие отсутствует или заметно запаздывает при штатном изменении давления ТМ.',
                  'Тормоз не отпускает после восстановления режима либо возникает самопроизвольное торможение.',
                  'Запасный резервуар не заряжается/не удерживает воздух, что требует разграничения утечки резервуара, воздухораспределителя и соединительных линий.'
              ],
              relations=[
                  {'type':'responds_to','targetId':'VL-EQ-BR-003','note':'воспринимает изменения давления тормозной магистрали как команду автоматического тормоза'},
                  {'type':'charges_and_uses','targetId':'VL-EQ-BR-011','note':'работает совместно с запасным резервуаром тормозной схемы'},
                  {'type':'control_output','targetId':'VL-EQ-BR-012','note':'формирует управляющее давление, передаваемое по импульсной магистрали'}
              ],
              notes=['Карточка не переносит устройство или регулировочные параметры других типов воздухораспределителей; конкретное исполнение №483 следует сверять по установленному аппарату.']
          )

          zr=by['VL-EQ-BR-011']
          zr['aliases']=[x for x in (zr.get('aliases') or []) if x.strip().lower()!='20 л']
          enrich('VL-EQ-BR-011',
              schemeDesignations=['ЗР'],
              principle='Запасный резервуар аккумулирует сжатый воздух, используемый связанной схемой воздухораспределителя при формировании тормозного действия, и заряжается в штатном режиме через пневматическую цепь.',
              normalState=[
                  'Резервуар заряжается в предусмотренном режиме и удерживает давление без выраженной утечки.',
                  'Корпус, соединения и крепления не имеют доступных признаков повреждения или разгерметизации.',
                  'Работа автоматического тормоза не сопровождается признаками недостаточного запаса воздуха при исправных остальных элементах.'
              ],
              deviationSigns=[
                  'Утечка воздуха, невозможность устойчивой зарядки или заметное падение давления резервуара.',
                  'Ослабление/повреждение соединений или корпуса.',
                  'Ослабленное либо нестабильное тормозное действие, если проверкой локализована недостаточная зарядка этой ветви.'
              ],
              relations=[
                  {'type':'works_with','targetId':'VL-EQ-BR-010','note':'заряжается и используется в тормозной схеме совместно с воздухораспределителем №483'}
              ],
              notes=['Alias «20 л» удалён в Beta30 как неподтверждённое для canonical-карточки числовое значение; объём следует брать из документации конкретного исполнения.']
          )

          enrich('VL-EQ-BR-012',
              schemeDesignations=['ИМ'],
              principle='Импульсная магистраль передаёт управляющее пневматическое давление между воздухораспределителем и локомотивной цепью независимого/повторительного торможения. Это канал передачи давления, а не самостоятельный источник тормозного усилия.',
              normalState=[
                  'Управляющее давление передаётся без заметного запаздывания и сохраняется без выраженной утечки.',
                  'При торможении и отпуске реакция связанных аппаратов согласована с изменением управляющего давления.',
                  'В доступных соединениях нет признаков повреждения, пережатия или разгерметизации.'
              ],
              deviationSigns=[
                  'Запаздывание или отсутствие передачи управляющего давления при исправном источнике команды.',
                  'Постоянная утечка, неполный отпуск или самопроизвольное тормозное действие из-за нарушения состояния линии.',
                  'Симптомы необходимо разграничивать с неисправностью воздухораспределителя, КВТ и реле №304.'
              ],
              relations=[
                  {'type':'receives_from','targetId':'VL-EQ-BR-010','note':'получает управляющее давление от воздухораспределителя автоматического тормоза'},
                  {'type':'interfaces_with','targetId':'VL-EQ-BR-002','note':'входит в локомотивную цепь, связанную с управлением независимым тормозом'},
                  {'type':'control_signal_to','targetId':'VL-EQ-BR-005','note':'передаёт управляющее давление в повторительную тормозную цепь'}
              ]
          )

          enrich('VL-EQ-BR-005',
              modelNames=['Реле давления №304'],
              schemeDesignations=['РД №304','№304'],
              principle='Пневматическое реле №304 повторяет управляющее давление тормозной цепи и, используя воздух питательной магистрали после редуктора №348, формирует соответствующее давление в тормозных цилиндрах второй тележки.',
              normalState=[
                  'Давление второй тележки следует за управляющим давлением без заметного запаздывания и необъяснимого отличия от ожидаемого действия.',
                  'После отпуска давление на выходе снижается штатно, без устойчивого остаточного торможения.',
                  'Нет выраженной утечки в корпусе, соединениях и управляющей линии.'
              ],
              deviationSigns=[
                  'Вторая тележка не набирает ожидаемое давление либо её давление заметно отличается от первой.',
                  'После отпуска сохраняется давление ТЦ или тормозная тележка остаётся заторможенной.',
                  'Симптомы требуют проверки не только №304, но и управляющего давления КВТ/импульсной линии и питания через №348.'
              ],
              relations=[
                  {'type':'controlled_by','targetId':'VL-EQ-BR-002','note':'повторяет управляющее давление независимого тормоза'},
                  {'type':'supplies','targetId':'VL-EQ-BR-004','note':'формирует давление тормозных цилиндров второй тележки'},
                  {'type':'fed_from','targetId':'VL-EQ-PN-014','note':'получает пневматическое питание через редуктор №348'},
                  {'type':'air_source','targetId':'VL-EQ-PN-004','note':'рабочий воздух поступает из питательной магистрали через редуцирующую цепь'}
              ],
              notes=list(dict.fromkeys((by['VL-EQ-BR-005'].get('notes') or [])+[
                  'Не путать с регулятором давления АК-11Б: АК-11Б управляет работой компрессора по давлению в главных резервуарах, а №304 является пневматическим реле-повторителем тормозной системы.'
              ]))
          )

          enrich('VL-EQ-PN-014',
              modelNames=['Редуктор давления №348'],
              schemeDesignations=['№348'],
              location={'text':'В пневматической тормозной цепи питания реле давления №304 от питательной магистрали; точное монтажное место сверяется по секции.','confidence':'source_confirmed'},
              principle='Редуктор №348 понижает давление питательной магистрали и поддерживает требуемый для повторительной тормозной цепи уровень на входе реле №304. Он не формирует тормозную команду, а обеспечивает пневматическое питание исполнительного реле.',
              normalState=[
                  'На выходе редуктора поддерживается устойчивое давление, достаточное для штатной работы реле №304.',
                  'При изменении расхода в рабочем диапазоне нет выраженных провалов или самопроизвольного роста выходного давления.',
                  'Нет заметной наружной утечки через корпус и соединения.'
              ],
              deviationSigns=[
                  'Недостаточное выходное давление сопровождается слабым или отсутствующим действием повторительной цепи второй тележки.',
                  'Завышенное или нестабильное выходное давление может проявляться несогласованным давлением тормозных цилиндров.',
                  'Перед выводом о неисправности редуктора необходимо исключить проблемы питательной магистрали и реле №304.'
              ],
              relations=[
                  {'type':'fed_from','targetId':'VL-EQ-PN-004','note':'получает сжатый воздух из питательной магистрали'},
                  {'type':'feeds','targetId':'VL-EQ-BR-005','note':'подаёт редуцированный воздух на реле давления №304'}
              ],
              notes=['Числовая уставка №348 в Beta30 намеренно не переносится в canonical-карточку без однозначной опоры на конкретное исполнение и ремонтную документацию.']
          )

          # Validate relation targets and keep the scope exactly 89 records.
          ids=set(by)
          for rec in records:
              for rel in rec.get('relations') or []:
                  if not isinstance(rel,dict): continue
                  tid=rel.get('targetId')
                  if isinstance(tid,str) and tid.startswith('VL-EQ-') and tid not in ids:
                      raise SystemExit(f"broken equipment relation: {rec.get('id')} -> {tid}")
          for eid in target_ids:
              rec=by[eid]
              for key in ('purpose','location','principle','normalState','deviationSigns','relations','sourceRefs'):
                  if not rec.get(key): raise SystemExit(f'{eid}: missing Beta30 field {key}')

          root['catalogVersion']='stage2-final-v1.8-vl80-brake-pneumatic-core'
          root['generatedAt']='2026-09-22'
          raw=(json.dumps(root,ensure_ascii=False,separators=(',',':'))+'\n').encode('utf-8')
          def dump(path):
              buf=io.BytesIO()
              with gzip.GzipFile(filename='',mode='wb',fileobj=buf,mtime=0,compresslevel=9) as g: g.write(raw)
              path.write_bytes(buf.getvalue())
          for p in EQ: dump(p)
          if EQ[0].read_bytes()!=EQ[1].read_bytes(): raise SystemExit('equipment mirrors differ after Beta30')

          for p in BUILD:
              text=p.read_text(encoding='utf-8')
              if text.count('// Beta29: VL80S section-aware variant and profile precision.')!=1: raise SystemExit(f'{p}: Beta29 comment mismatch')
              if text.count('versionCode = 174')!=1 or text.count('versionName = "1.2.2-dev14-beta29"')!=1: raise SystemExit(f'{p}: Beta29 build identity mismatch')
              text=text.replace('// Beta29: VL80S section-aware variant and profile precision.','// Beta30: VL80S brake-pneumatic core card enrichment.',1)
              text=text.replace('versionCode = 174','versionCode = 175',1)
              text=text.replace('versionName = "1.2.2-dev14-beta29"','versionName = "1.2.2-dev14-beta30"',1)
              p.write_text(text,encoding='utf-8')
          if BUILD[0].read_bytes()!=BUILD[1].read_bytes(): raise SystemExit('build mirrors differ after Beta30')

          with gzip.open(EQ[0],'rt',encoding='utf-8') as f: check=json.load(f)
          if len(check.get('records',[]))!=89: raise SystemExit('VL80S equipment count changed during Beta30')
          if len({r.get('id') for r in check['records']})!=89: raise SystemExit('duplicate/missing equipment IDs after Beta30')
          zr=next(r for r in check['records'] if r.get('id')=='VL-EQ-BR-011')
          if any(x.strip().lower()=='20 л' for x in (zr.get('aliases') or [])): raise SystemExit('unverified 20 l alias survived Beta30')
          PY
          git diff --check
          git status --short

      - name: Recheck branch immediately before source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || {
            echo 'dev14-integration moved while Beta30 patch was prepared; aborting without commit.' >&2
            exit 1
          }

      - name: Commit Beta30 source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz app/build.gradle.kts patch/app/build.gradle.kts
          git diff --cached --quiet && { echo 'No Beta30 source changes to commit'; exit 0; }
          git commit -m 'Enrich VL80S brake pneumatic core cards'
          git push origin HEAD:dev14-integration

      - name: Dispatch Dev14 safe build v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dev14-safe-build-v2.yml --repo DomEnota-hub/Beta --ref dev14-integration
