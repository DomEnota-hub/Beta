name: Apply Beta31 VL80S rheostatic-pneumatic interface

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta31-rheostatic-interface.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stale branch state
        shell: bash
        run: |
          set -euo pipefail
          expected="cb58f528e6f50d8c1753eb049530dbdd018b83ac"
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$expected" || { echo "Expected workflow parent $expected, got $parent"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before patch'; exit 1; }

      - name: Enrich rheostatic-pneumatic interface cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, re, shutil
          from pathlib import Path

          app = Path('app/src/main/assets/technical/vl80s_equipment.json.gz')
          patch = Path('patch/app/src/main/assets/technical/vl80s_equipment.json.gz')
          with gzip.open(app, 'rt', encoding='utf-8') as f:
              root = json.load(f)
          records = root['records']
          byid = {r['id']: r for r in records}
          target_ids = {'VL-EQ-BR-013','VL-EQ-BR-014','VL-EQ-TR-013','VL-EQ-TR-014','VL-EQ-TR-015'}
          if len(records) != 89 or not target_ids <= set(byid):
              raise SystemExit('Unexpected VL80S equipment catalog shape')

          def set_fields(r, **kwargs):
              for k, v in kwargs.items():
                  r[k] = v
              r['relationCoverage'] = 'documented_plus_system_text'

          # BR-013 — electro-blocking valve in the electric/pneumatic brake interface.
          r = byid['VL-EQ-BR-013']
          set_fields(
              r,
              modelNames=['КПЭ-99', 'КПЭ-99-02'],
              location={
                  'text':'В пневматической тормозной цепи между воздухораспределителем и краном вспомогательного тормоза №254; конкретное исполнение и монтаж сверяют по схеме секции.',
                  'confidence':'source_confirmed'
              },
              schemeDesignations=['ВР (в схеме взаимодействия электрического и пневматического тормозов)'],
              principle=(
                  'При невозбуждённой катушке клапан сохраняет пневматический путь от воздухораспределителя через кран №254 к тормозным цилиндрам. '
                  'При электрическом торможении катушка получает питание, клапан исключает автоматическое пневматическое торможение локомотива и обеспечивает требуемое состояние тормозных цилиндров. '
                  'При условиях замещения электрического тормоза клапан обесточивается и пневматический путь восстанавливается.'
              ),
              normalState=[
                  'При собранном реостатном торможении автоматический пневматический тормоз локомотива не накладывается одновременно на электрический.',
                  'Торможение краном №254 сохраняет предусмотренную схемой возможность ограниченного подтормаживания локомотива.',
                  'При срыве электрического торможения или соответствующем снижении давления в ТМ пневматическая цепь замещения восстанавливается штатно.'
              ],
              deviationSigns=[
                  'Клапан не переключает пневматический путь при наличии электрической команды или не возвращается после снятия команды.',
                  'Автоматический тормоз локомотива накладывается на реостатное торможение вопреки штатной блокировке.',
                  'При срыве электрического торможения пневматическое замещение не формируется; причину разграничивают между клапаном, ПВУ, электрической командой и последующей пневматической цепью.'
              ],
              relations=[
                  {'type':'receives_from','targetId':'VL-EQ-BR-010','note':'в штатном пневматическом пути получает воздействие от воздухораспределителя автоматического тормоза'},
                  {'type':'interfaces_with','targetId':'VL-EQ-BR-002','note':'включён в цепь, через которую кран №254 управляет тормозными цилиндрами'},
                  {'type':'interlocked_with','targetId':'VL-EQ-BR-014','note':'положение клапана и разрешение электрического торможения согласуются сигналами пневматических выключателей'}
              ],
              notes=[
                  'В описании цепей взаимодействия электрического и пневматического тормозов аппарат обозначен как клапан ВР; тип КПЭ-99/КПЭ-99-02 уточняют по конкретной секции.',
                  'Неисправность клапана нельзя устанавливать только по факту отсутствия торможения: проверяют электрическую команду, давление и состояние связанных аппаратов.'
              ],
              safetyNotes=[
                  'Не допускается использовать принудительное включение клапана или обход пневмоэлектрических блокировок как способ восстановления реостатного торможения.'
              ]
          )

          # BR-014 — pressure switches participating in the braking interlock.
          r = byid['VL-EQ-BR-014']
          set_fields(
              r,
              aliases=['ПВУ', 'ПВУ1', 'ПВУ2'],
              modelNames=['ПВУ-2', 'ПВУ-7'],
              location={
                  'text':'В пневматических цепях взаимодействия тормозов: ПВУ1 контролирует давление тормозной магистрали, ПВУ2 — давление тормозных цилиндров.',
                  'confidence':'source_confirmed'
              },
              schemeDesignations=['ПВУ1', 'ПВУ2'],
              parameters=[
                  'ПВУ1: отключение при давлении ТМ 0,27–0,29 МПа; восстановление разрешающего состояния при 0,45–0,48 МПа.',
                  'ПВУ2: отключение электрического торможения при давлении в ТЦ 0,13–0,15 МПа; возможность восстановления после снижения давления примерно до 0,05 МПа.'
              ],
              principle=(
                  'Пневматический выключатель преобразует достижение заданного давления в переключение электрического контакта. '
                  'В цепи реостатного торможения ПВУ1 контролирует состояние тормозной магистрали и участвует в пневматическом замещении, '
                  'а ПВУ2 контролирует давление в тормозных цилиндрах и не допускает сохранения электрического торможения при чрезмерном совместном пневматическом воздействии.'
              ),
              normalState=[
                  'Контакты ПВУ переключаются при достижении предусмотренных давлений без запаздывания и самопроизвольных переключений.',
                  'При нормальном давлении ТМ цепь допускает сбор реостатного торможения; при значительном снижении давления ПВУ1 инициирует переход к пневматическому замещению.',
                  'При подтормаживании краном №254 рост давления в ТЦ до порога ПВУ2 приводит к разбору электрического торможения.'
              ],
              deviationSigns=[
                  'Реостатное торможение не собирается или срывается при нормальных давлениях из-за неверного состояния контактов ПВУ.',
                  'При снижении давления ТМ не происходит предусмотренное замещение либо электрический тормоз сохраняется при превышении давления ТЦ.',
                  'Порог переключения нестабилен, имеется заметный гистерезис вне штатного поведения или контакт не меняет состояния.'
              ],
              relations=[
                  {'type':'monitors','targetId':'VL-EQ-BR-003','note':'ПВУ1 контролирует давление тормозной магистрали для разрешения и замещения электрического тормоза'},
                  {'type':'monitors','targetId':'VL-EQ-BR-004','note':'ПВУ2 контролирует давление тормозных цилиндров при совместном применении электрического и вспомогательного тормоза'},
                  {'type':'interlocks','targetId':'VL-EQ-BR-013','note':'участвует в управлении состоянием электроблокировочного клапана тормоза'},
                  {'type':'interlocks','targetId':'VL-EQ-TR-014','note':'контактами участвует в разрешении цепей реостатного торможения'}
              ],
              notes=[
                  'Обозначение аппарата по схеме (ПВУ1, ПВУ2) и его тип (например, ПВУ-2 или ПВУ-7) — разные вещи.',
                  'Не смешивать ПВУ2 тормозной блокировки с отдельным схемным аппаратом ПВУ7 вспомогательного компрессора поздних секций.'
              ],
              safetyNotes=[
                  'Уставки ПВУ являются частью тормозных блокировок; обход контактов или произвольная регулировка не рассматриваются как эксплуатационный способ устранения отказа.'
              ]
          )

          # TR-013 — excitation rectifier installation.
          r = byid['VL-EQ-TR-013']
          set_fields(
              r,
              aliases=['ВУ возбуждения', 'ВУВ', 'ВУ 60'],
              modelNames=['ВУВ-758'],
              quantity='По одной установке на секцию; 2 на штатный двухсекционный ВЛ80С.',
              location={
                  'text':'В высоковольтной камере, во втором конце секции; фактическую компоновку сверяют по документации конкретной секции.',
                  'confidence':'source_confirmed'
              },
              schemeDesignations=['60', 'ВУВ'],
              parameters=[
                  'Номинальное напряжение питания: 175 В (эффективное значение).',
                  'Номинальный выпрямленный ток: 850 А (среднее значение).',
                  'Выпрямленный ток 20-минутного режима: 1300 А (среднее значение).',
                  'Номинальное напряжение изоляции выводов А–Б: 2000 В.',
                  'Расход охлаждающего воздуха: 17 м³/мин.'
              ],
              principle=(
                  'ВУВ формирует регулируемый выпрямленный ток для последовательно соединённых обмоток возбуждения тяговых двигателей при реостатном торможении. '
                  'Угол проводимости тиристоров изменяется управляющими импульсами от системы БУРТ, благодаря чему регулируется ток возбуждения и, следовательно, тормозная сила.'
              ),
              normalState=[
                  'В режиме реостатного торможения установка получает питание и формирует регулируемый ток возбуждения без срывов и несимметрии.',
                  'Управляющие импульсы БУРТ приводят к плавному изменению тока возбуждения в пределах разрешённых системой ограничений.',
                  'Охлаждение ВУВ обеспечено штатным воздушным каналом; отсутствуют признаки перегрева и повреждения силовых элементов.'
              ],
              deviationSigns=[
                  'Реостатное торможение не собирается либо срывается из-за отсутствия или нестабильности тока возбуждения.',
                  'Ток возбуждения не следует управляющему воздействию при исправных разрешающих блокировках.',
                  'Срабатывает защита цепи возбуждения, наблюдаются признаки перегрева либо отказа охлаждения ВУВ.'
              ],
              relations=[
                  {'type':'supplies_excitation_to','targetId':'VL-EQ-TR-006','note':'питает обмотки возбуждения тяговых двигателей в генераторном режиме'},
                  {'type':'controlled_by','targetId':'VL-EQ-TR-005','note':'угол управления тиристорами задаётся системой БУРТ'},
                  {'type':'interlocked_with','targetId':'VL-EQ-TR-014','note':'вводится в работу после перевода силовой схемы из тяги в тормозной режим'}
              ],
              notes=[
                  'ВУВ-758 — установка возбуждения реостатного тормоза; её параметры нельзя переносить на тяговые выпрямительные установки ВУК-4000Т-02.',
                  'Срыв электрического торможения может быть вызван не только ВУВ, но и БУРТ, переключателями, контакторами, защитами или отсутствием разрешающих условий.'
              ]
          )

          # TR-014 — traction/braking switches 49 and 50.
          r = byid['VL-EQ-TR-014']
          set_fields(
              r,
              modelNames=['ПКД-142'],
              quantity='2 переключателя (49 и 50) на секцию; 4 на штатный двухсекционный ВЛ80С.',
              location={
                  'text':'В блоках силовых аппаратов №1 и №2.',
                  'confidence':'source_confirmed'
              },
              schemeDesignations=['49', '50'],
              principle=(
                  'Переключатели 49 и 50 принудительно переводят силовые и связанные цепи управления между положениями «Тяга» и «Торможение». '
                  'В тормозном положении они разрывают подготовку тяговой цепи, переводят якоря ТЭД на индивидуальные тормозные резисторы и подготавливают цепь контакторов возбуждения. '
                  'Переход режима выполняется при обесточенной силовой цепи.'
              ),
              normalState=[
                  'Оба переключателя занимают одинаковое требуемое положение и их блок-контакты подтверждают выбранный режим.',
                  'В положении «Тяга» подготовлены тяговые цепи; в положении «Торможение» тяговая конфигурация исключена и подготовлены цепи возбуждения и тормозных резисторов.',
                  'Переключение происходит без зависания в промежуточном состоянии и без несогласованности парных аппаратов.'
              ],
              deviationSigns=[
                  'Один или оба переключателя не доходят до требуемого положения, из-за чего не собирается тяга или реостатное торможение.',
                  'Блок-контакты не соответствуют механическому положению и цепь управления остаётся разомкнутой.',
                  'Силовая схема не переходит в генераторный режим при исправной команде и выполненных блокировках.'
              ],
              relations=[
                  {'type':'switches_mode_for','targetId':'VL-EQ-TR-006','note':'переключает силовую схему ТЭД между тяговым и генераторным тормозным режимом'},
                  {'type':'connects_to','targetId':'VL-EQ-TR-009','note':'в тормозном режиме якоря ТЭД подключаются к индивидуальным тормозным резисторам'},
                  {'type':'interlocked_with','targetId':'VL-EQ-TR-013','note':'подготавливает цепи возбуждения для работы ВУВ'},
                  {'type':'interlocked_with','targetId':'VL-EQ-BR-014','note':'сбор тормозного режима зависит от состояния пневматических разрешающих блокировок'}
              ],
              notes=[
                  'Переключатели 49/50 — кулачковые двухпозиционные ПКД-142; их не следует смешивать с реверсивными переключателями 63/64.',
                  'Наличие команды «Торможение» само по себе не доказывает исправность переключателя: учитывают питание, пневмопривод, блок-контакты и разрешающие цепи.'
              ],
              safetyNotes=[
                  'Переключение силовой схемы «Тяга/Торможение» предусмотрено при обесточенной силовой цепи; принудительное ручное доведение аппаратов под напряжением не описывается и не допускается как диагностический приём.'
              ]
          )

          # TR-015 — correct the overly narrow legacy name and describe DT-39's rheostatic role.
          r = byid['VL-EQ-TR-015']
          set_fields(
              r,
              name='Датчик тока ДТ-39',
              aliases=['ДТ-39', 'датчик тока', 'датчик тока якоря/возбуждения'],
              modelNames=['ДТ-39'],
              purpose='Формирует электрический сигнал, пропорциональный току якоря либо току возбуждения тяговых двигателей в режиме реостатного торможения, для системы автоматического регулирования тормозного усилия.',
              location={
                  'text':'Первичная токовая шина включается последовательно в контролируемую цепь якоря либо возбуждения ТЭД; конкретные обозначения и размещение датчиков сверяют по схеме секции.',
                  'confidence':'source_confirmed'
              },
              parameters=[
                  'Напряжение питания: 127 В (эффективное значение).',
                  'Коэффициент трансформации: 1240.',
                  'Максимальное сопротивление нагрузки: 44 Ом.',
                  'Охлаждение: естественное воздушное.',
                  'Масса: 4 кг.'
              ],
              principle=(
                  'ДТ-39 представляет собой трансформатор постоянного тока: контролируемый ток в первичной шине изменяет подмагничивание сердечника и режим вторичной цепи. '
                  'Среднее напряжение на шунтирующем резисторе в рабочем диапазоне пропорционально первичному току и используется системой автоматического регулирования тормозного усилия.'
              ),
              normalState=[
                  'Выходной сигнал устойчиво и монотонно изменяется вместе с контролируемым током без скачков и пропаданий.',
                  'Сигналы токов якоря/возбуждения согласованы с фактическим режимом реостатного торможения и не вызывают ложного ограничения БУРТ.',
                  'В цепях датчика отсутствуют признаки повреждения соединений, перегрева или нарушения вторичной нагрузки.'
              ],
              deviationSigns=[
                  'Сигнал отсутствует либо явно не соответствует фактическому току при исправной первичной силовой цепи.',
                  'Скачки или рассогласование измерительных сигналов приводят к нестабильному ограничению тормозной силы либо ошибочной оценке токов.',
                  'Причину различают между самим датчиком, его вторичной цепью, блоком измерения и последующей системой БУРТ.'
              ],
              relations=[
                  {'type':'measures_current_of','targetId':'VL-EQ-TR-006','note':'контролирует ток якоря либо ток возбуждения тяговых двигателей в реостатном режиме'},
                  {'type':'control_signal_to','targetId':'VL-EQ-TR-005','note':'измерительная информация используется системой БУРТ для автоматического регулирования тормозного усилия'}
              ],
              notes=[
                  'Прежнее название «Датчик тягового тока» было слишком узким: техническое описание ДТ-39 прямо предусматривает измерение токов якоря или возбуждения при реостатном торможении.',
                  'Не смешивать ДТ-39 с реле перегрузки: датчик формирует измерительный сигнал для регулирования, а защитные реле выполняют самостоятельные функции защиты.'
              ]
          )

          # Validate exact scope and all relation targets.
          ids={r['id'] for r in records}
          for tid in target_ids:
              rr=byid[tid]
              required=['purpose','location','principle','relations','normalState','deviationSigns','sourceRefs']
              missing=[k for k in required if not rr.get(k)]
              if missing: raise SystemExit(f'{tid}: missing {missing}')
              for rel in rr.get('relations') or []:
                  if rel.get('targetId') not in ids:
                      raise SystemExit(f"{tid}: bad relation target {rel.get('targetId')}")
          if byid['VL-EQ-TR-015']['name'] != 'Датчик тока ДТ-39':
              raise SystemExit('DT-39 correction missing')
          if 'ВУВ-758' not in byid['VL-EQ-TR-013'].get('modelNames',[]):
              raise SystemExit('VUV-758 model missing')
          if 'ПКД-142' not in byid['VL-EQ-TR-014'].get('modelNames',[]):
              raise SystemExit('PKD-142 model missing')
          if any('ВУП' in a for a in byid['VL-EQ-BR-014'].get('aliases',[])):
              raise SystemExit('Legacy reversed VUP alias remains')

          # Stable gzip output, mirrored to patch.
          raw=json.dumps(root,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          with app.open('wb') as fo:
              with gzip.GzipFile(fileobj=fo,mode='wb',mtime=0) as gz:
                  gz.write(raw)
          shutil.copyfile(app,patch)

          # Bump Beta31 build identity in both mirrors.
          for p in [Path('app/build.gradle.kts'),Path('patch/app/build.gradle.kts')]:
              text=p.read_text(encoding='utf-8')
              text=text.replace('// Beta30: VL80S brake-pneumatic core card enrichment.','// Beta31: VL80S rheostatic/pneumatic brake interface enrichment.')
              text=re.sub(r'versionCode\s*=\s*175\b','versionCode = 176',text)
              text=text.replace('versionName = "1.2.2-dev14-beta30"','versionName = "1.2.2-dev14-beta31"')
              p.write_text(text,encoding='utf-8')

          # Final mirror/data checks.
          if app.read_bytes()!=patch.read_bytes(): raise SystemExit('equipment mirrors differ')
          if Path('app/build.gradle.kts').read_bytes()!=Path('patch/app/build.gradle.kts').read_bytes(): raise SystemExit('build mirrors differ')
          with gzip.open(app,'rt',encoding='utf-8') as f:
              check=json.load(f)
          if len(check.get('records',[]))!=89: raise SystemExit('equipment count changed')
