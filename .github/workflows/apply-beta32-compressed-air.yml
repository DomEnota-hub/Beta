name: Apply Beta32 VL80S compressed-air supply

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta32-compressed-air.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stale branch state
        shell: bash
        run: |
          set -euo pipefail
          expected="4f15733b0b32fb7690e1048b0a42e14e99a483ff"
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$expected" || { echo "Expected workflow parent $expected, got $parent"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before patch'; exit 1; }

      - name: Enrich compressed-air supply cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, re, shutil
          from pathlib import Path

          app = Path('app/src/main/assets/technical/vl80s_equipment.json.gz')
          patch = Path('patch/app/src/main/assets/technical/vl80s_equipment.json.gz')
          with gzip.open(app, 'rt', encoding='utf-8') as f:
              root = json.load(f)
          records = root['records']
          byid = {r['id']: r for r in records}
          target_ids = {
              'VL-EQ-AU-003','VL-EQ-PN-008','VL-EQ-PN-010','VL-EQ-PN-001',
              'VL-EQ-PN-003','VL-EQ-PN-005','VL-EQ-PN-004','VL-EQ-PN-012'
          }
          if len(records) != 89 or not target_ids <= set(byid):
              raise SystemExit('Unexpected VL80S equipment catalog shape')

          def set_fields(r, **kwargs):
              for k, v in kwargs.items():
                  r[k] = v
              r['relationCoverage'] = 'documented_plus_system_text'

          # Main motor-compressor.
          r = byid['VL-EQ-AU-003']
          set_fields(
              r,
              modelNames=['КТ6-Эл'],
              quantity='По одному мотор-компрессору на секцию; 2 на штатный двухсекционный ВЛ80С.',
              location={'text':'В высоковольтной камере секции, в зоне блока мотор-компрессора; точную монтажную компоновку сверяют по документации секции.','confidence':'source_confirmed'},
              schemeDesignations=['КМ1'],
              parameters=[
                  'Компрессор: трёхцилиндровый, двухступенчатого сжатия.',
                  'Рабочее давление сжатого воздуха: 0,9 МПа (9,0 кгс/см²).',
                  'Подача воздуха: 2,75 м³/мин.',
                  'Потребляемая мощность: 24 кВт; частота вращения компрессора: 440 об/мин.',
                  'Режим работы повторно-кратковременный 1:2; непрерывная работа под нагрузкой — не более 15 мин.'
              ],
              principle=(
                  'КТ6-Эл всасывает очищенный воздух, сжимает его в две ступени с промежуточным охлаждением и подаёт в напорный трубопровод. '
                  'Через обратный клапан и маслоотделитель воздух поступает в группу главных резервуаров. Работа электропривода автоматически разрешается и прекращается регулятором давления по давлению в системе ГР.'
              ),
              normalState=[
                  'Компрессор запускается при снижении давления ГР примерно до 0,75 МПа и отключается после достижения около 0,90 МПа.',
                  'Давление в ГР растёт устойчиво; отсутствуют ненормальный стук, выраженный перегрев, утечка масла или длительная работа без достижения давления отключения.',
                  'После остановки обратный клапан изолирует компрессор от давления главных резервуаров.'
              ],
              deviationSigns=[
                  'Компрессор не запускается при пониженном давлении: причину разграничивают между цепью управления, регулятором давления, электроприводом и самим компрессором.',
                  'Компрессор работает продолжительно, но давление растёт медленно или не достигает верхнего порога; возможны снижение производительности, сопротивление напорного тракта или утечки.',
                  'Повышенный стук, перегрев, ненормальный унос масла либо нестабильное давление масла указывают на необходимость проверки агрегата.'
              ],
              relations=[
                  {'type':'functional_link','targetId':'VL-EQ-PN-008','note':'нагнетает воздух через обратный клапан КО1, который изолирует компрессор от противодавления ГР'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-010','note':'нагнетаемый воздух проходит маслоотделение перед поступлением в главные резервуары'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-001','note':'создаёт запас сжатого воздуха в группе главных резервуаров'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-003','note':'пуск и отключение компрессора определяются регулятором давления'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-004','note':'после накопления в ГР воздух подаётся потребителям через питательную магистраль'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-012','note':'конденсат из напорного тракта и резервуаров удаляется штатной системой продувки'}
              ],
              notes=[
                  'Длительная работа компрессора не доказывает его неисправность: сначала разделяют недостаточную производительность, утечки, засорение напорного тракта и ошибку регулирования.',
                  'Параметры относятся к КТ6-Эл из технического описания ВЛ80С; фактическую установленную машину после ремонтов сверяют по секции.'
              ]
          )

          # Main-compressor check valve.
          r = byid['VL-EQ-PN-008']
          set_fields(
              r,
              aliases=list(dict.fromkeys((r.get('aliases') or []) + ['КО1'])),
              modelNames=['Э-155'],
              quantity='По одному клапану КО1 в напорном тракте основного компрессора каждой секции; 2 на двухсекционный электровоз.',
              location={'text':'На напорном трубопроводе основного компрессора перед маслоотделителем и группой главных резервуаров.','confidence':'source_confirmed'},
              schemeDesignations=['КО1'],
              parameters=[
                  'Рабочее давление Э-155: 0,6–1,0 МПа (6–10 кгс/см²).',
                  'Присоединительная резьба Э-155: 1½″ труб.'
              ],
              principle=(
                  'При нагнетании клапан открывается по направлению потока к главным резервуарам. После прекращения подачи он садится на седло и не допускает обратного давления ГР на клапаны компрессора. '
                  'При повреждении компрессора тем самым отделяет его от общей пневматической системы.'
              ),
              normalState=[
                  'При работе компрессора клапан свободно пропускает воздух к ГР без заметного ограничения наполнения.',
                  'После остановки компрессора обратного перетока из ГР в его напорный тракт нет.',
                  'Работа клапана не сопровождается выраженным повторным стуком посадки.'
              ],
              deviationSigns=[
                  'Неплотность вызывает обратный переток и разгрузку ГР через неисправный компрессорный тракт.',
                  'Зависание или недостаточный проход могут проявляться медленным наполнением ГР при исправном компрессоре.',
                  'Повторный стук клапана при работе может сопровождать износ седла либо ненормальную посадку.'
              ],
              relations=[
                  {'type':'functional_link','targetId':'VL-EQ-AU-003','note':'принимает нагнетаемый компрессором воздух и разгружает его клапаны от противодавления после остановки'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-010','note':'после КО1 воздух направляется через маслоотделитель'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-001','note':'изолирует напорный тракт компрессора от запаса воздуха главных резервуаров'}
              ],
              notes=['Э-155 относится к основному компрессору КТ6-Эл; Э-175 применяется в других пневматических ветвях, в том числе у вспомогательного компрессора, и в эту карточку не объединяется.']
          )

          # Oil separator in main compressor line. Sources conflict on exact execution.
          r = byid['VL-EQ-PN-010']
          set_fields(
              r,
              aliases=list(dict.fromkeys((r.get('aliases') or []) + ['М01'])),
              modelNames=['Э-120/Т', 'Э-120Д'],
              quantity='По одному маслоотделителю М01 в основном напорном тракте каждой секции; 2 на двухсекционный электровоз.',
              location={'text':'На напорном трубопроводе после обратного клапана КО1 и перед группой главных резервуаров.','confidence':'source_confirmed'},
              schemeDesignations=['М01'],
              principle=(
                  'Поток нагнетаемого компрессором воздуха проходит через маслоотделитель, где из него отделяется часть унесённых паров/капель масла и влаги. '
                  'Отделённый конденсат собирается в нижней части прибора и удаляется через предусмотренную точку продувки.'
              ),
              normalState=[
                  'Воздух проходит через маслоотделитель без заметного ограничения скорости наполнения ГР.',
                  'В напорной системе нет чрезмерного уноса масла, а накопленный конденсат удаляется штатно.',
                  'Корпус и соединения герметичны.'
              ],
              deviationSigns=[
                  'Повышенный унос масла дальше по пневмосистеме может указывать на недостаточное отделение либо неисправность компрессора.',
                  'Засорение или ограничение прохода проявляется замедлением наполнения ГР при исправной производительности компрессора.',
                  'Неплотности прибора или точки продувки вызывают утечку напорного воздуха.'
              ],
              relations=[
                  {'type':'functional_link','targetId':'VL-EQ-PN-008','note':'расположен после обратного клапана КО1 в напорном тракте'},
                  {'type':'functional_link','targetId':'VL-EQ-AU-003','note':'очищает воздух, нагнетаемый основным компрессором'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-001','note':'подготавливает воздух перед поступлением в главные резервуары'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-012','note':'накопленный конденсат относится к штатно обслуживаемым точкам продувки напорного тракта'}
              ],
              notes=[
                  'В доступных материалах ВЛ80С встречаются обозначения Э-120/Т и Э-120Д. Подтверждённой границы по номерам секций для этих исполнений в текущем наборе источников нет, поэтому конкретную модель сверяют по документации секции.',
                  'М01 основного напорного тракта не смешивать с маслоотделителями вспомогательных цепей.'
              ]
          )

          # Main reservoirs.
          r = byid['VL-EQ-PN-001']
          set_fields(
              r,
              quantity='3 главных резервуара на секцию; 6 на штатный двухсекционный ВЛ80С.',
              location={'text':'На крыше каждой секции расположена группа РС1–РС3 из трёх главных резервуаров.','confidence':'source_confirmed'},
              schemeDesignations=['РС1', 'РС2', 'РС3'],
              parameters=[
                  'Вместимость одного главного резервуара: 300 л.',
                  'Суммарная вместимость группы одной секции: 900 л.',
                  'Штатный цикл давления: включение компрессора около 0,75 МПа; отключение около 0,90 МПа.'
              ],
              principle=(
                  'Три последовательно связанные ёмкости на секции накапливают воздух от основного компрессора и сглаживают его расход потребителями. '
                  'Из группы ГР воздух поступает в питательную магистраль, а давление группы используется регулятором для автоматического управления компрессором.'
              ),
              normalState=[
                  'Группа герметична и набирает давление от нижнего до верхнего порога за штатный цикл работы компрессора.',
                  'После отключения компрессора нет быстрого самопроизвольного падения давления при изолированных потребителях.',
                  'Конденсат из резервуаров и связанных сборников удаляется предусмотренной системой продувки.'
              ],
              deviationSigns=[
                  'Медленное наполнение группы может быть связано как с компрессором и напорным трактом, так и с утечками.',
                  'Ускоренное падение давления после остановки компрессора указывает на негерметичность группы или связанных магистралей.',
                  'Повторное срабатывание предохранительных клапанов при нормальной герметичности требует проверки регулятора давления.'
              ],
              relations=[
                  {'type':'functional_link','targetId':'VL-EQ-AU-003','note':'наполняются основным компрессором секции'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-004','note':'служат источником воздуха для питательной магистрали'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-003','note':'их давление используется для автоматического управления мотор-компрессором'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-005','note':'защищены предохранительными клапанами от недопустимого повышения давления'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-012','note':'конденсат группы удаляется через систему дистанционной продувки'}
              ],
              notes=['900 л — вместимость группы одной секции (3×300 л), а не всего двухсекционного электровоза.']
          )

          # Compressor pressure regulator.
          r = byid['VL-EQ-PN-003']
          set_fields(
              r,
              aliases=list(dict.fromkeys((r.get('aliases') or []) + ['РГД', 'АК-11Б'])),
              modelNames=['АК-11БТЗ'],
              quantity='По одному регулятору давления на секцию; 2 на двухсекционный электровоз.',
              location={'text':'В цепи контроля давления питательной системы/главных резервуаров; конкретное монтажное место сверяют по документации секции.','confidence':'source_confirmed'},
              schemeDesignations=['РГД'],
              parameters=[
                  'Штатное включение мотор-компрессора при снижении давления примерно до 0,75 МПа (7,5 кгс/см²).',
                  'Штатное отключение мотор-компрессора при достижении примерно 0,90 МПа (9,0 кгс/см²).'
              ],
              principle=(
                  'Давление воздуха воздействует на чувствительный элемент регулятора. При достижении настроенных порогов контактная система изменяет состояние электрической цепи управления мотор-компрессором: '
                  'при падении давления разрешает запуск, при достижении верхнего порога — отключение.'
              ),
              normalState=[
                  'Компрессор включается и отключается устойчиво около заданных порогов без частых ложных переключений.',
                  'После достижения верхнего давления команда на компрессор снимается; при снижении до нижнего порога запуск восстанавливается.',
                  'Регулятор не используется как аварийная защита от превышения давления — эту функцию выполняют предохранительные клапаны.'
              ],
              deviationSigns=[
                  'Компрессор не запускается при давлении ниже штатного порога при исправной остальной цепи управления.',
                  'Компрессор не отключается при достижении верхнего давления либо включается/отключается на явно неверных порогах.',
                  'Частые переключения могут быть следствием как регулятора, так и утечки/малого объёма подключённой системы.'
              ],
              relations=[
                  {'type':'functional_link','targetId':'VL-EQ-PN-001','note':'контролирует давление системы главных резервуаров'},
                  {'type':'functional_link','targetId':'VL-EQ-AU-003','note':'формирует штатную команду автоматического включения и отключения мотор-компрессора'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-005','note':'предохранительные клапаны остаются независимой аварийной защитой при отказе регулирования'}
              ],
              notes=[
                  'АК-11БТЗ/РГД не смешивать с реле давления №304: №304 работает в тормозной пневматике и не управляет основным компрессором.',
                  'В части учебных материалов название сокращается до АК-11Б; конкретное исполнение регулятора проверяют по документации секции.'
              ]
          )

          # Main-reservoir safety valves.
          r = byid['VL-EQ-PN-005']
          set_fields(
              r,
              aliases=list(dict.fromkeys((r.get('aliases') or []) + ['КП1', 'КП2'])),
              modelNames=['Э-216'],
              quantity='По два предохранительных клапана на секцию (КП1 и КП2); 4 на двухсекционный электровоз.',
              location={'text':'В напорном тракте главных резервуаров: КП1 расположен со стороны компрессора до КО1, КП2 — со стороны группы ГР после КО1.','confidence':'source_confirmed'},
              schemeDesignations=['КП1', 'КП2'],
              parameters=[
                  'Рабочий диапазон клапана Э-216: 0,6–1,0 МПа.',
                  'КП1: давление срабатывания около 0,98 МПа (9,8 кгс/см²).',
                  'КП2: давление срабатывания около 1,00 МПа (10 кгс/см²).'
              ],
              principle=(
                  'При нормальном давлении усилие пружины удерживает клапан закрытым. При превышении установленного давления воздух преодолевает усилие пружины, клапан выпускает избыточный воздух и тем самым ограничивает давление защищаемого участка.'
              ),
              normalState=[
                  'В штатном диапазоне 0,75–0,90 МПа клапаны закрыты и не травят воздух.',
                  'Срабатывание происходит только при превышении нормального диапазона и не заменяет работу регулятора давления.',
                  'После снижения давления клапан возвращается в закрытое состояние без постоянной утечки.'
              ],
              deviationSigns=[
                  'Постоянное травление при нормальном давлении указывает на неплотность, загрязнение седла или неверную регулировку.',
                  'Преждевременное срабатывание не позволяет системе набрать нормальное верхнее давление.',
                  'Рост давления выше защитной уставки без выпуска воздуха требует проверки клапана и независимого контроля показаний манометра.'
              ],
              relations=[
                  {'type':'functional_link','targetId':'VL-EQ-PN-001','note':'защищают систему главных резервуаров от недопустимого повышения давления'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-008','note':'КП1 и КП2 расположены по разные стороны обратного клапана КО1 и защищают соответствующие участки'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-003','note':'являются независимой защитой на случай отказа штатного регулятора давления'},
                  {'type':'functional_link','targetId':'VL-EQ-CB-001','note':'фактическое давление контролируется по манометрам пневматической системы'}
              ],
              notes=['КП1 и КП2 имеют разные уставки из-за расположения по разные стороны КО1; их нельзя описывать одной общей точкой срабатывания.']
          )

          # Feed line.
          r = byid['VL-EQ-PN-004']
          set_fields(
              r,
              quantity='Одна функционально общая питательная магистраль электровоза с межсекционным соединением и ответвлениями к потребителям.',
              location={'text':'Проходит вдоль секций от групп главных резервуаров, имеет межсекционное сообщение и ответвления к тормозным, управляющим и вспомогательным пневматическим потребителям.','confidence':'source_confirmed'},
              schemeDesignations=['ПМ'],
              parameters=['При автоматической работе основного компрессора давление питательной системы изменяется в штатном диапазоне примерно 0,75–0,90 МПа.'],
              principle=(
                  'Питательная магистраль объединяет запас воздуха главных резервуаров с потребителями. Давление из ГР передаётся по магистрали к тормозным аппаратам, цепям управления и вспомогательной пневматике; '
                  'межсекционное сообщение позволяет использовать запас и исправный компрессор соседней секции согласно штатной схеме.'
              ),
              normalState=[
                  'Магистраль герметична и сохраняет давление системы ГР без быстрого самопроизвольного падения.',
                  'Потребители получают воздух без заметной просадки, не объясняемой их штатным расходом.',
                  'Межсекционные и концевые соединения находятся в положении, соответствующем режиму работы электровоза.'
              ],
              deviationSigns=[
                  'Утечка ПМ вызывает повышенную продолжительность работы компрессоров и снижение доступного запаса воздуха.',
                  'Локальное ограничение прохода проявляется нормальным давлением в одной части системы и недостаточным питанием отдельных потребителей.',
                  'Падение давления ПМ само по себе не определяет место неисправности: проверяют ГР, соединения, краны и потребителей.'
              ],
              relations=[
                  {'type':'functional_link','targetId':'VL-EQ-PN-001','note':'получает основной запас сжатого воздуха от групп главных резервуаров'},
                  {'type':'functional_link','targetId':'VL-EQ-AU-003','note':'запас ПМ восстанавливается работой основных мотор-компрессоров через группы ГР'},
                  {'type':'functional_link','targetId':'VL-EQ-BR-001','note':'питает тормозные приборы, включая кран машиниста и связанные цепи согласно пневмосхеме'}
              ],
              notes=['Точная физическая трасса и положение разобщительных кранов зависят от монтажа и режима секции; карточка описывает функциональную магистраль, а не заменяет монтажную пневмосхему.']
          )

          # Remote condensate blowdown valves for main-reservoir collectors.
          r = byid['VL-EQ-PN-012']
          set_fields(
              r,
              aliases=list(dict.fromkeys((r.get('aliases') or []) + ['КЭП10', 'КЭП11', 'КЭП12'])),
              modelNames=['КП-110-01'],
              quantity='По три клапана дистанционной продувки КЭП10–КЭП12 на секцию для сборников РС11–РС13.',
              location={'text':'На резервуарах-сборниках РС11–РС13, куда отводится конденсат из главных резервуаров и связанных змеевиков.','confidence':'source_confirmed'},
              schemeDesignations=['КЭП10', 'КЭП11', 'КЭП12', 'РС11', 'РС12', 'РС13'],
              parameters=[
                  'Рабочее давление сжатого воздуха для привода клапана КП-110-01: 0,75–0,90 МПа.',
                  'Номинальное напряжение вентиля: 50 В.',
                  'Питание электрообогревателя: 50–75 В.'
              ],
              principle=(
                  'Электропневматический привод по команде открывает выпуск из резервуара-сборника и удаляет накопленный водомасляный конденсат в атмосферу. '
                  'В закрытом состоянии клапан должен герметично удерживать давление; электрообогрев снижает риск замерзания конденсата.'
              ),
              normalState=[
                  'Без команды клапаны закрыты и не создают постоянной утечки из системы ГР.',
                  'При команде продувки соответствующий сборник кратковременно сообщается с атмосферой и конденсат удаляется.',
                  'После снятия команды клапан полностью закрывается; в холодных условиях исправен предусмотренный обогрев.'
              ],
              deviationSigns=[
                  'Неплотность закрытого клапана проявляется постоянной утечкой и может увеличивать продолжительность работы компрессора.',
                  'Отсутствие выпуска при команде приводит к накоплению конденсата в сборниках.',
                  'Замерзание или заедание клапана нарушает продувку; причину отделяют от отсутствия электрической команды и закрытого разобщительного крана.'
              ],
              relations=[
                  {'type':'functional_link','targetId':'VL-EQ-PN-001','note':'удаляют конденсат, собираемый от группы главных резервуаров в РС11–РС13'},
                  {'type':'functional_link','targetId':'VL-EQ-PN-010','note':'являются частью общего контура удаления конденсата из напорной пневмосистемы'}
              ],
              notes=[
                  'В перечне аппаратов группа клапанов продувки шире (КЭП10–КЭП13); эта карточка описывает подтверждённые КЭП10–КЭП12, связанные со сборниками РС11–РС13 главных резервуаров.',
                  'Продувка описана как функция системы; карточка не заменяет эксплуатационную процедуру конкретной секции.'
              ]
          )

          # Integrity checks.
          known_ids = set(byid)
          for rid in target_ids:
              rec = byid[rid]
              for rel in rec.get('relations') or []:
                  if rel.get('targetId') not in known_ids:
                      raise SystemExit(f'Broken relation {rid} -> {rel.get("targetId")}')

          with gzip.open(app, 'wt', encoding='utf-8', compresslevel=9) as f:
              json.dump(root, f, ensure_ascii=False, separators=(',', ':'))
          shutil.copy2(app, patch)

          # Version bump, both mirrors.
          for path in [Path('app/build.gradle.kts'), Path('patch/app/build.gradle.kts')]:
              s = path.read_text(encoding='utf-8')
              s2 = re.sub(r'versionCode\s*=\s*176\b', 'versionCode = 177', s)
              s2 = s2.replace('versionName = "1.2.2-dev14-beta31"', 'versionName = "1.2.2-dev14-beta32"')
              if s2 == s:
                  raise SystemExit(f'Version anchor not found in {path}')
              if 'Beta32: VL80S compressed-air supply enrichment.' not in s2:
                  s2 = '\n// Beta32: VL80S compressed-air supply enrichment.\n' + s2.lstrip('\n')
              path.write_text(s2, encoding='utf-8')

          # Mirror and target contract checks.
          if app.read_bytes() != patch.read_bytes():
              raise SystemExit('Equipment mirrors differ')
          if Path('app/build.gradle.kts').read_bytes() != Path('patch/app/build.gradle.kts').read_bytes():
              raise SystemExit('Gradle mirrors differ')
          with gzip.open(app, 'rt', encoding='utf-8') as f:
              check = json.load(f)
          if len(check['records']) != 89:
              raise SystemExit('VL80S equipment count changed')
          check_byid = {x['id']:x for x in check['records']}
          if check_byid['VL-EQ-AU-003'].get('modelNames') != ['КТ6-Эл']:
              raise SystemExit('KT6-El model contract failed')
          if check_byid['VL-EQ-PN-003'].get('modelNames') != ['АК-11БТЗ']:
              raise SystemExit('AK-11BTZ model contract failed')
          if check_byid['VL-EQ-PN-001'].get('quantity') != '3 главных резервуара на секцию; 6 на штатный двухсекционный ВЛ80С.':
              raise SystemExit('Main reservoir quantity contract failed')
          if check_byid['VL-EQ-PN-012'].get('modelNames') != ['КП-110-01']:
              raise SystemExit('Blowdown valve model contract failed')
          PY

          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "app/build.gradle.kts app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/build.gradle.kts patch/app/src/main/assets/technical/vl80s_equipment.json.gz "

      - name: Recheck branch immediately before source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before source commit'; exit 1; }

      - name: Commit Beta32 source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts patch/app/build.gradle.kts app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          git commit -m 'Enrich VL80S compressed-air supply cards'
          git push origin HEAD:dev14-integration

      - name: Verify branch after source push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved after source push'; exit 1; }

      - name: Dispatch Dev14 safe build v2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run dev14-safe-build-v2.yml --ref dev14-integration
