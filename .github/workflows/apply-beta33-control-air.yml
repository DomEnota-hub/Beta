name: Polish Beta33 VL80S control-air text

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta33-control-air.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stale branch state
        shell: bash
        run: |
          set -euo pipefail
          expected="3d7c4c1e23a7fdae67a7ded46da55726113b0da6"
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$expected" || { echo "Expected workflow parent $expected, got $parent"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before polish'; exit 1; }

      - name: Replace stray English words
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, shutil
          from pathlib import Path

          app=Path('app/src/main/assets/technical/vl80s_equipment.json.gz')
          patch=Path('patch/app/src/main/assets/technical/vl80s_equipment.json.gz')
          with gzip.open(app,'rt',encoding='utf-8') as f:
              root=json.load(f)
          by={r['id']:r for r in root['records']}
          if len(root['records']) != 89:
              raise SystemExit('Unexpected equipment count')

          r=by['VL-EQ-PN-013']
          old='Запас быстро теряется после наполнения: локализуют утечку по резервуару, соединениям, арматуре и downstream-магистрали, не считая сам резервуар виновным заранее.'
          new='Запас быстро теряется после наполнения: локализуют утечку по резервуару, соединениям, арматуре и магистрали после резервуара, не считая сам резервуар виновным заранее.'
          if old not in r.get('deviationSigns',[]): raise SystemExit('PN-013 polish anchor not found')
          r['deviationSigns']=[new if x==old else x for x in r['deviationSigns']]

          r=by['VL-EQ-PN-015']
          old='Загрязнение или ограничение прохода может проявляться недостаточной подачей воздуха downstream-приборам при нормальном давлении до фильтра.'
          new='Загрязнение или ограничение прохода может проявляться недостаточной подачей воздуха приборам после фильтра при нормальном давлении перед ним.'
          if old not in r.get('deviationSigns',[]): raise SystemExit('PN-015 polish anchor not found')
          r['deviationSigns']=[new if x==old else x for x in r['deviationSigns']]

          text=json.dumps(root,ensure_ascii=False)
          if 'downstream' in text:
              raise SystemExit('Stray downstream token remains')
          with gzip.open(app,'wt',encoding='utf-8',compresslevel=9) as f:
              json.dump(root,f,ensure_ascii=False,separators=(',',':'))
          shutil.copy2(app,patch)
          assert app.read_bytes()==patch.read_bytes()
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz | sort)"
          test "$changed" = "$expected" || { echo 'Unexpected polish scope:'; git diff --name-only; exit 1; }

      - name: Commit and push polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          git commit -m 'Polish Beta33 control-air card wording'
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before polish push'; exit 1; }
          git push origin HEAD:dev14-integration
