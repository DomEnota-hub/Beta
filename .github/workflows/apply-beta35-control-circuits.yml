name: Apply Beta35 VL80S control circuits

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta35-control-circuits.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev14-integration

      - name: Refuse stale branch state
        shell: bash
        run: |
          set -euo pipefail
          expected="00cff5ce6806ca3e3e12d757e6610d6ea8aed26f"
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$expected" || { echo "Expected workflow parent $expected, got $parent"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta35 patch'; exit 1; }

      - name: Enrich control-circuit cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, gzip, json, re, shutil
          from pathlib import Path

          app_asset = Path('app/src/main/assets/technical/vl80s_equipment.json.gz')
          patch_asset = Path('patch/app/src/main/assets/technical/vl80s_equipment.json.gz')
          app_gradle = Path('app/build.gradle.kts')
          patch_gradle = Path('patch/app/build.gradle.kts')

          assert app_asset.read_bytes() == patch_asset.read_bytes(), 'app/patch equipment assets diverged before Beta35'
          assert app_gradle.read_text(encoding='utf-8') == patch_gradle.read_text(encoding='utf-8'), 'app/patch Gradle files diverged before Beta35'

          with gzip.open(app_asset, 'rt', encoding='utf-8') as f:
              root = json.load(f)
          records = root['records']
          assert len(records) == 89, len(records)
          ids_before = [r['id'] for r in records]
          before = {r['id']: copy.deepcopy(r) for r in records}
          byid = {r['id']: r for r in records}
          targets = [f'VL-EQ-CT-00{i}' for i in range(1, 7)]
          assert all(x in byid for x in targets)

          expected_diags = {
              'VL-EQ-CT-001': ['control-voltage-low','battery-no-charge','battery-overcharge'],
              'VL-EQ-CT-002': ['battery-no-charge','battery-overcharge','control-voltage-low'],
              'VL-EQ-CT-003': ['control-fuse-trip','relay-panel-overheat','section-control-loss'],
              'VL-EQ-CT-004': ['cab-control-mismatch','ekg-stuck','rheostatic-brake'],
              'VL-EQ-CT-005': ['control-voltage-low','control-fuse-trip','section-control-loss'],
              'VL-EQ-CT-006': ['control-fuse-trip','section-control-loss'],
          }
          expected_scheme_nodes = {rid: copy.deepcopy(byid[rid].get('schemeNodeIds', [])) for rid in targets}
          existing_rules_002 = copy.deepcopy(byid['VL-EQ-CT-002'].get('featureRules', []))
          existing_rules_003 = copy.deepcopy(byid['VL-EQ-CT-003'].get('featureRules', []))

          def sources(r, *extra):
              r['sourceRefs'] = list(dict.fromkeys((r.get('sourceRefs') or []) + list(extra)))

          # CT-001 — accumulator battery.
          r = byid['VL-EQ-CT-001']
          r['modelNames'] = ['НК-125']
          r['quantity'] = 'По одной аккумуляторной батарее на секцию; батарея состоит из 42 аккумуляторов НК-125, размещённых в двух металлических ящиках по 21 элементу.'
          r['location'] = {
              'text': 'Под кузовом каждой секции в аккумуляторных ящиках; батарея разделена на два ящика по 21 элементу.',
              'confidence': 'source_confirmed',
          }
          r['schemeDesignations'] = ['200А / 200Б — аккумуляторные батареи секций в базовой схеме ВЛ80С']
          r['parameters'] = [
              'Тип элементов: щелочные никель-кадмиевые НК-125.',
              'Номинальная ёмкость батареи: 125 А·ч.',
              'Номинальное напряжение батареи: 50 В.',
              'Состав батареи: 42 аккумулятора.'
          ]
          r['principle'] = (
              'Аккумуляторная батарея поддерживает питание низковольтных цепей управления и освещения при неработающем штатном зарядном источнике и участвует в переходных режимах питания. '
              'При работающем штатном источнике батарея заряжается, а сеть управления питается от системы выпрямления и регулирования; при исчезновении этого питания нагрузка переводится на батарею штатной схемой.'
          )
          r['relations'] = [
              {'type':'charged_by','targetId':'VL-EQ-CT-002','note':'штатный источник питания цепей управления обеспечивает заряд аккумуляторной батареи при нормальной работе'},
              {'type':'supplies','targetId':'VL-EQ-CT-005','note':'при отсутствии штатного источника батарея поддерживает питание распределительной сети управления 50 В'},
              {'type':'protected_via','targetId':'VL-EQ-CT-006','note':'ответственные низковольтные ветви, питаемые от батареи и штатного источника, секционируются и защищаются автоматическими выключателями; точный состав зависит от исполнения'}
          ]
          r['normalState'] = [
              'При работающем штатном источнике батарея получает заряд, а напряжение цепей управления остаётся устойчивым.',
              'При переходе на батарейное питание цепи управления сохраняют работоспособность без признаков резкой просадки напряжения.',
              'На батарее и соединениях отсутствуют ненормальный нагрев, следы повреждения, утечки электролита или признаки плохого контакта.'
          ]
          r['deviationSigns'] = [
              'Напряжение цепей управления заметно проседает при нагрузке или аппараты начинают неустойчиво включаться и удерживаться.',
              'После запуска штатного источника батарея не переходит в нормальный режим заряда либо признаки разряда сохраняются.',
              'Нагрев соединений, повреждение перемычек, следы электролита или локальные дефекты ящиков требуют разграничить неисправность самой батареи и внешней цепи.'
          ]
          r['notes'] = [
              'Пониженное напряжение сети 50 В само по себе не доказывает неисправность аккумуляторной батареи: причиной также могут быть зарядный источник, соединения, перегрузка или повреждение отдельной ветви.',
              'НК-125, 125 А·ч и 50 В подтверждены техническим описанием ВЛ80С; послеремонтную замену батареи сверяют по документации конкретной секции.'
          ]
          sources(r, 'VL-SRC-006')

          # CT-002 — normal control-power/charging source, with confirmed boundary at 2174.
          r = byid['VL-EQ-CT-002']
          r['modelNames'] = ['ТРПШ-2 + РЩ-34 — базовое исполнение', 'ЩР1 — исполнение с №2174']
          r['quantity'] = 'По одному комплекту штатного источника питания и зарядки цепей управления на секцию; конкретное исполнение определяется номером и фактической комплектацией секции.'
          r['schemeDesignations'] = ['ТРПШ — трансформатор питания цепей управления', 'РЩ-34 / аппарат 210 — распределительный щит базового исполнения', 'ЩР1 — распределительный щит с №2174']
          r['parameters'] = [
              'Для ТРПШ-2 базового исполнения: первичное напряжение 380 В.',
              'Для ТРПШ-2 базового исполнения: среднее выпрямленное напряжение вторичной обмотки 55 В.',
              'Для ТРПШ-2 базового исполнения: номинальный ток вторичной обмотки 80 А.',
              'Номинальная сеть потребителей цепей управления — 50 В.'
          ]
          r['principle'] = (
              'В базовом исполнении ТРПШ-2 совместно с выпрямительным мостом и устройствами распределительного щита формирует стабилизированное питание цепей управления и обеспечивает подзаряд аккумуляторной батареи. '
              'При исчезновении штатного питания схема переводит нагрузку на аккумуляторную батарею. С №2174 применяется ЩР1 с иной схемой питания, поэтому состав раннего РЩ-34/ТРПШ нельзя считать универсальным для поздних секций.'
          )
          r['relations'] = [
              {'type':'charges','targetId':'VL-EQ-CT-001','note':'обеспечивает штатный заряд аккумуляторной батареи при наличии питания зарядного комплекса'},
              {'type':'supplies','targetId':'VL-EQ-CT-005','note':'формирует штатное питание распределительной сети управления 50 В'},
              {'type':'protected_via','targetId':'VL-EQ-CT-006','note':'питание распределяется по отдельным защищённым ветвям через аппараты секционирования и защиты'}
          ]
          r['normalState'] = [
              'При штатной работе сеть управления получает устойчивое питание, а аккумуляторная батарея находится в режиме подзаряда.',
              'Переход между штатным источником и батарейным питанием не вызывает устойчивого отпадания исправных аппаратов управления.',
              'На распределительном щите, трансформаторе и соединениях отсутствуют признаки локального перегрева, повреждения изоляции или нестабильного контакта.'
          ]
          r['deviationSigns'] = [
              'Батарея не заряжается после включения штатного источника либо напряжение цепей управления остаётся пониженным.',
              'Повышенное напряжение сопровождается признаками перезаряда батареи или ненормальной работой низковольтной аппаратуры.',
              'Питание сети управления становится зависимым от батареи при наличии условий для работы штатного источника.',
              'Нагрев, запах или нестабильность на распределительном щите требуют разграничить неисправность источника, регулирования и конкретной отходящей цепи.'
          ]
          r['notes'] = [
              'Параметры 380 В / 55 В / 80 А относятся к ТРПШ-2 базового исполнения и не переносятся автоматически на ЩР1.',
              'Подтверждённая граница №2174 относится к переходу на ЩР1 и иной схеме питания цепей управления; после ремонтов фактическую комплектацию сверяют по секции.'
          ]
          r['featureRules'] = existing_rules_002
          assert any(x.get('feature') == 'control_power_shr1_2174' for x in r['featureRules'])
          sources(r, 'VL-SRC-006', 'VL-SRC-008')

          # CT-003 — relay panels / distributed low-voltage logic.
          r = byid['VL-EQ-CT-003']
          r['principle'] = (
              'Релейные панели объединяют промежуточные реле, контакты блокировок, соединения и часть аппаратуры защит, формируя логические условия включения исполнительных аппаратов. '
              'Команда от органов управления проходит через питание 50 В, разрешающие блокировки и контакты реле; только после выполнения необходимых условий получает питание соответствующая исполнительная цепь.'
          )
          r['relations'] = [
              {'type':'receives_power_from','targetId':'VL-EQ-CT-005','note':'релейная аппаратура питается от распределительной сети управления 50 В'},
              {'type':'protected_via','targetId':'VL-EQ-CT-006','note':'отдельные ветви релейных цепей защищаются и секционируются автоматическими выключателями'},
              {'type':'receives_commands_from','targetId':'VL-EQ-CT-004','note':'команды контроллера машиниста проходят через релейную и блокировочную логику прежде, чем воздействовать на исполнительные аппараты'},
              {'type':'interacts_with','targetId':'VL-EQ-PR-001','note':'часть разрешающих и отключающих условий формируется цепями защит; релейную панель и собственно защитные реле не следует считать одной сущностью'}
          ]
          r['normalState'] = [
              'Реле срабатывают и отпускают устойчиво в соответствии с командой и состоянием блокировок.',
              'Соединения и контактные элементы не имеют признаков локального перегрева, подгорания или ослабления.',
              'Команды между секциями и локальными исполнительными цепями проходят без самопроизвольных срывов и противоречивой индикации.'
          ]
          r['deviationSigns'] = [
              'Локальный запах, нагрев, потрескивание или изменение цвета элементов панели.',
              'Реле дребезжит, не удерживается либо не меняет состояние при наличии корректной команды и питания.',
              'Одна секция не выполняет команды ведущей либо её индикация не соответствует фактическому состоянию оборудования.',
              'Повторное отключение защищающего автомата указывает на необходимость искать дефект цепи, а не удерживать защиту включённой.'
          ]
          r['notes'] = [
              'Состав и размещение релейной аппаратуры менялись по мере выпуска ВЛ80С; точный номер реле и контакт сверяют по схеме конкретной секции.',
              'С №2174 часть аппаратуры перенесена с панелей №2 и №7 на отдельную панель напротив распределительного щита; существующий featureRule сохраняет эту вариантность.'
          ]
          r['featureRules'] = existing_rules_003
          assert any(x.get('feature') == 'relay_panel_relayout_2174' for x in r['featureRules'])
          sources(r, 'VL-SRC-006', 'VL-SRC-008')

          # CT-004 — driver controller KM-84.
          r = byid['VL-EQ-CT-004']
          r['modelNames'] = ['КМ-84']
          r['quantity'] = 'По одному контроллеру КМ-84 в каждой кабине/секции; 2 на штатный двухсекционный ВЛ80С.'
          r['location'] = {'text':'На рабочем месте машиниста в кабине каждой секции.','confidence':'source_confirmed'}
          r['schemeDesignations'] = ['КМЭ — контроллер машиниста']
          r['parameters'] = [
              'Кулачковые контакторы главного переключателя: 10.',
              'Кулачковые контакторы реверсивного переключателя: 7.',
              'Кулачковые контакторы тормозного переключателя: 5.',
              'Коммутирующие контакторы КЭ-153 работают в цепях постоянного тока 50 В.'
          ]
          r['principle'] = (
              'КМ-84 — многопозиционный кулачковый аппарат с главным, реверсивным и тормозным валами. Поворот рукояток изменяет состояние групп контактов, формируя команды тяги, набора/сброса, направления и реостатного торможения. '
              'Механические блокировки между валами ограничивают несовместимые положения, а дальнейшее выполнение команды определяется релейной логикой, блокировками и состоянием исполнительных аппаратов.'
          )
          r['relations'] = [
              {'type':'receives_power_from','targetId':'VL-EQ-CT-005','note':'контакты контроллера формируют команды в низковольтных цепях управления 50 В'},
              {'type':'commands_via','targetId':'VL-EQ-CT-003','note':'команды контроллера проходят через релейные, блокировочные и межсекционные цепи'},
              {'type':'commands','targetId':'VL-EQ-TR-001','note':'положения главной рукоятки участвуют в формировании команд набора и сброса позиций ЭКГ'},
              {'type':'commands','targetId':'VL-EQ-TR-005','note':'тормозной орган контроллера участвует в задании и подготовке режима реостатного торможения через соответствующую систему управления'}
          ]
          r['normalState'] = [
              'Рукоятки фиксируются и перемещаются в предусмотренных положениях без заедания и ненормального люфта.',
              'Механические блокировки не допускают несовместимых сочетаний положений валов.',
              'Команда контроллера соответствует реакции цепей управления и фактическому режиму оборудования.'
          ]
          r['deviationSigns'] = [
              'Положение рукоятки и фактическое состояние оборудования или индикации расходятся.',
              'Команда набора/сброса не доходит до ЭКГ либо выполняется нестабильно при исправном питании и исполнительной части.',
              'Нарушена фиксация, блокировка между валами, появляется заедание или нестабильное замыкание контактов.',
              'Реостатное торможение не подготавливается или срывается; причину разграничивают между контроллером, цепями управления и остальными узлами тормозной системы.'
          ]
          r['notes'] = [
              'КМ-84 подтверждён техническим описанием ВЛ80С. Legacy-node km84 согласуется с источником, но номера проводов и контактов берутся только со схемы соответствующего исполнения.',
              'Неисправность конечного исполнительного аппарата может имитировать отсутствие команды контроллера; диагностируют всю цепочку от команды до исполнения.'
          ]
          sources(r, 'VL-SRC-006', 'VL-SRC-008')

          # CT-005 — 50 V control distribution network.
          r = byid['VL-EQ-CT-005']
          r['parameters'] = [
              'Номинальное напряжение сети управления: 50 В постоянного тока.',
              'В штатной проверке ВЛ80С под контактным проводом контрольное напряжение цепей управления должно составлять 50±2,5 В.'
          ]
          r['principle'] = (
              'Распределительная сеть принимает низковольтное питание от штатного источника и аккумуляторной батареи и разводит его по защищённым ветвям к релейным, контакторным, электропневматическим, сигнальным и другим цепям управления. '
              'Межсекционные проводники передают часть команд и состояний между секциями, поэтому общая просадка 50 В либо разрыв конкретной ветви может проявляться сразу в нескольких функциональных системах.'
          )
          r['relations'] = [
              {'type':'supplied_by','targetId':'VL-EQ-CT-002','note':'штатный зарядный источник является основным источником питания сети 50 В при нормальной работе'},
              {'type':'backup_supplied_by','targetId':'VL-EQ-CT-001','note':'аккумуляторная батарея поддерживает сеть при отсутствии или переходном состоянии штатного источника'},
              {'type':'distributed_via','targetId':'VL-EQ-CT-006','note':'отдельные ответственные ветви сети защищаются и секционируются автоматическими выключателями'},
              {'type':'supplies','targetId':'VL-EQ-CT-003','note':'питает релейную и блокировочную логику цепей управления'},
              {'type':'supplies','targetId':'VL-EQ-CT-004','note':'обеспечивает электрическую цепь, в которой контакты контроллера формируют управляющие команды'},
              {'type':'supplies','targetId':'VL-EQ-PN-002','note':'питает электрическую управляющую часть клапана токоприёмника через соответствующие защитные и блокировочные цепи'}
          ]
          r['normalState'] = [
              'Напряжение сети устойчиво и не проседает при штатном включении потребителей до уровня, вызывающего отпадание аппаратов.',
              'Питание присутствует на разрешённых защищённых ветвях и корректно передаётся между секциями согласно выбранной кабине и режиму.',
              'Нет локального нагрева, повреждения соединений, запаха изоляции или повторного срабатывания защиты.'
          ]
          r['deviationSigns'] = [
              'Контакторы или реле отпадают, включаются неустойчиво либо несколько независимых систем одновременно теряют управление.',
              'Одна секция не получает команды при нормальной работе другой секции.',
              'Напряжение заметно падает при подключении нагрузки; причину разграничивают между источником, батареей, соединениями и перегрузкой конкретной ветви.',
              'Повторно срабатывает автомат отдельной цепи — это признак дефекта или перегрузки защищаемой ветви, а не основание обходить защиту.'
          ]
          r['notes'] = [
              'Контрольное значение 50±2,5 В относится к штатной проверке под контактным проводом; его не следует механически трактовать как универсальный порог для любого переходного режима.',
              'Схемы №937–1260 являются подтверждённой базой для соответствующего диапазона, но номера проводов и контактов поздних секций проверяют по их собственной схеме.'
          ]
          sources(r, 'VL-SRC-006', 'VL-SRC-008')

          # CT-006 — automatic breakers; exact model/rating intentionally not generalized.
          r = byid['VL-EQ-CT-006']
          r['location'] = {
              'text':'Блоки автоматических выключателей размещены в кабине и на панелях/в кузове в зависимости от защищаемой группы цепей; точную компоновку сверяют по схеме и перечню аппаратов секции.',
              'confidence':'confirmed_general',
          }
          r['principle'] = (
              'Автоматический выключатель включён последовательно в защищаемую низковольтную ветвь. При токовой аварии он разрывает её, локализуя повреждение и одновременно обесточивая соответствующих потребителей. '
              'Разделение сети на несколько защищённых ветвей позволяет отличать общий провал питания 50 В от отказа конкретной цепи.'
          )
          r['relations'] = [
              {'type':'receives_power_from','targetId':'VL-EQ-CT-005','note':'автоматы получают питание от распределительной сети 50 В и разделяют её на защищённые отходящие ветви'},
              {'type':'protects','targetId':'VL-EQ-CT-003','note':'часть релейных и управляющих цепей получает питание через соответствующие автоматы; конкретный автомат определяется схемой секции'},
              {'type':'protects','targetId':'VL-EQ-CT-004','note':'цепи команд от органов управления защищены в составе низковольтной сети; точную ветвь и обозначение автомата сверяют по схеме исполнения'}
          ]
          r['normalState'] = [
              'Автоматы штатно включены только для разрешённых к работе цепей и не отключаются повторно без причины.',
              'После включения защищаемая ветвь получает устойчивое питание, отсутствуют нагрев корпуса, запах или нестабильный контакт.',
              'Отключение конкретного автомата локализует отказ соответствующей ветви и не должно автоматически трактоваться как общий отказ сети 50 В.'
          ]
          r['deviationSigns'] = [
              'Автомат повторно отключается после штатной попытки включения — вероятны перегрузка, короткое замыкание или иной дефект защищаемой цепи.',
              'Автомат включён, но питание за ним отсутствует либо нестабильно — возможны неисправность контактов, соединения или аппарата.',
              'Локальный нагрев, запах, потрескивание или изменение цвета корпуса/соединений указывают на ненормальное состояние.'
          ]
          r['notes'] = [
              'Точный тип автомата, номинальный ток и обозначение зависят от защищаемой цепи и исполнения секции; без применимого источника эти значения намеренно не обобщаются.',
              'Повторно срабатывающую защиту нельзя удерживать включённой или обходить перемычкой: сначала локализуют причину отключения.'
          ]
          r.pop('modelNames', None)
          r.pop('quantity', None)
          r.pop('schemeDesignations', None)
          r.pop('parameters', None)
          sources(r, 'VL-SRC-006', 'VL-SRC-008')

          # Preserve IDs, diagnostics, scheme-node bindings and confirmed variant gates.
          assert [x['id'] for x in records] == ids_before
          changed = [rid for rid in ids_before if byid[rid] != before[rid]]
          assert changed == targets, changed
          for rid in targets:
              assert byid[rid]['diagnosticScenarioIds'] == expected_diags[rid], rid
              assert byid[rid].get('schemeNodeIds', []) == expected_scheme_nodes[rid], rid
          assert byid['VL-EQ-CT-002']['featureRules'] == existing_rules_002
          assert byid['VL-EQ-CT-003']['featureRules'] == existing_rules_003

          valid_ids = set(ids_before)
          for rid in targets:
              rec = byid[rid]
              for rel in rec.get('relations', []):
                  assert rel['targetId'] in valid_ids, (rid, rel)
                  assert rel.get('note','').strip(), (rid, rel)
              text = json.dumps({
                  'quantity': rec.get('quantity'), 'location': rec.get('location'),
                  'schemeDesignations': rec.get('schemeDesignations'), 'parameters': rec.get('parameters'),
                  'principle': rec.get('principle'), 'normalState': rec.get('normalState'),
                  'deviationSigns': rec.get('deviationSigns'), 'notes': rec.get('notes'),
                  'relationNotes': [q.get('note') for q in rec.get('relations', [])],
              }, ensure_ascii=False)
              assert 'VL-EQ-' not in text, rid

          with gzip.open(app_asset, 'wt', encoding='utf-8', newline='') as f:
              json.dump(root, f, ensure_ascii=False, separators=(',', ':'))
          shutil.copyfile(app_asset, patch_asset)
          assert app_asset.read_bytes() == patch_asset.read_bytes()

          for path in (app_gradle, patch_gradle):
              text = path.read_text(encoding='utf-8')
              text, n1 = re.subn(r'versionCode\s*=\s*179\b', 'versionCode = 180', text, count=1)
              text, n2 = re.subn(r'versionName\s*=\s*"1\.2\.2-dev14-beta34"', 'versionName = "1.2.2-dev14-beta35"', text, count=1)
              assert n1 == 1 and n2 == 1, (path, n1, n2)
              path.write_text(text, encoding='utf-8')
          assert app_gradle.read_text(encoding='utf-8') == patch_gradle.read_text(encoding='utf-8')

          # Re-open final gzip to catch serialization errors.
          with gzip.open(app_asset, 'rt', encoding='utf-8') as f:
              final_root = json.load(f)
          assert len(final_root['records']) == 89
          print('Beta35 changed cards:', ', '.join(changed))
          PY

          git diff --check
          git status --short
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' app/build.gradle.kts app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/build.gradle.kts patch/app/src/main/assets/technical/vl80s_equipment.json.gz | sort)"
          test "$changed" = "$expected" || { echo 'Unexpected Beta35 diff:'; printf '%s\n' "$changed"; exit 1; }

      - name: Re-check branch and commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta35 source commit'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts patch/app/build.gradle.kts app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          git commit -m 'Enrich VL80S control circuits'
          git push origin HEAD:dev14-integration
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
