name: Apply Beta36 auxiliary machines

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta36-auxiliary-machines.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev14-integration

      - name: Guard Beta36 base
        shell: bash
        run: |
          set -euo pipefail
          expected="c4d31ef6753a8dde9a4018854b6e574305880c22"
          test "$(git rev-parse HEAD^)" = "$expected" || { echo "Unexpected Beta36 parent: $(git rev-parse HEAD^)"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta36 apply'; exit 1; }

      - name: Enrich six auxiliary-machine cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, gzip, json, re
          from pathlib import Path

          app = Path('app/src/main/assets/technical/vl80s_equipment.json.gz')
          patch = Path('patch/app/src/main/assets/technical/vl80s_equipment.json.gz')
          with gzip.open(app, 'rt', encoding='utf-8') as f:
              root = json.load(f)
          before = copy.deepcopy(root)
          records = root['records']
          assert len(records) == 89
          byid = {r['id']: r for r in records}
          targets = {
              'VL-EQ-AU-001','VL-EQ-AU-002','VL-EQ-AU-004',
              'VL-EQ-AU-005','VL-EQ-AU-006','VL-EQ-AU-007'
          }
          assert targets <= set(byid)
          before_byid = {r['id']: copy.deepcopy(r) for r in before['records']}

          def rel(kind, target, note):
              return {'type': kind, 'targetId': target, 'note': note}

          r = byid['VL-EQ-AU-001']
          r['principle'] = (
              'Фазорасщепитель работает в системе собственных нужд: из однофазного питания, поступающего от '
              'соответствующей обмотки тягового трансформатора, формируется трёхфазная система для питания '
              'вспомогательных электродвигателей. Его исправная работа является общим условием запуска связанных '
              'вентиляторов, компрессора и других потребителей вспомогательной сети.'
          )
          r['relations'] = [
              rel('fed_from','VL-EQ-TR-004','получает питание системы собственных нужд от тягового трансформатора'),
              rel('supplies','VL-EQ-AU-004','питание вспомогательной сети далее коммутируется контакторами отдельных машин'),
              rel('supplies','VL-EQ-AU-002','обеспечивает трёхфазное питание системы мотор-вентиляторов'),
              rel('supplies','VL-EQ-AU-003','обеспечивает питание электропривода основного мотор-компрессора через штатную коммутацию'),
              rel('supplies','VL-EQ-AU-006','обеспечивает питание цепи электропривода маслонасоса через штатную коммутацию')
          ]
          r['normalState'] = [
              'После штатной команды фазорасщепитель запускается и вспомогательная трёхфазная сеть становится доступна без повторного действия защиты.',
              'Связанные вспомогательные машины получают условия для запуска; нет признаков общей потери одной из фаз или устойчивого ненормального режима ФР.',
              'Работа отдельного потребителя оценивается отдельно: исправный ФР не доказывает исправность конкретного контактора, двигателя или механизма.'
          ]
          r['deviationSigns'] = [
              'Фазорасщепитель не запускается либо сразу отключается защитой, вследствие чего одновременно недоступна группа вспомогательных машин.',
              'Несколько независимых вспомогательных машин не запускаются одновременно — общую причину ищут в питании собственных нужд, ФР и общей коммутации до проверки отдельных двигателей.',
              'Ненормальный запуск, устойчивый шум, перегрев или признаки неполнофазного режима требуют разграничения неисправности ФР, питающей цепи и нагрузки.'
          ]
          r['notes'] = [
              'Опытная партия №484–513 с АЭ-92-4 вместо НБ-455А уже хранится как section override; её нельзя считать основным исполнением всех ВЛ80С.',
              'С №2654 в базе подтверждён отдельный поздний вариант схемы фазорасщепителя. Номера проводов и аппаратов схемы №937–1260 нельзя автоматически переносить на поздние секции.',
              'НБ-455А и АЭ-92-4 не продвигаются в универсальное поле modelNames только на основании legacy/variant текста: фактический аппарат сверяют по документации конкретной секции.'
          ]

          r = byid['VL-EQ-AU-002']
          r['principle'] = (
              'Электродвигатели мотор-вентиляторов приводят вентиляторные агрегаты и создают принудительный поток воздуха. '
              'Поток через штатные воздуховоды распределяется к закреплённым группам силового оборудования; наличие вращения '
              'двигателя само по себе не гарантирует достаточный расход воздуха в конечной точке.'
          )
          r['relations'] = [
              rel('receives_power_from','VL-EQ-AU-001','работает от трёхфазной сети собственных нужд, формируемой фазорасщепителем'),
              rel('switched_by','VL-EQ-AU-004','питание конкретного мотор-вентилятора включается соответствующей коммутационной аппаратурой'),
              rel('supplies_airflow_to','VL-EQ-AU-005','создаёт поток, который распределяется воздуховодами и заслонками'),
              rel('monitored_by','VL-EQ-AU-007','наличие требуемого вентиляционного режима контролируется связанными устройствами контроля потока'),
              rel('cools','VL-EQ-TR-003','принудительная вентиляция участвует в охлаждении тяговых выпрямительных установок'),
              rel('cools','VL-EQ-TR-006','принудительная вентиляция обеспечивает охлаждение тяговых двигателей'),
              rel('cools','VL-EQ-TR-009','вентиляционные группы обеспечивают охлаждение блоков тормозных резисторов')
          ]
          r['normalState'] = [
              'После команды соответствующий мотор-вентилятор устойчиво выходит в рабочий режим без повторного отключения защиты.',
              'В связанном воздушном тракте присутствует устойчивый поток, а контроль вентиляции подтверждает требуемое состояние.',
              'Нет выраженного ненормального шума, вибрации, запаха перегрева электродвигателя или признаков ухудшения охлаждения закреплённой группы.'
          ]
          r['deviationSigns'] = [
              'Электродвигатель вентилятора не запускается либо отключается — причину разделяют между питанием, контактором, защитой и самим двигателем.',
              'Вентилятор работает, но поток недостаточен: проверяют воздушный тракт, заслонки, сопротивление канала и контроль потока, а не только электродвигатель.',
              'Перегрев одного из охлаждаемых аппаратов при работающем вентиляторе не доказывает неисправность вентилятора: возможны нарушение распределения воздуха или неисправность самого аппарата.'
          ]
          r['notes'] = [
              'Точные модели, количество и назначение всех обозначений МВ по серийным исполнениям в текущем наборе независимых assets не подтверждены достаточно для универсализации; фактический состав сверяют по схеме секции.',
              'Для тормозных резисторов в существующей базе подтверждена функциональная привязка R11/R12 и R13/R14 к разным вентиляционным группам; конкретную трассировку воздуховодов не домысливать.'
          ]

          r = byid['VL-EQ-AU-004']
          r['principle'] = (
              'Контактор вспомогательной машины по команде низковольтной цепи управления замыкает или размыкает её силовое питание. '
              'Поэтому отсутствие работы машины может быть вызвано как силовой частью контактора, так и отсутствием команды, '
              'просадкой 50 В, действием защиты либо неисправностью уже самого электродвигателя.'
          )
          r['relations'] = [
              rel('receives_power_from','VL-EQ-AU-001','коммутирует питание, поступающее из системы собственных нужд'),
              rel('controlled_by','VL-EQ-CT-003','катушка и разрешающие цепи зависят от релейной логики управления'),
              rel('controlled_by','VL-EQ-CT-005','управляющая цепь зависит от исправного распределения сети 50 В'),
              rel('switches','VL-EQ-AU-002','включает силовое питание соответствующих мотор-вентиляторов'),
              rel('switches','VL-EQ-AU-003','участвует в коммутации электропривода мотор-компрессора'),
              rel('switches','VL-EQ-AU-006','участвует в коммутации электропривода маслонасоса трансформатора')
          ]
          r['normalState'] = [
              'При выполненных разрешающих условиях контактор чётко включается и удерживается без дребезга.',
              'Силовые контакты обеспечивают питание соответствующей машины без признаков локального перегрева, подгорания или нестабильного включения.',
              'После снятия команды контактор штатно отключается; состояние конечной машины соответствует состоянию коммутационной цепи.'
          ]
          r['deviationSigns'] = [
              'Контактор не включается: различают отсутствие команды, потерю питания 50 В, разрыв цепи катушки, блокировку и механический/электрический отказ аппарата.',
              'Контактор дребезжит или отпадает — кроме самого аппарата проверяют просадку напряжения управления и нестабильность разрешающих цепей.',
              'Контактор включён, но машина не работает — неисправность локализуют далее по силовой цепи и самому потребителю; не считать контактор причиной автоматически.'
          ]
          r['notes'] = [
              'Контакторы вспомогательных машин не следует смешивать с линейными тяговыми контакторами БСА и переключателями тяга/торможение.',
              'Ранее существовавшая безликая связь с ТЭД удалена: в этой карточке описывается коммутация вспомогательных электродвигателей, а не силовая тяговая цепь.'
          ]

          r = byid['VL-EQ-AU-005']
          r['principle'] = (
              'Воздуховоды, форкамеры, жалюзи и заслонки направляют поток от мотор-вентиляторов к закреплённым группам оборудования. '
              'Исправность охлаждения определяется не только работой вентилятора, но и проходимостью тракта, правильным положением '
              'элементов распределения и фактическим поступлением воздуха к потребителю.'
          )
          r['relations'] = [
              rel('fed_by','VL-EQ-AU-002','получает принудительный поток от мотор-вентиляторов'),
              rel('monitored_by','VL-EQ-AU-007','состояние вентиляции отдельных трактов контролируется устройствами контроля потока'),
              rel('cools','VL-EQ-TR-003','направляет охлаждающий воздух к тяговым выпрямительным установкам'),
              rel('cools','VL-EQ-TR-006','направляет охлаждающий воздух к тяговым двигателям'),
              rel('cools','VL-EQ-TR-009','участвует в подводе воздуха к блокам тормозных резисторов')
          ]
          r['normalState'] = [
              'Воздушный тракт проходим, доступные элементы не имеют видимых повреждений или перекрытия, заслонки находятся в требуемом для режима положении.',
              'При работающем мотор-вентиляторе поток доходит до закреплённой охлаждаемой группы без выраженного ненормального сопротивления или утечки воздуха.',
              'Контроль вентиляции подтверждает требуемое состояние, а охлаждаемое оборудование не показывает признаков ухудшения теплоотвода.'
          ]
          r['deviationSigns'] = [
              'Мотор-вентилятор работает, но поток у потребителя слабый или отсутствует — возможны повреждение, засорение, неплотность либо неправильное положение элементов тракта.',
              'Контроль вентиляции не подтверждает поток при работающем вентиляторе; отдельно проверяют реальный воздушный тракт и цепь контроля.',
              'Локальный перегрев охлаждаемой группы при исправном электроприводе вентилятора требует проверки распределения воздуха до вывода о неисправности самого аппарата.'
          ]
          old_notes = list(r.get('notes') or [])
          r['notes'] = old_notes + [
              'Точная физическая трассировка воздуховодов намеренно не универсализируется: после ремонтов и модернизаций компоновка конкретной секции может отличаться.',
              'Статус profile_detail_pending сохраняется до появления документации, позволяющей надёжно привязать трассировку к серийному исполнению.'
          ]

          r = byid['VL-EQ-AU-006']
          r['principle'] = (
              'Электропривод насоса обеспечивает принудительную циркуляцию трансформаторного масла через охлаждающий контур. '
              'Работа насоса является только одной частью теплоотвода: итоговый тепловой режим также зависит от состояния масла, '
              'радиаторов, воздушного охлаждения и самого тягового трансформатора.'
          )
          r['relations'] = [
              rel('serves','VL-EQ-TR-004','обеспечивает циркуляцию масла в системе охлаждения тягового трансформатора'),
              rel('switched_by','VL-EQ-AU-004','электропривод насоса получает питание через штатную коммутационную аппаратуру вспомогательных машин'),
              rel('works_with','VL-EQ-AU-005','теплоотвод масляной системы зависит также от исправности связанного воздушного охлаждения')
          ]
          r['normalState'] = [
              'При выполненных штатных условиях насос включается и работает устойчиво без повторного отключения защиты.',
              'Нет ненормального шума, выраженной вибрации, течи в доступной зоне или признаков нарушения циркуляции масла.',
              'Температурное состояние трансформатора соответствует режиму нагрузки и работе комплекса масляного и воздушного охлаждения.'
          ]
          r['deviationSigns'] = [
              'Насос не запускается: причину разделяют между условиями разрешения пуска, цепью управления, контактором, силовым питанием и самим агрегатом.',
              'Повышенный шум, вибрация или признаки отсутствия циркуляции требуют проверки насосного агрегата и охлаждающего контура.',
              'Ненормальный нагрев масла или трансформатора не доказывает неисправность насоса: учитывают радиаторы, воздушное охлаждение, состояние масла и сам трансформатор.'
          ]
          r['notes'] = [
              'Обозначение «4ТТ-63/10» сохранено только как существующий поисковый alias; в текущем наборе независимых technical-assets оно не подтверждено как точная модель насоса и не переносится в modelNames.',
              'Параметры производительности и электрические характеристики не приведены без отдельного подтверждения для установленного исполнения ВЛ80С.'
          ]

          r = byid['VL-EQ-AU-007']
          r['principle'] = (
              'Устройство контроля вентиляции отслеживает наличие требуемого состояния воздушного потока в связанном тракте и '
              'передаёт результат в цепи контроля/блокировок. Оно не создаёт поток: отсутствие подтверждения может быть вызвано '
              'как реальной потерей вентиляции, так и неисправностью самого устройства или его электрической цепи.'
          )
          r['relations'] = [
              rel('monitors','VL-EQ-AU-005','контролирует состояние потока в связанном вентиляционном тракте'),
              rel('monitors','VL-EQ-AU-002','подтверждает результат работы соответствующей вентиляционной группы, а не только наличие команды на двигатель'),
              rel('control_signal_to','VL-EQ-CT-003','сигнал контроля вентиляции используется в релейно-блокировочных цепях управления')
          ]
          r['normalState'] = [
              'При фактически достаточной вентиляции устройство устойчиво подтверждает требуемое состояние без самопроизвольных переключений.',
              'При исчезновении потока состояние контроля изменяется в соответствии с логикой связанной схемы и не остаётся ложноположительным.',
              'Показание/контакт контроля согласуется с фактической работой вентилятора и состоянием воздушного тракта.'
          ]
          r['deviationSigns'] = [
              'Вентилятор и воздушный поток фактически присутствуют, но цепь не получает подтверждения вентиляции — проверяют устройство контроля, его подключение и место контроля.',
              'Устройство подтверждает вентиляцию при явном отсутствии потока — возможна неисправность чувствительного/контактного узла или цепи контроля.',
              'Повторяющийся нестабильный сигнал требует разграничить колебание реального потока, проблему воздуховода и электрическую неисправность контроля.'
          ]
          r['notes'] = [
              '«УПВ-5» сохранено как существующий alias для поиска, но текущие независимые technical-assets не дают достаточного подтверждения, чтобы универсально записать его в modelNames для всех секций.',
              'Численная уставка срабатывания намеренно не приводится без достоверного источника на конкретное исполнение.'
          ]

          # Preserve hard boundaries explicitly.
          for rid in targets:
              assert byid[rid].get('diagnosticScenarioIds') == before_byid[rid].get('diagnosticScenarioIds')
              assert byid[rid].get('schemeNodeIds') == before_byid[rid].get('schemeNodeIds')
              assert byid[rid].get('featureRules') == before_byid[rid].get('featureRules')
              assert byid[rid].get('equipmentOverrides') == before_byid[rid].get('equipmentOverrides')
          assert byid['VL-EQ-AU-005']['location']['confidence'] == 'profile_detail_pending'
          assert byid['VL-EQ-AU-003'] == before_byid['VL-EQ-AU-003']
          assert '4ТТ-63/10' not in (byid['VL-EQ-AU-006'].get('modelNames') or [])
          assert 'УПВ-5' not in (byid['VL-EQ-AU-007'].get('modelNames') or [])

          # No non-target equipment card may change.
          for rec in records:
              if rec['id'] not in targets:
                  assert rec == before_byid[rec['id']], rec['id']

          all_ids = set(byid)
          for rid in targets:
              for rr in byid[rid].get('relations', []) or []:
                  assert rr.get('targetId') in all_ids, (rid, rr)
                  assert rr.get('note'), (rid, rr)

          depth_fields = [
              'modelNames','quantity','location','schemeDesignations','parameters','principle',
              'relations','normalState','deviationSigns','diagnosticScenarioIds','schemeNodeIds',
              'applicability','featureRules','notes','sourceRefs'
          ]
          for rid in sorted(targets):
              d = sum(bool(byid[rid].get(k)) for k in depth_fields)
              print('DEPTH', rid, d)
              assert d >= 8, (rid, d)

          payload = json.dumps(root, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
          gz = gzip.compress(payload, compresslevel=9, mtime=0)
          app.write_bytes(gz)
          patch.write_bytes(gz)

          for path in [Path('app/build.gradle.kts'), Path('patch/app/build.gradle.kts')]:
              text = path.read_text(encoding='utf-8')
              text, n1 = re.subn(r'versionCode = 180\b', 'versionCode = 181', text, count=1)
              text, n2 = re.subn(r'versionName = "1\.2\.2-dev14-beta35"', 'versionName = "1.2.2-dev14-beta36"', text, count=1)
              assert n1 == 1 and n2 == 1, path
              path.write_text(text, encoding='utf-8')
          PY

