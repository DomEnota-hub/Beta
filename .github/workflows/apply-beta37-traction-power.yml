name: Apply Beta37 traction power

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta37-traction-power.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev14-integration

      - name: Guard Beta37 base
        shell: bash
        run: |
          set -euo pipefail
          expected="10e54b5cbf62313df7f214a641cf1f5e134ebe91"
          test "$(git rev-parse HEAD^)" = "$expected" || { echo "Unexpected workflow parent: $(git rev-parse HEAD^)"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta37 apply'; exit 1; }

      - name: Enrich traction power cards
        shell: bash
        run: |
          set -euo pipefail
          cmp app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          cmp app/build.gradle.kts patch/app/build.gradle.kts
          python3 - <<'PY'
          import copy, gzip, json, re, shutil
          from pathlib import Path

          app_eq = Path('app/src/main/assets/technical/vl80s_equipment.json.gz')
          patch_eq = Path('patch/app/src/main/assets/technical/vl80s_equipment.json.gz')
          with gzip.open(app_eq, 'rt', encoding='utf-8') as f:
              data = json.load(f)
          records = data['records']
          assert len(records) == 89
          by_id = {r['id']: r for r in records}
          targets = {'VL-EQ-TR-001','VL-EQ-TR-002','VL-EQ-TR-003','VL-EQ-TR-004','VL-EQ-TR-006'}
          assert targets <= set(by_id)
          untouched = {rid: copy.deepcopy(r) for rid, r in by_id.items() if rid not in targets}
          preserved_fields = ['id','legacyId','slug','kind','domain','systemIds','diagnosticScenarioIds','schemeNodeIds','applicability','featureRules','equipmentOverrides','crosslinks','migration']
          preserved = {rid: {k: copy.deepcopy(by_id[rid].get(k)) for k in preserved_fields} for rid in targets}

          def set_card(rid, **values):
              r = by_id[rid]
              for k,v in values.items():
                  r[k] = v

          set_card('VL-EQ-TR-004',
              modelNames=['ОДЦЭ-5000/25Б'],
              quantity='1 тяговый трансформатор на секцию.',
              schemeDesignations=['3 — тяговый трансформатор в базовой силовой схеме №937–1260'],
              parameters=[
                  'Номинальное напряжение сетевой обмотки — 25 000 В.',
                  'Номинальная мощность сетевой обмотки — 4485 кВ·А; тяговых обмоток — 4260 кВ·А.',
                  'Номинальное напряжение тяговых обмоток на выводах а1–01 и а2–02 — 1218 В.',
                  'Обмотка собственных нужд имеет выводы на 232, 406 и 638 В; конкретное включение определяется схемой секции.',
                  'Охлаждение масляное с принудительной циркуляцией через радиаторы; насос и воздушный обдув являются отдельными элементами системы охлаждения.'
              ],
              principle='Тяговый трансформатор понижает напряжение контактной сети и имеет отдельные вторичные цепи для тяги и собственных нужд. Тяговые вторичные обмотки работают совместно с ЭКГ: изменение их включения меняет напряжение, поступающее далее к тяговым выпрямительным установкам. Масло одновременно выполняет изоляционную и охлаждающую функции, а принудительная циркуляция отводит тепло к радиаторам.',
              normalState=[
                  'Нет течи масла, дыма, запаха перегретой изоляции, следов пробоя или ненормального нагрева корпуса и выводов.',
                  'Уровень и состояние масла соответствуют эксплуатационному состоянию, масляная циркуляция и обдув радиаторов работают штатно.',
                  'При исправных входной высоковольтной цепи, ЭКГ и нагрузке вторичные цепи не вызывают повторного действия защит.'
              ],
              deviationSigns=[
                  'Действие трансформаторной или общей высоковольтной защиты, дым, запах изоляции, следы масла или локальный перегрев требуют разграничения неисправности самого трансформатора и внешних цепей.',
                  'Ненормальный нагрев при исправной нагрузке может быть связан как с электрической частью, так и с нарушением циркуляции масла либо обдува радиаторов.',
                  'Отсутствие тяги само по себе не доказывает отказ трансформатора: проверяют входную цепь, положение ЭКГ, выпрямительные установки и силовую коммутацию.'
              ],
              relations=[
                  {'type':'fed_from','targetId':'VL-EQ-HV-001','note':'получает питание контактной сети через главный выключатель и входную высоковольтную цепь'},
                  {'type':'regulated_by','targetId':'VL-EQ-TR-001','note':'ЭКГ изменяет включение тяговых вторичных обмоток и тем самым ступенчато изменяет тяговое напряжение'},
                  {'type':'supplies','targetId':'VL-EQ-TR-003','note':'питает две тяговые выпрямительные установки соответствующими вторичными цепями'},
                  {'type':'supplies','targetId':'VL-EQ-AU-001','note':'обмотка собственных нужд питает систему вспомогательных машин через соответствующую схему'},
                  {'type':'cooled_via','targetId':'VL-EQ-AU-006','note':'маслонасос обеспечивает принудительную циркуляцию трансформаторного масла через радиаторы'}
              ],
              unresolvedSystemConnections=[],
              notes=[
                  'ОДЦЭ-5000/25Б является базовым тяговым трансформатором ВЛ80С; фактическое исполнение после модернизаций сверяют по документации конкретной секции.',
                  'Для секции №1270 в базе сохранён отдельный исторический override: опытное исполнение с двухрядным расположением радиаторов. Его нельзя распространять на соседние номера.',
                  'Проблема масла, насоса или обдува не означает автоматически внутреннюю электрическую неисправность трансформатора.'
              ])

          set_card('VL-EQ-TR-001',
              modelNames=['ЭКГ-8Ж'],
              quantity='1 главный контроллер ЭКГ-8Ж на секцию.',
              schemeDesignations=['ГП'],
              parameters=[
                  '33 фиксированные позиции, из них 9 ходовых.',
                  'Переключатель ступеней имеет 18 контакторов, переключатель обмоток — 12; дополнительно применяются 4 контактора с дугогашением.',
                  'Номинальный ток силовых контакторов — 1300 А.',
                  'Блокировочные цепи аппарата работают в системе управления 50 В.'
              ],
              principle='ЭКГ-8Ж ступенчато изменяет включение регулируемой и нерегулируемой частей тяговых вторичных обмоток трансформатора. Команда набора или сброса поступает из цепей управления, сервопривод поворачивает кулачковые валы, а переходной реактор ограничивает переходные токи между ступенями. Результатом является изменение напряжения, подводимого через выпрямительные установки к ТЭД.',
              normalState=[
                  'Набор и сброс выполняются последовательно без зависания на промежуточном положении.',
                  'Фактическое положение ЭКГ соответствует указателю и состоянию блок-контактов.',
                  'Парные секции при работе по СМЕ не накапливают устойчивого рассогласования позиций при исправных цепях синхронизации.'
              ],
              deviationSigns=[
                  'ЭКГ не начинает набор/сброс, останавливается между позициями или переходит заметно медленнее штатного процесса.',
                  'Указатель положения и фактическое состояние аппарата расходятся.',
                  'Повторяющееся рассогласование секций требует разграничения механики ЭКГ, сервопривода, блок-контактов и схемы синхронизации.'
              ],
              relations=[
                  {'type':'commanded_by','targetId':'VL-EQ-CT-004','note':'команды набора и сброса формируются органами контроллера машиниста через цепи управления'},
                  {'type':'switches','targetId':'VL-EQ-TR-004','note':'переключает тяговые вторичные обмотки трансформатора и изменяет тяговое напряжение'},
                  {'type':'works_with','targetId':'VL-EQ-TR-011','note':'переходной реактор участвует в безопасном переходном процессе между ступенями ЭКГ'},
                  {'type':'regulates_supply_to','targetId':'VL-EQ-TR-003','note':'изменение ступени трансформатора изменяет переменное напряжение, поступающее на тяговые ВУ'}
              ],
              unresolvedSystemConnections=['сигнализация положения'],
              notes=[
                  'Базовая рабочая схема цепей управления ЭКГ в приложении относится к source-reference bucket №937–1260; номера проводов и контактов нельзя переносить на все исполнения.',
                  'С №1406 сохранено подтверждённое изменение схемы синхронизации ЭКГ при СМЕ; feature rule ekg_sme_sync_updated остаётся приоритетным.',
                  'Неисправность набора позиции может находиться в цепях 50 В, релейной логике, приводе, блок-контактах, переходной силовой цепи или самом ЭКГ.'
              ])

          set_card('VL-EQ-TR-003',
              modelNames=['ВУК-4000Т-02','ВОППД-3,15к-1,4к-02'],
              quantity='2 тяговые выпрямительные установки на секцию — аппараты 61 и 62.',
              schemeDesignations=['61','62'],
              parameters=[
                  'Назначение обеих исполнений — преобразование переменного тока тяговых вторичных цепей в постоянный для питания ТЭД.',
                  'Каждая установка обслуживает тяговую группу своей тележки через соответствующие силовые аппараты.',
                  'Охлаждение принудительное воздушное; фактические параметры и элементная база зависят от установленного исполнения ВУ.'
              ],
              principle='Каждая тяговая ВУ работает как силовой выпрямительный мост: принимает переменное напряжение от соответствующей тяговой вторичной цепи трансформатора и формирует выпрямленный ток. Далее ток проходит через сглаживающий реактор и силовую коммутацию к группе тяговых двигателей.',
              normalState=[
                  'Обе выпрямительные группы работают без устойчивой токовой асимметрии и повторного действия защит.',
                  'Принудительное воздушное охлаждение соответствующей ВУ обеспечено; нет запаха перегрева, дыма или признаков повреждения силовых элементов.',
                  'При одинаковом режиме групп отсутствует необъяснимое систематическое различие тягового тока.'
              ],
              deviationSigns=[
                  'Отказ одной группы может проявляться потерей тяги соответствующей тележки, токовой асимметрией либо действием защиты.',
                  'Перегрев при сохранённой электрической работе требует проверки как самой ВУ, так и вентиляции/воздуховода.',
                  'Токовая асимметрия не доказывает отказ ВУ без проверки БСА, сглаживающего реактора, соединений и ТЭД.'
              ],
              relations=[
                  {'type':'fed_from','targetId':'VL-EQ-TR-004','note':'получает переменное тяговое напряжение от соответствующей вторичной цепи тягового трансформатора'},
                  {'type':'feeds','targetId':'VL-EQ-TR-010','note':'подаёт выпрямленный ток в соответствующий сглаживающий реактор'},
                  {'type':'works_with','targetId':'VL-EQ-TR-002','note':'после выпрямления силовая цепь проходит через аппаратуру БСА соответствующей тележки'},
                  {'type':'supplies','targetId':'VL-EQ-TR-006','note':'через реактор и силовую коммутацию обеспечивает питание соответствующей группы тяговых двигателей'},
                  {'type':'cooled_by','targetId':'VL-EQ-AU-002','note':'принудительный воздушный поток мотор-вентиляторов участвует в охлаждении тяговых ВУ'}
              ],
              unresolvedSystemConnections=[],
              notes=[
                  'В техническом описании ВЛ80С встречаются два исполнения тяговых ВУ — ВУК-4000Т-02 и ВОППД-3,15к-1,4к-02; конкретную установку определяют по секции, универсальную номерную границу без источника не вводят.',
                  'Не смешивать тяговые ВУ 61/62 с ВУВ-758 — выпрямительной установкой возбуждения реостатного тормоза.',
                  'С №2349 сохранено отдельное изменение схемы защиты ВУ; базовую защитную схему нельзя считать универсальной для поздних секций.'
              ])

          set_card('VL-EQ-TR-002',
              quantity='2 блока на секцию: БСА №1 обслуживает силовые аппараты первой тележки, БСА №2 — второй.',
              schemeDesignations=['БСА №1','БСА №2'],
              parameters=[
                  'В БСА №1 линейные контакторы ТЭД первой тележки обозначены 51 и 52; в БСА №2 второй тележки — 53 и 54.',
                  'В блоках размещены аппараты трёх ступеней ослабления возбуждения, разъединители ТЭД, реверсоры, тормозные переключатели и реле перегрузки соответствующей тележки.',
                  'Состав конкретного блока и номера аппаратов необходимо сверять со схемой исполнения секции.'
              ],
              principle='БСА объединяют силовую коммутацию каждой тележки. Линейные контакторы подключают тяговую группу, аппараты ослабления возбуждения изменяют режим поля ТЭД, реверсор задаёт направление, а защитные реле контролируют недопустимые токовые режимы. БСА не является единым самостоятельным преобразователем: это конструктивный блок нескольких аппаратов с разными функциями.',
              normalState=[
                  'Требуемые силовые аппараты обеих тележек включаются и отключаются согласованно с командой и состоянием блокировок.',
                  'Нет устойчивого дребезга контакторов, следов перегрева, подгорания, ослабления доступных соединений или повторного действия токовых защит.',
                  'При одинаковом заданном режиме обе тяговые группы формируют ожидаемую конфигурацию без необъяснимой асимметрии.'
              ],
              deviationSigns=[
                  'Не собирается силовая цепь одной тележки при исправной общей подготовке.',
                  'Линейный или иной контактор не подтверждает включение, отпадает либо имеет признаки перегрева/подгорания.',
                  'Токовая асимметрия или действие защиты требует различать неисправность аппарата БСА, ВУ, ТЭД и внешних соединений.'
              ],
              relations=[
                  {'type':'receives_power_from','targetId':'VL-EQ-TR-003','note':'работает в силовой цепи после соответствующей тяговой выпрямительной группы и сглаживающего реактора'},
                  {'type':'switches_power_to','targetId':'VL-EQ-TR-006','note':'линейные и другие силовые аппараты БСА коммутируют цепи тяговых двигателей соответствующей тележки'},
                  {'type':'contains','targetId':'VL-EQ-TR-008','note':'в каждом БСА расположен реверсивный переключатель соответствующей тележки'},
                  {'type':'works_with','targetId':'VL-EQ-TR-012','note':'аппараты ослабления возбуждения работают совместно с цепями индуктивных шунтов'},
                  {'type':'contains','targetId':'VL-EQ-PR-004','note':'реле перегрузки соответствующих тяговых двигателей размещены в БСА'},
                  {'type':'works_with','targetId':'VL-EQ-TR-005','note':'часть силовых аппаратов БСА участвует в перестроении цепей при реостатном торможении'}
              ],
              unresolvedSystemConnections=[],
              notes=[
                  'БСА №1 и №2 функционально привязаны к разным тележкам; отказ одного блока не равнозначен общему отказу всей тяговой схемы.',
                  'Не смешивать силовые контакторы БСА с контакторами вспомогательных машин из системы AU.',
                  'Номера аппаратов приведены для подтверждённой базовой компоновки; после ремонтов и для иных variant buckets приоритет имеет документация конкретной секции.'
              ])

          set_card('VL-EQ-TR-006',
              modelNames=['НБ-418К6'],
              quantity='4 тяговых двигателя на секцию; 8 на штатный двухсекционный ВЛ80С.',
              schemeDesignations=['ТЭД 1–4 на секцию'],
              parameters=[
                  'Базовый тип — НБ-418К6, коллекторный двигатель пульсирующего постоянного тока с последовательным возбуждением.',
                  'Номинальное напряжение на зажимах НБ-418К6 — 950 В; максимальное — 1180 В.',
                  'Часовой режим НБ-418К6: мощность 790 кВт, ток якоря 880 А.',
                  'Длительный режим НБ-418К6: мощность 740 кВт, ток якоря 820 А.',
                  'Для НБ-418К6 требуется принудительное воздушное охлаждение; в техописании указан поток 105 м³/мин на двигатель.'
              ],
              principle='В тяговом режиме ТЭД преобразуют электрическую энергию выпрямленного тока в вращающий момент, который через тяговую передачу передаётся колёсным парам. В реостатном торможении силовая схема переводит двигатели в генераторный режим: механическая энергия движения преобразуется в электрическую и рассеивается в тормозных резисторах при отдельном управлении возбуждением.',
              normalState=[
                  'Токи двигателей одной тяговой группы соответствуют режиму и не имеют устойчивой необъяснимой асимметрии.',
                  'Нет запаха перегретой изоляции, дыма, признаков кругового огня, ненормального шума подшипников или выраженного локального перегрева.',
                  'Принудительная вентиляция и воздуховоды обеспечивают требуемый поток через двигатели.'
              ],
              deviationSigns=[
                  'Устойчивая токовая асимметрия между ТЭД или группами при одинаковой команде требует проверки двигателя, ВУ, БСА и силовых соединений.',
                  'Запах изоляции, дым, искрение/круговой огонь или повторное действие токовой защиты являются признаками электрического неблагополучия двигателя либо его внешней цепи.',
                  'Перегрев без электрической асимметрии может быть связан с вентиляцией, механической нагрузкой, подшипниковым узлом или самой машиной.',
                  'Боксование не является доказательством неисправности ТЭД: учитывают сцепление, противобоксовочную защиту, пескоподачу и токораспределение.'
              ],
              relations=[
                  {'type':'fed_via','targetId':'VL-EQ-TR-003','note':'получает выпрямленный тяговый ток от соответствующей ВУ через сглаживающий реактор и силовую коммутацию'},
                  {'type':'switched_by','targetId':'VL-EQ-TR-002','note':'цепи каждого ТЭД коммутируются аппаратами БСА соответствующей тележки'},
                  {'type':'cooled_by','targetId':'VL-EQ-AU-002','note':'охлаждается принудительным воздушным потоком мотор-вентиляторов'},
                  {'type':'drives','targetId':'VL-EQ-TR-007','note':'передаёт вращающий момент к колёсной паре через тяговую зубчатую передачу'},
                  {'type':'supported_by','targetId':'VL-EQ-MC-006','note':'при опорно-осевом подвешивании моторно-осевые подшипники служат опорой ТЭД на ось колёсной пары'},
                  {'type':'works_with','targetId':'VL-EQ-TR-014','note':'переключатели тяга/торможение переводят силовые цепи ТЭД между двигательным и генераторным режимом'}
              ],
              unresolvedSystemConnections=[],
              notes=[
                  'НБ-418К6 — базовый тип. В техописании также описано применение НБ-514А на части поздних ВЛ80С; фактическую модель необходимо определять по секции.',
                  'Отдельно сохранён исторический override: известно о пяти опытных ВЛ80С 1985 года с НБ-514, но их точные серийные номера не установлены и не должны угадываться.',
                  'Не переносить численные параметры НБ-418К6 на НБ-514/НБ-514А без отдельного подтверждения.'
              ])

          # Ensure no non-target equipment records changed in memory.
          for rid, old in untouched.items():
              assert by_id[rid] == old, f'Unexpected equipment change: {rid}'
          for rid in targets:
              for k,v in preserved[rid].items():
                  assert by_id[rid].get(k) == v, f'Preserved field changed: {rid}.{k}'

          all_ids = set(by_id)
          for rid in targets:
              for rel in by_id[rid].get('relations') or []:
                  assert rel.get('targetId') in all_ids, (rid, rel)
              assert by_id[rid].get('diagnosticScenarioIds')
              assert by_id[rid].get('applicability',{}).get('model') == 'VL80S'

          # Serialize once and mirror exactly.
          raw = json.dumps(data, ensure_ascii=False, separators=(',',':')).encode('utf-8')
          with app_eq.open('wb') as fout:
              with gzip.GzipFile(fileobj=fout, mode='wb', mtime=0) as gz:
                  gz.write(raw)
          shutil.copyfile(app_eq, patch_eq)

          for path in [Path('app/build.gradle.kts'), Path('patch/app/build.gradle.kts')]:
              text = path.read_text(encoding='utf-8')
              assert 'versionCode = 181' in text
              assert 'versionName = "1.2.2-dev14-beta36"' in text
              text = text.replace('versionCode = 181', 'versionCode = 182', 1)
              text = text.replace('versionName = "1.2.2-dev14-beta36"', 'versionName = "1.2.2-dev14-beta37"', 1)
              path.write_text(text, encoding='utf-8')

          fields=['modelNames','quantity','location','schemeDesignations','parameters','principle','relations','normalState','deviationSigns','diagnosticScenarioIds','schemeNodeIds','applicability','featureRules','notes','sourceRefs']
          depth=lambda r: sum(bool(r.get(k)) for k in fields)
          for rid in sorted(targets):
              print(rid, 'DEPTH', depth(by_id[rid]))
          PY

          cmp app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          cmp app/build.gradle.kts patch/app/build.gradle.kts
          git diff --check

          python3 - <<'PY'
          import gzip, json, re
          from pathlib import Path
          with gzip.open('app/src/main/assets/technical/vl80s_equipment.json.gz','rt',encoding='utf-8') as f:
              d=json.load(f)
          assert len(d['records']) == 89
          ids={r['id'] for r in d['records']}
          scenarios=set()
          with gzip.open('app/src/main/assets/technical/vl80s_diagnostics.json.gz','rt',encoding='utf-8') as f:
              dg=json.load(f)
          scenarios={s['id'] for s in dg.get('scenarios',[])}
          for r in d['records']:
              for rel in r.get('relations') or []:
                  if rel.get('targetId'): assert rel['targetId'] in ids
              for sid in r.get('diagnosticScenarioIds') or []:
                  assert sid in scenarios, (r['id'],sid)
          txt=Path('app/build.gradle.kts').read_text()
          assert 'versionCode = 182' in txt and 'versionName = "1.2.2-dev14-beta37"' in txt
          print('Validation OK: 89 records; relation and diagnostic references valid; beta37 version set')
          PY

