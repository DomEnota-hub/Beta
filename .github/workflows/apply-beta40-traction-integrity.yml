name: Apply Beta40 traction integrity

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta40-traction-integrity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev14-integration

      - name: Guard Beta40 base
        shell: bash
        run: |
          set -euo pipefail
          expected="36bebf3202eb9d384270160dafd5cc346c595b15"
          test "$(git rev-parse HEAD^)" = "$expected" || { echo "Unexpected workflow parent: $(git rev-parse HEAD^)"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta40 apply'; exit 1; }

      - name: Repair traction integrity links
        shell: bash
        run: |
          set -euo pipefail

          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          cmp app/src/main/assets/technical/vl80s_diagnostics.json.gz patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz
          cmp app/src/main/assets/technical/vl80s_electrical.json.gz patch/app/src/main/assets/technical/vl80s_electrical.json.gz

          python3 - <<'PY'
          import copy, gzip, json, shutil
          from pathlib import Path

          root = Path('.')
          eq_path = root / 'app/src/main/assets/technical/vl80s_equipment.json.gz'
          diag_path = root / 'app/src/main/assets/technical/vl80s_diagnostics.json.gz'
          el_path = root / 'app/src/main/assets/technical/vl80s_electrical.json.gz'

          def load_gz(path):
              with gzip.open(path, 'rt', encoding='utf-8') as f:
                  return json.load(f)

          def dump_gz(path, obj):
              raw = (json.dumps(obj, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
              with open(path, 'wb') as out:
                  with gzip.GzipFile(filename='', mode='wb', fileobj=out, mtime=0) as gz:
                      gz.write(raw)

          eq = load_gz(eq_path)
          diag = load_gz(diag_path)
          electrical = load_gz(el_path)

          assert len(eq['records']) == 89, len(eq['records'])
          assert len(diag['scenarios']) == 93, len(diag['scenarios'])
          assert len(electrical['baseSchemes']) == 8, len(electrical['baseSchemes'])

          records = {r['id']: r for r in eq['records']}
          scenarios = {s['id']: s for s in diag['scenarios']}
          tr_ids = {f'VL-EQ-TR-{i:03d}' for i in range(1, 16)}
          assert tr_ids <= set(records)

          target_cards = {
              'VL-EQ-TR-001', 'VL-EQ-TR-002', 'VL-EQ-TR-003',
              'VL-EQ-TR-004', 'VL-EQ-TR-006', 'VL-EQ-TR-007'
          }
          target_scenarios = {
              'ekg-slow-transition', 'traction-gear-noise', 'transformer-oil-signs'
          }

          untouched_cards = {rid: copy.deepcopy(r) for rid, r in records.items() if rid not in target_cards}
          untouched_scenarios = {sid: copy.deepcopy(s) for sid, s in scenarios.items() if sid not in target_scenarios}
          old_reverse = copy.deepcopy(eq['reverseIndex']['diagnosticScenarioId'])
          old_schemes = copy.deepcopy(electrical['baseSchemes'])

          # Explicit semantic repairs in diagnostics.
          def append_unique(seq, value):
              if value not in seq:
                  seq.append(value)

          s = scenarios['traction-gear-noise']
          append_unique(s['equipmentIds'], 'VL-EQ-TR-007')
          append_unique(s['systemIds'], 'VL-SYS-TR')
          if not any(x.get('id') == 'vl80-eq-traction-drive' for x in s.get('articleTargets', [])):
              s.setdefault('articleTargets', []).append({'id': 'vl80-eq-traction-drive', 'status': 'planned_canonical'})
          append_unique(s['electricalSchemes'].setdefault('explicit', []), 'VL-SCH-EL-TRACTION-POWER-937-1260')

          s = scenarios['ekg-slow-transition']
          append_unique(s['equipmentIds'], 'VL-EQ-TR-001')
          if not any(x.get('id') == 'vl80-eq-ekg' for x in s.get('articleTargets', [])):
              s.setdefault('articleTargets', []).append({'id': 'vl80-eq-ekg', 'status': 'planned_canonical'})
          append_unique(s['electricalSchemes'].setdefault('explicit', []), 'VL-SCH-EL-EKG-CONTROL-937-1260')

          s = scenarios['transformer-oil-signs']
          append_unique(s['equipmentIds'], 'VL-EQ-TR-004')
          append_unique(s['systemIds'], 'VL-SYS-TR')
          if not any(x.get('id') == 'vl80-eq-transformer' for x in s.get('articleTargets', [])):
              s.setdefault('articleTargets', []).append({'id': 'vl80-eq-transformer', 'status': 'planned_canonical'})

          # Canonicalize card -> diagnostic links for all traction cards from diagnostics.
          expected_by_card = {tid: [] for tid in tr_ids}
          for scenario in diag['scenarios']:
              for eid in scenario.get('equipmentIds', []):
                  if eid in expected_by_card:
                      expected_by_card[eid].append(scenario['id'])
          for tid in tr_ids:
              expected_by_card[tid] = sorted(set(expected_by_card[tid]))

          for tid in target_cards:
              records[tid]['diagnosticScenarioIds'] = expected_by_card[tid]

          # Every non-target traction card must already be exact and remain untouched.
          for tid in sorted(tr_ids - target_cards):
              assert sorted(records[tid].get('diagnosticScenarioIds', [])) == expected_by_card[tid], (tid, records[tid].get('diagnosticScenarioIds'), expected_by_card[tid])

          # Refresh only diagnostic reverse-index entries that touch traction equipment.
          traction_sids = {
              s['id'] for s in diag['scenarios']
              if tr_ids & set(s.get('equipmentIds', []))
          }
          reverse = eq['reverseIndex']['diagnosticScenarioId']
          for sid in traction_sids:
              reverse[sid] = sorted(set(scenarios[sid].get('equipmentIds', [])))

          # Keep the existing traction-power scheme node synchronized for TR-007.
          traction_scheme = next(x for x in electrical['baseSchemes'] if x['id'] == 'VL-SCH-EL-TRACTION-POWER-937-1260')
          gear_node = next(x for x in traction_scheme['nodes'] if x.get('equipmentId') == 'VL-EQ-TR-007')
          gear_node['diagnosticScenarioIds'] = expected_by_card['VL-EQ-TR-007']

          # Strong integrity validation.
          scenario_ids = set(scenarios)
          equipment_ids = set(records)
          scheme_ids = {s['id'] for s in electrical['baseSchemes']}
          assert len(equipment_ids) == 89
          assert len(scenario_ids) == 93

          for tid in sorted(tr_ids):
              card = records[tid]
              declared = sorted(card.get('diagnosticScenarioIds', []))
              actual = sorted(s['id'] for s in diag['scenarios'] if tid in s.get('equipmentIds', []))
              assert declared == actual, (tid, declared, actual)
              for sid in declared:
                  assert sid in scenario_ids, (tid, sid)

          for sid in sorted(traction_sids):
              assert sorted(reverse.get(sid, [])) == sorted(set(scenarios[sid].get('equipmentIds', []))), sid
              assert set(reverse[sid]) <= equipment_ids, sid

          assert 'VL-EQ-TR-007' in scenarios['traction-gear-noise']['equipmentIds']
          assert 'traction-gear-noise' in records['VL-EQ-TR-007']['diagnosticScenarioIds']
          assert 'VL-SYS-TR' in scenarios['traction-gear-noise']['systemIds']
          assert 'VL-SCH-EL-TRACTION-POWER-937-1260' in scenarios['traction-gear-noise']['electricalSchemes']['explicit']
          assert 'traction-gear-noise' in gear_node['diagnosticScenarioIds']

          assert 'VL-EQ-TR-001' in scenarios['ekg-slow-transition']['equipmentIds']
          assert 'ekg-slow-transition' in records['VL-EQ-TR-001']['diagnosticScenarioIds']
          assert 'VL-EQ-TR-004' in scenarios['transformer-oil-signs']['equipmentIds']
          assert 'transformer-oil-signs' in records['VL-EQ-TR-004']['diagnosticScenarioIds']

          # Expected Stage6 one-way repairs must now be reflected in the cards and reverse index.
          expected_repairs = {
              'VL-EQ-TR-001': {'ekg-position-mismatch', 'traction-one-section-low', 'ekg-slow-transition'},
              'VL-EQ-TR-002': {'traction-intermittent', 'traction-one-section-low'},
              'VL-EQ-TR-003': {'rectifier-overheat', 'traction-one-section-low'},
              'VL-EQ-TR-004': {'transformer-oil-signs'},
              'VL-EQ-TR-006': {'traction-motor-flashover', 'traction-motor-overheat', 'traction-one-section-low'},
              'VL-EQ-TR-007': {'traction-gear-noise'},
          }
          for tid, needed in expected_repairs.items():
              assert needed <= set(records[tid]['diagnosticScenarioIds']), (tid, needed, records[tid]['diagnosticScenarioIds'])

          # Non-target cards/scenarios are byte-structure identical.
          for rid, before in untouched_cards.items():
              assert records[rid] == before, rid
          for sid, before in untouched_scenarios.items():
              assert scenarios[sid] == before, sid

          # Reverse index may change only for traction-touching scenario IDs.
          all_reverse_keys = set(old_reverse) | set(reverse)
          for sid in all_reverse_keys - traction_sids:
              assert old_reverse.get(sid) == reverse.get(sid), sid

          # Electrical base schemes: only the TR-007 node inside traction-power may change.
          before_by = {s['id']: s for s in old_schemes}
          after_by = {s['id']: s for s in electrical['baseSchemes']}
          for sid in scheme_ids - {'VL-SCH-EL-TRACTION-POWER-937-1260'}:
              assert before_by[sid] == after_by[sid], sid
          b = copy.deepcopy(before_by['VL-SCH-EL-TRACTION-POWER-937-1260'])
          a = copy.deepcopy(after_by['VL-SCH-EL-TRACTION-POWER-937-1260'])
          bnode = next(x for x in b['nodes'] if x.get('equipmentId') == 'VL-EQ-TR-007')
          anode = next(x for x in a['nodes'] if x.get('equipmentId') == 'VL-EQ-TR-007')
          bnode['diagnosticScenarioIds'] = anode['diagnosticScenarioIds']
          assert b == a

          dump_gz(eq_path, eq)
          dump_gz(diag_path, diag)
          dump_gz(el_path, electrical)

          shutil.copyfile(eq_path, 'patch/app/src/main/assets/technical/vl80s_equipment.json.gz')
          shutil.copyfile(diag_path, 'patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz')
          shutil.copyfile(el_path, 'patch/app/src/main/assets/technical/vl80s_electrical.json.gz')
          PY

          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('app/build.gradle.kts'), Path('patch/app/build.gradle.kts')]:
              text = p.read_text(encoding='utf-8')
              text = text.replace('versionCode = 184', 'versionCode = 185')
              text = text.replace('versionName = "1.2.2-dev14-beta39"', 'versionName = "1.2.2-dev14-beta40"')
              assert 'versionCode = 185' in text
              assert 'versionName = "1.2.2-dev14-beta40"' in text
              p.write_text(text, encoding='utf-8')
          PY

          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          cmp app/src/main/assets/technical/vl80s_diagnostics.json.gz patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz
          cmp app/src/main/assets/technical/vl80s_electrical.json.gz patch/app/src/main/assets/technical/vl80s_electrical.json.gz
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            app/build.gradle.kts \
            app/src/main/assets/technical/vl80s_diagnostics.json.gz \
            app/src/main/assets/technical/vl80s_electrical.json.gz \
            app/src/main/assets/technical/vl80s_equipment.json.gz \
            patch/app/build.gradle.kts \
            patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz \
            patch/app/src/main/assets/technical/vl80s_electrical.json.gz \
            patch/app/src/main/assets/technical/vl80s_equipment.json.gz | sort)"
          test "$changed" = "$expected" || { echo 'Unexpected permanent diff:'; printf '%s\n' "$changed"; exit 1; }

      - name: Commit Beta40 source safely
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta40 source commit'; exit 1; }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            patch/app/build.gradle.kts \
            app/src/main/assets/technical/vl80s_equipment.json.gz \
            patch/app/src/main/assets/technical/vl80s_equipment.json.gz \
            app/src/main/assets/technical/vl80s_diagnostics.json.gz \
            patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz \
            app/src/main/assets/technical/vl80s_electrical.json.gz \
            patch/app/src/main/assets/technical/vl80s_electrical.json.gz

          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git commit -m 'Repair VL80S traction diagnostic integrity'
          source_sha="$(git rev-parse HEAD)"
          git push origin HEAD:dev14-integration
          git fetch origin dev14-integration
          test "$source_sha" = "$(git rev-parse origin/dev14-integration)" || { echo 'Unexpected branch head after Beta40 push'; exit 1; }
