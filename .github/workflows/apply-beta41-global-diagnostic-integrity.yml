name: Apply Beta41 global diagnostic integrity

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta41-global-diagnostic-integrity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev14-integration

      - name: Guard Beta41 base
        shell: bash
        run: |
          set -euo pipefail
          expected="5ba3ddd18163e6e7601c0d125c3937a67b7e5d48"
          test "$(git rev-parse HEAD^)" = "$expected" || { echo "Unexpected workflow parent: $(git rev-parse HEAD^)"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta41 apply'; exit 1; }

      - name: Canonicalize diagnostic integrity
        shell: bash
        run: |
          set -euo pipefail

          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          cmp app/src/main/assets/technical/vl80s_diagnostics.json.gz patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz
          cmp app/src/main/assets/technical/vl80s_electrical.json.gz patch/app/src/main/assets/technical/vl80s_electrical.json.gz

          python3 - <<'PY'
          import copy, gzip, json, shutil
          from pathlib import Path

          eq_path = Path('app/src/main/assets/technical/vl80s_equipment.json.gz')
          diag_path = Path('app/src/main/assets/technical/vl80s_diagnostics.json.gz')
          el_path = Path('app/src/main/assets/technical/vl80s_electrical.json.gz')

          def load_gz(path):
              with gzip.open(path, 'rt', encoding='utf-8') as f:
                  return json.load(f)

          def dump_gz(path, obj):
              raw = (json.dumps(obj, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
              with open(path, 'wb') as out:
                  with gzip.GzipFile(filename='', mode='wb', fileobj=out, mtime=0) as gz:
                      gz.write(raw)

          eq = load_gz(eq_path)
          diag = load_gz(diag_path)
          electrical = load_gz(el_path)

          assert len(eq['records']) == 89, len(eq['records'])
          assert len(diag['scenarios']) == 93, len(diag['scenarios'])
          assert len(electrical['baseSchemes']) == 8, len(electrical['baseSchemes'])

          records = {r['id']: r for r in eq['records']}
          scenarios = {s['id']: s for s in diag['scenarios']}
          assert len(records) == 89
          assert len(scenarios) == 93
          equipment_ids = set(records)
          scenario_ids = set(scenarios)

          # Referential integrity from diagnostics must already be valid.
          for s in diag['scenarios']:
              unknown = set(s.get('equipmentIds', [])) - equipment_ids
              assert not unknown, (s['id'], sorted(unknown))

          # Reproduce the audited Beta40 state exactly before applying any repair.
          audited_missing = []
          audited_reverse_only = []
          for rid, card in records.items():
              declared = set(card.get('diagnosticScenarioIds', []))
              actual = {s['id'] for s in diag['scenarios'] if rid in s.get('equipmentIds', [])}
              audited_missing.extend((rid, sid) for sid in sorted(actual - declared))
              audited_reverse_only.extend((rid, sid) for sid in sorted(declared - actual))

          expected_missing = {
              ('VL-EQ-HV-001', 'gv-no-open'),
              ('VL-EQ-HV-002', 'pantograph-slow-rise'),
              ('VL-EQ-HV-002', 'pantograph-wrong-selection'),
              ('VL-EQ-AU-002', 'fan-vibration'),
              ('VL-EQ-AU-002', 'rectifier-overheat'),
              ('VL-EQ-AU-002', 'traction-motor-overheat'),
              ('VL-EQ-AU-003', 'compressor-overheat'),
              ('VL-EQ-SF-001', 'vigilance-control-fault'),
              ('VL-EQ-MC-001', 'sand-nozzle-blocked'),
              ('VL-EQ-MC-002', 'external-object-impact'),
              ('VL-EQ-PR-001', 'traction-motor-flashover'),
              ('VL-EQ-SF-002', 'vigilance-control-fault'),
              ('VL-EQ-PN-002', 'pantograph-slow-rise'),
              ('VL-EQ-FR-001', 'fire-loop-fault'),
              ('VL-EQ-FR-001', 'machine-room-smoke'),
              ('VL-EQ-HV-003', 'vvk-interlock-fault'),
              ('VL-EQ-BR-006', 'brake-rigging-damage'),
              ('VL-EQ-CT-003', 'intersection-command-loss'),
              ('VL-EQ-CT-003', 'traction-intermittent'),
              ('VL-EQ-FR-002', 'machine-room-smoke'),
              ('VL-EQ-AU-005', 'rectifier-overheat'),
              ('VL-EQ-CT-004', 'ekg-position-mismatch'),
              ('VL-EQ-CT-004', 'traction-intermittent'),
              ('VL-EQ-CT-005', 'intersection-command-loss'),
          }
          assert set(audited_missing) == expected_missing, (len(audited_missing), audited_missing)
          assert len(audited_missing) == 24
          assert audited_reverse_only == [], audited_reverse_only

          affected_cards = {rid for rid, _ in expected_missing}
          assert len(affected_cards) == 18
          untouched_cards = {rid: copy.deepcopy(card) for rid, card in records.items() if rid not in affected_cards}
          old_diagnostics = copy.deepcopy(diag)
          old_electrical = copy.deepcopy(electrical)
          old_reverse = copy.deepcopy(eq['reverseIndex']['diagnosticScenarioId'])

          # Audit the 13 real reverse-index omissions. Scenarios without equipmentIds are intentionally not forced into the index.
          expected_reverse_missing = {
              'brake-rigging-damage',
              'compressor-overheat',
              'external-object-impact',
              'fan-vibration',
              'fire-loop-fault',
              'gv-no-open',
              'intersection-command-loss',
              'machine-room-smoke',
              'pantograph-slow-rise',
              'pantograph-wrong-selection',
              'sand-nozzle-blocked',
              'vigilance-control-fault',
              'vvk-interlock-fault',
          }
          reverse = eq['reverseIndex']['diagnosticScenarioId']
          reverse_missing = {
              sid for sid, s in scenarios.items()
              if s.get('equipmentIds') and sorted(set(reverse.get(sid, []))) != sorted(set(s.get('equipmentIds', [])))
          }
          assert reverse_missing == expected_reverse_missing, sorted(reverse_missing)
          assert len(reverse_missing) == 13

          # Canonical source of truth: diagnostic scenario equipmentIds.
          expected_by_card = {rid: [] for rid in records}
          for s in diag['scenarios']:
              for rid in s.get('equipmentIds', []):
                  expected_by_card[rid].append(s['id'])
          for rid in expected_by_card:
              expected_by_card[rid] = sorted(set(expected_by_card[rid]))

          # Only the 18 audited cards may change.
          for rid in affected_cards:
              records[rid]['diagnosticScenarioIds'] = expected_by_card[rid]
          for rid, before in untouched_cards.items():
              assert records[rid] == before, rid

          # Canonicalize reverseIndex for every scenario that actually references equipment.
          for sid, s in scenarios.items():
              ids = sorted(set(s.get('equipmentIds', [])))
              if ids:
                  reverse[sid] = ids

          # Global card <-> diagnostics equality after repair.
          for rid, card in records.items():
              declared = sorted(set(card.get('diagnosticScenarioIds', [])))
              actual = expected_by_card[rid]
              assert declared == actual, (rid, declared, actual)
              assert set(declared) <= scenario_ids

          # Every non-empty scenario must now have an exact reverseIndex entry.
          for sid, s in scenarios.items():
              ids = sorted(set(s.get('equipmentIds', [])))
              if ids:
                  assert sorted(set(reverse.get(sid, []))) == ids, (sid, reverse.get(sid), ids)

          # Preserve zero-equipment reverse-index behavior exactly; Beta41 does not invent empty entries.
          zero_equipment_sids = {sid for sid, s in scenarios.items() if not s.get('equipmentIds')}
          for sid in zero_equipment_sids:
              assert reverse.get(sid) == old_reverse.get(sid), sid

          # Diagnostics and electrical assets are read-only in Beta41.
          assert diag == old_diagnostics
          assert electrical == old_electrical

          # Reverse-index keys unrelated to scenarios with equipment must remain untouched.
          nonempty_sids = {sid for sid, s in scenarios.items() if s.get('equipmentIds')}
          for sid in (set(old_reverse) | set(reverse)) - nonempty_sids:
              assert old_reverse.get(sid) == reverse.get(sid), sid

          dump_gz(eq_path, eq)
          shutil.copyfile(eq_path, 'patch/app/src/main/assets/technical/vl80s_equipment.json.gz')
          PY

          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('app/build.gradle.kts'), Path('patch/app/build.gradle.kts')]:
              text = p.read_text(encoding='utf-8')
              text = text.replace('versionCode = 185', 'versionCode = 186')
              text = text.replace('versionName = "1.2.2-dev14-beta40"', 'versionName = "1.2.2-dev14-beta41"')
              assert 'versionCode = 186' in text
              assert 'versionName = "1.2.2-dev14-beta41"' in text
              p.write_text(text, encoding='utf-8')
          PY

          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          cmp app/src/main/assets/technical/vl80s_diagnostics.json.gz patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz
          cmp app/src/main/assets/technical/vl80s_electrical.json.gz patch/app/src/main/assets/technical/vl80s_electrical.json.gz
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            app/build.gradle.kts \
            app/src/main/assets/technical/vl80s_equipment.json.gz \
            patch/app/build.gradle.kts \
            patch/app/src/main/assets/technical/vl80s_equipment.json.gz | sort)"
          test "$changed" = "$expected" || { echo 'Unexpected permanent diff:'; printf '%s\n' "$changed"; exit 1; }

      - name: Commit Beta41 source safely
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta41 source commit'; exit 1; }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            patch/app/build.gradle.kts \
            app/src/main/assets/technical/vl80s_equipment.json.gz \
            patch/app/src/main/assets/technical/vl80s_equipment.json.gz

          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'Canonicalize VL80S diagnostic equipment links'
          source_sha="$(git rev-parse HEAD)"
          git push origin HEAD:dev14-integration
          git fetch origin dev14-integration
          test "$source_sha" = "$(git rev-parse origin/dev14-integration)" || { echo 'Unexpected branch head after Beta41 push'; exit 1; }
