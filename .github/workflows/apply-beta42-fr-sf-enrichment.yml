name: Apply Beta42 FR SF enrichment

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta42-fr-sf-enrichment.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev14-integration

      - name: Guard Beta42 base
        shell: bash
        run: |
          set -euo pipefail
          expected="ca8fbb3fd081a83a4d3c78f5cadc4909efa8c6cc"
          test "$(git rev-parse HEAD^)" = "$expected" || { echo "Unexpected workflow parent: $(git rev-parse HEAD^)"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta42 apply'; exit 1; }

      - name: Enrich FR and SF cards
        shell: bash
        run: |
          set -euo pipefail

          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          cmp app/src/main/assets/technical/vl80s_diagnostics.json.gz patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz
          cmp app/src/main/assets/technical/vl80s_electrical.json.gz patch/app/src/main/assets/technical/vl80s_electrical.json.gz

          python3 - <<'PY'
          import copy, gzip, json, shutil
          from pathlib import Path

          eq_path = Path('app/src/main/assets/technical/vl80s_equipment.json.gz')
          diag_path = Path('app/src/main/assets/technical/vl80s_diagnostics.json.gz')
          el_path = Path('app/src/main/assets/technical/vl80s_electrical.json.gz')

          def load_gz(path):
              with gzip.open(path, 'rt', encoding='utf-8') as f:
                  return json.load(f)

          def dump_gz(path, obj):
              raw = (json.dumps(obj, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
              with open(path, 'wb') as out:
                  with gzip.GzipFile(filename='', mode='wb', fileobj=out, mtime=0) as gz:
                      gz.write(raw)

          eq = load_gz(eq_path)
          diag = load_gz(diag_path)
          electrical = load_gz(el_path)

          assert len(eq['records']) == 89, len(eq['records'])
          assert len(diag['scenarios']) == 93, len(diag['scenarios'])

          records = {r['id']: r for r in eq['records']}
          scenarios = {s['id']: s for s in diag['scenarios']}
          target_ids = {
              'VL-EQ-FR-001',
              'VL-EQ-SF-001',
              'VL-EQ-SF-002',
              'VL-EQ-SF-003',
              'VL-EQ-SF-005',
          }
          assert target_ids <= set(records)
          protected_ids = {'VL-EQ-FR-002', 'VL-EQ-SF-004'}
          before_records = {rid: copy.deepcopy(card) for rid, card in records.items()}
          before_sources = copy.deepcopy(eq['sources'])
          before_diag = copy.deepcopy(diag)
          before_electrical = copy.deepcopy(electrical)

          for rid, card in records.items():
              actual = sorted(s['id'] for s in diag['scenarios'] if rid in s.get('equipmentIds', []))
              declared = sorted(set(card.get('diagnosticScenarioIds', [])))
              assert declared == actual, (rid, declared, actual)

          assert 'VL-SRC-015' not in eq['sources']
          eq['sources']['VL-SRC-015'] = {
              'class': 'A/B',
              'type': 'maintenance_instruction',
              'title': 'ЦТ-ЦШ-857. Инструкция по техническому обслуживанию АЛСН и устройств контроля бдительности машиниста',
              'approved': '24.09.2001',
              'publisher': 'МПС России',
              'url': 'https://rcit.su/techinfo99.html',
              'locator': 'разделы 1.1, 2.2, 2.15 и 2.22: состав АЛСН, приёмные катушки, ЭПК-150 и электропитание',
              'note': 'Нормативный источник для параметров АЛСН, приёмных катушек и ЭПК; конкретное исполнение оборудования секции имеет приоритет.'
          }

          def add_source(card, source_id):
              refs = list(card.get('sourceRefs', []))
              if source_id not in refs:
                  refs.append(source_id)
              card['sourceRefs'] = refs

          c = records['VL-EQ-FR-001']
          c['purpose'] = 'Обнаруживает признаки пожара по термозащитным реле и формирует световой и звуковой сигнал для локомотивной бригады.'
          c['quantity'] = '7 термозащитных реле К1–К7 на секцию в исполнении с пожарной сигнализацией'
          c['location'] = {
              'text': 'К1–К7 распределены по кабине и кузову: два термозащитных реле в кабине и пять в кузове; с №2174 реле 442 размещается на панели №2.',
              'confidence': 'confirmed_with_serial_note'
          }
          c['schemeDesignations'] = ['К1–К7 — термозащитные реле', '442 — реле пожарной сигнализации', '443 «ПС» — сигнальная лампа', '410 — выключатель цепи пожарной сигнализации']
          c['parameters'] = ['В штатной схеме используется семь термозащитных реле К1–К7 на секцию.']
          c['principle'] = 'В нормальном состоянии реле 442 включено. Срабатывание любого из термозащитных реле К1–К7 разрывает цепь 442 и включает звуковую сигнализацию и лампу 443 «ПС».'
          c['normalState'] = [
              'Реле 442 удерживается во включённом состоянии при исправном шлейфе и отсутствии теплового срабатывания.',
              'Выключатель 410 находится в предусмотренном штатной схемой включённом состоянии; пожарная сигнализация не подаёт ложный сигнал.'
          ]
          c['deviationSigns'] = [
              'Срабатывает лампа 443 «ПС» и звуковой сигнал.',
              'Появляется неисправность шлейфа или сигнализация отсутствует/неустойчива при проверяемом событии.'
          ]
          c['unresolvedSystemConnections'] = []
          c['relationCoverage'] = 'documented_plus_system_text'
          c['notes'] = [
              'Серийная граница наличия пожарной сигнализации №2110 сохраняется по действующему featureRule; фактическая комплектация после ремонта или модернизации имеет приоритет.',
              'Карточка описывает сигнализацию и не переносит эту серийную границу на конкретное исполнение системы пожаротушения FR-002.'
          ]

          c = records['VL-EQ-SF-001']
          c['purpose'] = 'Принимает кодовые сигналы из рельсовой цепи, формирует показания локомотивной сигнализации и участвует в контроле бдительности с воздействием через ЭПК.'
          c['location'] = {
              'text': 'Кабинные приборы АЛСН размещены на рабочих постах; приёмный тракт начинается от вынесенных под кузов катушек SF-005. В базовом исполнении фильтр и дешифратор размещаются у поста помощника, локомотивный светофор и органы контроля бдительности — в кабине.',
              'confidence': 'confirmed_general'
          }
          c['schemeDesignations'] = ['225 — «Локомотивная сигнализация»', 'ВА6/ВА7 — защита цепей АЛСН', 'Н119 — линия питания от аккумуляторной батареи']
          c['parameters'] = ['Питание АЛСН организовано отдельной цепью от аккумуляторной батареи через Н119, ВА6/ВА7 и выключатель 225.']
          c['principle'] = 'Приёмные катушки воспринимают кодовый ток рельсовой цепи; сигнал проходит через фильтр и дешифратор, после чего формируются показания локомотивного светофора и команды контроля бдительности. При требуемом защитном воздействии система управляет ЭПК.'
          c['relations'] = [
              {'type': 'receives_signal_from', 'targetId': 'VL-EQ-SF-005', 'note': 'получает кодовый сигнал от приёмных катушек АЛСН'},
              {'type': 'controls', 'targetId': 'VL-EQ-SF-002', 'note': 'управляет защитным воздействием через ЭПК'},
              {'type': 'works_with', 'targetId': 'VL-EQ-BR-003', 'note': 'защитное воздействие ЭПК реализуется через тормозную магистраль'},
              {'type': 'powered_by', 'targetId': 'VL-EQ-CT-001', 'note': 'имеет отдельную цепь питания от аккумуляторной батареи'}
          ]
          c['normalState'] = [
              'Кодовые показания устойчивы и соответствуют принимаемому сигналу.',
              'Цепь питания АЛСН включена штатно; контроль бдительности и ЭПК готовы к работе без ложных воздействий.'
          ]
          c['deviationSigns'] = [
              'Код теряется, появляется неправильное или нестабильное показание локомотивного светофора.',
              'Возникает отказ контроля бдительности либо непредусмотренное/отсутствующее воздействие на ЭПК.'
          ]
          c['unresolvedSystemConnections'] = []
          c['relationCoverage'] = 'documented_plus_system_text'
          add_source(c, 'VL-SRC-015')
          c['notes'] = ['Фактический состав АЛСН после модернизаций может отличаться; карточка описывает базовую архитектуру без приписывания секции неподтверждённого комплекса безопасности.']

          c = records['VL-EQ-SF-002']
          c['purpose'] = 'Преобразует электрическую команду системы безопасности в пневматическое воздействие на тормозную магистраль при срабатывании АЛСН/контроля бдительности.'
          c['modelNames'] = ['ЭПК-150', 'ЭПК-150И']
          c['quantity'] = '2 на двухсекционный электровоз — по одному в каждой рабочей кабине'
          c['location'] = {'text': 'В кабине машиниста, в составе электрической и пневматической части системы безопасности.', 'confidence': 'confirmed_general'}
          c['schemeDesignations'] = ['ЭПК', '267 — реле контроля состояния ЭПК в цепях ВЛ80С']
          c['parameters'] = [
              'Рабочее напряжение ЭПК-150 — 50 ± 10 В.',
              'Напряжение срабатывания электромагнитного вентиля — не более 30 В; отпускания — не менее 8 В.',
              'Давление в камере выдержки, при котором открывается срывной клапан, — 0,13–0,20 МПа (1,3–2,0 кгс/см²).',
              'Остаточное давление в камере выдержки после срабатывания — не более 0,06 МПа (0,6 кгс/см²).'
          ]
          c['principle'] = 'При снятии питания с электромагнитного вентиля разряжается камера выдержки времени; после достижения установленного давления открывается срывной клапан и разряжает тормозную магистраль. После восстановления штатного состояния клапан возвращается в готовность.'
          c['relations'] = [
              {'type': 'controlled_by', 'targetId': 'VL-EQ-SF-001', 'note': 'получает команду от системы АЛСН и контроля бдительности'},
              {'type': 'acts_on', 'targetId': 'VL-EQ-BR-003', 'note': 'при срабатывании воздействует на тормозную магистраль'},
              {'type': 'interlocked_with', 'targetId': 'VL-EQ-TR-002', 'note': 'через реле 267 состояние ЭПК участвует в разрешении тяговых цепей'},
              {'type': 'functional_link', 'targetId': 'VL-EQ-MC-001', 'note': 'через реле 267 участвует в цепи автоматической пескоподачи при защитном воздействии'}
          ]
          c['normalState'] = [
              'Камера выдержки заряжена, утечки через свисток и срывной клапан отсутствуют.',
              'Для штатного разрешения тяговой цепи ВЛ80С давление в камере ЭПК должно быть не ниже 3,5 кгс/см².'
          ]
          c['deviationSigns'] = [
              'ЭПК не заряжается или не удерживает давление.',
              'Происходит непредусмотренная разрядка тормозной магистрали либо отсутствует ожидаемое защитное воздействие.',
              'Реле 267 не подтверждает штатное состояние цепи ЭПК.'
          ]
          c['unresolvedSystemConnections'] = []
          c['relationCoverage'] = 'documented_plus_system_text'
          add_source(c, 'VL-SRC-015')
          c['notes'] = ['В документации встречаются обозначения ЭПК-150 и ЭПК-150И; конкретный суффикс исполнения должен определяться по фактическому оборудованию секции.']

          c = records['VL-EQ-SF-003']
          c['purpose'] = 'Обеспечивает поездную и маневровую радиосвязь через штатный КВ/УКВ тракт в зависимости от исполнения электровоза.'
          c['location'] = {
              'text': 'Аппаратура и органы управления размещаются в кабине/секции, антенно-фидерный тракт — на кузове; в раннем базовом описании КВ-радиостанция относится к первой секции.',
              'confidence': 'confirmed_with_variant_note'
          }
          c['schemeDesignations'] = ['ВА8 — «Радиосвязь»', '477 — «Радио КВ»', '231 — «УКВ»', '478 — «Радиосвязь»']
          c['parameters'] = ['Питание радиосвязи подаётся от аккумуляторной батареи через отдельную защищённую цепь ВА8 и соответствующие органы включения.']
          c['principle'] = 'Радиостанция принимает и передаёт переговорный сигнал через соответствующий КВ или УКВ радиоблок, антенно-фидерный тракт, пульт управления и гарнитуру.'
          c['relations'] = [
              {'type': 'powered_by', 'targetId': 'VL-EQ-CT-001', 'note': 'питается от отдельной цепи аккумуляторной батареи через ВА8'}
          ]
          c['normalState'] = [
              'Питание включается штатно, приём и передача устойчивы, органы управления и гарнитура работоспособны.',
              'Антенно-фидерный тракт не имеет видимых повреждений или ненадёжных соединений.'
          ]
          c['deviationSigns'] = [
              'Нет приёма или передачи при исправном внешнем канале связи.',
              'Связь нестабильна, появляются пропадания, сильные помехи или признаки неисправности питания/антенного тракта.'
          ]
          c['unresolvedSystemConnections'] = []
          c['relationCoverage'] = 'documented_plus_system_text'
          c['featureRules'] = [
              {
                  'feature': 'radio_ukv_late_execution',
                  'condition': 'section.serialNumber >= 1428 unless actualEquipmentOverrides says otherwise',
                  'affects': 'installed_radio_channels_and_controls',
                  'sourceRefs': ['VL-SRC-006'],
                  'confidence': 'confirmed_boundary_with_profile_check',
                  'note': 'С №1428 в документации фиксируется внедрение УКВ-радиосвязи и связанного оборудования; после ремонтов и модернизаций фактическая комплектация имеет приоритет.'
              }
          ]
          c['notes'] = [
              'Модель радиостанции намеренно не задана: для карточки подтверждена архитектура КВ/УКВ и схемные органы, но не один универсальный тип станции для всего парка ВЛ80С.',
              'Для раннего исполнения подтверждена КВ-радиостанция на первой секции; позднее исполнение включает УКВ-тракт согласно серийной вариантности.'
          ]

          c = records['VL-EQ-SF-005']
          c['purpose'] = 'Индуктивно принимает кодовый ток из рельсовой цепи и передаёт электрический сигнал в аппаратуру АЛСН.'
          c['quantity'] = '2 на секцию; 4 на штатный двухсекционный электровоз'
          c['location'] = {'text': 'На путеочистителе/в нижней передней части каждой секции над рельсовыми нитями.', 'confidence': 'confirmed_general'}
          c['schemeDesignations'] = ['ПК1', 'ПК2']
          c['principle'] = 'Магнитное поле кодового тока в рельсе наводит ЭДС в приёмной катушке; сформированный сигнал по кабельной цепи поступает в фильтр и последующую аппаратуру АЛСН.'
          c['relations'] = [
              {'type': 'sends_signal_to', 'targetId': 'VL-EQ-SF-001', 'note': 'является входным датчиком локомотивной сигнализации'}
          ]
          c['normalState'] = [
              'Катушки и подвеска закреплены без повреждений, кабель и клеммные соединения исправны.',
              'Положение катушек относительно рельса соответствует требованиям для фактически установленного типа.'
          ]
          c['deviationSigns'] = [
              'Катушка, подвеска, кожух или кабель имеют механическое повреждение или смещение.',
              'Код АЛСН пропадает либо становится неустойчивым при исправной последующей аппаратуре.'
          ]
          c['unresolvedSystemConnections'] = []
          c['relationCoverage'] = 'documented_plus_system_text'
          add_source(c, 'VL-SRC-015')
          c['notes'] = [
              'Норматив ЦТ-ЦШ-857 охватывает катушки ПЭ, ПТ, КПУ-1 и КПУ-2, но карточка не назначает один из этих типов универсальным для ВЛ80С.',
              'Допустимая высота установки зависит от фактического типа катушки, поэтому единое числовое значение без идентификации модели не приводится.'
          ]

          for rid, before in before_records.items():
              if rid not in target_ids:
                  assert records[rid] == before, rid
          for rid in protected_ids:
              assert records[rid] == before_records[rid], rid

          preserve_fields = [
              'id', 'legacyId', 'slug', 'aliases', 'kind', 'domain', 'systemIds',
              'diagnosticScenarioIds', 'schemeNodeIds', 'legacyHotspotIds',
              'applicability', 'migration', 'instances', 'crosslinks',
              'equipmentOverrides'
          ]
          for rid in target_ids:
              before = before_records[rid]
              after = records[rid]
              for field in preserve_fields:
                  assert after.get(field) == before.get(field), (rid, field)
              assert after['diagnosticScenarioIds'] == before['diagnosticScenarioIds']
              assert after['schemeNodeIds'] == before['schemeNodeIds']

          assert records['VL-EQ-FR-001']['featureRules'] == before_records['VL-EQ-FR-001']['featureRules']
          for rid in target_ids - {'VL-EQ-SF-003'}:
              if rid != 'VL-EQ-FR-001':
                  assert records[rid].get('featureRules', []) == before_records[rid].get('featureRules', []), rid

          assert set(eq['sources']) == set(before_sources) | {'VL-SRC-015'}
          for sid, meta in before_sources.items():
              assert eq['sources'][sid] == meta, sid

          equipment_ids = set(records)
          scenario_ids = set(scenarios)
          source_ids = set(eq['sources'])
          for rid, card in records.items():
              for rel in card.get('relations', []):
                  assert rel['targetId'] in equipment_ids, (rid, rel)
              assert set(card.get('diagnosticScenarioIds', [])) <= scenario_ids, rid
              assert set(card.get('sourceRefs', [])) <= source_ids, rid
              for rule in card.get('featureRules', []):
                  assert set(rule.get('sourceRefs', [])) <= source_ids, (rid, rule)

          for rid, card in records.items():
              actual = sorted(s['id'] for s in diag['scenarios'] if rid in s.get('equipmentIds', []))
              declared = sorted(set(card.get('diagnosticScenarioIds', [])))
              assert declared == actual, (rid, declared, actual)
              for sid in declared:
                  assert rid in scenarios[sid].get('equipmentIds', []), (rid, sid)

          reverse = eq['reverseIndex']['diagnosticScenarioId']
          for sid, s in scenarios.items():
              ids = sorted(set(s.get('equipmentIds', [])))
              if ids:
                  assert sorted(set(reverse.get(sid, []))) == ids, (sid, reverse.get(sid), ids)

          assert diag == before_diag
          assert electrical == before_electrical

          dump_gz(eq_path, eq)
          shutil.copyfile(eq_path, 'patch/app/src/main/assets/technical/vl80s_equipment.json.gz')
          PY

          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('app/build.gradle.kts'), Path('patch/app/build.gradle.kts')]:
              text = p.read_text(encoding='utf-8')
              text = text.replace('versionCode = 186', 'versionCode = 187')
              text = text.replace('versionName = "1.2.2-dev14-beta41"', 'versionName = "1.2.2-dev14-beta42"')
              assert 'versionCode = 187' in text
              assert 'versionName = "1.2.2-dev14-beta42"' in text
              p.write_text(text, encoding='utf-8')
          PY

          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          cmp app/src/main/assets/technical/vl80s_diagnostics.json.gz patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz
          cmp app/src/main/assets/technical/vl80s_electrical.json.gz patch/app/src/main/assets/technical/vl80s_electrical.json.gz
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            app/build.gradle.kts \
            app/src/main/assets/technical/vl80s_equipment.json.gz \
            patch/app/build.gradle.kts \
            patch/app/src/main/assets/technical/vl80s_equipment.json.gz | sort)"
          test "$changed" = "$expected" || { echo 'Unexpected permanent diff:'; printf '%s\n' "$changed"; exit 1; }

      - name: Commit Beta42 source safely
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta42 source commit'; exit 1; }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            patch/app/build.gradle.kts \
            app/src/main/assets/technical/vl80s_equipment.json.gz \
            patch/app/src/main/assets/technical/vl80s_equipment.json.gz

          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'Enrich VL80S fire alarm and safety equipment cards'
          source_sha="$(git rev-parse HEAD)"
          git push origin HEAD:dev14-integration
          git fetch origin dev14-integration
          test "$source_sha" = "$(git rev-parse origin/dev14-integration)" || { echo 'Unexpected branch head after Beta42 push'; exit 1; }
