name: Apply Beta43 cab and brake tail v2

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta43-cab-brake-tail-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev14-integration

      - name: Guard Beta43 source base
        shell: bash
        run: |
          set -euo pipefail
          base="95c1be08891d974b3577d8814ef5670e21ce3264"
          expected_parent="3ebe9344cf7b23a900f0b0a5b78cd214a125225f"
          test "$(git rev-parse HEAD^)" = "$expected_parent" || { echo "Unexpected v2 parent: $(git rev-parse HEAD^)"; exit 1; }
          git diff --quiet "$base" HEAD -- app patch || { echo 'Permanent source moved since Beta42'; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta43 v2 apply'; exit 1; }

      - name: Enrich Beta43 cards with corrected unload-valve alias
        shell: bash
        run: |
          set -euo pipefail
          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          cmp app/src/main/assets/technical/vl80s_diagnostics.json.gz patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz
          cmp app/src/main/assets/technical/vl80s_electrical.json.gz patch/app/src/main/assets/technical/vl80s_electrical.json.gz
          cmp app/src/main/assets/technical/vl80s_pneumatic.json.gz patch/app/src/main/assets/technical/vl80s_pneumatic.json.gz

          python3 - <<'PY'
          import copy, gzip, json, shutil
          from pathlib import Path

          eq_path = Path('app/src/main/assets/technical/vl80s_equipment.json.gz')
          diag_path = Path('app/src/main/assets/technical/vl80s_diagnostics.json.gz')
          el_path = Path('app/src/main/assets/technical/vl80s_electrical.json.gz')
          pn_path = Path('app/src/main/assets/technical/vl80s_pneumatic.json.gz')

          def load_gz(path):
              with gzip.open(path, 'rt', encoding='utf-8') as f:
                  return json.load(f)

          def dump_gz(path, obj):
              raw = (json.dumps(obj, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
              with open(path, 'wb') as out:
                  with gzip.GzipFile(filename='', mode='wb', fileobj=out, mtime=0) as gz:
                      gz.write(raw)

          eq = load_gz(eq_path)
          diag = load_gz(diag_path)
          electrical = load_gz(el_path)
          pneumatic = load_gz(pn_path)
          assert len(eq['records']) == 89
          assert len(diag['scenarios']) == 93

          records = {r['id']: r for r in eq['records']}
          target_ids = {'VL-EQ-CB-002','VL-EQ-CB-004','VL-EQ-PN-009','VL-EQ-MC-001','VL-EQ-BR-015'}
          assert target_ids <= set(records)
          before = {rid: copy.deepcopy(card) for rid, card in records.items()}
          before_diag = copy.deepcopy(diag)
          before_el = copy.deepcopy(electrical)
          before_pn = copy.deepcopy(pneumatic)

          c = records['VL-EQ-CB-002']
          c['purpose'] = 'Обеспечивают освещение пути прожектором и световое обозначение лобовой части секции белыми/красными буферными фонарями.'
          c['quantity'] = 'На секцию: 1 прожектор и 2 буферных фонаря; в двухсекционном электровозе — 2 лампы прожектора и 4 лампы буферных фонарей.'
          c['location'] = {'text':'Прожектор и два буферных фонаря установлены на лобовой части каждой кабины; управление — из кабины машиниста.','confidence':'source_confirmed'}
          c['schemeDesignations'] = ['300 — лампа прожектора','320, 321 — лампы буферных фонарей','257, 258 — тумблеры выбора буферных фонарей','г41 — сопротивление цепи прожектора']
          c['modelNames'] = ['ПЖ50-500-1 — лампа прожектора','Ж-54-60 — лампы буферных фонарей']
          c['parameters'] = ['Прожектор имеет режимы «тусклый свет» и «яркий свет».','В режиме яркого света шунтируется часть сопротивления г41; часть г41 между выводами 2–3 остаётся включённой для увеличения срока службы лампы.','Буферные фонари допускают выбор белого или красного огня тумблерами 257 и 258.']
          c['principle'] = 'Кнопки прожектора изменяют включение сопротивления г41 и тем самым режим свечения лампы 300. Буферные фонари управляются отдельными тумблерами 257 и 258, позволяющими задать требуемый цвет огня.'
          c['relations'] = [{'type':'powered_and_switched_by','targetId':'VL-EQ-CT-006','note':'питание и коммутация цепей освещения относятся к низковольтным цепям управления'}]
          c['normalState'] = ['Прожектор устойчиво работает в требуемом режиме без мерцания и заметного падения яркости.','Оба буферных фонаря включаются в требуемом белом/красном режиме, корпуса и светофильтры без повреждений.']
          c['deviationSigns'] = ['Прожектор не включается, не переключается между тусклым и ярким режимом либо мерцает.','Один из буферных фонарей не включается, не меняет цвет либо имеет нестабильное свечение.']
          c['unresolvedSystemConnections'] = []
          c['relationCoverage'] = 'source_confirmed'
          c['notes'] = ['Связь с переключателями «тяга/торможение» удалена как ошибочная: наружное освещение относится к цепям управления и собственным органам коммутации.']

          c = records['VL-EQ-CB-004']
          c['purpose'] = 'Пневматически очищает лобовое стекло кабины от атмосферных осадков и пыли.'
          c['modelNames'] = ['СЛ-440Б']
          c['quantity'] = 'Комплект стеклоочистителей рабочей кабины; точное количество щёток определяется фактическим исполнением остекления секции.'
          c['location'] = {'text':'Лобовое остекление кабины; привод и распределитель расположены со стороны кабины у механизма щётки.','confidence':'source_confirmed'}
          c['parameters'] = ['Рабочее давление 0,45–0,9 МПа (4,5–9 кгс/см²).','Число двойных ходов по мокрому стеклу: минимальная частота — не более 35 в минуту, максимальная — не менее 50 в минуту.','Угол размаха щётки — (100±8)°.']
          c['principle'] = 'Сжатый воздух попеременно подаётся распределителем в полости пневмоцилиндра; возвратно-поступательное движение через рычаг преобразуется в качание щётки по стеклу. Регулирование подачи воздуха изменяет частоту ходов.'
          c['normalState'] = ['Щётка движется равномерно без заеданий и полностью отрабатывает рабочий сектор.','Нет заметных утечек воздуха, рывков, самопроизвольной остановки или повреждения щётки/рычага.']
          c['deviationSigns'] = ['Щётка не движется, движется рывками либо не проходит полный сектор.','Наблюдается утечка воздуха, заедание распределителя или пневмоцилиндра, ослабление рычага или щётки.']
          c['relationCoverage'] = 'source_confirmed'
          c['notes'] = ['Значение усилия прижатия щётки не внесено: в доступной оцифровке единица/число переданы неоднозначно.']

          c = records['VL-EQ-PN-009']
          c['aliases'] = ['КР-50','КР-50-01','разгрузочный клапан']
          c['purpose'] = 'Сообщает нагнетательный участок компрессора с атмосферой при остановленном компрессоре и облегчает последующий запуск электродвигателя без противодавления.'
          c['modelNames'] = ['КР-50','КР-50-01']
          c['location'] = {'text':'На нагнетательном трубопроводе мотор-компрессора до обратного клапана, аппарат 246 в цепи управления компрессором.','confidence':'source_confirmed'}
          c['schemeDesignations'] = ['246 — разгрузочный клапан компрессора']
          c['parameters'] = ['Рабочее давление сжатого воздуха 0,75–0,9 МПа.','Номинальное напряжение электромагнитного вентиля 50 В.','Сопротивление катушки вентиля при +20 °C — 173 Ом.','Ход клапана — 5–6 мм.']
          c['principle'] = 'При выключенном компрессоре разгрузочный клапан сообщает участок нагнетательной магистрали до обратного клапана с атмосферой. При запуске включается электромагнитный вентиль, а с ростом подачи компрессора запорный клапан закрывает атмосферный канал; после остановки участок снова разгружается.'
          c['relations'] = [{'type':'unloads','targetId':'VL-EQ-AU-003','note':'облегчает запуск мотор-компрессора'},{'type':'installed_before','targetId':'VL-EQ-PN-008','note':'разгружает участок нагнетательного трубопровода до обратного клапана'}]
          c['normalState'] = ['Перед запуском нагнетательный участок разгружен от остаточного противодавления.','После запуска и набора подачи атмосферный канал закрывается, воздух поступает к главным резервуарам через обратный клапан.']
          c['deviationSigns'] = ['Компрессор запускается тяжело из-за неразгруженного нагнетательного участка.','Клапан не закрывается после запуска и продолжает выпускать воздух в атмосферу либо не открывается после остановки.']
          c['relationCoverage'] = 'source_confirmed'
          c['notes'] = ['КР-50 и КР-50-01 описываются как применявшиеся исполнения. Точную серийную границу для ВЛ80С карточка не устанавливает без отдельного надёжного подтверждения.']

          c = records['VL-EQ-MC-001']
          c['purpose'] = 'Подаёт песок в зону контакта колёс с рельсами для повышения сцепления при тяге и для уменьшения риска юза при торможении.'
          c['quantity'] = '6 песочных бункеров на секцию, общий объём 1232 л; два средних бункера общие для обоих направлений движения.'
          c['location'] = {'text':'Бункеры размещены в кузове секции и заправляются через крышевые люки; форсунки и пескоподающие трубы расположены у тележек и направляют песок к колёсным парам.','confidence':'source_confirmed'}
          c['schemeDesignations'] = ['241, 242 — электропневматические вентили пескоподачи','219 «Песок» — дополнительная кнопка на исполнениях с №1904']
          c['parameters'] = ['Номинальная регулировка подачи: 1,2 кг/мин под передние колёсные пары секций и 0,8 кг/мин под средние колёсные пары.','Источник сжатого воздуха — питательная магистраль.']
          c['principle'] = 'Сжатый воздух из питательной магистрали через ручной либо электропневматический орган управления и переключающий клапан поступает к форсункам. Поток воздуха разрыхляет и увлекает песок из бункера по пескоподающей трубе к зоне контакта колеса с рельсом. Направление подачи зависит от положения реверсора.'
          c['relations'] = [{'type':'supplied_by','targetId':'VL-EQ-PN-004','note':'сжатый воздух поступает из питательной магистрали'},{'type':'cooperates_with','targetId':'VL-EQ-PR-002','note':'автоматическая пескоподача участвует в противобоксовочном/противоюзном действии'}]
          c['normalState'] = ['Бункеры, сетки, патрубки и форсунки без повреждений и засоров; песок сухой и сыпучий.','При команде песок подаётся в требуемом направлении устойчивой струёй и попадает в зону контакта колеса с рельсом.']
          c['deviationSigns'] = ['Песок не подаётся либо подаётся слабо/неравномерно при исправной команде.','Засорена форсунка или пескопровод, песок увлажнён/слежался, есть утечка воздуха или неправильное направление струи.']
          c['unresolvedSystemConnections'] = []
          c['relationCoverage'] = 'source_confirmed'
          c['notes'] = ['Связь с кранами продувки конденсата PN-012 удалена как ошибочная; рабочий источник воздуха системы пескоподачи — питательная магистраль PN-004.','Существующее правило №1904 сохранено без изменения.']

          c = records['VL-EQ-BR-015']
          c['purpose'] = 'Соединяют тормозную и питательную магистрали между секциями/единицами подвижного состава и позволяют штатно разобщать их концевыми кранами.'
          c['modelNames'] = ['190.00 — концевой кран']
          c['location'] = {'text':'На концевых брусьях/торцах секций в местах вывода тормозной и питательной магистралей; к кранам присоединены соединительные рукава.','confidence':'source_confirmed'}
          c['parameters'] = ['Наибольшее рабочее давление концевого крана 190.00 — 0,9 МПа (9 кгс/см²).','Диаметр проходного сечения концевого крана — 33 мм.']
          c['principle'] = 'В открытом положении концевой кран обеспечивает проход воздуха между магистралью и соединительным рукавом; в закрытом положении разобщает магистраль перед расцеплением или при необходимости изоляции соединения.'
          c['relations'] = [{'type':'connects','targetId':'VL-EQ-BR-003','note':'концевые краны и рукава тормозной магистрали'},{'type':'connects','targetId':'VL-EQ-PN-004','note':'концевые краны и рукава питательной магистрали'}]
          c['normalState'] = ['Краны полностью занимают требуемое фиксированное положение, рукава и головки соединений герметичны и без видимых повреждений.','При соединённых магистралях отсутствует утечка воздуха через кран, рукав и головку соединения.']
          c['deviationSigns'] = ['Утечка воздуха через кран, рукав или соединительную головку.','Кран не переводится полностью в требуемое положение, рукав повреждён, пережат или соединение неплотное.']
          c['relationCoverage'] = 'source_confirmed'
          c['notes'] = ['Тип соединительного рукава не объявлен универсальным без отдельного подтверждения конкретного исполнения секции.']

          protected = ['id','legacyId','slug','name','kind','domain','systemIds','diagnosticScenarioIds','schemeNodeIds','legacyHotspotIds','sourceRefs','evidenceStatus','applicability','migration','instances','crosslinks','featureRules','equipmentOverrides']
          for rid in target_ids:
              for field in protected:
                  assert records[rid].get(field) == before[rid].get(field), (rid, field)
          for rid in target_ids - {'VL-EQ-PN-009'}:
              assert records[rid].get('aliases') == before[rid].get('aliases'), rid
          assert records['VL-EQ-PN-009']['aliases'] == ['КР-50','КР-50-01','разгрузочный клапан']

          for rid, card in records.items():
              if rid not in target_ids:
                  assert card == before[rid], rid

          assert all(rel['targetId'] != 'VL-EQ-TR-014' for rel in records['VL-EQ-CB-002']['relations'])
          assert any(rel['targetId'] == 'VL-EQ-PN-004' for rel in records['VL-EQ-MC-001']['relations'])
          assert all(rel['targetId'] != 'VL-EQ-PN-012' for rel in records['VL-EQ-MC-001']['relations'])
          assert records['VL-EQ-PN-009']['modelNames'] == ['КР-50','КР-50-01']
          assert 'КР-1' not in records['VL-EQ-PN-009']['aliases']
          assert 'ЭПВ2' not in json.dumps(records['VL-EQ-PN-009'], ensure_ascii=False)

          all_ids = set(records)
          for rid in target_ids:
              for rel in records[rid].get('relations', []):
                  assert rel['targetId'] in all_ids, (rid, rel)

          assert diag == before_diag
          assert electrical == before_el
          assert pneumatic == before_pn
          dump_gz(eq_path, eq)
          shutil.copy2(eq_path, 'patch/app/src/main/assets/technical/vl80s_equipment.json.gz')
          PY

          python3 - <<'PY'
          from pathlib import Path
          for path in [Path('app/build.gradle.kts'), Path('patch/app/build.gradle.kts')]:
              text = path.read_text(encoding='utf-8')
              assert 'versionCode = 187' in text
              assert 'versionName = "1.2.2-dev14-beta42"' in text
              text = text.replace('versionCode = 187', 'versionCode = 188', 1)
              text = text.replace('versionName = "1.2.2-dev14-beta42"', 'versionName = "1.2.2-dev14-beta43"', 1)
              path.write_text(text, encoding='utf-8')
          PY

          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          git diff --name-only HEAD -- app/build.gradle.kts patch/app/build.gradle.kts app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz app/src/main/assets/technical/vl80s_diagnostics.json.gz patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz app/src/main/assets/technical/vl80s_electrical.json.gz patch/app/src/main/assets/technical/vl80s_electrical.json.gz app/src/main/assets/technical/vl80s_pneumatic.json.gz patch/app/src/main/assets/technical/vl80s_pneumatic.json.gz | sort > /tmp/changed.txt
          printf '%s\n' app/build.gradle.kts app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/build.gradle.kts patch/app/src/main/assets/technical/vl80s_equipment.json.gz | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit Beta43 source safely
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta43 source commit'; exit 1; }
          git config user.name 'DomEnota-hub'
          git config user.email 'domenota6212@gmail.com'
          git add app/build.gradle.kts patch/app/build.gradle.kts app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' app/build.gradle.kts app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/build.gradle.kts patch/app/src/main/assets/technical/vl80s_equipment.json.gz | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/staged.txt
          git commit -m 'Enrich VL80S cab, sanding and pneumatic tail cards'
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved during Beta43 commit'; exit 1; }
          git push origin HEAD:dev14-integration
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Beta43 post-push SHA mismatch'; exit 1; }
