name: Apply Beta44 brake mechanics

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta44-brake-mechanics.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev14-integration

      - name: Guard Beta44 base
        shell: bash
        run: |
          set -euo pipefail
          base="6c86213d28525df8acffdced53b38581437ca076"
          test "$(git rev-parse HEAD^)" = "$base" || { echo "Unexpected workflow parent: $(git rev-parse HEAD^)"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta44 apply'; exit 1; }
          grep -Fq 'versionCode = 188' app/build.gradle.kts
          grep -Fq 'versionName = "1.2.2-dev14-beta43"' app/build.gradle.kts

      - name: Enrich Beta44 brake mechanics and bogie cards
        shell: bash
        run: |
          set -euo pipefail
          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          cmp app/src/main/assets/technical/vl80s_diagnostics.json.gz patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz
          cmp app/src/main/assets/technical/vl80s_electrical.json.gz patch/app/src/main/assets/technical/vl80s_electrical.json.gz
          cmp app/src/main/assets/technical/vl80s_pneumatic.json.gz patch/app/src/main/assets/technical/vl80s_pneumatic.json.gz

          python3 - <<'PY'
          import copy, gzip, json, shutil
          from pathlib import Path

          eq_path = Path('app/src/main/assets/technical/vl80s_equipment.json.gz')
          diag_path = Path('app/src/main/assets/technical/vl80s_diagnostics.json.gz')
          el_path = Path('app/src/main/assets/technical/vl80s_electrical.json.gz')
          pn_path = Path('app/src/main/assets/technical/vl80s_pneumatic.json.gz')

          def load_gz(path):
              with gzip.open(path, 'rt', encoding='utf-8') as f:
                  return json.load(f)

          def dump_gz(path, obj):
              raw = (json.dumps(obj, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
              with open(path, 'wb') as out:
                  with gzip.GzipFile(filename='', mode='wb', fileobj=out, mtime=0) as gz:
                      gz.write(raw)

          eq = load_gz(eq_path)
          diag = load_gz(diag_path)
          electrical = load_gz(el_path)
          pneumatic = load_gz(pn_path)

          assert len(eq['records']) == 89
          assert len(diag['scenarios']) == 93

          records = {r['id']: r for r in eq['records']}
          target_ids = {
              'VL-EQ-BR-003', 'VL-EQ-BR-004', 'VL-EQ-BR-006',
              'VL-EQ-BR-008', 'VL-EQ-MC-002'
          }
          assert target_ids <= set(records)

          before = {rid: copy.deepcopy(card) for rid, card in records.items()}
          before_diag = copy.deepcopy(diag)
          before_el = copy.deepcopy(electrical)
          before_pn = copy.deepcopy(pneumatic)
          preserved = [
              'id','legacyId','slug','name','aliases','kind','domain','systemIds',
              'diagnosticScenarioIds','schemeNodeIds','legacyHotspotIds','sourceRefs',
              'evidenceStatus','applicability','migration','instances','crosslinks',
              'featureRules','equipmentOverrides'
          ]

          # BR-003 — brake pipe
          c = records['VL-EQ-BR-003']
          c['purpose'] = 'Передаёт по всему электровозу и составу пневматическую команду автоматического тормоза: зарядку, служебную разрядку, перекрышу и экстренную разрядку.'
          c['quantity'] = 'Одна непрерывная тормозная магистраль, проходящая через секции и соединяемая между единицами подвижного состава концевыми кранами и рукавами.'
          c['location'] = {'text':'Магистральный трубопровод проходит вдоль электровоза; на концах секций связан с концевыми кранами и соединительными рукавами.','confidence':'source_confirmed'}
          c['schemeDesignations'] = ['ТМ — тормозная магистраль']
          c['parameters'] = [
              'Давление ТМ задаётся краном машиниста №395 через уравнительный резервуар и его пневматическую часть.',
              'Снижение давления ТМ воспринимается воздухораспределителем №483 как команда автоматического торможения; восстановление давления участвует в отпуске и зарядке.',
              'При нарушении целостности ТМ падение давления используется системой контроля тормозной магистрали для снятия тяги и сигнализации.'
          ]
          c['principle'] = 'Кран машиниста изменяет давление в уравнительном резервуаре и через свою пневматическую часть управляет зарядкой или разрядкой ТМ. Воздухораспределитель №483 отслеживает изменение давления ТМ и формирует соответствующее тормозное действие. Непрерывность магистрали между секциями и составом обеспечивают концевые краны и соединительные рукава.'
          c['relations'] = [
              {'type':'controlled_by','targetId':'VL-EQ-BR-001','note':'кран машиниста №395 управляет зарядкой и разрядкой тормозной магистрали'},
              {'type':'command_source_for','targetId':'VL-EQ-BR-010','note':'воздухораспределитель №483 воспринимает изменения давления ТМ'},
              {'type':'coupled_by','targetId':'VL-EQ-BR-015','note':'концевые краны и рукава обеспечивают продолжение ТМ между секциями и составом'},
              {'type':'monitored_by','targetId':'VL-EQ-SF-002','note':'система контроля целостности ТМ использует пневматический сигнал магистрали'}
          ]
          c['normalState'] = [
              'ТМ заряжается и поддерживает давление без аномального падения при установленном режиме крана машиниста.',
              'При тормозной команде давление изменяется предсказуемо, а связанные тормозные приборы реагируют без самопроизвольного торможения или отпуска.',
              'Концевые соединения герметичны и не создают заметной утечки.'
          ]
          c['deviationSigns'] = [
              'Тормозная магистраль не заряжается либо давление заметно падает без команды.',
              'Наблюдаются утечки в трубопроводе, соединительных рукавах или концевых соединениях.',
              'Возникает самопроизвольное торможение, нестабильный отпуск либо несоответствие давления ТМ команде крана машиниста.'
          ]
          c['unresolvedSystemConnections'] = []
          c['relationCoverage'] = 'source_confirmed'
          c['notes'] = ['Карточка описывает магистраль как пневматический командный канал; неисправности крана машиниста, воздухораспределителя и концевых соединений диагностируются отдельно.']

          # BR-004 — brake cylinders
          c = records['VL-EQ-BR-004']
          c['purpose'] = 'Преобразуют давление сжатого воздуха в механическое усилие, передаваемое тормозной рычажной передачей к колодкам.'
          c['modelNames'] = ['Тормозной цилиндр 10″']
          c['quantity'] = '4 на секцию: по 2 на каждую двухосную тележку, с индивидуальным цилиндром на каждую сторону тележки.'
          c['location'] = {'text':'На кронштейнах шкворневых брусьев рам тележек.','confidence':'source_confirmed'}
          c['parameters'] = [
              'Диаметр тормозного цилиндра — 254 мм (10″).',
              'Для рычажной передачи с чугунными колодками установочный выход штока — 100–120 мм, допустимый — до 180 мм.',
              'Для рычажной передачи с композиционными колодками установочный выход штока — 60–80 мм, допустимый — до 120 мм.'
          ]
          c['principle'] = 'При наполнении цилиндра поршень и шток создают усилие на рычажной передаче. В пневматической схеме секции тормозные цилиндры одной тележки получают воздух через кран вспомогательного тормоза №254, а цилиндры второй тележки — через реле давления №304, которое повторяет управляющее давление и питается от напорной магистрали.'
          c['relations'] = [
              {'type':'controlled_by','targetId':'VL-EQ-BR-002','note':'кран №254 формирует управляющее давление локомотивного тормоза'},
              {'type':'supplied_by_relay','targetId':'VL-EQ-BR-005','note':'реле №304 обеспечивает наполнение цилиндров второй тележки'},
              {'type':'actuates','targetId':'VL-EQ-BR-006','note':'штоки цилиндров передают усилие на тормозную рычажную передачу'}
          ]
          c['normalState'] = [
              'Все цилиндры обеих тележек наполняются и отпускают без выраженной разницы по действию.',
              'Штоки выходят плавно, без заеданий; утечки через цилиндр и соединения отсутствуют либо находятся в допустимых пределах.',
              'После отпуска штоки возвращаются, колодки отходят от бандажей.'
          ]
          c['deviationSigns'] = [
              'Одна тележка или одна сторона тележки тормозит заметно слабее другой.',
              'Цилиндр не наполняется, не отпускает, имеет утечку или заедание штока.',
              'Выход штока выходит за допустимые пределы для установленного типа колодок.'
          ]
          c['unresolvedSystemConnections'] = []
          c['relationCoverage'] = 'source_confirmed'
          c['notes'] = ['Параметры выхода штока различаются для чугунных и композиционных колодок; их нельзя переносить между исполнениями без учёта настройки рычажной передачи.']

          # BR-006 — brake rigging
          c = records['VL-EQ-BR-006']
          c['purpose'] = 'Передаёт усилие тормозных цилиндров или ручного тормоза к тормозным колодкам и обеспечивает двустороннее нажатие колодок на бандажи колёс.'
          c['quantity'] = '2 комплекта на секцию — по одному на каждую тележку.'
          c['location'] = {'text':'На обеих тележках; рычаги, балансиры, тяги, подвески и башмаки закреплены на элементах рамы тележки.','confidence':'source_confirmed'}
          c['parameters'] = [
              'Двустороннее нажатие тормозных колодок на колесо.',
              'Передаточное число для чугунных колодок — 2,88.',
              'Передаточное число для композиционных колодок — 1,03.',
              'Установочный выход штока тормозного цилиндра: 100–120 мм для чугунных и 60–80 мм для композиционных колодок.',
              'Допустимый выход штока: до 180 мм для чугунных и до 120 мм для композиционных колодок.',
              'Выход штока регулируется изменением длины тяги; при исчерпании регулировки применяется перестановка валиков по предусмотренным отверстиям.'
          ]
          c['principle'] = 'Усилие от штока тормозного цилиндра передаётся через рычаги, планки, балансиры и тяги на внутренние и наружные колодки. Для композиционных колодок используются предусмотренные конструкцией иные положения валиков, формирующие другое передаточное отношение. Та же механическая передача используется приводом ручного тормоза.'
          c['relations'] = [
              {'type':'actuated_by','targetId':'VL-EQ-BR-004','note':'основное пневматическое усилие создают тормозные цилиндры'},
              {'type':'actuated_by','targetId':'VL-EQ-BR-008','note':'ручной тормоз использует ту же рычажную передачу для удержания локомотива'},
              {'type':'brakes','targetId':'VL-EQ-MC-003','note':'колодки воздействуют с двух сторон на бандажи колёсных пар'},
              {'type':'mounted_on','targetId':'VL-EQ-MC-002','note':'элементы рычажной передачи закреплены на раме тележки'}
          ]
          c['normalState'] = [
              'Колодки подходят к бандажам с обеих сторон без перекоса и после отпуска отходят без прихватывания.',
              'Тяги, подвески, башмаки, валики и страховочные элементы закреплены; видимых трещин, деформаций и недопустимых люфтов нет.',
              'Выход штоков и положение валиков соответствуют фактически установленному типу тормозных колодок.'
          ]
          c['deviationSigns'] = [
              'Неравномерное или одностороннее прижатие колодок, перекос башмака или повышенный зазор.',
              'Повреждение тяги, подвески, валика, балансира, башмака или страховочного элемента.',
              'После отпуска колодка остаётся прижатой и вызывает нагрев или волочение колёсной пары.',
              'Настройка рычажной передачи не соответствует типу установленных колодок.'
          ]
          c['unresolvedSystemConnections'] = []
          c['relationCoverage'] = 'source_confirmed'
          c['notes'] = ['Числа 2,88 и 1,03 относятся к разным исполнениям рычажной передачи под чугунные и композиционные колодки; их нельзя смешивать как параметры одного положения механизма.']

          # BR-008 — hand brake
          c = records['VL-EQ-BR-008']
          c['purpose'] = 'Механически затормаживает локомотив без использования сжатого воздуха, передавая усилие от колонки ручного тормоза на тормозные колодки через рычажную передачу.'
          c['quantity'] = '1 колонка ручного тормоза в каждой кабине секции; 2 на штатном двухсекционном ВЛ80С.'
          c['location'] = {'text':'Колонка ручного тормоза установлена на поперечной стенке кабины; механический привод связан с тормозной рычажной передачей тележки.','confidence':'source_confirmed'}
          c['parameters'] = [
              'Привод полностью механический и использует элементы тормозной рычажной передачи.',
              'Предназначен для затормаживания и удержания одиночного электровоза при стоянке.'
          ]
          c['principle'] = 'Вращение привода колонки создаёт механическое натяжение системы тяг и рычагов. Усилие передаётся на тормозную рычажную передачу и далее к колодкам, прижимающимся к бандажам колёс независимо от давления в тормозных цилиндрах.'
          c['relations'] = [
              {'type':'actuates','targetId':'VL-EQ-BR-006','note':'ручной привод передаёт усилие через общую тормозную рычажную передачу'},
              {'type':'brakes','targetId':'VL-EQ-MC-003','note':'через колодки создаёт удерживающее усилие на колёсных парах'}
          ]
          c['normalState'] = [
              'Колонка вращается без заеданий и передаёт усилие на рычажную передачу.',
              'При полном отпуске механический привод не удерживает колодки у бандажей.',
              'Тяги и шарнирные соединения привода закреплены и не имеют повреждений.'
          ]
          c['deviationSigns'] = [
              'Ручной тормоз не создаёт удерживающего усилия либо не отпускается полностью.',
              'Наблюдается заедание привода, чрезмерный люфт, повреждение тяг или шарниров.',
              'После отпуска сохраняется прижатие колодок и признаки волочения колёсной пары.'
          ]
          c['unresolvedSystemConnections'] = []
          c['relationCoverage'] = 'source_confirmed'
          c['notes'] = ['Ручной тормоз воздействует через ту же механическую рычажную передачу, что и пневматические тормозные цилиндры; пневматическую часть для его действия использовать не требуется.']

          # MC-002 — bogie assembly
          c = records['VL-EQ-MC-002']
          c['purpose'] = 'Несёт кузов, направляет секцию по пути и передаёт между кузовом и рельсами вертикальные, тяговые, тормозные и боковые усилия через колёсные пары, буксы и подвешивание.'
          c['quantity'] = '2 двухосные тележки на секцию; 4 на штатном двухсекционном ВЛ80С.'
          c['location'] = {'text':'Под кузовом каждой секции; кузов опирается на две тележки.','confidence':'source_confirmed'}
          c['parameters'] = [
              'Тележка двухосная: по 2 колёсные пары на каждую тележку.',
              'Основные узлы: рама, колёсные пары, тяговая зубчатая передача, буксовые узлы, рессорное подвешивание, тормозная система, подвеска тяговых двигателей и шаровая связь.',
              'Тормозная система тележки — рычажная, с двусторонним нажатием колодок на бандажи колёс.',
              'Рессорная система первой ступени индивидуальна для каждой буксы.'
          ]
          c['principle'] = 'Рама тележки распределяет вертикальную нагрузку между колёсными парами через рессорное подвешивание, воспринимает тяговые, тормозные, боковые и вертикальные силы и передаёт их на кузов через связи тележки. Колёсные пары направляют локомотив по рельсам и передают тяговое и тормозное усилие в контакте колесо–рельс.'
          c['relations'] = [
              {'relationType':'contains','targetId':'VL-EQ-MC-003','note':'каждая двухосная тележка содержит две колёсные пары'},
              {'relationType':'contains','targetId':'VL-EQ-MC-004','note':'буксовые узлы связывают концы осей колёсных пар с рамой тележки'},
              {'relationType':'contains','targetId':'VL-EQ-MC-005','note':'рессорное подвешивание передаёт и смягчает вертикальные нагрузки'},
              {'relationType':'contains','targetId':'VL-EQ-TR-007','note':'тяговая зубчатая передача размещена в моторно-колёсном блоке тележки'},
              {'relationType':'supports','targetId':'VL-EQ-TR-006','note':'тяговые двигатели имеют опорно-осевую подвеску, связанную с рамой тележки и осью колёсной пары'},
              {'relationType':'carries','targetId':'VL-EQ-BR-006','note':'на раме тележки закреплены элементы тормозной рычажной передачи и тормозные цилиндры'}
          ]
          c['normalState'] = [
              'Рама и сварные швы без видимых трещин, деформаций и повреждения кронштейнов.',
              'Колёсные пары, буксы, рессорное подвешивание, тяговый привод и тормозная система не имеют признаков ослабления, перекоса или ненормального нагрева.',
              'При движении отсутствуют новые удары, стук или вибрация, связанные со скоростью и работой тележки.'
          ]
          c['deviationSigns'] = [
              'Трещины или деформация рамы, повреждение кронштейнов и подвесок.',
              'Ненормальный нагрев буксы или моторно-осевого узла, новый механический шум, удары или вибрация.',
              'Повреждение рессорного подвешивания, тормозной передачи, колёсной пары либо элементов тягового привода.'
          ]
          c['unresolvedSystemConnections'] = []
          c['relationCoverage'] = 'source_confirmed'
          c['notes'] = ['Карточка описывает тележку как сборочный узел; точные параметры колёсных пар, букс, подвешивания и тяговой передачи приведены в соответствующих отдельных карточках.']

          # Preserve identity, source provenance, diagnostics and variant contracts on all targets.
          for rid in target_ids:
              for key in preserved:
                  assert records[rid].get(key) == before[rid].get(key), (rid, key)

          # All 84 non-target records must remain byte-for-byte-equivalent as JSON values.
          for rid, old in before.items():
              if rid not in target_ids:
                  assert records[rid] == old, rid

          # No changes in diagnostic / electrical / pneumatic assets.
          assert diag == before_diag
          assert electrical == before_el
          assert pneumatic == before_pn

          # Validate references.
          all_eq = set(records)
          all_diag = {s['id'] for s in diag['scenarios']}
          for rid in target_ids:
              card = records[rid]
              for rel in card.get('relations', []):
                  assert rel['targetId'] in all_eq, (rid, rel)
              for did in card.get('diagnosticScenarioIds', []):
                  assert did in all_diag, (rid, did)

          # Content guards against accidental cross-model or OCR transfer.
          assert '254 мм' in ' '.join(records['VL-EQ-BR-004']['parameters'])
          assert records['VL-EQ-BR-004']['quantity'].startswith('4 на секцию')
          rig = ' '.join(records['VL-EQ-BR-006']['parameters'])
          assert '2,88' in rig and '1,03' in rig and 'Двустороннее' in rig
          assert records['VL-EQ-BR-008']['quantity'].startswith('1 колонка')
          assert records['VL-EQ-MC-002']['quantity'].startswith('2 двухосные тележки')
