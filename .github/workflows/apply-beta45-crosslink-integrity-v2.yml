name: Apply Beta45 crosslink integrity v2

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta45-crosslink-integrity-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev14-integration

      - name: Guard Beta45 source base
        shell: bash
        run: |
          set -euo pipefail
          base="fdd563032bdbc36302c0f06d1e5b45fef77d2c8e"
          expected_parent="9e492c0632c6865c22a7d6b7c6898fe180d37e71"
          test "$(git rev-parse HEAD^)" = "$expected_parent" || { echo "Unexpected v2 parent: $(git rev-parse HEAD^)"; exit 1; }
          git diff --quiet "$base" HEAD -- app patch || { echo 'Permanent source moved since Beta44'; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta45 v2 apply'; exit 1; }
          grep -Fq 'versionCode = 189' app/build.gradle.kts
          grep -Fq 'versionName = "1.2.2-dev14-beta44"' app/build.gradle.kts

      - name: Canonicalize VL80S crosslinks and hotspot reverse index
        shell: bash
        run: |
          set -euo pipefail
          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          cmp app/src/main/assets/technical/vl80s_diagnostics.json.gz patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz
          cmp app/src/main/assets/technical/vl80s_electrical.json.gz patch/app/src/main/assets/technical/vl80s_electrical.json.gz
          cmp app/src/main/assets/technical/vl80s_pneumatic.json.gz patch/app/src/main/assets/technical/vl80s_pneumatic.json.gz

          python3 - <<'PY'
          import copy, gzip, json, shutil
          from collections import defaultdict
          from pathlib import Path

          eq_path = Path('app/src/main/assets/technical/vl80s_equipment.json.gz')
          diag_path = Path('app/src/main/assets/technical/vl80s_diagnostics.json.gz')
          el_path = Path('app/src/main/assets/technical/vl80s_electrical.json.gz')
          pn_path = Path('app/src/main/assets/technical/vl80s_pneumatic.json.gz')

          def load_gz(path):
              with gzip.open(path, 'rt', encoding='utf-8') as f:
                  return json.load(f)

          def dump_gz(path, obj):
              raw = (json.dumps(obj, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
              with open(path, 'wb') as out:
                  with gzip.GzipFile(filename='', mode='wb', fileobj=out, mtime=0) as gz:
                      gz.write(raw)

          def link_ids(value):
              out = []
              for item in value or []:
                  if isinstance(item, str): out.append(item)
                  elif isinstance(item, dict) and item.get('id'): out.append(item['id'])
              return out

          eq = load_gz(eq_path); diag = load_gz(diag_path)
          electrical = load_gz(el_path); pneumatic = load_gz(pn_path)
          assert len(eq['records']) == 89
          assert len(diag['scenarios']) == 93
          before_eq = copy.deepcopy(eq); before_diag = copy.deepcopy(diag)
          before_el = copy.deepcopy(electrical); before_pn = copy.deepcopy(pneumatic)

          records = eq['records']; by_id = {r['id']: r for r in records}; all_eq = set(by_id)
          all_diag = {s['id'] for s in diag['scenarios']}; scenarios = {s['id']: s for s in diag['scenarios']}
          reverse = eq['reverseIndex']

          # Beta41 canonical diagnostic graph invariants.
          expected_by_diag = defaultdict(list)
          for card in records:
              ids = card.get('diagnosticScenarioIds', [])
              assert len(ids) == len(set(ids)), ('duplicate diagnostic ids', card['id'])
              for did in ids:
                  assert did in all_diag, (card['id'], did)
                  expected_by_diag[did].append(card['id'])
          for did, scenario in scenarios.items():
              assert set(scenario.get('equipmentIds', [])) == set(expected_by_diag.get(did, [])), ('scenario/card asymmetry', did)
          expected_diag_reverse = {k:v for k,v in expected_by_diag.items() if v}
          actual_diag_reverse = reverse['diagnosticScenarioId']
          assert set(actual_diag_reverse) == set(expected_diag_reverse)
          for did, ids in expected_diag_reverse.items():
              assert set(actual_diag_reverse[did]) == set(ids), ('diagnostic reverse mismatch', did)

          expected_missing = {
              ('VL-EQ-HV-001','gv-no-open'),('VL-EQ-HV-002','pantograph-slow-rise'),('VL-EQ-HV-002','pantograph-wrong-selection'),
              ('VL-EQ-TR-001','ekg-position-mismatch'),('VL-EQ-TR-001','ekg-slow-transition'),('VL-EQ-TR-001','traction-one-section-low'),
              ('VL-EQ-TR-002','traction-intermittent'),('VL-EQ-TR-002','traction-one-section-low'),('VL-EQ-TR-003','rectifier-overheat'),
              ('VL-EQ-TR-003','traction-one-section-low'),('VL-EQ-TR-004','transformer-oil-signs'),('VL-EQ-AU-002','fan-vibration'),
              ('VL-EQ-AU-002','rectifier-overheat'),('VL-EQ-AU-002','traction-motor-overheat'),('VL-EQ-AU-003','compressor-overheat'),
              ('VL-EQ-SF-001','vigilance-control-fault'),('VL-EQ-MC-001','sand-nozzle-blocked'),('VL-EQ-MC-002','external-object-impact'),
              ('VL-EQ-PR-001','traction-motor-flashover'),('VL-EQ-SF-002','vigilance-control-fault'),('VL-EQ-PN-002','pantograph-slow-rise'),
              ('VL-EQ-TR-006','traction-motor-flashover'),('VL-EQ-TR-006','traction-motor-overheat'),('VL-EQ-TR-006','traction-one-section-low'),
              ('VL-EQ-TR-007','traction-gear-noise'),('VL-EQ-FR-001','fire-loop-fault'),('VL-EQ-FR-001','machine-room-smoke'),
              ('VL-EQ-HV-003','vvk-interlock-fault'),('VL-EQ-BR-006','brake-rigging-damage'),('VL-EQ-CT-003','intersection-command-loss'),
              ('VL-EQ-CT-003','traction-intermittent'),('VL-EQ-FR-002','machine-room-smoke'),('VL-EQ-AU-005','rectifier-overheat'),
              ('VL-EQ-CT-004','ekg-position-mismatch'),('VL-EQ-CT-004','traction-intermittent'),('VL-EQ-CT-005','intersection-command-loss'),
          }
          missing=set(); extras=set(); stale_cards=set()
          for card in records:
              canonical=set(card.get('diagnosticScenarioIds', [])); linked=set(link_ids(card.get('crosslinks',{}).get('diagnostics',[])))
              missing |= {(card['id'], did) for did in canonical-linked}
              extras |= {(card['id'], did) for did in linked-canonical}
              if canonical-linked: stale_cards.add(card['id'])
              assert linked <= all_diag, ('dangling diagnostic crosslink', card['id'])
          assert missing == expected_missing, ('unexpected stale fingerprint', missing ^ expected_missing)
          assert not extras
          assert len(missing)==36 and len(stale_cards)==24

          # Scheme crosslinks: equipment schemeNodeIds are legacy node aliases spanning
          # both electrical and pneumatic packages. Scheme-local diagnostics are curated
          # subsets and therefore must not be expanded mechanically.
          legacy_scheme_ids=set()
          for root, collection in ((electrical,'baseSchemes'),(pneumatic,'views')):
              for scheme in root.get(collection,[]):
                  for node in scheme.get('nodes',[]):
                      legacy_scheme_ids.update(node.get('legacySchemeNodeIds',[]))
                      eid=node.get('equipmentId')
                      if eid in by_id:
                          assert set(node.get('diagnosticScenarioIds',[])) <= set(by_id[eid].get('diagnosticScenarioIds',[])), ('scheme diag not on card', scheme.get('id'), node.get('id'))
          for card in records:
              scheme_ids=card.get('schemeNodeIds',[])
              assert set(link_ids(card.get('crosslinks',{}).get('schemeNodes',[]))) == set(scheme_ids), ('scheme crosslink mismatch',card['id'])
              assert set(scheme_ids) <= legacy_scheme_ids, ('unknown legacy scheme node',card['id'],set(scheme_ids)-legacy_scheme_ids)

          expected_scheme=defaultdict(list)
          for card in records:
              for sid in card.get('schemeNodeIds',[]): expected_scheme[sid].append(card['id'])
          actual_scheme=reverse['schemeNodeId']
          assert set(actual_scheme)==set(expected_scheme)
          for sid,ids in expected_scheme.items(): assert set(actual_scheme[sid])==set(ids), ('scheme reverse mismatch',sid)

          # Article crosslinks/reverse index are already canonical; existing detail cards
          # correspond to layout hotspots, while planned_canonical links remain planned.
          expected_article=defaultdict(list)
          for card in records:
              hids=set(card.get('legacyHotspotIds',[])) | {i.get('hotspotId') for i in card.get('instances',[]) if i.get('hotspotId')}
              for article in card.get('crosslinks',{}).get('articles',[]):
                  aid=article.get('id') if isinstance(article,dict) else article
                  if not aid: continue
                  expected_article[aid].append(card['id'])
                  if isinstance(article,dict) and article.get('status')=='existing':
                      assert aid.startswith('vl80-detail-') and aid.removeprefix('vl80-detail-') in hids, (card['id'],aid)
          actual_article=reverse['articleId']
          assert set(actual_article)==set(expected_article)
          for aid,ids in expected_article.items(): assert set(actual_article[aid])==set(ids), ('article reverse mismatch',aid)

          # Relations are validated but deliberately not normalized in Beta45.
          for card in records:
              seen=set()
              for rel in card.get('relations',[]):
                  target=rel.get('targetId'); assert target in all_eq and target != card['id'], ('bad relation',card['id'],rel)
                  key=(rel.get('type'),rel.get('relationType'),target,rel.get('note'))
                  assert key not in seen, ('duplicate relation',card['id'],key); seen.add(key)

          # Only known hotspot reverse-index defects are duplicate memberships for bsa1/mv3.
          old_hotspot=reverse['hotspotId']
          duplicate_keys={k for k,v in old_hotspot.items() if len(v)!=len(set(v))}
          assert duplicate_keys=={'bsa1','mv3'}, duplicate_keys
          expected_hotspot=defaultdict(list)
          for card in records:
              hids=list(card.get('legacyHotspotIds',[]))+[i.get('hotspotId') for i in card.get('instances',[]) if i.get('hotspotId')]
              for hid in hids:
                  if card['id'] not in expected_hotspot[hid]: expected_hotspot[hid].append(card['id'])
          assert set(old_hotspot)==set(expected_hotspot)
          for hid,ids in expected_hotspot.items(): assert set(old_hotspot[hid])==set(ids), ('hotspot membership',hid)

          # Apply repairs.
          for card in records:
              card.setdefault('crosslinks',{})['diagnostics']=[{'id':did,'status':'existing'} for did in card.get('diagnosticScenarioIds',[])]
          reverse['hotspotId']=dict(expected_hotspot)

          for card in records:
              assert link_ids(card.get('crosslinks',{}).get('diagnostics',[])) == card.get('diagnosticScenarioIds',[])
          assert all(len(v)==len(set(v)) for v in reverse['hotspotId'].values())

          # No card content/provenance/relations may change beyond crosslinks.diagnostics.
          old_records={r['id']:r for r in before_eq['records']}
          def stripped(card):
              c=copy.deepcopy(card); c.setdefault('crosslinks',{}).pop('diagnostics',None); return c
          for card in records: assert stripped(card)==stripped(old_records[card['id']]), ('unexpected card mutation',card['id'])
          old_top=copy.deepcopy(before_eq); new_top=copy.deepcopy(eq)
          old_top.pop('records'); new_top.pop('records')
          old_top['reverseIndex'].pop('hotspotId',None); new_top['reverseIndex'].pop('hotspotId',None)
          assert old_top==new_top, 'unexpected top-level equipment mutation'
          assert diag==before_diag and electrical==before_el and pneumatic==before_pn

          dump_gz(eq_path,eq)
          shutil.copy2(eq_path,'patch/app/src/main/assets/technical/vl80s_equipment.json.gz')
          PY

          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('app/build.gradle.kts'),Path('patch/app/build.gradle.kts')]:
              s=p.read_text(encoding='utf-8')
              s=s.replace('versionCode = 189','versionCode = 190',1)
              s=s.replace('versionName = "1.2.2-dev14-beta44"','versionName = "1.2.2-dev14-beta45"',1)
              p.write_text(s,encoding='utf-8')
          PY

          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          cmp app/src/main/assets/technical/vl80s_diagnostics.json.gz patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz
          cmp app/src/main/assets/technical/vl80s_electrical.json.gz patch/app/src/main/assets/technical/vl80s_electrical.json.gz
          cmp app/src/main/assets/technical/vl80s_pneumatic.json.gz patch/app/src/main/assets/technical/vl80s_pneumatic.json.gz
          git diff --name-only HEAD | sort > /tmp/beta45-diff.txt
          printf '%s\n' app/build.gradle.kts app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/build.gradle.kts patch/app/src/main/assets/technical/vl80s_equipment.json.gz | sort > /tmp/beta45-expected.txt
          diff -u /tmp/beta45-expected.txt /tmp/beta45-diff.txt
          grep -Fq 'versionCode = 190' app/build.gradle.kts
          grep -Fq 'versionName = "1.2.2-dev14-beta45"' app/build.gradle.kts

      - name: Commit Beta45 source with fresh branch guard
        shell: bash
        run: |
          set -euo pipefail
          workflow_head="$(git rev-parse HEAD)"
          git fetch origin dev14-integration
          test "$workflow_head" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta45 source commit'; exit 1; }
          git config user.name 'DomEnota-hub'
          git config user.email 'domenota6212@gmail.com'
          git add app/build.gradle.kts patch/app/build.gradle.kts app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'Canonicalize VL80S equipment crosslinks'
          git push origin HEAD:dev14-integration
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Beta45 post-push SHA mismatch'; exit 1; }
