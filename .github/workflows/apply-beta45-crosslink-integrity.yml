name: Apply Beta45 crosslink integrity

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/apply-beta45-crosslink-integrity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev14-integration

      - name: Guard Beta45 base
        shell: bash
        run: |
          set -euo pipefail
          base="fdd563032bdbc36302c0f06d1e5b45fef77d2c8e"
          test "$(git rev-parse HEAD^)" = "$base" || { echo "Unexpected workflow parent: $(git rev-parse HEAD^)"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta45 apply'; exit 1; }
          grep -Fq 'versionCode = 189' app/build.gradle.kts
          grep -Fq 'versionName = "1.2.2-dev14-beta44"' app/build.gradle.kts

      - name: Canonicalize VL80S crosslinks and hotspot reverse index
        shell: bash
        run: |
          set -euo pipefail
          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          cmp app/src/main/assets/technical/vl80s_diagnostics.json.gz patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz
          cmp app/src/main/assets/technical/vl80s_electrical.json.gz patch/app/src/main/assets/technical/vl80s_electrical.json.gz
          cmp app/src/main/assets/technical/vl80s_pneumatic.json.gz patch/app/src/main/assets/technical/vl80s_pneumatic.json.gz

          python3 - <<'PY'
          import copy, gzip, json, shutil
          from collections import defaultdict
          from pathlib import Path

          eq_path = Path('app/src/main/assets/technical/vl80s_equipment.json.gz')
          diag_path = Path('app/src/main/assets/technical/vl80s_diagnostics.json.gz')
          el_path = Path('app/src/main/assets/technical/vl80s_electrical.json.gz')
          pn_path = Path('app/src/main/assets/technical/vl80s_pneumatic.json.gz')

          def load_gz(path):
              with gzip.open(path, 'rt', encoding='utf-8') as f:
                  return json.load(f)

          def dump_gz(path, obj):
              raw = (json.dumps(obj, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
              with open(path, 'wb') as out:
                  with gzip.GzipFile(filename='', mode='wb', fileobj=out, mtime=0) as gz:
                      gz.write(raw)

          def link_ids(value):
              out = []
              for item in value or []:
                  if isinstance(item, str):
                      out.append(item)
                  elif isinstance(item, dict):
                      ident = item.get('id')
                      if ident:
                          out.append(ident)
              return out

          eq = load_gz(eq_path)
          diag = load_gz(diag_path)
          electrical = load_gz(el_path)
          pneumatic = load_gz(pn_path)
          assert len(eq['records']) == 89
          assert len(diag['scenarios']) == 93

          before_eq = copy.deepcopy(eq)
          before_diag = copy.deepcopy(diag)
          before_el = copy.deepcopy(electrical)
          before_pn = copy.deepcopy(pneumatic)

          records = eq['records']
          by_id = {r['id']: r for r in records}
          all_eq = set(by_id)
          all_diag = {s['id'] for s in diag['scenarios']}
          scenarios = {s['id']: s for s in diag['scenarios']}

          # Canonical diagnostic graph must already be symmetric from Beta41.
          expected_by_diag = defaultdict(list)
          for card in records:
              seen = set()
              for did in card.get('diagnosticScenarioIds', []):
                  assert did in all_diag, (card['id'], did)
                  assert did not in seen, ('duplicate diagnosticScenarioIds', card['id'], did)
                  seen.add(did)
                  expected_by_diag[did].append(card['id'])

          for did, scenario in scenarios.items():
              actual = scenario.get('equipmentIds', [])
              assert set(actual) == set(expected_by_diag.get(did, [])), ('scenario/card diagnostic asymmetry', did, actual, expected_by_diag.get(did, []))

          reverse = eq['reverseIndex']
          reverse_diag = reverse['diagnosticScenarioId']
          expected_nonempty = {did: ids for did, ids in expected_by_diag.items() if ids}
          assert set(reverse_diag) == set(expected_nonempty), ('diagnostic reverse index keys', set(reverse_diag) ^ set(expected_nonempty))
          for did, ids in expected_nonempty.items():
              assert set(reverse_diag[did]) == set(ids), ('diagnostic reverse index', did)

          # Exact stale crosslink fingerprint expected at Beta44.
          expected_missing = {
              ('VL-EQ-HV-001','gv-no-open'),
              ('VL-EQ-HV-002','pantograph-slow-rise'),
              ('VL-EQ-HV-002','pantograph-wrong-selection'),
              ('VL-EQ-TR-001','ekg-position-mismatch'),
              ('VL-EQ-TR-001','ekg-slow-transition'),
              ('VL-EQ-TR-001','traction-one-section-low'),
              ('VL-EQ-TR-002','traction-intermittent'),
              ('VL-EQ-TR-002','traction-one-section-low'),
              ('VL-EQ-TR-003','rectifier-overheat'),
              ('VL-EQ-TR-003','traction-one-section-low'),
              ('VL-EQ-TR-004','transformer-oil-signs'),
              ('VL-EQ-AU-002','fan-vibration'),
              ('VL-EQ-AU-002','rectifier-overheat'),
              ('VL-EQ-AU-002','traction-motor-overheat'),
              ('VL-EQ-AU-003','compressor-overheat'),
              ('VL-EQ-SF-001','vigilance-control-fault'),
              ('VL-EQ-MC-001','sand-nozzle-blocked'),
              ('VL-EQ-MC-002','external-object-impact'),
              ('VL-EQ-PR-001','traction-motor-flashover'),
              ('VL-EQ-SF-002','vigilance-control-fault'),
              ('VL-EQ-PN-002','pantograph-slow-rise'),
              ('VL-EQ-TR-006','traction-motor-flashover'),
              ('VL-EQ-TR-006','traction-motor-overheat'),
              ('VL-EQ-TR-006','traction-one-section-low'),
              ('VL-EQ-TR-007','traction-gear-noise'),
              ('VL-EQ-FR-001','fire-loop-fault'),
              ('VL-EQ-FR-001','machine-room-smoke'),
              ('VL-EQ-HV-003','vvk-interlock-fault'),
              ('VL-EQ-BR-006','brake-rigging-damage'),
              ('VL-EQ-CT-003','intersection-command-loss'),
              ('VL-EQ-CT-003','traction-intermittent'),
              ('VL-EQ-FR-002','machine-room-smoke'),
              ('VL-EQ-AU-005','rectifier-overheat'),
              ('VL-EQ-CT-004','ekg-position-mismatch'),
              ('VL-EQ-CT-004','traction-intermittent'),
              ('VL-EQ-CT-005','intersection-command-loss'),
          }
          missing = set()
          extras = set()
          stale_cards = set()
          for card in records:
              canonical = set(card.get('diagnosticScenarioIds', []))
              linked = set(link_ids(card.get('crosslinks', {}).get('diagnostics', [])))
              for did in canonical - linked:
                  missing.add((card['id'], did)); stale_cards.add(card['id'])
              for did in linked - canonical:
                  extras.add((card['id'], did))
              assert linked <= all_diag, ('dangling diagnostic crosslink', card['id'], linked - all_diag)
          assert missing == expected_missing, ('unexpected stale crosslinks', missing ^ expected_missing)
          assert not extras, extras
          assert len(missing) == 36 and len(stale_cards) == 24

          # Scheme-node crosslinks already match card schemeNodeIds. Validate against
          # legacySchemeNodeIds in current electrical nodes, not against node object IDs.
          legacy_scheme_ids = set()
          for scheme in electrical.get('baseSchemes', []):
              for node in scheme.get('nodes', []):
                  legacy_scheme_ids.update(node.get('legacySchemeNodeIds', []))
                  equipment_id = node.get('equipmentId')
                  if equipment_id in by_id:
                      node_diags = set(node.get('diagnosticScenarioIds', []))
                      card_diags = set(by_id[equipment_id].get('diagnosticScenarioIds', []))
                      assert node_diags <= card_diags, ('scheme diagnostic not canonical on card', scheme.get('id'), node.get('id'), node_diags - card_diags)
          for card in records:
              scheme_ids = card.get('schemeNodeIds', [])
              assert set(link_ids(card.get('crosslinks', {}).get('schemeNodes', []))) == set(scheme_ids), ('scheme crosslink mismatch', card['id'])
              assert set(scheme_ids) <= legacy_scheme_ids, ('unknown legacy scheme node', card['id'], set(scheme_ids) - legacy_scheme_ids)

          # Article crosslinks and reverse index are already canonical. Existing
          # vl80-detail-* cards are dynamically generated from layout hotspots.
          reverse_article = reverse['articleId']
          expected_article = defaultdict(list)
          for card in records:
              hotspot_ids = list(card.get('legacyHotspotIds', [])) + [i.get('hotspotId') for i in card.get('instances', []) if i.get('hotspotId')]
              hotspot_ids = set(hotspot_ids)
              for article in card.get('crosslinks', {}).get('articles', []):
                  aid = article.get('id') if isinstance(article, dict) else article
                  if not aid:
                      continue
                  expected_article[aid].append(card['id'])
                  if isinstance(article, dict) and article.get('status') == 'existing':
                      assert aid.startswith('vl80-detail-'), (card['id'], aid)
                      assert aid.removeprefix('vl80-detail-') in hotspot_ids, (card['id'], aid, hotspot_ids)
          assert set(reverse_article) == set(expected_article), ('article reverse keys', set(reverse_article) ^ set(expected_article))
          for aid, ids in expected_article.items():
              assert set(reverse_article[aid]) == set(ids), ('article reverse index', aid)

          # Reverse scheme-node index must agree with card crosslinks.
          expected_scheme = defaultdict(list)
          for card in records:
              for sid in card.get('schemeNodeIds', []):
                  expected_scheme[sid].append(card['id'])
          reverse_scheme = reverse['schemeNodeId']
          assert set(reverse_scheme) == set(expected_scheme), ('scheme reverse keys', set(reverse_scheme) ^ set(expected_scheme))
          for sid, ids in expected_scheme.items():
              assert set(reverse_scheme[sid]) == set(ids), ('scheme reverse index', sid)

          # Validate all relation targets without normalizing relation type vocabulary.
          for card in records:
              seen_rel = set()
              for rel in card.get('relations', []):
                  target = rel.get('targetId')
                  assert target in all_eq, ('dangling relation', card['id'], target)
                  assert target != card['id'], ('self relation', card['id'], rel)
                  key = (rel.get('type'), rel.get('relationType'), target, rel.get('note'))
                  assert key not in seen_rel, ('duplicate relation', card['id'], key)
                  seen_rel.add(key)

          # Hotspot reverse index has only two known duplicate entries at Beta44.
          old_hotspot = reverse['hotspotId']
          duplicate_keys = {key for key, ids in old_hotspot.items() if len(ids) != len(set(ids))}
          assert duplicate_keys == {'bsa1', 'mv3'}, duplicate_keys

          expected_hotspot = defaultdict(list)
          for card in records:
              ids = list(card.get('legacyHotspotIds', []))
              ids += [item.get('hotspotId') for item in card.get('instances', []) if item.get('hotspotId')]
              for hid in ids:
                  if card['id'] not in expected_hotspot[hid]:
                      expected_hotspot[hid].append(card['id'])
          assert set(old_hotspot) == set(expected_hotspot), ('hotspot reverse keys', set(old_hotspot) ^ set(expected_hotspot))
          for hid, ids in expected_hotspot.items():
              assert set(old_hotspot[hid]) == set(ids), ('hotspot reverse membership', hid)

          # Apply only the two canonical-index repairs.
          for card in records:
              crosslinks = card.setdefault('crosslinks', {})
              crosslinks['diagnostics'] = [
                  {'id': did, 'status': 'existing'} for did in card.get('diagnosticScenarioIds', [])
              ]
          reverse['hotspotId'] = dict(expected_hotspot)

          # Post-repair canonical checks.
          for card in records:
              assert link_ids(card.get('crosslinks', {}).get('diagnostics', [])) == card.get('diagnosticScenarioIds', []), ('diagnostic crosslinks not canonical', card['id'])
          assert all(len(ids) == len(set(ids)) for ids in reverse['hotspotId'].values())

          # Only card crosslinks.diagnostics and reverseIndex.hotspotId may differ.
          def strip_allowed_card(card):
              c = copy.deepcopy(card)
              c.setdefault('crosslinks', {}).pop('diagnostics', None)
              return c
          old_records = {r['id']: r for r in before_eq['records']}
          for card in records:
              assert strip_allowed_card(card) == strip_allowed_card(old_records[card['id']]), ('unexpected card mutation', card['id'])

          old_top = copy.deepcopy(before_eq)
          new_top = copy.deepcopy(eq)
          old_top.pop('records'); new_top.pop('records')
          old_top['reverseIndex'].pop('hotspotId', None)
          new_top['reverseIndex'].pop('hotspotId', None)
          assert old_top == new_top, 'unexpected top-level equipment mutation'

          assert diag == before_diag
          assert electrical == before_el
          assert pneumatic == before_pn

          dump_gz(eq_path, eq)
          shutil.copy2(eq_path, 'patch/app/src/main/assets/technical/vl80s_equipment.json.gz')
          PY

          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('app/build.gradle.kts'), Path('patch/app/build.gradle.kts')]:
              s = p.read_text(encoding='utf-8')
              s = s.replace('versionCode = 189', 'versionCode = 190', 1)
              s = s.replace('versionName = "1.2.2-dev14-beta44"', 'versionName = "1.2.2-dev14-beta45"', 1)
              p.write_text(s, encoding='utf-8')
          PY

          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          cmp app/src/main/assets/technical/vl80s_diagnostics.json.gz patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz
          cmp app/src/main/assets/technical/vl80s_electrical.json.gz patch/app/src/main/assets/technical/vl80s_electrical.json.gz
          cmp app/src/main/assets/technical/vl80s_pneumatic.json.gz patch/app/src/main/assets/technical/vl80s_pneumatic.json.gz

          git diff --name-only HEAD | sort > /tmp/beta45-diff.txt
          cat > /tmp/beta45-expected.txt <<'EOF'
          app/build.gradle.kts
          app/src/main/assets/technical/vl80s_equipment.json.gz
          patch/app/build.gradle.kts
          patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          EOF
          sort -o /tmp/beta45-expected.txt /tmp/beta45-expected.txt
          diff -u /tmp/beta45-expected.txt /tmp/beta45-diff.txt

          grep -Fq 'versionCode = 190' app/build.gradle.kts
          grep -Fq 'versionName = "1.2.2-dev14-beta45"' app/build.gradle.kts

      - name: Commit Beta45 source with fresh branch guard
        shell: bash
        run: |
          set -euo pipefail
          workflow_head="$(git rev-parse HEAD)"
          git fetch origin dev14-integration
          test "$workflow_head" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta45 source commit'; exit 1; }
          git config user.name 'DomEnota-hub'
          git config user.email 'domenota6212@gmail.com'
          git add app/build.gradle.kts patch/app/build.gradle.kts \
                  app/src/main/assets/technical/vl80s_equipment.json.gz \
                  patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'Canonicalize VL80S equipment crosslinks'
          git push origin HEAD:dev14-integration
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Beta45 post-push SHA mismatch'; exit 1; }
