name: Audit Beta27 VL80S protection and power periphery

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/audit-beta27-protection-periphery.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Audit protection and power-periphery cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path

          root = Path('app/src/main/assets/technical')
          def load(name):
              with gzip.open(root / name, 'rt', encoding='utf-8') as f:
                  return json.load(f)

          eqroot = load('vl80s_equipment.json.gz')
          eq = eqroot.get('records', [])
          dg = load('vl80s_diagnostics.json.gz').get('scenarios', [])
          ac = load('vl80s_acceptance.json.gz').get('items', [])
          el = load('vl80s_electrical.json.gz')
          var = load('vl80s_variants.json.gz')

          keywords = [
              'дифференц', 'перегруз', 'заземл', 'реактор', 'опн',
              'ограничител', 'разрядник', 'крышев', 'шина', 'токоведущ',
              'реле рт', 'реле рз', 'защит'
          ]
          systems = {'VL-SYS-PR', 'VL-SYS-HV'}
          def text(obj):
              return json.dumps(obj, ensure_ascii=False).lower()

          def coverage(r):
              checks = {
                  'name': bool(r.get('name')),
                  'purpose': bool(r.get('purpose')),
                  'modelNames': bool(r.get('modelNames')),
                  'quantity': bool(r.get('quantity')),
                  'location': bool(r.get('location')),
                  'schemeDesignations': bool(r.get('schemeDesignations')),
                  'parameters': bool(r.get('parameters')),
                  'principle': bool(r.get('principle')),
                  'relations': bool(r.get('relations')),
                  'normalState': bool(r.get('normalState')),
                  'deviationSigns': bool(r.get('deviationSigns')),
                  'diagnosticScenarioIds': bool(r.get('diagnosticScenarioIds')),
                  'applicability': bool(r.get('applicability')),
                  'notes': bool(r.get('notes')),
                  'sourceRefs': bool(r.get('sourceRefs')),
              }
              score = sum(checks.values())
              return {'score': score, 'max': len(checks), 'fields': checks}

          all_pr_hv = []
          keyword_hits = []
          for r in eq:
              sys = set(r.get('systemIds') or [])
              row = {'id': r.get('id'), 'name': r.get('name'), 'coverage': coverage(r), 'record': r}
              if sys & systems:
                  all_pr_hv.append(row)
              if any(k in text(r) for k in keywords):
                  keyword_hits.append(row)

          selected_ids = {x['id'] for x in keyword_hits}
          related_diag = []
          for d in dg:
              refs = set(d.get('equipmentIds') or []) | set(d.get('equipmentRefs') or [])
              if refs & selected_ids or any(k in text(d) for k in keywords):
                  related_diag.append(d)

          related_acc = []
          for a in ac:
              refs = set(a.get('relatedEquipmentIds') or [])
              if a.get('equipmentId'):
                  refs.add(a.get('equipmentId'))
              if refs & selected_ids or any(k in text(a) for k in keywords):
                  related_acc.append(a)

          # Keep only compact electrical scheme references mentioning selected equipment.
          scheme_refs = []
          for s in el.get('baseSchemes', []):
              ids = set(s.get('equipmentIds') or [])
              ids |= {n.get('equipmentId') for n in (s.get('nodes') or []) if isinstance(n, dict) and n.get('equipmentId')}
              matched = sorted(ids & selected_ids)
              if matched:
                  scheme_refs.append({'id': s.get('id'), 'title': s.get('title') or s.get('name'), 'matchedEquipmentIds': matched})

          source_refs = sorted({src for x in keyword_hits for src in (x['record'].get('sourceRefs') or [])})
          out = {
              'headExpectedAtAudit': 'branch checkout',
              'equipmentCount': len(eq),
              'keywordHits': keyword_hits,
              'protectionAndHvSystemCards': all_pr_hv,
              'diagnostics': related_diag,
              'acceptance': related_acc,
              'electricalSchemeRefs': scheme_refs,
              'sourceRefs': source_refs,
              'variants': var,
          }
          Path('beta27-protection-periphery-audit.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps({
              'equipmentCount': len(eq),
              'keywordHits': [(x['id'], x['name'], x['coverage']['score']) for x in keyword_hits],
              'prHvCount': len(all_pr_hv),
              'diagnostics': len(related_diag),
              'acceptance': len(related_acc),
              'schemes': len(scheme_refs),
              'sourceRefs': source_refs,
          }, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: beta27-protection-periphery-audit
          path: beta27-protection-periphery-audit.json
          retention-days: 7
          if-no-files-found: error
