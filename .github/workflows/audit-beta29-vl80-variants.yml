name: Audit Beta29 VL80S variants

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/audit-beta29-vl80-variants.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Audit VL80S applicability and variant rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path

          root = Path('app/src/main/assets/technical')
          def load(name):
              with gzip.open(root/name, 'rt', encoding='utf-8') as f:
                  return json.load(f)

          eqroot = load('vl80s_equipment.json.gz')
          eq = eqroot.get('records', [])
          variants = load('vl80s_variants.json.gz')

          def walk_pending(obj, path=''):
              hits=[]
              if isinstance(obj, dict):
                  for k,v in obj.items():
                      p=f'{path}.{k}' if path else k
                      if 'pending' in k.lower() or (isinstance(v,str) and 'pending' in v.lower()):
                          hits.append((p,v))
                      hits.extend(walk_pending(v,p))
              elif isinstance(obj,list):
                  for i,v in enumerate(obj): hits.extend(walk_pending(v,f'{path}[{i}]'))
              return hits

          rows=[]
          for r in eq:
              pending=walk_pending(r)
              app=r.get('applicability')
              rules=r.get('featureRules') or []
              models=r.get('modelNames') or []
              notes=r.get('notes') or []
              risk=[]
              text=json.dumps(r,ensure_ascii=False).lower()
              if pending: risk.append('pending_marker')
              if rules: risk.append('feature_rules')
              if app: risk.append('applicability')
              if any(x in text for x in ['опытн', 'модерниз', 'до №', 'с №', 'серийн', 'исполнен', 'замен', 'вариант']): risk.append('variant_text')
              if risk:
                  rows.append({
                      'id':r.get('id'),'name':r.get('name'),'models':models,
                      'applicability':app,'featureRules':rules,'pending':pending,
                      'notes':notes,'sourceRefs':r.get('sourceRefs') or [],
                      'risk':risk,'record':r
                  })

          summary={
              'equipmentCount':len(eq),
              'flaggedCount':len(rows),
              'pendingCount':sum(bool(x['pending']) for x in rows),
              'featureRulesCount':sum(bool(x['featureRules']) for x in rows),
              'applicabilityCount':sum(bool(x['applicability']) for x in rows),
              'flagged':[(x['id'],x['name'],x['risk']) for x in rows],
          }
          out={'summary':summary,'variants':variants,'flaggedRecords':rows}
          Path('beta29-vl80-variants-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: beta29-vl80-variants-audit
          path: beta29-vl80-variants-audit.json
          retention-days: 7
          if-no-files-found: error
