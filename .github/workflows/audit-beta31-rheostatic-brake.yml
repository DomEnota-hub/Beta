name: Audit Beta31 VL80S rheostatic brake interface

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/audit-beta31-rheostatic-brake.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract Beta31 candidate context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, re
          from pathlib import Path

          root=Path('app/src/main/assets/technical')
          def load(path):
              with gzip.open(path,'rt',encoding='utf-8') as f:
                  return json.load(f)
          def txt(x): return json.dumps(x,ensure_ascii=False).lower()

          files={p.name:load(p) for p in root.glob('vl80s_*.json.gz')}
          eqroot=files['vl80s_equipment.json.gz']
          records=eqroot.get('records',[])
          terms=[
              'реостат','тормож','возбужден','пву','вуп','электроблокиров',
              'тяга-тормож','тяга / тормож','тяга тормож','датчик тока','ток якор',
              'тормозной ток','выпрямительная установка возбуждения','вув','возбуждение тэд'
          ]
          explicit={'VL-EQ-BR-013','VL-EQ-BR-014'}
          candidates=[]
          for r in records:
              t=txt(r)
              if r.get('id') in explicit or any(k in t for k in terms):
                  candidates.append(r)
          cand_ids={r.get('id') for r in candidates}

          # expand by direct equipment relations from candidates, but only keep likely braking/traction/control neighbors
          neigh=[]
          likely_terms=['тормоз','возбужден','резист','тягов','ток','переключ','контактор','реле','выпрям','пневмат']
          byid={r.get('id'):r for r in records}
          for r in candidates:
              for rel in r.get('relations') or []:
                  tid=rel.get('targetId') if isinstance(rel,dict) else None
                  rr=byid.get(tid)
                  if rr and any(k in txt(rr) for k in likely_terms):
                      neigh.append(rr)
          for rr in neigh:
              if rr.get('id') not in cand_ids:
                  candidates.append(rr); cand_ids.add(rr.get('id'))

          diagnostics=[]
          droot=files.get('vl80s_diagnostics.json.gz',{})
          for d in droot.get('scenarios',[]):
              refs=set(d.get('equipmentIds') or []) | set(d.get('equipmentRefs') or [])
              if refs & cand_ids or any(k in txt(d) for k in terms):
                  diagnostics.append(d)

          scheme_hits={}
          for name,obj in files.items():
              if 'scheme' not in name and 'electrical' not in name and 'pneumatic' not in name:
                  continue
              hits=[]
              def walk(v,path='$'):
                  if isinstance(v,dict):
                      vals=set()
                      for kk in ('equipmentId','equipmentIds','relatedEquipmentIds','targetId'):
                          vv=v.get(kk)
                          if isinstance(vv,str): vals.add(vv)
                          elif isinstance(vv,list): vals.update(x for x in vv if isinstance(x,str))
                      if vals & cand_ids or any(k in txt(v) for k in terms):
                          # compact high-level hit
                          hits.append({'path':path,'id':v.get('id'),'title':v.get('title') or v.get('name') or v.get('label'),'equipment':sorted(vals & cand_ids)})
                      for k,x in v.items(): walk(x,path+'.'+str(k))
                  elif isinstance(v,list):
                      for i,x in enumerate(v): walk(x,f'{path}[{i}]')
              walk(obj)
              # de-duplicate compact hits
              seen=set(); uniq=[]
              for h in hits:
                  key=(h['id'],h['title'],tuple(h['equipment']))
                  if key in seen: continue
                  seen.add(key); uniq.append(h)
              if uniq: scheme_hits[name]=uniq[:200]

          source_ids=sorted({s for r in candidates for s in (r.get('sourceRefs') or []) if isinstance(s,str)})
          source_context={}
          for name,obj in files.items():
              if any(s in txt(obj) for s in source_ids):
                  source_context[name]=[]
                  def walksrc(v,path='$'):
                      if isinstance(v,dict):
                          if any(s in txt(v) for s in source_ids):
                              if v.get('id') in source_ids or any(v.get(k) in source_ids for k in ('sourceId','sourceRef')):
                                  source_context[name].append({'path':path,'value':v})
                          for k,x in v.items(): walksrc(x,path+'.'+str(k))
                      elif isinstance(v,list):
                          for i,x in enumerate(v): walksrc(x,f'{path}[{i}]')
                  walksrc(obj)

          depth_fields=['purpose','modelNames','quantity','location','schemeDesignations','parameters','principle','relations','normalState','deviationSigns','diagnosticScenarioIds','applicability','notes','safetyNotes','sourceRefs']
          compact=[]
          for r in candidates:
              present=[]; missing=[]
              for k in depth_fields:
                  v=r.get(k)
                  ok=(isinstance(v,dict) and bool(v.get('text'))) if k=='location' else bool(v)
                  (present if ok else missing).append(k)
              compact.append({'id':r.get('id'),'name':r.get('name'),'score':len(present),'missing':missing,'record':r})
          compact.sort(key=lambda x:(x['score'],x['id'] or ''))

          out={
              'equipmentCount':len(records),
              'candidateCount':len(compact),
              'candidates':compact,
              'diagnostics':diagnostics,
              'schemeHits':scheme_hits,
              'sourceIds':source_ids,
              'sourceContext':source_context,
              'availableVl80Files':sorted(files),
          }
          Path('beta31-rheostatic-brake-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({
              'equipmentCount':len(records),
              'candidates':[(x['id'],x['name'],x['score']) for x in compact],
              'diagnostics':[(d.get('id'),d.get('title')) for d in diagnostics],
              'schemeFiles':list(scheme_hits),
              'sourceIds':source_ids,
              'files':sorted(files),
          },ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: beta31-rheostatic-brake-audit
          path: beta31-rheostatic-brake-audit.json
          retention-days: 7
          if-no-files-found: error
