name: Audit Beta33 VL80S control air

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/audit-beta33-control-air.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stale branch state
        shell: bash
        run: |
          set -euo pipefail
          expected="222f342f679f0978ae709a4e64d28711861918a8"
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$expected" || { echo "Expected workflow parent $expected, got $parent"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before audit'; exit 1; }

      - name: Audit selected equipment and cross-links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, re
          from pathlib import Path

          target_ids = {'VL-EQ-PN-007','VL-EQ-PN-013','VL-EQ-PN-015','VL-EQ-PN-016','VL-EQ-PN-002'}
          with gzip.open('app/src/main/assets/technical/vl80s_equipment.json.gz','rt',encoding='utf-8') as f:
              eq = json.load(f)
          records = eq['records']
          byid = {r['id']: r for r in records}
          print('=== TARGET CARDS ===')
          for eid in sorted(target_ids):
              print('\n###', eid)
              print(json.dumps(byid[eid], ensure_ascii=False, indent=2, sort_keys=True))

          print('\n=== INBOUND RELATIONS FROM ALL EQUIPMENT ===')
          for r in records:
              for rel in r.get('relations') or []:
                  if rel.get('targetId') in target_ids:
                      print(r['id'], r.get('name'), '=>', json.dumps(rel, ensure_ascii=False))

          print('\n=== NEARBY PNEUMATIC EQUIPMENT PN-* ===')
          for r in records:
              if r['id'].startswith('VL-EQ-PN-'):
                  print(r['id'], '|', r.get('name'), '| models=', r.get('modelNames'), '| schemes=', r.get('schemeNodeIds'), '| diag=', r.get('diagnosticScenarioIds'))

          terms = [
              'вспомогательн', 'цепей управления', 'аппаратов управления',
              'токоприемник', '№245', '245', 'фильтр сжатого воздуха',
              'резервуар цепей', 'вспомогательный компрессор'
          ]
          print('\n=== MATCHES IN TECHNICAL GZIP DATASETS ===')
          for p in sorted(Path('app/src/main/assets/technical').glob('vl80s_*.json.gz')):
              try:
                  with gzip.open(p,'rt',encoding='utf-8') as f:
                      data=json.load(f)
              except Exception:
                  continue
              text=json.dumps(data,ensure_ascii=False)
              if not any(t.lower() in text.lower() for t in terms):
                  continue
              def walk(obj, path=''):
                  if isinstance(obj, dict):
                      blob=json.dumps(obj,ensure_ascii=False)
                      if any(t.lower() in blob.lower() for t in terms) and len(blob) < 12000:
                          ident=obj.get('id') or obj.get('nodeId') or obj.get('title') or obj.get('name')
                          if ident:
                              print(f'[{p.name}] {path} :: {ident}')
                              print(json.dumps(obj,ensure_ascii=False,indent=2)[:8000])
                              print('---')
                              return
                      for k,v in obj.items():
                          walk(v, f'{path}/{k}')
                  elif isinstance(obj, list):
                      for i,v in enumerate(obj):
                          walk(v, f'{path}[{i}]')
              walk(data)
          PY

      - name: Search repository text for control-air references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== TEXT REFERENCES ==='
          git grep -n -I -E 'вспомогательн(ый|ого|ому|ым)? компресс|резервуар.*цеп.*управ|магистрал.*аппарат.*управ|клапан.*245|№245|фильтр.*сжат.*воздух|пневматик.*токопри' -- ':!*.gz' ':!*.zip' ':!*.apk' || true
