name: Audit VL80S first equipment batch

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/audit-vl80-first-batch.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dump first-batch VL80S records and catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path

          root = Path('app/src/main/assets/technical')
          def load(name):
              with gzip.open(root / name, 'rt', encoding='utf-8') as f:
                  return json.load(f)

          eqroot = load('vl80s_equipment.json.gz')
          eq = eqroot.get('records', [])
          dg = load('vl80s_diagnostics.json.gz').get('scenarios', [])
          el = load('vl80s_electrical.json.gz').get('baseSchemes', [])
          pn = load('vl80s_pneumatic.json.gz').get('views', [])

          needles = [
              'тифон', 'свист', 'индуктив', 'трансформатор тока',
              'помехоподав', 'сборник конденсат', 'скоростемер'
          ]
          selected = [r for r in eq if any(n in json.dumps(r, ensure_ascii=False).lower() for n in needles)]
          ids = {r.get('id') for r in selected if r.get('id')}
          diag_ids = {x for r in selected for x in (r.get('diagnosticScenarioIds', []) or [])}

          related_diag = []
          for r in dg:
              refs = set(r.get('equipmentIds', []) or []) | set(r.get('equipmentRefs', []) or [])
              if refs & ids or r.get('id') in diag_ids:
                  related_diag.append(r)

          related_schemes = []
          for r in el + pn:
              refs = set(r.get('equipmentIds', []) or [])
              for n in r.get('nodes', []) or []:
                  if isinstance(n, dict) and n.get('equipmentId'):
                      refs.add(n['equipmentId'])
              if refs & ids:
                  related_schemes.append(r)

          root_meta = {k:v for k,v in eqroot.items() if k != 'records'}
          catalog = [
              {
                  'id': r.get('id'), 'name': r.get('name'), 'aliases': r.get('aliases', []),
                  'systemIds': r.get('systemIds', []), 'diagnosticScenarioIds': r.get('diagnosticScenarioIds', [])
              }
              for r in eq
          ]
          out = {
              'rootMeta': root_meta,
              'catalog': catalog,
              'equipment': selected,
              'diagnostics': related_diag,
              'schemes': related_schemes,
              'selectedIds': sorted(ids),
          }
          Path('vl80-first-batch-audit.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({'rootKeys':list(eqroot.keys()), 'count':len(eq), 'selectedIds':sorted(ids)}, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vl80-first-batch-audit
          path: vl80-first-batch-audit.json
