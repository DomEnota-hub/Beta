name: Beta hotfix3 experiment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/beta-hotfix3.yml
      - tools/apply_beta_patch.py
      - BETA_USE_RESTRICTION.txt
      - README.md

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      UPSTREAM_SHA: ac5607f8d7a9c359f91da0eede309b2983ad18cf
      EXPECTED_SIGNING_CERT_SHA256: ea9fe9341a6ba72b585bd7ff82ce29c8fc5b7b59e76b8b134df203eaab8e2788
      RELEASE_KEYSTORE_B64: ${{ secrets.RAILBRAKE_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout Beta controls
        uses: actions/checkout@v4
        with:
          path: beta

      - name: Checkout exact hotfix3
        uses: actions/checkout@v4
        with:
          repository: DomEnota-hub/Test-
          ref: ${{ env.UPSTREAM_SHA }}
          path: source
          fetch-depth: 0

      - name: Apply Beta patch
        shell: bash
        run: |
          set -euo pipefail
          python3 beta/tools/apply_beta_patch.py source
          cp beta/BETA_USE_RESTRICTION.txt source/BETA_USE_RESTRICTION.txt
          mkdir -p source/tools source/.github/workflows
          cp beta/tools/apply_beta_patch.py source/tools/apply_beta_patch.py
          cp beta/.github/workflows/beta-hotfix3.yml source/.github/workflows/beta-hotfix3.yml
          printf '%s\n' '# RailBrakeCalculator Beta baseline' '' "Upstream: DomEnota-hub/Test- @ $UPSTREAM_SHA" 'Beta: 1.2.2-dev14-beta1 / versionCode 146' '' 'Experimental use only; see BETA_USE_RESTRICTION.txt.' > source/BETA_BASELINE.md

      - name: Verify source patch
        shell: bash
        run: |
          set -euo pipefail
          cmp source/app/build.gradle.kts source/patch/app/build.gradle.kts
          grep -Fq 'versionCode = 146' source/app/build.gradle.kts
          grep -Fq 'versionName = "1.2.2-dev14-beta1"' source/app/build.gradle.kts
          ! grep -Fq 'диагностических сценария •' source/app/src/main/java/ru/railbrake/calculator/ui/HomeScreen.kt
          ! grep -Fq 'Text("Тренажёр")' source/app/src/main/java/ru/railbrake/calculator/ui/DiagnosticScreen.kt
          grep -Fq 'Поиск по быстрому маршруту' source/app/src/main/java/ru/railbrake/calculator/ui/DiagnosticScreen.kt
          grep -Fq 'internal fun SafetyNotice()' source/app/src/main/java/ru/railbrake/calculator/ui/DiagnosticScreen.kt
          grep -Fq 'formatExamCorrectAnswer' source/app/src/main/java/ru/railbrake/calculator/ui/ExamQuestionScreen.kt
          ! grep -Fq 'Внешние первоисточники открываются в браузере.' source/app/src/main/java/ru/railbrake/calculator/ui/KnowledgeBaseScreen.kt
          grep -Fq '!examQuestionsUnlocked' source/app/src/main/java/ru/railbrake/calculator/ui/KnowledgeBaseScreen.kt
          for f in HomeScreen.kt DiagnosticScreen.kt ErmakDiagnosticsScreen.kt ExamQuestionScreen.kt KnowledgeBaseScreen.kt; do
            cmp "source/app/src/main/java/ru/railbrake/calculator/ui/$f" "source/patch/app/src/main/java/ru/railbrake/calculator/ui/$f"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare build tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q source/RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a source/patch/. buildsrc/RailBrakeCalculator/
          python3 source/qa/verify_runtime_asset_paths.py buildsrc/RailBrakeCalculator/app/src/main/java buildsrc/RailBrakeCalculator/app/src/main/assets | tee runtime-assets-overlay.log

      - name: Unit tests
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unit-tests.log

      - name: Android lint
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain 2>&1 | tee lint.log

      - name: Build debug APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build-debug.log

      - name: Verify debug runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk
          python3 source/qa/verify_technical_assets_in_apk.py "$APK" | tee technical-assets-debug.log
          python3 source/qa/verify_runtime_asset_paths.py buildsrc/RailBrakeCalculator/app/src/main/java buildsrc/RailBrakeCalculator/app/src/main/assets "$APK" | tee runtime-assets-debug.log

      - name: Android runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 1536
          script: |
            export APK="$GITHUB_WORKSPACE/buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk"
            export QA_OUT="$GITHUB_WORKSPACE/qa-evidence"
            python3 source/qa/dev14_android_smoke.py

      - name: Decode release signing key
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build signed release APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        env:
          RAILBRAKE_KEYSTORE_PATH: ${{ github.workspace }}/buildsrc/RailBrakeCalculator/release.keystore
          RAILBRAKE_STORE_PASSWORD: ${{ secrets.RAILBRAKE_STORE_PASSWORD }}
          RAILBRAKE_KEY_ALIAS: ${{ secrets.RAILBRAKE_KEY_ALIAS }}
          RAILBRAKE_KEY_PASSWORD: ${{ secrets.RAILBRAKE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RAILBRAKE_STORE_PASSWORD"
          test -n "$RAILBRAKE_KEY_ALIAS"
          test -n "$RAILBRAKE_KEY_PASSWORD"
          timeout --signal=TERM 15m gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee build-release.log

      - name: Verify signed release
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/RailBrakeCalculator/app/build/outputs/apk/release/app-release.apk
          mkdir -p final-package
          cp "$APK" final-package/RailBrakeCalculator-1.2.2-dev14-beta1-release-signed.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" | tee final-package/APK_BADGING.txt
          grep -Fq "package: name='ru.railbrake.calculator' versionCode='146' versionName='1.2.2-dev14-beta1'" final-package/APK_BADGING.txt
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee final-package/APKSIGNER.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNING_CERT_SHA256" final-package/APKSIGNER.txt
          python3 source/qa/verify_technical_assets_in_apk.py "$APK" | tee final-package/TECHNICAL_ASSETS.txt
          python3 source/qa/verify_runtime_asset_paths.py buildsrc/RailBrakeCalculator/app/src/main/java buildsrc/RailBrakeCalculator/app/src/main/assets "$APK" | tee final-package/RUNTIME_ASSETS.txt
          sha256sum final-package/RailBrakeCalculator-1.2.2-dev14-beta1-release-signed.apk | tee final-package/SHA256SUMS.txt
          cd source
          zip -qr "$GITHUB_WORKSPACE/final-package/RailBrakeCalculator-1.2.2-dev14-beta1-source.zip" . -x '.git/*' '*/build/*' '.gradle/*' '*.keystore'
          cd "$GITHUB_WORKSPACE"
          sha256sum final-package/RailBrakeCalculator-1.2.2-dev14-beta1-source.zip >> final-package/SHA256SUMS.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-1.2.2-dev14-beta1-release-signed
          path: final-package/RailBrakeCalculator-1.2.2-dev14-beta1-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-1.2.2-dev14-beta1-source
          path: final-package/RailBrakeCalculator-1.2.2-dev14-beta1-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta1-verification
          path: |
            qa-evidence/
            runtime-assets-overlay.log
            runtime-assets-debug.log
            technical-assets-debug.log
            final-package/
            buildsrc/RailBrakeCalculator/unit-tests.log
            buildsrc/RailBrakeCalculator/lint.log
            buildsrc/RailBrakeCalculator/build-debug.log
            buildsrc/RailBrakeCalculator/build-release.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish patched source to Beta main
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Beta1: apply Work fixes on hotfix3'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:main
