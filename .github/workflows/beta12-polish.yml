name: Beta12 polish

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/scripts/apply_beta12_polish.py
      - .github/workflows/beta12-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev14-integration
      - name: Apply Beta12 polish
        run: python3 .github/scripts/apply_beta12_polish.py
      - name: Verify mirrors
        run: |
          cmp app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/theme/Theme.kt patch/app/src/main/java/ru/railbrake/calculator/ui/theme/Theme.kt
          cmp app/src/main/java/ru/railbrake/calculator/core/TechnicalPresentation.kt patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalPresentation.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt patch/app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          cmp app/build.gradle.kts patch/app/build.gradle.kts
      - name: Commit Beta12
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app patch
          git diff --cached --quiet && exit 0
          git commit -m 'Beta12: polish search palette acceptance and calculator inputs'
          git push origin HEAD:dev14-integration
