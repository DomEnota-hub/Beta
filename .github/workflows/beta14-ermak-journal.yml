name: Beta14 Ermak journal

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/scripts/apply_beta14_ermak_journal.py
      - .github/workflows/beta14-ermak-journal.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev14-integration
      - name: Apply Beta14 Ermak journal patch
        run: python3 .github/scripts/apply_beta14_ermak_journal.py
      - name: Verify mirrors
        run: |
          cmp app/src/main/java/ru/railbrake/calculator/data/DiagnosticSessionRepository.kt patch/app/src/main/java/ru/railbrake/calculator/data/DiagnosticSessionRepository.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/DiagnosticScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/DiagnosticScreen.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/ErmakDiagnosticsScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/ErmakDiagnosticsScreen.kt
          cmp app/build.gradle.kts patch/app/build.gradle.kts
      - name: Commit Beta14
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app patch
          git diff --cached --quiet && exit 0
          git commit -m 'Beta14: persist and scope Ermak diagnostic journal'
          git push origin HEAD:dev14-integration
