name: Beta34 pressure-control enrichment

on:
  push:
    branches: [dev14-integration]
    paths:
      - .github/workflows/beta34-pressure-enrich.yml

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev14-integration
      - name: Guard fresh head
        shell: bash
        run: |
          set -euo pipefail
          expected_parent="d44d1328fd654ca0efcecfa8e7d8aca5e4346bee"
          test "$(git rev-parse HEAD^)" = "$expected_parent" || { echo "Unexpected workflow parent: $(git rev-parse HEAD^)"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta34 enrichment'; exit 1; }
      - name: Enrich pressure-indication cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, gzip, json, shutil
          from pathlib import Path

          app_asset = Path('app/src/main/assets/technical/vl80s_equipment.json.gz')
          patch_asset = Path('patch/app/src/main/assets/technical/vl80s_equipment.json.gz')
          assert app_asset.read_bytes() == patch_asset.read_bytes(), 'app/patch equipment assets diverged before Beta34'

          def load(path):
              with gzip.open(path, 'rt', encoding='utf-8') as f:
                  return json.load(f)

          root = load(app_asset)
          records = root['records']
          assert len(records) == 89, len(records)
          before = {r['id']: copy.deepcopy(r) for r in records}
          ids_before = [r['id'] for r in records]
          by_id = {r['id']: r for r in records}
          assert len(by_id) == 89

          gauge = by_id['VL-EQ-CB-001']
          lines = by_id['VL-EQ-PN-006']

          expected_gauge_diags = [
              'pressure-gauge-mismatch',
              'equalizing-reservoir-mismatch',
              'brake-cylinder-imbalance',
              'compressor-pressure',
              'brakes-no-apply-release',
          ]
          expected_line_diags = [
              'pneumatic-instrument-line-leak',
              'pressure-gauge-mismatch',
              'equalizing-reservoir-mismatch',
          ]
          assert gauge['diagnosticScenarioIds'] == expected_gauge_diags
          assert lines['diagnosticScenarioIds'] == expected_line_diags
          assert gauge.get('schemeNodeIds', []) == []
          assert lines.get('schemeNodeIds', []) == []

          gauge['quantity'] = '4 основных кабинных манометра в базовой компоновке панели ВЛ80С; фактическую компоновку после модернизаций сверяют по документации секции.'
          gauge['location'] = {
              'text': 'На панели контрольно-измерительных приборов поста машиниста в кабине; точная компоновка после ремонтов и модернизаций определяется фактическим исполнением секции.',
              'confidence': 'source_confirmed',
          }
          gauge['schemeDesignations'] = [
              'М1 — давление тормозных цилиндров',
              'М2 — давление главных резервуаров / питательной системы',
              'М3 — давление тормозной магистрали',
              'М4 — давление уравнительного резервуара',
          ]
          gauge['principle'] = (
              'Давление из контролируемой пневматической точки поступает к соответствующему кабинному прибору по отдельной приборной линии. '
              'Чувствительный механизм манометра преобразует изменение давления в перемещение стрелки. '
              'Манометр только отображает давление: он не создаёт, не регулирует и не ограничивает его в пневматической системе.'
          )
          gauge['normalState'] = [
              'Показание изменяется вслед за состоянием контролируемой пневматической цепи без ненормальной задержки.',
              'Стрелка перемещается плавно, без заедания; при устойчивом давлении показание остаётся стабильным.',
              'Показания ТМ, УР, ТЦ и запаса воздуха не противоречат фактическому режиму работы соответствующих пневматических цепей.',
          ]
          gauge['deviationSigns'] = [
              'Стрелка не реагирует на очевидное изменение состояния контролируемой пневматической цепи либо реагирует с выраженной задержкой.',
              'Показание скачкообразно, нестабильно, зависает или медленно возвращается после изменения давления.',
              'Один прибор показывает значение, которое противоречит согласованным признакам работы соответствующей системы или связанным показаниям.',
              'Нулевое или заниженное показание наблюдается при других признаках наличия давления; требуется разграничить реальное состояние системы, приборную линию и сам манометр.',
          ]
          gauge['relations'] = [
              {
                  'type': 'monitors_pressure_of',
                  'targetId': 'VL-EQ-BR-003',
                  'note': 'М3 отображает давление тормозной магистрали через соответствующую приборную линию; ошибочное показание само по себе не доказывает неисправность ТМ.',
              },
              {
                  'type': 'monitors_pressure_of',
                  'targetId': 'VL-EQ-BR-004',
                  'note': 'М1 используется для контроля давления тормозных цилиндров; расхождение следует отделять от неисправности линии отбора или самого прибора.',
              },
              {
                  'type': 'monitors_pressure_of',
                  'targetId': 'VL-EQ-BR-007',
                  'note': 'М4 отображает давление уравнительного резервуара; при расхождении УР и ТМ учитывают исправность обоих измерительных трактов.',
              },
              {
                  'type': 'monitors_pressure_of',
                  'targetId': 'VL-EQ-PN-001',
                  'note': 'М2 контролирует запас давления главных резервуаров / питательной системы в базовой компоновке; фактическую точку отбора сверяют по пневмосхеме секции.',
              },
              {
                  'type': 'measured_via',
                  'targetId': 'VL-EQ-PN-006',
                  'note': 'достоверность показания зависит не только от манометра, но и от герметичности и проходимости его приборной линии',
              },
          ]
          gauge['notes'] = [
              'Неверное показание не является достаточным доказательством неисправности самого манометра: последовательно разграничивают реальное давление в системе, состояние приборной линии и состояние прибора.',
              'Для базовой панели ВЛ80С подтверждено назначение М1–М4. Точную модель прибора, предел шкалы и послеремонтную компоновку не следует переносить между исполнениями без документации конкретной секции.',
          ]

          lines['location'] = {
              'text': 'От точек отбора давления соответствующих пневматических цепей к манометрам на посту машиниста; фактическую трассировку трубок сверяют по схеме конкретной секции.',
              'confidence': 'confirmed_general',
          }
          lines['principle'] = (
              'Приборная линия передаёт фактическое давление от точки отбора к чувствительному механизму манометра. '
              'Она служит только измерительным трактом и не формирует команду торможения, не регулирует давление и не является управляющей пневматической магистралью.'
          )
          lines['normalState'] = [
              'Линия герметична и свободно передаёт изменение давления от точки отбора к прибору.',
              'Нет перекрытия, пережатия или засорения, вызывающего заметную ненормальную задержку показания.',
              'При устойчивом давлении линия не вызывает самопроизвольного падения или колебания показания манометра.',
          ]
          lines['deviationSigns'] = [
              'Утечка приборной линии может проявляться заниженным, нестабильным или медленно изменяющимся показанием; влияние на общий расход воздуха зависит от места и величины утечки.',
              'Засорение, ограничение прохода или пережатие может вызывать задержку реакции, «зависшее» показание или медленный возврат стрелки.',
              'Повреждение линии нарушает передачу давления от точки отбора к прибору и может имитировать неисправность самого манометра или контролируемой системы.',
          ]
          lines['relations'] = [
              {
                  'type': 'receives_pressure_from',
                  'targetId': 'VL-EQ-BR-003',
                  'note': 'передаёт давление от точки отбора тормозной магистрали к соответствующему кабинному манометру',
              },
              {
                  'type': 'receives_pressure_from',
                  'targetId': 'VL-EQ-BR-004',
                  'note': 'передаёт давление ветви тормозных цилиндров к прибору контроля ТЦ',
              },
              {
                  'type': 'receives_pressure_from',
                  'targetId': 'VL-EQ-BR-007',
                  'note': 'передаёт давление уравнительного резервуара к его кабинному манометру',
              },
              {
                  'type': 'receives_pressure_from',
                  'targetId': 'VL-EQ-PN-001',
                  'note': 'передаёт давление запаса главных резервуаров / питательной системы к прибору контроля; точку отбора определяют по фактической пневмосхеме',
              },
              {
                  'type': 'transmits_pressure_to',
                  'targetId': 'VL-EQ-CB-001',
                  'note': 'состояние линии непосредственно влияет на достоверность и динамику показания соответствующего манометра',
              },
          ]
          lines['notes'] = [
              'Импульсную линию манометра нельзя путать с импульсной магистралью тормоза: первая является измерительным трактом к прибору, вторая передаёт управляющее давление в тормозной системе.',
              'При противоречивом показании сначала проверяют, соответствует ли оно реальному состоянию пневмосистемы, затем учитывают состояние приборной линии и только после этого сам манометр.',
              'Точную физическую трассировку трубок и послеремонтные изменения определяют по пневмосхеме и документации конкретной секции.',
          ]

          # Do not invent exact gauge model names or numerical scale limits without a section-applicable source.
          gauge.pop('modelNames', None)
          gauge.pop('parameters', None)
          lines.pop('modelNames', None)
          lines.pop('parameters', None)

          ids_after = [r['id'] for r in records]
          assert ids_after == ids_before
          changed = [rid for rid in ids_before if by_id[rid] != before[rid]]
          assert changed == ['VL-EQ-CB-001', 'VL-EQ-PN-006'], changed
          assert gauge['diagnosticScenarioIds'] == expected_gauge_diags
          assert lines['diagnosticScenarioIds'] == expected_line_diags
          assert gauge.get('schemeNodeIds', []) == []
          assert lines.get('schemeNodeIds', []) == []

          valid_ids = set(ids_before)
          for rec in (gauge, lines):
              for rel in rec['relations']:
                  assert rel['targetId'] in valid_ids, rel
                  assert rel.get('note','').strip(), rel
                  assert rel.get('type') != 'functional_link', rel
              user_text = json.dumps({
                  'quantity': rec.get('quantity'),
                  'location': rec.get('location'),
                  'schemeDesignations': rec.get('schemeDesignations'),
                  'principle': rec.get('principle'),
                  'normalState': rec.get('normalState'),
                  'deviationSigns': rec.get('deviationSigns'),
                  'notes': rec.get('notes'),
                  'relations': [r.get('note') for r in rec.get('relations',[])],
              }, ensure_ascii=False)
              assert 'VL-EQ-' not in user_text

          with gzip.open(app_asset, 'wt', encoding='utf-8', newline='') as f:
              json.dump(root, f, ensure_ascii=False, separators=(',', ':'))
          shutil.copyfile(app_asset, patch_asset)
          assert load(app_asset)['records'] == load(patch_asset)['records']
          assert app_asset.read_bytes() == patch_asset.read_bytes()

          for path in (Path('app/build.gradle.kts'), Path('patch/app/build.gradle.kts')):
              text = path.read_text(encoding='utf-8')
              assert text.count('versionCode = 178') == 1, path
              assert text.count('versionName = "1.2.2-dev14-beta33"') == 1, path
              text = text.replace('versionCode = 178', 'versionCode = 179')
              text = text.replace('versionName = "1.2.2-dev14-beta33"', 'versionName = "1.2.2-dev14-beta34"')
              path.write_text(text, encoding='utf-8')

          assert Path('app/build.gradle.kts').read_text(encoding='utf-8') == Path('patch/app/build.gradle.kts').read_text(encoding='utf-8')
          print('Beta34 records changed:', changed)
          print('records:', len(records))
          print('version: 179 / 1.2.2-dev14-beta34')
          PY

          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' app/build.gradle.kts app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/build.gradle.kts patch/app/src/main/assets/technical/vl80s_equipment.json.gz | sort)"
      - name: Commit source patch safely
        shell: bash
        run: |
          set -euo pipefail
          start_head="$(git rev-parse HEAD)"
          git fetch origin dev14-integration
          test "$start_head" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta34 source write'; exit 1; }
          git config user.name 'DomEnota-hub'
          git config user.email 'domenota6212@gmail.com'
          git add app/build.gradle.kts patch/app/build.gradle.kts \
            app/src/main/assets/technical/vl80s_equipment.json.gz \
            patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' app/build.gradle.kts app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/build.gradle.kts patch/app/src/main/assets/technical/vl80s_equipment.json.gz | sort)"
          git commit -m 'Enrich VL80S pressure indication cards'
          git push origin HEAD:dev14-integration
