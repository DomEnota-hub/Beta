name: Beta34 pressure-control inspect

on:
  push:
    branches: [dev14-integration]
    paths:
      - .github/workflows/beta34-pressure-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev14-integration
      - name: Guard fresh head
        shell: bash
        run: |
          set -euo pipefail
          expected_parent="74aee2d6fd0f306bf3bbee0c7a1f735d9d8ed3dc"
          test "$(git rev-parse HEAD^)" = "$expected_parent" || { echo "Unexpected workflow parent"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo "Branch moved before inspection"; exit 1; }
      - name: Inspect exact cards and pressure references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, pathlib, re

          def load(path):
              with gzip.open(path, 'rt', encoding='utf-8') as f:
                  return json.load(f)

          eq = load('app/src/main/assets/technical/vl80s_equipment.json.gz')
          print('ROOT_KEYS', list(eq.keys()))
          for rid in ('VL-EQ-CB-001','VL-EQ-PN-006'):
              rec = next(r for r in eq['records'] if r['id'] == rid)
              print('\n===', rid, '===')
              print(json.dumps(rec, ensure_ascii=False, indent=2))

          wanted = {'VL-SRC-001','VL-SRC-004','VL-SRC-006','VL-SRC-014'}
          print('\n=== SOURCE METADATA ===')
          def walk(o, path='root'):
              if isinstance(o, dict):
                  if o.get('id') in wanted:
                      print(path, json.dumps(o, ensure_ascii=False, indent=2))
                  for k,v in o.items(): walk(v, f'{path}.{k}')
              elif isinstance(o, list):
                  for i,v in enumerate(o): walk(v, f'{path}[{i}]')
          walk(eq)

          pn = load('app/src/main/assets/technical/vl80s_pneumatic.json.gz')
          print('\n=== PNEUMATIC MATCHES ===')
          terms = ('манометр','монометр','давлен','тм','ур','тц','гр','пм')
          for item in pn.get('records', pn if isinstance(pn,list) else []):
              blob = json.dumps(item, ensure_ascii=False).lower()
              if any(t in blob for t in terms):
                  print(json.dumps(item, ensure_ascii=False, indent=2))

          print('\n=== REPO TEXT MATCHES ===')
          patterns = re.compile(r'манометр|pressure-gauge-mismatch|pneumatic-instrument-line-leak|equalizing-reservoir-mismatch', re.I)
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix in {'.gz','.apk','.zip','.webp'}: continue
              try: text=p.read_text(encoding='utf-8')
              except Exception: continue
              hits=[(i+1,l.strip()) for i,l in enumerate(text.splitlines()) if patterns.search(l)]
              if hits:
                  print('\n--', p)
                  for i,l in hits[:80]: print(f'{i}: {l}')
          PY
