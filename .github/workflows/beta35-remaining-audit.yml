name: Beta35 remaining-card audit

on:
  push:
    branches: [dev14-integration]
    paths:
      - .github/workflows/beta35-remaining-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Beta35 control-circuit candidate group
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,json
          def load(name):
              with gzip.open(f'app/src/main/assets/technical/{name}.json.gz','rt',encoding='utf-8') as f:
                  return json.load(f)
          eq=load('vl80s_equipment')
          recs=eq['records']
          assert len(recs)==89
          print('CT_CARDS')
          ct=[r for r in recs if r.get('id','').startswith('VL-EQ-CT-')]
          for r in ct:
              keep={k:r.get(k) for k in ['id','name','purpose','modelNames','quantity','location','schemeDesignations','parameters','principle','relations','normalState','deviationSigns','diagnosticScenarioIds','schemeNodeIds','applicability','featureRules','notes','sourceRefs','legacyConnections']}
              print(json.dumps(keep,ensure_ascii=False))
          print('CT_COUNT',len(ct))
          print('\nROOT_KEYS',list(eq.keys()))
          for key in ['sources','sourceCatalog','references']:
              if key in eq:
                  print('\n'+key.upper())
                  print(json.dumps(eq[key],ensure_ascii=False))
          el=load('vl80s_electrical')
          print('\nELECTRICAL_MATCHES')
          terms=['50 В','50В','аккумуля','контроллер','релейн','цепей управления','автоматическ','заряд']
          for s in el.get('baseSchemes',[]):
              txt=json.dumps(s,ensure_ascii=False).lower()
              if any(t.lower() in txt for t in terms):
                  print(json.dumps(s,ensure_ascii=False))
          dg=load('vl80s_diagnostics')
          print('\nDIAGNOSTIC_MATCHES')
          wanted=set(x for r in ct for x in r.get('diagnosticScenarioIds',[]))
          def walk(v):
              if isinstance(v,dict):
                  if v.get('id') in wanted: print(json.dumps(v,ensure_ascii=False))
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(dg)
          PY
