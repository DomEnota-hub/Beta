name: Beta37 traction audit

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/beta37-traction-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev14-integration

      - name: Guard audit base
        shell: bash
        run: |
          set -euo pipefail
          expected="470c005762de556f98066f9701e772ada843a9ff"
          test "$(git rev-parse HEAD^)" = "$expected" || { echo "Unexpected audit parent: $(git rev-parse HEAD^)"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta37 audit'; exit 1; }

      - name: Audit traction cards, schemes and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json
          from collections import defaultdict
          from pathlib import Path

          def load(name):
              with gzip.open(Path('app/src/main/assets/technical')/name, 'rt', encoding='utf-8') as f:
                  return json.load(f)

          eq = load('vl80s_equipment.json.gz')
          records = eq['records']
          assert len(records) == 89
          fields=['modelNames','quantity','location','schemeDesignations','parameters','principle','relations','normalState','deviationSigns','diagnosticScenarioIds','schemeNodeIds','applicability','featureRules','notes','sourceRefs']
          depth=lambda r: sum(bool(r.get(k)) for k in fields)
          trs=[r for r in records if r['id'].startswith('VL-EQ-TR-')]
          print('TR_COUNT',len(trs))
          print('TR_WEAK_LE7',sum(depth(r)<=7 for r in trs))
          for r in sorted(trs,key=lambda x:x['id']):
              print('\nCARD',r['id'],'DEPTH',depth(r))
              print(json.dumps(r,ensure_ascii=False,indent=2))

          ids={r['id'] for r in trs}
          incoming=defaultdict(list)
          for r in records:
              for rel in r.get('relations') or []:
                  if rel.get('targetId') in ids:
                      incoming[rel['targetId']].append({'from':r['id'],'type':rel.get('type'),'note':rel.get('note')})
          print('\n=== INCOMING ===')
          for tid in sorted(ids):
              if incoming[tid]: print(tid,json.dumps(incoming[tid],ensure_ascii=False,indent=2))

          el=load('vl80s_electrical.json.gz')
          print('\n=== ELECTRICAL SCHEMES touching TR ids/names ===')
          etext=json.dumps(el,ensure_ascii=False)
          for s in el.get('baseSchemes',[]):
              blob=json.dumps(s,ensure_ascii=False)
              if any(x in blob for x in ['ЭКГ','выпрям','трансформ','ТЭД','тягов','реостат','БСА','резистор']):
                  print(json.dumps({k:s.get(k) for k in ['id','title','scopeNote','sourceRefs']},ensure_ascii=False,indent=2))
                  print('NODES',json.dumps(s.get('nodes',[]),ensure_ascii=False)[:6000])
          for key in ['modeOverlays','variantOverlays','candidateVariantFragments']:
              for s in el.get(key,[]):
                  blob=json.dumps(s,ensure_ascii=False)
                  if any(x in blob for x in ['ЭКГ','выпрям','трансформ','ТЭД','тягов','реостат','БСА','резистор']):
                      print(key,json.dumps(s,ensure_ascii=False)[:6000])

          dg=load('vl80s_diagnostics.json.gz')
          print('\n=== DIAGNOSTIC TITLES relevant traction ===')
          for s in dg.get('scenarios',[]):
              blob=json.dumps(s,ensure_ascii=False).lower()
              if any(x in blob for x in ['экг','тягов','тэд','выпрям','трансформ','реостат','буксован','ток двигателя','позици']):
                  print(s.get('id'),':',s.get('title'))

          print('\n=== SOURCE REGISTRY ===')
          print(json.dumps(eq.get('sourceRegistry',{}),ensure_ascii=False,indent=2)[:16000])
          PY
          git diff --exit-code
