name: Beta8 stage1 diagnostics patch

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/beta8-stage1-patch.yml
      - qa/beta8_stage1_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev14-integration
      - name: Apply diagnostics patch
        run: python3 qa/beta8_stage1_patch.py
      - name: Commit diagnostics patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ru/railbrake/calculator/ui/DiagnosticScreen.kt
          git add patch/app/src/main/java/ru/railbrake/calculator/ui/DiagnosticScreen.kt
          git add app/src/main/java/ru/railbrake/calculator/core/DiagnosticCompletionCatalog.kt
          git add patch/app/src/main/java/ru/railbrake/calculator/core/DiagnosticCompletionCatalog.kt
          git diff --cached --check
          git commit -m "Beta8: finish diagnostics package"
          git push origin HEAD:dev14-integration
