name: Beta8 stage2-4 UI identity patch

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/beta8-stage2-4-patch.yml
      - qa/beta8_stage2_4_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev14-integration
      - name: Apply UI identity patch
        run: python3 qa/beta8_stage2_4_patch.py
      - name: Commit UI identity package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app patch/app
          git diff --cached --check
          git commit -m "Beta8: localize UI and finalize identity"
          git push origin HEAD:dev14-integration
