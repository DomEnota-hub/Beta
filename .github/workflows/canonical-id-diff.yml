name: Canonical runtime ID diff

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/canonical-id-diff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect VL80S canonical edge conventions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json

          with gzip.open('app/src/main/assets/technical/vl80s_diagnostics.json.gz', 'rt', encoding='utf-8') as f:
              root = json.load(f)

          ids = {'aux-machine-single-trip', 'transformer-oil-signs', 'aux-machines'}
          print('--- outgoing/incoming edges for canonical neighbors ---')
          for edge in root.get('edges', []):
              if edge.get('from') in ids or edge.get('to') in ids:
                  print(json.dumps(edge, ensure_ascii=False, sort_keys=True))
          PY
