name: Canonical runtime ID diff

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/canonical-id-diff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect oil-pump runtime source and canonical neighbors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, re
          from pathlib import Path

          source = Path('app/src/main/java/ru/railbrake/calculator/core/DiagnosticCompletionCatalog.kt').read_text(encoding='utf-8')
          marker = 'id = "oil-pump-failure"'
          pos = source.index(marker)
          start = source.rfind('        scenario(', 0, pos)
          end = source.find('\n        scenario(', pos)
          if end < 0:
              end = source.find('\n    )', pos)
          print('--- oil-pump-failure runtime block ---')
          print(source[start:end])

          with gzip.open('app/src/main/assets/technical/vl80s_diagnostics.json.gz', 'rt', encoding='utf-8') as f:
              root = json.load(f)
          ids = {'aux-machine-single-trip', 'transformer-oil-signs', 'aux-machines'}
          print('--- canonical neighbor records ---')
          for s in root.get('scenarios', []):
              if s.get('id') in ids:
                  print(json.dumps(s, ensure_ascii=False, sort_keys=True))
          PY
