name: Canonical runtime alignment

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/canonical-id-diff.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add preserved oil-pump scenario to VL80S canonical graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip
          import io
          import json
          import shutil
          from pathlib import Path

          app_path = Path('app/src/main/assets/technical/vl80s_diagnostics.json.gz')
          patch_path = Path('patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz')

          with gzip.open(app_path, 'rt', encoding='utf-8') as source:
              root = json.load(source)

          scenarios = root.get('scenarios', [])
          edges = root.get('edges', [])
          ids = [item.get('id') for item in scenarios]
          assert len(scenarios) == 94, f'expected 94 VL80S canonical scenarios before alignment, got {len(scenarios)}'
          assert len(ids) == len(set(ids)), 'canonical IDs must be unique before alignment'
          assert 'oil-pump-failure' not in ids, 'oil-pump-failure already exists in canonical graph'

          by_id = {item['id']: item for item in scenarios}
          for required in ('aux-machine-single-trip', 'aux-machines', 'aux-common-loss', 'smoke-fire-flashover', 'transformer-oil-signs'):
              assert required in by_id, f'missing canonical neighbor {required}'

          new_record = {
              'id': 'oil-pump-failure',
              'runtimeStatus': 'VISIBLE_CURRENT_DIAGNOSTIC_REPOSITORY',
              'originLayer': 'DiagnosticCompletionCatalog.kt',
              'title': 'Отказ масляного насоса трансформатора',
              'summary': 'Маслонасос трансформатора не запускается, отключается после пуска либо работа системы циркуляции масла не подтверждается.',
              'category': 'Вспомогательные машины',
              'severity': 'RESTRICT_OPERATION',
              'applicableVariantIds': ['vl80s-general'],
              'questionCount': 3,
              'checkCount': 3,
              'dangerCount': 3,
              'relatedScenarioIds': [
                  'aux-machines',
                  'aux-common-loss',
                  'aux-machine-single-trip',
                  'smoke-fire-flashover'
              ],
              'equipmentIds': ['VL-EQ-AU-004', 'VL-EQ-AU-006', 'VL-EQ-TR-004'],
              'systemIds': ['VL-SYS-AU', 'VL-SYS-TR'],
              'articleTargets': [
                  {'id': 'vl80-detail-relay-panels', 'status': 'existing'},
                  {'id': 'vl80-eq-aux-contactor', 'status': 'planned_canonical'},
                  {'id': 'vl80-eq-oil-pump', 'status': 'planned_canonical'},
                  {'id': 'vl80-eq-transformer', 'status': 'planned_canonical'}
              ],
              'acceptance': {
                  'direct': [],
                  'viaEquipment': ['VL80-ACC-046', 'VL80-ACC-061']
              },
              'electricalSchemes': {
                  'explicit': ['VL-SCH-EL-AUX-937-1260'],
                  'viaEquipment': []
              },
              'pneumaticViews': {'explicit': [], 'viaEquipment': []},
              'qna': {'explicit': [], 'viaEquipment': []},
              'linkProvenance': 'RUNTIME_CANONICAL_ALIGNMENT_2026-09-25'
          }
          scenarios.append(new_record)

          # Preserve the existing unique runtime route and make its canonical
          # diagnostic neighborhood bidirectional without altering runtime text.
          for related_id in new_record['relatedScenarioIds']:
              related = by_id[related_id]
              values = list(related.get('relatedScenarioIds', []))
              if 'oil-pump-failure' not in values:
                  values.append('oil-pump-failure')
              related['relatedScenarioIds'] = sorted(set(values))

          def edge_key(edge):
              return (edge.get('from'), edge.get('to'), edge.get('type'))

          existing_edges = {edge_key(edge) for edge in edges}
          def add_edge(from_id, to_id, relation, provenance, gate=None):
              key = (from_id, to_id, relation)
              if key in existing_edges:
                  return
              edge = {
                  'from': from_id,
                  'to': to_id,
                  'type': relation,
                  'provenance': provenance
              }
              if gate:
                  edge['gate'] = gate
              edges.append(edge)
              existing_edges.add(key)

          for equipment_id in ('VL-EQ-AU-004', 'VL-EQ-AU-006', 'VL-EQ-TR-004'):
              add_edge(
                  'oil-pump-failure', equipment_id, 'diagnostic_to_equipment',
                  'RUNTIME_CANONICAL_ALIGNMENT_2026-09-25',
                  'Stage1/Stage2 execution applicability'
              )

          for article_id, provenance in (
              ('vl80-detail-relay-panels', 'existing'),
              ('vl80-eq-aux-contactor', 'planned_canonical'),
              ('vl80-eq-oil-pump', 'planned_canonical'),
              ('vl80-eq-transformer', 'planned_canonical'),
          ):
              add_edge(
                  'oil-pump-failure', article_id, 'diagnostic_to_article',
                  provenance, 'through stable equipment identity'
              )

          for acceptance_id in ('VL80-ACC-046', 'VL80-ACC-061'):
              add_edge(
                  acceptance_id, 'oil-pump-failure', 'acceptance_to_diagnostic_candidate',
                  'shared_equipment', 'show only as related link'
              )

          add_edge(
              'VL-SCH-EL-AUX-937-1260', 'oil-pump-failure', 'electrical_scheme_to_diagnostic',
              'explicit_stage4_node', 'Stage4 profile filter'
          )

          # Keep common summary counters honest if this package carries them.
          def refresh_counts(value):
              if isinstance(value, dict):
                  for key, child in list(value.items()):
                      lower = key.lower()
                      if lower in {'scenariocount', 'scenarioscount', 'diagnosticcount'} and isinstance(child, int):
                          value[key] = len(scenarios)
                      elif lower in {'edgecount', 'edgescount', 'linkcount'} and isinstance(child, int):
                          value[key] = len(edges)
                      else:
                          refresh_counts(child)
              elif isinstance(value, list):
                  for child in value:
                      refresh_counts(child)
          refresh_counts(root)

          assert len(root['scenarios']) == 95
          assert len({item['id'] for item in root['scenarios']}) == 95
          assert sum(1 for item in root['scenarios'] if item['id'] == 'oil-pump-failure') == 1

          payload = (json.dumps(root, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          buffer = io.BytesIO()
          with gzip.GzipFile(filename='', mode='wb', fileobj=buffer, mtime=0) as target:
              target.write(payload)
          app_path.write_bytes(buffer.getvalue())
          shutil.copyfile(app_path, patch_path)
          assert app_path.read_bytes() == patch_path.read_bytes()

          print(f'VL80S canonical aligned: scenarios={len(scenarios)} edges={len(edges)}')
          PY

          python3 qa/verify_diagnostic_graphs.py app/src/main/assets
          python3 tools/audit_canonical_data.py app/src/main/assets/technical
          cmp app/src/main/assets/technical/vl80s_diagnostics.json.gz patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz

      - name: Commit canonical alignment and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/canonical-id-diff.yml
          git add app/src/main/assets/technical/vl80s_diagnostics.json.gz patch/app/src/main/assets/technical/vl80s_diagnostics.json.gz
          git diff --cached --stat
          git commit -m 'fix: preserve oil pump scenario in canonical diagnostics'
          git push origin HEAD:dev14-integration
