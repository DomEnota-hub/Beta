name: Canonical runtime ID diff

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/canonical-id-diff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect VL80S canonical oil-pump candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, re
          from pathlib import Path

          path = Path('app/src/main/assets/technical/vl80s_diagnostics.json.gz')
          with gzip.open(path, 'rt', encoding='utf-8') as f:
              root = json.load(f)

          pattern = re.compile(r'(oil|pump|масл|насос)', re.I)
          print('scenario_count=', len(root.get('scenarios', [])))
          print('--- matching canonical scenarios ---')
          for s in root.get('scenarios', []):
              hay = json.dumps(s, ensure_ascii=False)
              if pattern.search(hay):
                  print(json.dumps(s, ensure_ascii=False, sort_keys=True))

          print('--- matching edges ---')
          for e in root.get('edges', []):
              hay = json.dumps(e, ensure_ascii=False)
              if pattern.search(hay):
                  print(json.dumps(e, ensure_ascii=False, sort_keys=True))
          PY
