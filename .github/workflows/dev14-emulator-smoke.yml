name: Dev14 emulator smoke

on:
  workflow_dispatch:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/dev14-emulator-smoke.yml

permissions:
  contents: read

concurrency:
  group: dev14-emulator-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract source overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Build debug APK
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:assembleDebug --stacktrace --console=plain

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS:="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare QA evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          git rev-parse HEAD > qa-evidence/source-sha.txt
          sed -n '/versionCode =/p; /versionName =/p' app/build.gradle.kts > qa-evidence/version.txt

      - name: Run adb smoke on Android API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          avd-name: dev14-smoke
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: |
            set +e
            APK="$GITHUB_WORKSPACE/buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk" \
              QA_OUT="$GITHUB_WORKSPACE/qa-evidence" \
              python3 "$GITHUB_WORKSPACE/qa/dev14_android_smoke.py"
            smoke_status=$?
            adb shell wm size > "$GITHUB_WORKSPACE/qa-evidence/device.txt" 2>&1
            adb shell wm density >> "$GITHUB_WORKSPACE/qa-evidence/device.txt" 2>&1
            adb shell settings get system font_scale >> "$GITHUB_WORKSPACE/qa-evidence/device.txt" 2>&1
            adb logcat -d > "$GITHUB_WORKSPACE/qa-evidence/logcat-final.txt" 2>&1
            exit "$smoke_status"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev14-emulator-smoke-evidence
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 14
