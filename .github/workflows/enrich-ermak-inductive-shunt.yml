name: Enrich Ermak field weakening reference

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/scripts/enrich_ermak_inductive_shunt.py'
      - '.github/workflows/enrich-ermak-inductive-shunt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev14-integration

      - name: Apply field weakening enrichment
        run: python3 .github/scripts/enrich_ermak_inductive_shunt.py

      - name: Verify mirrors and content
        shell: bash
        run: |
          set -euo pipefail
          cmp app/src/main/assets/technical/ermak_equipment.json.gz patch/app/src/main/assets/technical/ermak_equipment.json.gz
          cmp app/src/main/assets/technical/ermak_knowledge.json.gz patch/app/src/main/assets/technical/ermak_knowledge.json.gz
          python3 - <<'PY'
          import gzip, json

          with gzip.open('app/src/main/assets/technical/ermak_equipment.json.gz','rt',encoding='utf-8') as f:
              eq=json.load(f)
          matches=[r for r in eq['records'] if r.get('id')=='ER-EQ-TR-009']
          assert len(matches)==1, len(matches)
          p=matches[0]
          models=set(p.get('modelNames',[]))
          assert {'РОВ-21','ИШ-95'} <= models, models
          assert 'ИШ-009' not in models
          assert len(p['parameters'])==5
          assert any(x['name']=='ИШ-95 — номинальное напряжение относительно земли' and x['value']==2000 for x in p['parameters'])
          assert any(x['name']=='ИШ-95 — номинальный ток' and x['value']==520 for x in p['parameters'])
          assert any(x['name']=='ИШ-95 — индуктивность при токе 520 А, не менее' and x['value']==1.5 for x in p['parameters'])
          assert any(x['name']=='ИШ-95 — сопротивление при 20 °C' and x['value']==0.0051 for x in p['parameters'])
          assert any(x['name']=='ИШ-95 — охлаждение' and x['value']=='воздушное принудительное' for x in p['parameters'])
          ids={x.get('sourceId') for x in p['sourceRefs'] if isinstance(x,dict)}
          assert {'ER-SRC-049','ER-SRC-050','ER-SRC-051','ER-SRC-052'} <= ids

          with gzip.open('app/src/main/assets/technical/ermak_knowledge.json.gz','rt',encoding='utf-8') as f:
              kb=json.load(f)
          expected='ER-KB-EQ-ER-EQ-TR-009'
          articles=[a for a in kb['articles'] if a.get('id')==expected or a.get('equipmentId')=='ER-EQ-TR-009']
          by_id={a.get('id'):a for a in articles}
          assert len(by_id)==1, list(by_id)
          a=next(iter(by_id.values()))
          assert len(a['keyParameters'])==5
          assert all(x in a['sourceRefs'] for x in ['ER-SRC-049','ER-SRC-050','ER-SRC-051','ER-SRC-052'])
          assert 'ослабления возбуждения' in a['principle'].lower()
          assert any('ИШ-009' in rule and 'ИШ-95' in rule for rule in a.get('variantRules',[]))
          assert len(a['normalState']) >= 3 and len(a['deviationSigns']) >= 3
          print('Field weakening enrichment verified for ER-EQ-TR-009')
          PY
          git diff --check

      - name: Commit enriched assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/technical/ermak_equipment.json.gz \
                  patch/app/src/main/assets/technical/ermak_equipment.json.gz \
                  app/src/main/assets/technical/ermak_knowledge.json.gz \
                  patch/app/src/main/assets/technical/ermak_knowledge.json.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Enrich Ermak field weakening chain reference data'
            git push origin HEAD:dev14-integration
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: true

      - name: Extract base and overlay patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain

      - name: Debug build
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:assembleDebug --stacktrace --console=plain
