name: Enrich Ermak DP-011 reference

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/scripts/enrich_ermak_interference_choke.py'
      - '.github/workflows/enrich-ermak-interference-choke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev14-integration

      - name: Apply DP-011 enrichment
        run: python3 .github/scripts/enrich_ermak_interference_choke.py

      - name: Verify mirrors and content
        shell: bash
        run: |
          set -euo pipefail
          cmp app/src/main/assets/technical/ermak_equipment.json.gz patch/app/src/main/assets/technical/ermak_equipment.json.gz
          cmp app/src/main/assets/technical/ermak_knowledge.json.gz patch/app/src/main/assets/technical/ermak_knowledge.json.gz
          python3 - <<'PY'
          import gzip, json
          with gzip.open('app/src/main/assets/technical/ermak_equipment.json.gz','rt',encoding='utf-8') as f:
              eq=json.load(f)
          p=next(r for r in eq['records'] if r['id']=='ER-EQ-HV-002')
          assert 'ДП-011' in p['modelNames']
          assert len(p['parameters'])==7
          assert any(x['name']=='Номинальный ток продолжительного режима' and x['value']==650 for x in p['parameters'])
          assert any(x['name']=='Пусковой ток' and x['value']==300 for x in p['parameters'])
          assert any(x['name']=='Индуктивность' and x['value']=='250±25' for x in p['parameters'])
          assert any(x['name']=='Сопротивление катушки постоянному току при 20 °C' and x['value']==0.0061 for x in p['parameters'])
          assert any(x['name']=='Масса' and x['value']==38 for x in p['parameters'])
          ids={x.get('sourceId') for x in p['sourceRefs'] if isinstance(x,dict)}
          assert {'ER-SRC-041','ER-SRC-042'} <= ids
          with gzip.open('app/src/main/assets/technical/ermak_knowledge.json.gz','rt',encoding='utf-8') as f:
              kb=json.load(f)
          a=next(x for x in kb['articles'] if x['id']=='ER-KB-EQ-ER-EQ-HV-002')
          assert len(a['keyParameters'])==7
          assert 'ER-SRC-041' in a['sourceRefs'] and 'ER-SRC-042' in a['sourceRefs']
          assert 'высокочастот' in a['principle'].lower()
          print('DP-011 enrichment verified')
          PY
          git diff --check

      - name: Commit enriched assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/technical/ermak_equipment.json.gz \
                  patch/app/src/main/assets/technical/ermak_equipment.json.gz \
                  app/src/main/assets/technical/ermak_knowledge.json.gz \
                  patch/app/src/main/assets/technical/ermak_knowledge.json.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Enrich Ermak DP-011 interference choke reference data'
            git push origin HEAD:dev14-integration
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: true

      - name: Extract base and overlay patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain

      - name: Debug build
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:assembleDebug --stacktrace --console=plain
