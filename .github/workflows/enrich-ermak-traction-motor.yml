name: Enrich Ermak traction motor reference

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/scripts/enrich_ermak_traction_motor.py'
      - '.github/workflows/enrich-ermak-traction-motor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev14-integration

      - name: Apply traction motor enrichment
        run: python3 .github/scripts/enrich_ermak_traction_motor.py

      - name: Verify mirrors and content
        shell: bash
        run: |
          set -euo pipefail
          cmp app/src/main/assets/technical/ermak_equipment.json.gz patch/app/src/main/assets/technical/ermak_equipment.json.gz
          cmp app/src/main/assets/technical/ermak_knowledge.json.gz patch/app/src/main/assets/technical/ermak_knowledge.json.gz
          python3 - <<'PY'
          import gzip, json
          with gzip.open('app/src/main/assets/technical/ermak_equipment.json.gz','rt',encoding='utf-8') as f:
              eq=json.load(f)
          ted=next(r for r in eq['records'] if r['id']=='ER-EQ-TR-005')
          assert 'НБ-514Б' in ted['modelNames'] and 'НБ-514Е' in ted['modelNames']
          assert len(ted['parameters'])==11
          assert any(p['name']=='Номинальная мощность, часовой режим' and p['value']==820 for p in ted['parameters'])
          assert any(p['name']=='Номинальная мощность, продолжительный режим' and p['value']==765 for p in ted['parameters'])
          assert any(p['name']=='Расход вентилирующего воздуха при полном напоре 620 Па, не менее' and p['value']==70 for p in ted['parameters'])
          assert any(p['name']=='Масса без зубчатой передачи' and p['value']==4300 and p['condition']=='НБ-514Б' for p in ted['parameters'])
          assert any(p['name']=='Масса без зубчатой передачи' and p['value']==4350 and p['condition']=='НБ-514Е' for p in ted['parameters'])
          assert any(x.get('sourceId')=='ER-SRC-035' for x in ted['sourceRefs'])
          assert any(x.get('sourceId')=='ER-SRC-036' for x in ted['sourceRefs'])
          with gzip.open('app/src/main/assets/technical/ermak_knowledge.json.gz','rt',encoding='utf-8') as f:
              kb=json.load(f)
          article=next(a for a in kb['articles'] if a['id']=='ER-KB-EQ-ER-EQ-TR-005')
          assert len(article['keyParameters'])==11
          assert 'ER-SRC-035' in article['sourceRefs'] and 'ER-SRC-036' in article['sourceRefs']
          assert 'моторно-осевыми подшипниками качения' in article['principle']
          print('Traction motor enrichment verified')
          PY
          git diff --check

      - name: Commit enriched assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/technical/ermak_equipment.json.gz \
                  patch/app/src/main/assets/technical/ermak_equipment.json.gz \
                  app/src/main/assets/technical/ermak_knowledge.json.gz \
                  patch/app/src/main/assets/technical/ermak_knowledge.json.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Enrich Ermak NB-514 traction motor reference data'
            git push origin HEAD:dev14-integration
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: true

      - name: Extract base and overlay patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain

      - name: Debug build
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:assembleDebug --stacktrace --console=plain
