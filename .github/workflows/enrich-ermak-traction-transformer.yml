name: Enrich Ermak traction transformer reference

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/scripts/enrich_ermak_traction_transformer.py'
      - '.github/workflows/enrich-ermak-traction-transformer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev14-integration

      - name: Apply traction transformer enrichment
        run: python3 .github/scripts/enrich_ermak_traction_transformer.py

      - name: Verify mirrors and content
        shell: bash
        run: |
          set -euo pipefail
          cmp app/src/main/assets/technical/ermak_equipment.json.gz patch/app/src/main/assets/technical/ermak_equipment.json.gz
          cmp app/src/main/assets/technical/ermak_knowledge.json.gz patch/app/src/main/assets/technical/ermak_knowledge.json.gz
          python3 - <<'PY'
          import gzip, json
          with gzip.open('app/src/main/assets/technical/ermak_equipment.json.gz','rt',encoding='utf-8') as f:
              eq=json.load(f)
          tr=next(r for r in eq['records'] if r['id']=='ER-EQ-HV-008')
          assert 'ОНДЦЭ-4350/25' in tr['modelNames']
          assert any(p['name']=='Номинальная мощность трансформатора' and p['value']==4350 for p in tr['parameters'])
          assert any(p['name']=='Номинальный ток сетевой обмотки' and p['value']==173.8 for p in tr['parameters'])
          assert any(p['name']=='Номинальный ток тяговых обмоток' and p['value']==1600 for p in tr['parameters'])
          assert any(p['name']=='Потери короткого замыкания' and p['value']==56.8 for p in tr['parameters'])
          assert any(p['name']=='Ток холостого хода' and p['value']==0.8 for p in tr['parameters'])
          assert any(x.get('sourceId')=='ER-SRC-033' for x in tr['sourceRefs'])
          assert any(x.get('sourceId')=='ER-SRC-037' for x in tr['sourceRefs'])
          assert 'рекуперации' in tr['purpose']
          with gzip.open('app/src/main/assets/technical/ermak_knowledge.json.gz','rt',encoding='utf-8') as f:
              kb=json.load(f)
          article=next(a for a in kb['articles'] if a['id']=='ER-KB-EQ-ER-EQ-HV-008')
          assert 'ER-SRC-037' in article['sourceRefs']
          assert any(p['name']=='Номинальный ток тяговых обмоток' and p['value']==1600 for p in article['keyParameters'])
          assert 'две тяговые обмотки' in article['principle']
          assert 'принудительную циркуляцию масла и воздуха' in article['principle']
          assert any('расхождения' in r for r in article['variantRules'])
          print('Traction transformer enrichment verified')
          PY
          git diff --check

      - name: Commit enriched assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/technical/ermak_equipment.json.gz \
                  patch/app/src/main/assets/technical/ermak_equipment.json.gz \
                  app/src/main/assets/technical/ermak_knowledge.json.gz \
                  patch/app/src/main/assets/technical/ermak_knowledge.json.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Enrich Ermak traction transformer reference data'
            git push origin HEAD:dev14-integration
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: true

      - name: Extract base and overlay patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain

      - name: Debug build
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:assembleDebug --stacktrace --console=plain
