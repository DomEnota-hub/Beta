name: Final black-box recovery8 v3

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/final-blackbox-recovery8-v3.yml'
      - 'qa/final_blackbox_v3.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  blackbox:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout QA driver
        uses: actions/checkout@v4
      - name: Download recovery8 APK
        uses: actions/download-artifact@v4
        with:
          name: RailBrakeCalculator-beta-recovery8-debug
          path: apk
          github-token: ${{ github.token }}
          repository: DomEnota-hub/Beta
          run-id: 35213411275
      - name: Exercise recovery8 user paths
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ github.workspace }}/apk/app-debug.apk
          OUT: ${{ github.workspace }}/final-evidence-v3
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 1536
          script: bash "$GITHUB_WORKSPACE/qa/final_blackbox_v3.sh"
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery8-final-blackbox-evidence-v3
          path: final-evidence-v3/
          if-no-files-found: warn
          retention-days: 14
