name: Fix Beta24 calculation helpers

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/fix-beta24-calculation-helpers.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev14-integration
          fetch-depth: 0

      - name: Verify expected broken state
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/scripts/fix_beta24_calculation_helpers.py
          grep -Fq 'versionName = "1.2.2-dev14-beta24"' app/build.gradle.kts
          ! grep -Fq 'private fun Metric(' app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          ! grep -Fq 'private fun MiniMetric(' app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          ! grep -Fq 'private fun Formula(' app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt

      - name: Restore calculation helpers
        run: python3 .github/scripts/fix_beta24_calculation_helpers.py

      - name: Verify repair
        shell: bash
        run: |
          set -euo pipefail
          cmp app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt patch/app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          grep -Fq 'private fun Metric(' app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          grep -Fq 'private fun MiniMetric(' app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          grep -Fq 'private fun Formula(' app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          grep -Fq 'color = colors.warningContainer' app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          grep -Fq 'RailTheme.colors' app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt

      - name: Commit repaired Beta24 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app patch
          git rm .github/scripts/fix_beta24_calculation_helpers.py .github/workflows/fix-beta24-calculation-helpers.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "Restore Beta24 calculation helper composables"
          git push origin HEAD:dev14-integration
