name: Fix Beta25 speedometer variant note

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/fix-beta25-speedometer-note.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize speedometer model note
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, io, json
          from pathlib import Path
          paths=[Path('app/src/main/assets/technical/vl80s_equipment.json.gz'),Path('patch/app/src/main/assets/technical/vl80s_equipment.json.gz')]
          with gzip.open(paths[0],'rt',encoding='utf-8') as f: data=json.load(f)
          by={r['id']:r for r in data['records']}
          rec=by['VL-EQ-SF-004']
          rec['modelNames']=['3СЛ-2М']
          notes=[n for n in (rec.get('notes') or []) if 'OCR' not in n and 'ЗСЛ2М-150' not in n and '3СЛ2М-150' not in n]
          variant='3СЛ-2М относится к базовому механическому исполнению. На модернизированных ВЛ80С канал индикации и регистрации скорости может быть выполнен другим комплексом; фактическое оборудование конкретной секции имеет приоритет.'
          rec['notes']=list(dict.fromkeys(notes+[variant]))
          raw=(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n').encode('utf-8')
          def write(path):
              b=io.BytesIO()
              with gzip.GzipFile(filename='',mode='wb',fileobj=b,mtime=0,compresslevel=9) as g:g.write(raw)
              path.write_bytes(b.getvalue())
          for p in paths: write(p)
          if paths[0].read_bytes()!=paths[1].read_bytes(): raise SystemExit('VL80S equipment mirrors differ')
          with gzip.open(paths[0],'rt',encoding='utf-8') as f: check=json.load(f)
          c={r['id']:r for r in check['records']}['VL-EQ-SF-004']
          if c.get('modelNames')!=['3СЛ-2М']: raise SystemExit('speedometer model mismatch')
          if any('3СЛ2М-150' in n or 'ЗСЛ2М-150' in n for n in c.get('notes',[])): raise SystemExit('stale speedometer note remains')
          PY
          git diff --check
      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'Normalize VL80S speedometer model note'
          git pull --rebase origin dev14-integration
          git push origin HEAD:dev14-integration
