name: Fix Ermak interactive atlas ANR

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/fix-ermak-atlas-anr.yml'
      - '.github/scripts/fix_ermak_atlas_anr.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout latest dev14
        uses: actions/checkout@v4
        with:
          ref: dev14-integration
          fetch-depth: 0

      - name: Capture guarded head
        shell: bash
        run: echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply Ermak atlas ANR fix
        run: python3 .github/scripts/fix_ermak_atlas_anr.py

      - name: Verify source mirrors and patch scope
        shell: bash
        run: |
          set -euo pipefail
          cmp app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt \
              patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt \
              patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt
          grep -F 'private val sharedEntryCache = mutableMapOf<String, TechnicalEntry>()' \
              app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          grep -F 'if (isErmakLayout) entry.blocks.filterNot { it.title == "Оборудование" }' \
              app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt
          expected=$(printf '%s\n' \
            app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt \
            app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt \
            patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt \
            patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: true

      - name: Extract base and overlay patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain

      - name: Debug build
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:assembleDebug --stacktrace --console=plain

      - name: Guard, commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev14-integration
          test "$(git rev-parse origin/dev14-integration)" = "$BASE_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt \
                  app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt \
                  patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt \
                  patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt \
            app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt \
            patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt \
            patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt | sort > /tmp/expected.txt
          cmp /tmp/changed.txt /tmp/expected.txt
          git commit -m 'Fix Ermak interactive atlas ANR'
          git push origin HEAD:dev14-integration

      - name: Stage debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          cp buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk \
             handoff/RailBrakeCalculator-dev14-ermak-atlas-fix.apk
          sha256sum handoff/RailBrakeCalculator-dev14-ermak-atlas-fix.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-dev14-ermak-atlas-fix
          path: handoff/RailBrakeCalculator-dev14-ermak-atlas-fix.apk
          if-no-files-found: error
          retention-days: 7
