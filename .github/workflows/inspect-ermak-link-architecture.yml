name: Inspect Ermak link architecture

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/inspect-ermak-link-architecture.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect canonical link indexes
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip,json
          from pathlib import Path
          root=Path('app/src/main/assets/technical')
          def load(n):
              with gzip.open(root/f'{n}.json.gz','rt',encoding='utf-8') as f:return json.load(f)
          eq=load('ermak_equipment'); kb=load('ermak_knowledge'); links=load('ermak_links'); sm=load('ermak_system_map'); dg=load('ermak_diagnostics')
          rows=eq.get('records',[]); arts=kb.get('articles',[])
          out={
            'equipmentCount':len(rows),
            'articleCount':len(arts),
            'linksStatistics':links.get('statistics'),
            'linksPolicy':links.get('policy'),
            'linksQuarantine':links.get('quarantine'),
            'linksExplicitNonBlockingGaps':links.get('explicitNonBlockingGaps'),
            'linksIndexes':links.get('indexes'),
            'systems':sm.get('systems'),
            'criticalLinks':sm.get('criticalLinks'),
            'diagnosticsStatistics':dg.get('statistics'),
            'diagnosticsIntegrationContract':dg.get('integrationContract'),
            'diagnosticsIndexes':dg.get('indexes'),
            'scenarioSamples':dg.get('scenarios',[])[:3],
          }
          # Report current article futureLinks and equipment systemIds for likely first package.
          targets=['ER-EQ-HV-004','ER-EQ-TR-004','ER-EQ-PN-006','ER-EQ-BR-014','ER-EQ-PR-004','ER-EQ-SF-001']
          out['targets']=[]
          for eid in targets:
              r=next((x for x in rows if x.get('id')==eid),None)
              a=next((x for x in arts if x.get('equipmentId')==eid),None)
              out['targets'].append({'equipmentId':eid,'record':r,'article':a})
          Path('link-architecture.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ermak-link-architecture
          path: link-architecture.json
