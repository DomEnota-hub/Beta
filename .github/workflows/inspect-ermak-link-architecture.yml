name: Inspect Ermak link architecture

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/inspect-ermak-link-architecture.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect link architecture and diagnostic matches
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip,json,re
          from pathlib import Path
          root=Path('app/src/main/assets/technical')
          names=['ermak_equipment','ermak_knowledge','ermak_links','ermak_system_map','ermak_diagnostics']
          data={}
          for n in names:
              with gzip.open(root/f'{n}.json.gz','rt',encoding='utf-8') as f:data[n]=json.load(f)
          out={}
          for n,v in data.items():
              out[n]={'type':type(v).__name__,'keys':list(v.keys()) if isinstance(v,dict) else None,'count':len(v) if hasattr(v,'__len__') else None}
              if isinstance(v,dict):
                  for k,val in v.items():
                      if isinstance(val,list) and val:
                          out[n]['sample_list_key']=k;out[n]['sample']=val[0];break
                      if isinstance(val,dict) and val:
                          out[n]['sample_dict_key']=k;out[n]['sample']=next(iter(val.items()));break
          eq=data['ermak_equipment']
          rows=eq.get('records',[])
          kb=data['ermak_knowledge']
          arts=kb.get('articles',[])
          links=data['ermak_links']
          diags=data['ermak_diagnostics']
          dtext=json.dumps(diags,ensure_ascii=False).lower()
          candidates=[]
          for r in rows:
              tokens=[]
              tokens += [r.get('id','')]
              tokens += r.get('schemeDesignations',[]) or []
              tokens += r.get('modelNames',[]) or []
              title=r.get('title') or r.get('name') or ''
              if title: tokens.append(title)
              hits=[t for t in tokens if t and len(t)>=3 and str(t).lower() in dtext]
              if hits:
                  candidates.append({'id':r.get('id'),'title':title,'systemId':r.get('systemId'),'scheme':r.get('schemeDesignations',[]),'models':r.get('modelNames',[]),'hits':hits[:8]})
          out['diagnostic_candidates']=candidates
          out['equipment_link_fields']=[{k:r.get(k) for k in r.keys() if 'link' in k.lower() or 'diag' in k.lower() or 'article' in k.lower() or 'system' in k.lower()} for r in rows[:8]]
          out['knowledge_link_fields']=[{k:a.get(k) for k in a.keys() if 'link' in k.lower() or 'diag' in k.lower() or 'equipment' in k.lower() or 'system' in k.lower()} for a in arts[:8]]
          Path('link-architecture.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ermak-link-architecture
          path: link-architecture.json
