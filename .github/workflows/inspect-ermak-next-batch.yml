name: Inspect next Ermak enrichment batch

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/inspect-ermak-next-batch.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live equipment remainder
        shell: python
        run: |
          import gzip, json, pathlib, re
          ep = pathlib.Path('app/src/main/assets/technical/ermak_equipment.json.gz')
          kp = pathlib.Path('app/src/main/assets/technical/ermak_knowledge.json.gz')
          with gzip.open(ep, 'rt', encoding='utf-8') as f: e=json.load(f)
          with gzip.open(kp, 'rt', encoding='utf-8') as f: k=json.load(f)
          records=e['records']
          articles={a.get('equipmentId'):a for a in k['articles'] if a.get('equipmentId')}
          empty=[]
          for r in records:
              if r.get('parameters'): continue
              a=articles.get(r['id'],{})
              empty.append({
                  'id':r.get('id'), 'name':r.get('name'), 'modelNames':r.get('modelNames'),
                  'schemeDesignations':r.get('schemeDesignations'), 'sectionApplicability':r.get('sectionApplicability'),
                  'quantity':r.get('quantity'), 'parameterCoverage':r.get('parameterCoverage'),
                  'purpose':r.get('purpose'), 'notes':r.get('notes'), 'sourceRefs':r.get('sourceRefs'),
                  'knowledgeSummary':a.get('summary'), 'variantRules':a.get('variantRules'),
                  'knowledgeSourceRefs':a.get('sourceRefs')
              })
          ids=[]
          for v in e.get('sourceRegistry',{}).values():
              if isinstance(v,dict) and isinstance(v.get('sourceId'),str):
                  m=re.fullmatch(r'ER-SRC-(\d+)',v['sourceId'])
                  if m: ids.append((int(m.group(1)),v['sourceId']))
          out={'statistics':e.get('statistics'),'emptyCount':len(empty),'emptyRecords':empty,
               'sourceIdTail':[x[1] for x in sorted(ids)[-15:]]}
          pathlib.Path('ermak_next_batch_inspection.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: ermak-next-batch-inspection
          path: ermak_next_batch_inspection.json
