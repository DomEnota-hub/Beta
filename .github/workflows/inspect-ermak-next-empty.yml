name: Inspect next empty Ermak nodes

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/inspect-ermak-next-empty.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev14-integration
      - name: Print next empty records
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, json
          with gzip.open('app/src/main/assets/technical/ermak_equipment.json.gz','rt',encoding='utf-8') as f:
              root=json.load(f)
          rows=[]
          for r in root.get('records',[]):
              if not r.get('parameters'):
                  rows.append({
                      'id': r.get('id'),
                      'domain': r.get('domain'),
                      'name': r.get('name'),
                      'modelNames': r.get('modelNames'),
                      'schemeDesignations': r.get('schemeDesignations'),
                      'quantity': r.get('quantity'),
                      'purpose': r.get('purpose'),
                      'parameterCoverage': r.get('parameterCoverage'),
                  })
          print(json.dumps(rows[:20], ensure_ascii=False, indent=2))
          PY
