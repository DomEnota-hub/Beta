name: Inspect Ermak profile gates

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/inspect-ermak-profile-gates.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Stage 7 gated link compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip,json
          from pathlib import Path
          root=Path('app/src/main/assets/technical')
          def load(name):
              with gzip.open(root/name,'rt',encoding='utf-8') as f:return json.load(f)
          links=load('ermak_links.json.gz')
          diagnostics=load('ermak_diagnostics.json.gz')
          by_scheme=links['indexes']['byScheme']
          diag={d['id']:d for d in diagnostics['scenarios']}
          rows=[]
          for sid,s in by_scheme.items():
              sr=s.get('variantRules') or {}
              sprof=set(sr.get('includeProfiles') or [])
              smod=set(sr.get('models') or [])
              for link in s.get('diagnosticLinks') or []:
                  if not link.get('profileGateRequired'): continue
                  d=diag[link['diagnosticId']]
                  app=d.get('applicability') or {}
                  dprof=set(app.get('profiles') or [])
                  dmod=set(app.get('families') or [])
                  special=bool(dprof & {'all_confirmed_profiles','profile_required'})
                  inter=sorted(sprof & dprof)
                  rows.append({
                    'schemeId':sid,'diagnosticId':d['id'],'schemeModels':sorted(smod),'diagnosticModels':sorted(dmod),
                    'schemeProfiles':sorted(sprof),'diagnosticProfiles':sorted(dprof),'profileIntersection':inter,
                    'specialProfileToken':special,'diagnosticVariantSelectionRequired':app.get('variantSelectionRequired'),
                    'reason':link.get('reason')
                  })
          ambiguous=[r for r in rows if not r['specialProfileToken'] and len(r['schemeProfiles'])>1 and r['profileIntersection'] and set(r['profileIntersection']) != set(r['schemeProfiles'])]
          no_profile_intersection=[r for r in rows if not r['specialProfileToken'] and r['schemeProfiles'] and not r['profileIntersection']]
          model_subset=[r for r in rows if set(r['schemeModels']) != set(r['diagnosticModels']) and set(r['schemeModels']) & set(r['diagnosticModels'])]
          out={
            'gatedCount':len(rows),'ambiguousProfileCount':len(ambiguous),'ambiguousProfiles':ambiguous,
            'noProfileIntersectionCount':len(no_profile_intersection),'noProfileIntersection':no_profile_intersection,
            'modelSubsetCount':len(model_subset),'modelSubsets':model_subset,
            'rows':rows
          }
          Path('ermak-profile-gates.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ermak-profile-gates
          path: ermak-profile-gates.json
