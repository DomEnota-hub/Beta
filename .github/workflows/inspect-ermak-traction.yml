name: Inspect Ermak traction catalog

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/inspect-ermak-traction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev14-integration
      - name: Inspect TR-002 and knowledge article
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, json
          with gzip.open('app/src/main/assets/technical/ermak_equipment.json.gz','rt',encoding='utf-8') as f:
              eq=json.load(f)
          rec=next(r for r in eq['records'] if r.get('id')=='ER-EQ-TR-002')
          print('EQUIPMENT')
          print(json.dumps(rec, ensure_ascii=False, indent=2))
          with gzip.open('app/src/main/assets/technical/ermak_knowledge.json.gz','rt',encoding='utf-8') as f:
              kb=json.load(f)
          expected='ER-KB-EQ-ER-EQ-TR-002'
          matches=[a for a in kb['articles'] if a.get('id')==expected or a.get('equipmentId')=='ER-EQ-TR-002']
          print('ARTICLES', len(matches))
          for a in matches:
              print(json.dumps(a, ensure_ascii=False, indent=2))
          PY
