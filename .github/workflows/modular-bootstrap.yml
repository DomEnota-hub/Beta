name: Modular architecture bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - modular-rebuild
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'app-shell/**'
      - 'assistant-core/**'
      - 'design-system/**'
      - 'feature-acceptance/**'
      - 'feature-atlas/**'
      - 'feature-calculations/**'
      - 'feature-diagnostics/**'
      - 'feature-history/**'
      - 'feature-safety/**'
      - 'domain-contracts/**'
      - 'content-runtime/**'
      - 'navigation-contracts/**'
      - 'link-router/**'
      - 'source-policy/**'
      - 'content-schema/**'
      - 'content-packs/**'
      - 'qa/**'
      - 'qa-tools/**'
      - '.github/workflows/modular-bootstrap.yml'
  pull_request:
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'app-shell/**'
      - 'assistant-core/**'
      - 'design-system/**'
      - 'feature-acceptance/**'
      - 'feature-atlas/**'
      - 'feature-calculations/**'
      - 'feature-diagnostics/**'
      - 'feature-history/**'
      - 'feature-safety/**'
      - 'domain-contracts/**'
      - 'content-runtime/**'
      - 'navigation-contracts/**'
      - 'link-router/**'
      - 'source-policy/**'
      - 'content-schema/**'
      - 'content-packs/**'
      - 'qa/**'
      - 'qa-tools/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate modular content topology
        run: python3 qa/validate_content_topology.py

      - name: Validate pinned Common first-aid data and publication gate
        run: python3 qa/validate_common_first_aid.py --verify-pinned-output

      - name: Validate Common knowledge and safety source packs
        run: python3 qa/validate_common_knowledge.py --verify-pinned-output

      - name: Validate lossless Ermak object packs
        run: python3 qa/validate_ermak.py

      - name: Validate pinned VL80S legacy knowledge cards
        run: python3 qa/validate_vl80s_legacy_knowledge.py

      - name: Validate VL80S detail-card projections over Atlas hotspots
        run: python3 qa/validate_vl80s_detail_projections.py

      - name: Validate pinned Ermak supplementary source indexes
        run: python3 qa/validate_ermak_supplement.py

      - name: Verify pinned Ermak supplemental assets and unresolved diagnostic link
        run: python3 qa/validate_ermak_supplemental_assets.py

      - name: Reconcile Ermak system map and source link indexes without runtime promotion
        run: python3 qa/validate_ermak_system_link_reconciliation.py

      - name: Test Ermak source identities and unresolved-link isolation
        run: python3 -m unittest discover -s qa -p test_ermak_reconciliation_dispositions.py

      - name: Test Ermak source-link ID gap detection
        run: python3 -m unittest discover -s qa -p test_ermak_link_id_audit.py

      - name: Verify pinned diagnostic Kotlin wrapper dispositions
        run: python3 qa/validate_ermak_diagnostic_kotlin_dispositions.py

      - name: Verify pinned Ermak generator dispositions and Stage 7 isolation
        run: python3 qa/validate_ermak_generator_dispositions.py

      - name: Test Ermak generator disposition gates
        run: python3 -m unittest discover -s qa -p test_ermak_generator_dispositions.py

      - name: Validate CHME3 family source and variant isolation
        run: python3 qa/validate_chme3.py

      - name: Validate pinned CHME3 source registries and unresolved IDs
        run: python3 qa/validate_chme3_source_registries.py

      - name: Verify CHME3 source registry dispositions
        run: python3 qa/map_chme3_source_registries.py --ledger docs/data-migration/document-object-ledger.json --verify-output

      - name: Validate pinned CHME3 family and profile sources
        run: python3 qa/validate_chme3_profiles.py

      - name: Verify CHME3 profile document dispositions
        run: python3 qa/map_chme3_profiles.py --ledger docs/data-migration/document-object-ledger.json --verify-output

      - name: Validate pinned CHME3 acceptance source documents
        run: python3 qa/validate_chme3_acceptance_sources.py

      - name: Verify CHME3 acceptance document dispositions
        run: python3 qa/map_chme3_acceptance_sources.py --ledger docs/data-migration/document-object-ledger.json --verify-output

      - name: Validate CHME3 20 by 3 applicability and requiredness boundary
        run: python3 qa/validate_chme3_acceptance_applicability.py

      - name: Verify CHME3 applicability matrix derivation
        run: python3 qa/build_chme3_acceptance_applicability.py --verify-output

      - name: Validate pinned CHME3 Atlas source pairs
        run: python3 qa/validate_chme3_atlas_sources.py

      - name: Verify CHME3 Atlas document dispositions
        run: python3 qa/map_chme3_atlas_sources.py --ledger docs/data-migration/document-object-ledger.json --verify-output

      - name: Validate pinned CHME3 diagnostic graph sources
        run: python3 qa/validate_chme3_graph_sources.py

      - name: Verify CHME3 diagnostic graph dispositions
        run: python3 qa/map_chme3_graph_sources.py --ledger docs/data-migration/document-object-ledger.json --verify-output

      - name: Validate pinned CHME3 pass3 diagnostic sources
        run: python3 qa/validate_chme3_diagnostic_sources.py

      - name: Verify CHME3 pass3 diagnostic dispositions
        run: python3 qa/map_chme3_diagnostic_sources.py --ledger docs/data-migration/document-object-ledger.json --verify-output

      - name: Validate remaining pinned CHME3 document sources
        run: python3 qa/validate_chme3_remaining_documents.py

      - name: Verify remaining CHME3 document dispositions
        run: python3 qa/map_chme3_remaining_documents.py --ledger docs/data-migration/document-object-ledger.json --verify-output

      - name: Verify complete CHME3 document-ledger coverage
        run: python3 qa/validate_chme3_document_coverage.py

      - name: Validate pinned shared locomotive family manifest
        run: python3 qa/validate_locomotive_family_manifest.py

      - name: Verify mixed-owner family manifest dispositions
        run: python3 qa/map_locomotive_family_manifest.py --ledger docs/data-migration/document-object-ledger.json --verify-output

      - name: Verify complete locomotive document-ledger coverage
        run: python3 qa/validate_locomotive_document_coverage.py

      - name: Validate TEM2 family source and training scheme data
        run: python3 qa/validate_tem2.py

      - name: Validate pinned TEM2 Stage-4 acceptance data
        run: python3 qa/validate_tem2_acceptance.py

      - name: Validate pinned TEM2 family and profile sources
        run: python3 qa/validate_tem2_profiles.py

      - name: Verify TEM2 profile document dispositions
        run: python3 qa/map_tem2_profiles.py --ledger docs/data-migration/document-object-ledger.json --verify-output

      - name: Validate pinned TEM2 Stage-2 source foundation
        run: python3 qa/validate_tem2_stage2.py

      - name: Verify TEM2 Stage-2 document dispositions
        run: python3 qa/map_tem2_stage2_document.py --ledger docs/data-migration/document-object-ledger.json --verify-output

      - name: Validate pinned TEM2 Stage-3 diagnostic lineage
        run: python3 qa/validate_tem2_stage3.py

      - name: Verify TEM2 Stage-3 document dispositions
        run: python3 qa/map_tem2_stage3_document.py --ledger docs/data-migration/document-object-ledger.json --verify-output

      - name: Validate pinned TEM2 source registry
        run: python3 qa/validate_tem2_source_registry.py

      - name: Verify TEM2 source-registry object dispositions
        run: python3 qa/map_tem2_source_registry_document.py --ledger docs/data-migration/document-object-ledger.json --verify-output

      - name: Verify TEM2 acceptance object dispositions
        run: python3 qa/map_tem2_acceptance_document.py --ledger docs/data-migration/document-object-ledger.json --verify-output

      - name: Validate cross-block migrated data array
        run: python3 qa/validate_migrated_data_array.py

      - name: Validate pinned candidate inventory
        run: python3 qa/validate_vl80s_candidate_inventory.py

      - name: Validate VL80S vertical slice packs
        run: python3 qa/validate_vl80s_vertical_slice.py

      - name: Validate migrated VL80S equipment and technical data
        run: python3 qa/validate_vl80s_equipment_migration.py

      - name: Validate VL80S profile catalog
        run: python3 qa/validate_vl80s_profile_catalog.py

      - name: Validate migrated VL80S normal values
        run: python3 qa/validate_vl80s_normal_values.py

      - name: Validate migrated VL80S acceptance
        run: python3 qa/validate_vl80s_acceptance.py

      - name: Validate migrated VL80S diagnostics
        run: python3 qa/validate_vl80s_diagnostics.py

      - name: Validate VL80S executable diagnostic runtime when present
        run: |
          if test -f content-packs/electric/vl80s/diagnostics/runtime/executable-flow.json; then
            python3 qa/validate_vl80s_diagnostic_runtime.py
          else
            echo "Executable diagnostic runtime is not generated yet."
          fi

      - name: Validate VL80S observation index when present
        run: |
          if test -f content-packs/electric/vl80s/diagnostics/observations/index.json; then
            python3 qa/validate_vl80s_observations.py
          else
            echo "VL80S observation index is not generated yet."
          fi

      - name: Validate migrated VL80S electrical and pneumatic schemes
        run: python3 qa/validate_vl80s_schemes.py

      - name: Validate migrated VL80S layout hotspots
        run: python3 qa/validate_vl80s_layout.py

      - name: Validate migrated VL80S pneumatic stepwise flows
        run: python3 qa/validate_vl80s_pneumatic_flows.py

      - name: Validate migrated VL80S electrical functional flows
        run: python3 qa/validate_vl80s_electrical_functional_flows.py

      - name: Validate VL80S model-owned safety content
        run: python3 qa/validate_vl80s_safety.py

      - name: Show project boundaries
        run: gradle projects --console=plain

      - name: Contract, runtime, assistant, UI routing and policy tests
        run: >-
          gradle
          :assistant-core:test
          :domain-contracts:test
          :content-runtime:test
          :navigation-contracts:test
          :link-router:test
          :source-policy:test
          :design-system:testDebugUnitTest
          :feature-acceptance:testDebugUnitTest
          :feature-atlas:testDebugUnitTest
          :feature-calculations:test
          :feature-diagnostics:testDebugUnitTest
          :feature-history:test
          :feature-safety:testDebugUnitTest
          --stacktrace --console=plain

      - name: Android lint
        run: gradle :design-system:lintDebug :feature-acceptance:lintDebug :feature-atlas:lintDebug :feature-diagnostics:lintDebug :feature-safety:lintDebug :app-shell:lintDebug --stacktrace --console=plain

      - name: Assemble debug
        run: gradle :design-system:assembleDebug :feature-acceptance:assembleDebug :feature-atlas:assembleDebug :feature-diagnostics:assembleDebug :feature-safety:assembleDebug :app-shell:assembleDebug --stacktrace --console=plain

      - name: Verify indexed VL80S assets in APK
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          apk = Path("app-shell/build/outputs/apk/debug/app-shell-debug.apk")
          assert apk.is_file(), apk

          index_path = Path("content-packs/electric/vl80s/runtime-index.json")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          assert index["modelId"] == "vl80s"
          assert len(index["packs"]) == len(set(index["packs"]))

          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              assert names.count("assets/electric/vl80s/runtime-index.json") == 1
              profile_catalog = index.get("profileCatalog")
              assert profile_catalog
              assert names.count("assets/" + profile_catalog) == 1
              for feature_name, feature_index in index.get("featureIndexes", {}).items():
                  assert feature_name
                  feature_asset = "assets/" + feature_index
                  assert names.count(feature_asset) == 1, (
                      feature_name,
                      feature_index,
                      names.count(feature_asset),
                  )

                  if feature_name == "atlas":
                      atlas_index = json.loads(
                          archive.read(feature_asset).decode("utf-8")
                      )
                      for layout_path in atlas_index.get("layoutMaps", []):
                          layout_asset = "assets/" + layout_path
                          assert names.count(layout_asset) == 1, (
                              layout_asset,
                              names.count(layout_asset),
                          )
                          layout_document = json.loads(
                              archive.read(layout_asset).decode("utf-8")
                          )
                          background = layout_document.get("background")
                          if background:
                              background_asset = "assets/" + background["assetPath"]
                              assert names.count(background_asset) == 1, (
                                  background_asset,
                                  names.count(background_asset),
                              )
                      for flow_path in atlas_index.get("stepwiseFlows", []):
                          flow_asset = "assets/" + flow_path
                          assert names.count(flow_asset) == 1, (
                              flow_asset,
                              names.count(flow_asset),
                          )
                          flow_document = json.loads(
                              archive.read(flow_asset).decode("utf-8")
                          )
                          background = flow_document.get("semantics", {}).get("background")
                          if background:
                              image_asset = "assets/" + background["assetPath"]
                              assert names.count(image_asset) == 1, (
                                  image_asset,
                                  names.count(image_asset),
                              )
                              assert hashlib.sha256(
                                  archive.read(image_asset)
                              ).hexdigest() == background["sha256"]
                      for flow_path in atlas_index.get("functionalFlows", []):
                          flow_asset = "assets/" + flow_path
                          assert names.count(flow_asset) == 1, (
                              flow_asset,
                              names.count(flow_asset),
                          )

                  if feature_name == "diagnostics":
                      diagnostic_index = json.loads(
                          archive.read(feature_asset).decode("utf-8")
                      )
                      if (
                          diagnostic_index.get("runtimePayloadStatus")
                          == "EXECUTABLE_FLOW_AVAILABLE"
                      ):
                          flow_path = diagnostic_index.get("executableFlow")
                          assert flow_path
                          flow_asset = "assets/" + flow_path
                          assert names.count(flow_asset) == 1, (
                              flow_asset,
                              names.count(flow_asset),
                          )
                          flow = json.loads(
                              archive.read(flow_asset).decode("utf-8")
                          )
                          assert flow["modelId"] == "vl80s"
                          assert flow["scenarioCount"] == 103
                          assert flow["questionCount"] == 318
                          assert flow["responseEdgeCount"] == 954

                      observation_path = diagnostic_index.get("observationIndex")
                      if observation_path:
                          observation_asset = "assets/" + observation_path
                          assert names.count(observation_asset) == 1, (
                              observation_asset,
                              names.count(observation_asset),
                          )
                          observation_index = json.loads(
                              archive.read(observation_asset).decode("utf-8")
                          )
                          assert observation_index["modelId"] == "vl80s"
                          assert observation_index["observationCount"] > 0
                          assert observation_index["semantics"]["searchOnly"] is True
                          assert observation_index["semantics"]["actionAuthority"] == "NONE"

              for pack in index["packs"]:
                  asset = "assets/" + pack
                  assert names.count(asset) == 1, (asset, names.count(asset))
              assert "RailBrakeCalculator.zip" not in names
              assert not any(name.startswith("assets/patch/") for name in names)

          print("VL80S_INDEXED_ASSETS_PASS", len(index["packs"]))
          PY
