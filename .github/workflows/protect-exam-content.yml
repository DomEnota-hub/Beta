name: Protect hidden exam content

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/scripts/protect_exam_content.py'
      - '.github/workflows/protect-exam-content.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev14-integration

      - name: Protect 329-question payload
        run: python3 .github/scripts/protect_exam_content.py

      - name: Verify protected mirrors
        shell: bash
        run: |
          set -euo pipefail
          cmp app/src/main/assets/exam_questions.json patch/app/src/main/assets/exam_questions.json
          cmp app/src/main/java/ru/railbrake/calculator/core/ExamQuestionRepository.kt patch/app/src/main/java/ru/railbrake/calculator/core/ExamQuestionRepository.kt
          cmp app/src/test/java/ru/railbrake/calculator/core/ExamQuestionAssetTest.kt patch/app/src/test/java/ru/railbrake/calculator/core/ExamQuestionAssetTest.kt
          ! grep -aFq '"questions"' app/src/main/assets/exam_questions.json
          ! grep -aFq 'Тепловозы классифицируются' app/src/main/assets/exam_questions.json
          grep -Fq 'ExamPayloadCodec.decode(encoded)' app/src/main/java/ru/railbrake/calculator/core/ExamQuestionRepository.kt
          grep -Fq 'AES/CBC/PKCS5Padding' app/src/main/java/ru/railbrake/calculator/core/ExamQuestionRepository.kt
          git diff --check

      - name: Commit protected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/exam_questions.json \
                  patch/app/src/main/assets/exam_questions.json \
                  app/src/main/java/ru/railbrake/calculator/core/ExamQuestionRepository.kt \
                  patch/app/src/main/java/ru/railbrake/calculator/core/ExamQuestionRepository.kt \
                  app/src/test/java/ru/railbrake/calculator/core/ExamQuestionAssetTest.kt \
                  patch/app/src/test/java/ru/railbrake/calculator/core/ExamQuestionAssetTest.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Protect hidden exam question payload'
            git push origin HEAD:dev14-integration
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: true

      - name: Extract base and overlay patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain

      - name: Debug build
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:assembleDebug --stacktrace --console=plain

      - name: Verify APK does not expose plain Q&A asset
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/exam_questions.json > /tmp/exam_questions_asset.txt
          test -s /tmp/exam_questions_asset.txt
          ! grep -aFq '"questions"' /tmp/exam_questions_asset.txt
          ! grep -aFq 'Тепловозы классифицируются' /tmp/exam_questions_asset.txt
          python3 - <<'PY'
          import base64
          from pathlib import Path
          raw = Path('/tmp/exam_questions_asset.txt').read_text()
          decoded = base64.b64decode(raw)
          assert len(decoded) > 1000
          assert not decoded.startswith(b'{')
          print('APK Q&A asset is transformed and not plain JSON')
          PY
