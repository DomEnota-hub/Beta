name: Refine Beta25 VL80S variant data

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/refine-beta25-vl80-variants.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine variant-sensitive VL80S cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip
          import io
          import json
          from pathlib import Path

          paths = [
              Path('app/src/main/assets/technical/vl80s_equipment.json.gz'),
              Path('patch/app/src/main/assets/technical/vl80s_equipment.json.gz'),
          ]

          def load(path):
              with gzip.open(path, 'rt', encoding='utf-8') as f:
                  return json.load(f)

          def save(path, data):
              raw = (json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n').encode('utf-8')
              buf = io.BytesIO()
              with gzip.GzipFile(filename='', mode='wb', fileobj=buf, mtime=0, compresslevel=9) as f:
                  f.write(raw)
              path.write_bytes(buf.getvalue())

          data = load(paths[0])
          records = data.get('records', [])
          if len(records) != 89:
              raise SystemExit(f'unexpected VL80S equipment count: {len(records)}')
          by_id = {r.get('id'): r for r in records}

          # Keep model-specific characteristics explicitly tied to the actual variant.
          ish = by_id['VL-EQ-TR-012']
          ish['modelNames'] = ['ИШ-95', 'ИШ-009']
          ish['parameters'] = [
              'ИШ-95: номинальное напряжение изоляции — 2000 В',
              'ИШ-95: номинальный ток ветви — 520 А',
              'ИШ-95: начальная индуктивность при переменном токе до 100 А, 50 Гц — не менее 2 мГн',
              'ИШ-95: индуктивность при подмагничивании током 520 А — не менее 1,5 мГн',
              'ИШ-95: активное сопротивление при +20 °C — 0,0051 Ом',
              'ИШ-95: тепловые потери при +20 °C — 1,4 кВт',
              'ИШ-95: охлаждение — воздушное принудительное, расход воздуха 20 м³/мин',
              'ИШ-95: масса — 110 кг',
              'ИШ-009: применяется на части ВЛ80С выпуска после 1989 г. с ТЭД НБ-514; масса — 97 кг, сечение обмоточного провода — 3×35 мм²',
          ]
          ish['notes'] = list(dict.fromkeys((ish.get('notes') or []) + [
              'Тип индуктивного шунта зависит от исполнения: базовые данные ИШ-95 нельзя автоматически переносить на ИШ-009; фактический аппарат сверять по документации конкретной секции.'
          ]))

          # The main-reservoir condensate collectors are a defined three-reservoir group.
          condensate = by_id['VL-EQ-PN-011']
          condensate['quantity'] = '3 на секцию (РС11, РС12, РС13)'
          condensate['parameters'] = ['Объём каждого резервуара-сборника — 3 л']

          # Do not present a mechanical recorder as universal after modernisations.
          speed = by_id['VL-EQ-SF-004']
          speed['modelNames'] = ['3СЛ-2М']
          speed['notes'] = list(dict.fromkeys((speed.get('notes') or []) + [
              '3СЛ-2М относится к базовому механическому исполнению. На модернизированных ВЛ80С канал индикации и регистрации скорости может быть выполнен другим комплексом; фактическое оборудование конкретной секции имеет приоритет.'
          ]))

          # Validate all newly introduced relation targets against the same canonical catalog.
          ids = set(by_id)
          for rec in records:
              for rel in rec.get('relations') or []:
                  target = rel.get('targetId') if isinstance(rel, dict) else None
                  if isinstance(target, str) and target.startswith('VL-EQ-') and target not in ids:
                      raise SystemExit(f"broken equipment relation: {rec.get('id')} -> {target}")

          # Ensure the first batch still satisfies the structured-card minimum after refinement.
          enriched = ['VL-EQ-HV-005', 'VL-EQ-HV-007', 'VL-EQ-TR-012', 'VL-EQ-PN-011', 'VL-EQ-SF-004', 'VL-EQ-CB-003']
          for eid in enriched:
              rec = by_id[eid]
              for key in ('purpose', 'principle', 'normalState', 'deviationSigns', 'sourceRefs'):
                  if not rec.get(key):
                      raise SystemExit(f'{eid}: missing {key}')
          if any(x in by_id['VL-EQ-HV-007'].get('aliases', []) for x in ['Л-13У1', 'Л-14М1']):
              raise SystemExit('pantograph model is still attached to the D-51 card')
          pantograph_models = set(by_id['VL-EQ-HV-002'].get('modelNames') or [])
          if not {'Л-13У1', 'Л-14М1'}.issubset(pantograph_models):
              raise SystemExit('pantograph model correction is missing')

          data['generatedAt'] = '2026-09-22'
          for path in paths:
              save(path, data)
          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit('VL80S equipment app/patch mirrors differ')
          PY
          git diff --check
          git status --short
      - name: Commit refined source data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/technical/vl80s_equipment.json.gz patch/app/src/main/assets/technical/vl80s_equipment.json.gz
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'Refine VL80S equipment variant applicability'
          git pull --rebase origin dev14-integration
          git push origin HEAD:dev14-integration
