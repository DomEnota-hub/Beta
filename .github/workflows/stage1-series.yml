name: Stage 1 diagnostics series switch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage1-series.yml'
      - 'qa/stage1_series_probe.py'
      - 'stage1/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  series:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DomEnota-hub/Test-
          ref: a3c9861f5d00c4c2993eb405541694ecead7e83a
          path: source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare Recovery8 and stage 1 fix
        run: |
          set -euo pipefail
          mkdir buildsrc
          unzip -q source/RailBrakeCalculator.zip -d buildsrc
          cp -a source/patch/. buildsrc/RailBrakeCalculator/
          ROOT=buildsrc/RailBrakeCalculator
          python3 qa/apply_recovery_patch.py "$ROOT"
          python3 qa/apply_recovery_patch2.py "$ROOT"
          python3 qa/apply_recovery_patch3.py "$ROOT"
          python3 qa/apply_recovery_patch4.py "$ROOT"
          python3 .github/scripts/apply_startup_patch.py "$ROOT"
          python3 qa/apply_recovery_patch5.py "$ROOT"
          python3 recovery6/apply_recovery_patch6.py "$ROOT"
          python3 recovery7/apply_recovery_patch7.py "$ROOT"
          python3 recovery8/apply_recovery_patch8.py "$ROOT"
          python3 stage1/apply_series_fix.py "$ROOT"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Test and build stage 1
        working-directory: buildsrc/RailBrakeCalculator
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain
      - name: Prepare focused reproduction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('qa/final_blackbox_v3.sh').read_text()
          marker = "tap_text 'Ермак' || exit 43"
          assert source.count(marker) == 1
          Path('/tmp/stage1-setup.sh').write_text(source.split(marker)[0])
          PY
      - name: Verify series on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ github.workspace }}/buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk
          OUT: ${{ github.workspace }}/stage1-evidence
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 1536
          script: bash /tmp/stage1-setup.sh && python3 qa/stage1_series_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-series-evidence
          path: stage1-evidence/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-build-and-tests
          path: |
            buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk
            buildsrc/RailBrakeCalculator/app/build/test-results/testDebugUnitTest/
          retention-days: 14
