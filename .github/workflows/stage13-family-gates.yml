name: Stage 13 family profiles and publication gates

on:
  push:
    branches:
      - audit/information-block-gaps-20261014
    paths:
      - 'app-shell/**'
      - 'content-runtime/**'
      - 'domain-contracts/**'
      - 'content-packs/electric/ermak/**'
      - 'content-packs/diesel/chme3-family/**'
      - 'content-packs/diesel/tem2-family/**'
      - '.github/workflows/stage13-family-gates.yml'
  workflow_dispatch:

jobs:
  family-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gradle-8.7-bin.zip"
          ok=0
          for url in \
            "https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip" \
            "https://downloads.gradle.org/distributions/gradle-8.7-bin.zip" \
            "https://services.gradle.org/distributions/gradle-8.7-bin.zip"; do
            rm -f "$archive"
            if curl --fail --location --retry 4 --retry-delay 6 --retry-all-errors \
              --connect-timeout 20 --max-time 300 "$url" --output "$archive" \
              && echo "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  $archive" | sha256sum --check; then
              ok=1
              break
            fi
          done
          test "$ok" -eq 1
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Family variant/source gate tests, Android lint and Debug APK
        run: gradle :app-shell:testDebugUnitTest :app-shell:lintDebug :app-shell:assembleDebug --stacktrace --console=plain
      - name: Verify APK excludes unreviewed family and research assets
        run: python3 qa/check_stage13_apk_quarantine.py
      - name: Validate pinned family packs without publishing candidates
        run: |
          python3 qa/validate_ermak.py
          python3 qa/validate_chme3.py
          python3 qa/validate_tem2.py
