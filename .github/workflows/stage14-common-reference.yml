name: Stage 14 common knowledge and safety references

on:
  push:
    branches:
      - audit/information-block-gaps-20261014
    paths:
      - 'feature-safety/**'
      - 'app-shell/**'
      - 'content-runtime/**'
      - 'content-packs/common/**'
      - 'qa/check_stage14_common_reference.py'
      - '.github/workflows/stage14-common-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gradle-8.7-bin.zip"
          ok=0
          for url in \
            "https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip" \
            "https://downloads.gradle.org/distributions/gradle-8.7-bin.zip" \
            "https://services.gradle.org/distributions/gradle-8.7-bin.zip"; do
            rm -f "$archive"
            if curl --fail --location --retry 4 --retry-delay 6 --retry-all-errors \
              --connect-timeout 20 --max-time 300 "$url" --output "$archive" \
              && echo "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  $archive" | sha256sum --check; then
              ok=1
              break
            fi
          done
          test "$ok" -eq 1
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Test common reference policy and compile app
        run: gradle :feature-safety:testDebugUnitTest :app-shell:testDebugUnitTest :app-shell:lintDebug :app-shell:assembleDebug --stacktrace --console=plain
      - name: Verify common references and action boundary in built APK
        run: python3 qa/check_stage14_common_reference.py
      - name: Verify pinned common source packs
        run: |
          python3 qa/validate_common_first_aid.py --verify-pinned-output
          python3 qa/validate_common_knowledge.py --verify-pinned-output
