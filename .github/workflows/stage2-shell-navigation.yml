name: Stage 2 shell navigation

on:
  push:
    branches:
      - audit/information-block-gaps-20261014
    paths:
      - 'app-shell/**'
      - 'navigation-contracts/**'
      - '.github/workflows/stage2-shell-navigation.yml'
  workflow_dispatch:

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.7 from pinned official GitHub release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gradle-8.7-bin.zip"
          # The primary distribution endpoint intermittently returns HTTP 504.
          # Only the pinned Gradle 8.7 artifact with the published SHA-256 is accepted.
          ok=0
          for url in \
            "https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip" \
            "https://downloads.gradle.org/distributions/gradle-8.7-bin.zip" \
            "https://services.gradle.org/distributions/gradle-8.7-bin.zip"; do
            rm -f "$archive"
            if curl --fail --location --retry 4 --retry-delay 6 --retry-all-errors \
              --connect-timeout 20 --max-time 300 "$url" --output "$archive" \
              && echo "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  $archive" | sha256sum --check; then
              ok=1
              break
            fi
            echo "Pinned Gradle download failed verification or transfer at $url; trying next official endpoint" >&2
          done
          test "$ok" -eq 1
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Unit tests, Android test APK compile, lint and debug APK
        run: gradle :navigation-contracts:test :app-shell:assembleDebugAndroidTest :app-shell:lintDebug :app-shell:assembleDebug --stacktrace --console=plain
