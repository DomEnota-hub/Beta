name: Stage 5 final Beta package
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage5-final.yml'
      - 'stage5/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SIGNING_CERT_SHA256: ea9fe9341a6ba72b585bd7ff82ce29c8fc5b7b59e76b8b134df203eaab8e2788
      RELEASE_KEYSTORE_B64: ${{ secrets.RAILBRAKE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DomEnota-hub/Test-
          ref: a3c9861f5d00c4c2993eb405541694ecead7e83a
          path: source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare final restored project
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64" || { echo 'Release keystore is unavailable in Beta'; exit 20; }
          rm -rf buildsrc final-package
          mkdir buildsrc final-package
          unzip -q source/RailBrakeCalculator.zip -d buildsrc
          cp -a source/patch/. buildsrc/RailBrakeCalculator/
          ROOT=buildsrc/RailBrakeCalculator
          python3 qa/apply_recovery_patch.py "$ROOT"
          python3 qa/apply_recovery_patch2.py "$ROOT"
          python3 qa/apply_recovery_patch3.py "$ROOT"
          python3 qa/apply_recovery_patch4.py "$ROOT"
          python3 .github/scripts/apply_startup_patch.py "$ROOT"
          python3 qa/apply_recovery_patch5.py "$ROOT"
          python3 recovery6/apply_recovery_patch6.py "$ROOT"
          python3 recovery7/apply_recovery_patch7.py "$ROOT"
          python3 recovery8/apply_recovery_patch8.py "$ROOT"
          python3 stage1/apply_series_fix.py "$ROOT"
          python3 stage3/apply_scenario_fix.py "$ROOT"
          python3 stage5/apply_final_identity.py "$ROOT"
          python3 stage2/runtime_contract_audit.py "$ROOT"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$ROOT/release.keystore"
      - name: Unit tests and signed release build
        working-directory: buildsrc/RailBrakeCalculator
        env:
          RAILBRAKE_KEYSTORE_PATH: ${{ github.workspace }}/buildsrc/RailBrakeCalculator/release.keystore
          RAILBRAKE_STORE_PASSWORD: ${{ secrets.RAILBRAKE_STORE_PASSWORD }}
          RAILBRAKE_KEY_ALIAS: ${{ secrets.RAILBRAKE_KEY_ALIAS }}
          RAILBRAKE_KEY_PASSWORD: ${{ secrets.RAILBRAKE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RAILBRAKE_STORE_PASSWORD"
          test -n "$RAILBRAKE_KEY_ALIAS"
          test -n "$RAILBRAKE_KEY_PASSWORD"
          gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain
      - name: Verify and package signed release APK
        run: |
          set -euo pipefail
          APK=buildsrc/RailBrakeCalculator/app/build/outputs/apk/release/app-release.apk
          FINAL=final-package/RailBrakeCalculator-1.2.2-beta-restored-signed.apk
          test -f "$APK"
          cp "$APK" "$FINAL"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$FINAL" | tee final-package/APKSIGNER.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNING_CERT_SHA256" final-package/APKSIGNER.txt
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$FINAL" | tee final-package/BADGING.txt
          grep -Fq "package: name='ru.railbrake.calculator' versionCode='146' versionName='1.2.2-beta-restored'" final-package/BADGING.txt
          python3 stage5/verify_final.py "$FINAL" final-package
          cp buildsrc/RailBrakeCalculator/stage2-runtime-contract.txt final-package/STAGE2_RUNTIME_CONTRACT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-1.2.2-beta-restored-signed
          path: final-package/RailBrakeCalculator-1.2.2-beta-restored-signed.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: restored-signed-control-materials
          path: |
            final-package/APKSIGNER.txt
            final-package/BADGING.txt
            final-package/FINAL_MANIFEST.json
            final-package/SHA256SUMS.txt
            final-package/STAGE2_RUNTIME_CONTRACT.txt
          if-no-files-found: error
          retention-days: 30
