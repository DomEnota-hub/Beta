name: Stage 5 final Beta package
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage5-final.yml'
      - 'stage5/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STAGE1_RUN: '35218077965'
      STAGE2_RUN: '35219038019'
      STAGE3_RUN: '35220314511'
      STAGE4_RUN: '35220469901'
    steps:
      - uses: actions/checkout@v4
      - name: Wait for and require stages 1-4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          repo='DomEnota-hub/Beta'; token=os.environ['GH_TOKEN']
          runs=[os.environ[k] for k in ('STAGE1_RUN','STAGE2_RUN','STAGE3_RUN','STAGE4_RUN')]
          for run in runs:
              for attempt in range(120):
                  req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{run}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
                  with urllib.request.urlopen(req) as r: data=json.load(r)
                  print(run,data['status'],data.get('conclusion'),flush=True)
                  if data['status']=='completed':
                      if data.get('conclusion')!='success': raise SystemExit(f'gate failed: run {run} conclusion={data.get("conclusion")}')
                      break
                  time.sleep(15)
              else: raise SystemExit(f'timeout waiting for run {run}')
          print('PASS: stages 1-4 are green')
          PY
      - uses: actions/checkout@v4
        with:
          repository: DomEnota-hub/Test-
          ref: a3c9861f5d00c4c2993eb405541694ecead7e83a
          path: source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare final restored project
        run: |
          set -euo pipefail
          mkdir buildsrc final-package
          unzip -q source/RailBrakeCalculator.zip -d buildsrc
          cp -a source/patch/. buildsrc/RailBrakeCalculator/
          ROOT=buildsrc/RailBrakeCalculator
          python3 qa/apply_recovery_patch.py "$ROOT"
          python3 qa/apply_recovery_patch2.py "$ROOT"
          python3 qa/apply_recovery_patch3.py "$ROOT"
          python3 qa/apply_recovery_patch4.py "$ROOT"
          python3 .github/scripts/apply_startup_patch.py "$ROOT"
          python3 qa/apply_recovery_patch5.py "$ROOT"
          python3 recovery6/apply_recovery_patch6.py "$ROOT"
          python3 recovery7/apply_recovery_patch7.py "$ROOT"
          python3 recovery8/apply_recovery_patch8.py "$ROOT"
          python3 stage1/apply_series_fix.py "$ROOT"
          python3 stage3/apply_scenario_fix.py "$ROOT"
          python3 stage5/apply_final_identity.py "$ROOT"
          python3 stage2/runtime_contract_audit.py "$ROOT"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Unit tests and final build
        working-directory: buildsrc/RailBrakeCalculator
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain
      - name: Verify and package signed APK
        run: |
          set -euo pipefail
          APK=buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk
          FINAL=final-package/RailBrakeCalculator-1.2.2-beta-restored.apk
          cp "$APK" "$FINAL"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$FINAL" | tee final-package/APKSIGNER.txt
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$FINAL" | tee final-package/BADGING.txt
          grep -Fq "package: name='ru.railbrake.calculator'" final-package/BADGING.txt
          grep -Fq "versionName='1.2.2-beta-restored'" final-package/BADGING.txt
          python3 stage5/verify_final.py "$FINAL" final-package
          cp buildsrc/RailBrakeCalculator/stage2-runtime-contract.txt final-package/STAGE2_RUNTIME_CONTRACT.txt
          cat > final-package/FINAL_QA.md <<EOF
          # Beta restored final QA

          Source repository: DomEnota-hub/Test- (read-only source)
          Pinned source commit: a3c9861f5d00c4c2993eb405541694ecead7e83a
          Beta build commit: $GITHUB_SHA

          Required green runs:
          - Stage 1 diagnostics series switch: $STAGE1_RUN
          - Stage 2 canonical runtime contract: $STAGE2_RUN
          - Stage 3 technical user paths: $STAGE3_RUN
          - Stage 4 full acceptance semantics: $STAGE4_RUN

          Final build repeats Recovery 1-8 + stage1 fix + stage3 scenario performance fix,
          canonical contract audit and unit tests before packaging.
          APK is Android debug-signed and independently verified by apksigner in APKSIGNER.txt.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-1.2.2-beta-restored
          path: final-package/RailBrakeCalculator-1.2.2-beta-restored.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: restored-final-control-materials
          path: |
            final-package/APKSIGNER.txt
            final-package/BADGING.txt
            final-package/FINAL_MANIFEST.json
            final-package/SHA256SUMS.txt
            final-package/STAGE2_RUNTIME_CONTRACT.txt
            final-package/FINAL_QA.md
          if-no-files-found: error
          retention-days: 30
