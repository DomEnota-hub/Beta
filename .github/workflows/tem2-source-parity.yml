name: TEM2 pinned source object parity

on:
  workflow_dispatch:
  push:
    branches:
      - audit/information-block-gaps-20261014
    paths:
      - 'qa/migrate_tem2.py'
      - 'qa/validate_tem2.py'
      - 'content-packs/diesel/tem2-family/**'
      - '.github/workflows/tem2-source-parity.yml'
  pull_request:
    paths:
      - 'qa/migrate_tem2.py'
      - 'qa/validate_tem2.py'
      - 'content-packs/diesel/tem2-family/**'
      - '.github/workflows/tem2-source-parity.yml'

permissions:
  contents: read

jobs:
  source-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch six pinned donor JSON assets
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tem2-donor"
          mkdir -p "$dir"
          for name in \
            tem2_tem2_catalog \
            tem2_tem2_diagnostics \
            tem2_tem2u_catalog \
            tem2_tem2u_diagnostics \
            tem2_scheme_layout_metadata \
            tem2_stepwise_scheme_flows; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 20 --max-time 180 \
              "https://raw.githubusercontent.com/DomEnota-hub/Test-/3176d6ee228f0ed4b78371f45209e10c1c724eff/app/src/main/assets/technical/$name.json" \
              --output "$dir/$name.json"
            base64 -w0 "$dir/$name.json" > "$dir/$name.json.b64"
          done
          echo "TEM2_DONOR_FETCHED six pinned JSON assets"
      - name: Verify all 333 donor source objects and 320 canonical candidate entries
        shell: bash
        run: python3 qa/validate_tem2.py --donor-dir "$RUNNER_TEMP/tem2-donor"
