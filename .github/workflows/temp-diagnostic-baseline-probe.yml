name: Temp diagnostic baseline probe

on:
  push:
    branches:
      - ermak-diagnostic-rework
    paths:
      - .github/workflows/temp-diagnostic-baseline-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_PARENT: 322f6c8efc02c4e3c2a596ad72d6381c0fede588
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ermak-diagnostic-rework"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract current source and add runtime probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cp -a patch/. buildsrc/RailBrakeCalculator/
          cat > buildsrc/RailBrakeCalculator/app/src/test/java/ru/railbrake/calculator/core/DiagnosticBaselineProbeTest.kt <<'KOTLIN'
          package ru.railbrake.calculator.core

          import org.junit.Assert.fail
          import org.junit.Test

          class DiagnosticBaselineProbeTest {
              @Test
              fun runtimeSnapshot() {
                  val duplicates = DiagnosticRepository.scenarios.mapNotNull { scenario ->
                      val grouped = scenario.questions.groupBy { it.key }.filterValues { it.size > 1 }
                      if (grouped.isEmpty()) null else "${scenario.id}:${grouped.mapValues { it.value.size }}"
                  }

                  fun route(id: String): String {
                      val s = DiagnosticRepository.scenario(id) ?: return "$id=MISSING"
                      val keys = s.questions.map { it.key }
                      fun next(key: String, response: DiagnosticResponse): String? =
                          DiagnosticRepository.nextQuestion(s, key, response)?.key
                      return buildString {
                          append("id=").append(id)
                          append(" keys=").append(keys)
                          if (id == "gv-no-close") {
                              val first = s.questions.firstOrNull()?.key
                              append(" first=").append(first)
                              if (first != null) {
                                  append(" first.YES=").append(next(first, DiagnosticResponse.YES))
                                  append(" first.NO=").append(next(first, DiagnosticResponse.NO))
                                  append(" first.UNKNOWN=").append(next(first, DiagnosticResponse.UNKNOWN))
                              }
                              listOf("gvc-scope", "gvc-voltage", "gvc-attempt", "gvc-load").forEach { k ->
                                  append(" ").append(k).append("[Y=").append(next(k, DiagnosticResponse.YES))
                                      .append(",N=").append(next(k, DiagnosticResponse.NO))
                                      .append(",U=").append(next(k, DiagnosticResponse.UNKNOWN)).append("]")
                              }
                          }
                          if (id == "traction-no-assemble") {
                              listOf("tna-scope", "tna-va2", "tna-apparatus", "tna-aux").forEach { k ->
                                  append(" ").append(k).append("[Y=").append(next(k, DiagnosticResponse.YES))
                                      .append(",N=").append(next(k, DiagnosticResponse.NO))
                                      .append(",U=").append(next(k, DiagnosticResponse.UNKNOWN)).append("]")
                              }
                          }
                      }
                  }

                  fail(
                      "BASELINE_PROBE duplicates=$duplicates | " +
                          route("gv-no-close") + " | " +
                          route("traction-no-assemble")
                  )
              }
          }
          KOTLIN

      - name: Run probe only
        working-directory: buildsrc/RailBrakeCalculator
        run: gradle :app:testDebugUnitTest --tests 'ru.railbrake.calculator.core.DiagnosticBaselineProbeTest.runtimeSnapshot' --stacktrace --console=plain
