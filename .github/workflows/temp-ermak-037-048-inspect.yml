name: Temp Ermak 037-048 inspect

on:
  push:
    branches: [ermak-comprehensive-audit]
    paths: [.github/workflows/temp-ermak-037-048-inspect.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Print scenario details
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip,json
          p='app/src/main/assets/technical/ermak_diagnostics.json.gz'
          with gzip.open(p,'rt',encoding='utf-8') as f:d=json.load(f)
          by={s['id']:s for s in d['scenarios']}
          for i in range(37,49):
              sid=f'ER-DIAG-{i:03d}'; s=by[sid]
              print('===',sid,s.get('title',''),'===')
              print('symptom:',s.get('symptom',''))
              print('applicability:',json.dumps(s.get('applicability',{}),ensure_ascii=False))
              print('actions:',json.dumps(s.get('actions',[]),ensure_ascii=False))
              print('sourceAgeNote:',s.get('sourceAgeNote',''))
              print('nodes:',json.dumps(s.get('graph',{}).get('nodes',[]),ensure_ascii=False))
          PY
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-ermak-037-048-inspect.yml
          git commit -m "chore: remove temporary Ermak 037-048 inspect"
          git push origin HEAD:ermak-comprehensive-audit
