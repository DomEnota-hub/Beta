name: Temp Ermak 090-092 inspect

on:
  push:
    branches: [ermak-comprehensive-audit]
    paths: [.github/workflows/temp-ermak-090-092-inspect.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Print scenarios
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip,json
          p='app/src/main/assets/technical/ermak_diagnostics.json.gz'
          with gzip.open(p,'rt',encoding='utf-8') as f:d=json.load(f)
          by={s['id']:s for s in d['scenarios']}
          for sid in ('ER-DIAG-090','ER-DIAG-091','ER-DIAG-092'):
              s=by[sid]
              print('===',sid,'===')
              for k in ('title','symptom','problem','description','category'):
                  if s.get(k) is not None: print(k+':',s.get(k))
              print('actions:',json.dumps(s.get('actions',[]),ensure_ascii=False))
              print('sourceRefs:',json.dumps(s.get('sourceRefs',[]),ensure_ascii=False))
              print('nodes:',json.dumps(s.get('graph',{}).get('nodes',[]),ensure_ascii=False))
          PY
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-ermak-090-092-inspect.yml
          git commit -m "chore: remove temporary Ermak inspect workflow"
          git push origin HEAD:ermak-comprehensive-audit
