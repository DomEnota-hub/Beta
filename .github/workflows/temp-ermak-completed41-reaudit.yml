      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract base and overlay candidate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Run full unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Run Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain

      - name: Recheck branch before commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ermak-source-reaudit-41
          test "$(git rev-parse origin/ermak-source-reaudit-41)" = "$GITHUB_SHA"

      - name: Commit audited assets and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-ermak-completed41-reaudit.yml
          git add app/src/main/assets/technical/ermak_diagnostics.json.gz patch/app/src/main/assets/technical/ermak_diagnostics.json.gz docs/ERMAK_COMPLETED41_SOURCE_REAUDIT_2026-09-26.md
          mapfile -t staged < <(git diff --cached --name-only | sort -u)
          printf '%s\n' "${staged[@]}"
          test "${#staged[@]}" -eq 4
          git commit -m "feat: re-audit completed Ermak diagnostics against external sources"
          git push origin HEAD:ermak-source-reaudit-41
