name: Temp Ermak completed41 source re-audit

on:
  push:
    branches:
      - ermak-source-reaudit-41
    paths:
      - .github/workflows/temp-ermak-completed41-reaudit.yml

permissions:
  contents: write

jobs:
  reaudit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_PARENT: bd27753d6f967259e80cdd6f4dc96a9578466634
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ermak-source-reaudit-41"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Apply completed41 external source re-audit
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, json
          from copy import deepcopy
          from pathlib import Path

          APP=Path('app/src/main/assets/technical/ermak_diagnostics.json.gz')
          PATCH=Path('patch/app/src/main/assets/technical/ermak_diagnostics.json.gz')
          ALL={
          'ER-DIAG-002','ER-DIAG-003','ER-DIAG-004','ER-DIAG-005','ER-DIAG-015','ER-DIAG-030','ER-DIAG-040','ER-DIAG-041','ER-DIAG-049','ER-DIAG-050','ER-DIAG-051','ER-DIAG-052','ER-DIAG-053','ER-DIAG-054','ER-DIAG-055','ER-DIAG-056','ER-DIAG-074','ER-DIAG-075','ER-DIAG-076','ER-DIAG-077','ER-DIAG-078','ER-DIAG-079','ER-DIAG-080','ER-DIAG-081','ER-DIAG-082','ER-DIAG-083','ER-DIAG-084','ER-DIAG-085','ER-DIAG-086','ER-DIAG-087','ER-DIAG-088','ER-DIAG-098','ER-DIAG-099','ER-DIAG-100','ER-DIAG-101','ER-DIAG-102','ER-DIAG-115','ER-DIAG-122','ER-DIAG-129','ER-DIAG-130','ER-DIAG-136'}
          IMP={'ER-DIAG-002','ER-DIAG-003','ER-DIAG-004','ER-DIAG-005','ER-DIAG-015','ER-DIAG-041','ER-DIAG-049','ER-DIAG-050','ER-DIAG-054','ER-DIAG-055','ER-DIAG-056','ER-DIAG-078','ER-DIAG-080','ER-DIAG-098','ER-DIAG-099','ER-DIAG-101','ER-DIAG-129'}
          B12={'ER-DIAG-003','ER-DIAG-004','ER-DIAG-005','ER-DIAG-015','ER-DIAG-040','ER-DIAG-041','ER-DIAG-049','ER-DIAG-050','ER-DIAG-051','ER-DIAG-052','ER-DIAG-053','ER-DIAG-054','ER-DIAG-055','ER-DIAG-056','ER-DIAG-136'}
          ROOF={'ER-DIAG-002','ER-DIAG-030','ER-DIAG-115','ER-DIAG-122','ER-DIAG-129','ER-DIAG-130'}
          PROT={'ER-DIAG-098','ER-DIAG-099','ER-DIAG-100','ER-DIAG-101','ER-DIAG-102'}
          PNEU={'ER-DIAG-074','ER-DIAG-075','ER-DIAG-076','ER-DIAG-077','ER-DIAG-078','ER-DIAG-079','ER-DIAG-080'}
          BRAKES={f'ER-DIAG-{i:03d}' for i in range(81,89)}
          V='2026-09-26'

          def ref(sid,document,locator,role,kind,label,revision,status,url=''):
              d={'sourceId':sid,'document':document,'locator':locator,'role':role,'sourceKind':kind,'version':{'label':label,'revision':revision,'verifiedAt':V,'status':status}}
              if url:d['url']=url
              return d
          R996=ref('ER-AUDIT-NORM-996R-2024','Перечень действий локомотивных бригад по выявлению и устранению неисправностей на локомотивах, распоряжение ОАО «РЖД» №996/р от 12.04.2022','Приложение 9: 2ЭС5К/3ЭС5К; публично проверена редакция №592/р от 05.03.2024','current_procedure_crosscheck','NORMATIVE','№996/р','№592/р от 05.03.2024; полнота более поздних изменений требует контроля','REQUIRES_REVIEW','https://птэ-ржд.рф/ustraneniyu-neispravnostej-na-lokomo/неисправности-на-электровозах-2эс5к-3э/')
          R1=ref('ER-AUDIT-MFR-RE1-PUBLIC','2ЭС5К/3ЭС5К. ИДМБ.661142.009РЭ1. Электрические схемы','МСУД-Н, силовые и управляющие цепи','manufacturer_technical_basis_public_copy','MANUFACTURER','ИДМБ.661142.009РЭ1','публичная копия; применимость зависит от исполнения','REQUIRES_REVIEW','https://www.rcit.su/techinfoV51.html')
          R4=ref('ER-AUDIT-MFR-RE4-PUBLIC','2ЭС5К/3ЭС5К. ИДМБ.661142.009РЭ4. Электрические аппараты и оборудование','реле, панели защит, контакторы, выключатели','manufacturer_technical_basis_public_copy','MANUFACTURER','ИДМБ.661142.009РЭ4','публичная копия; применимость зависит от исполнения','REQUIRES_REVIEW','https://rcit.su/techinfoV5.html')
          R6=ref('ER-AUDIT-MFR-RE6-PUBLIC','2ЭС5К/3ЭС5К. ИДМБ.661142.009РЭ6. Механическая часть и пневматическая система','пневмосистема и пневмооборудование','manufacturer_technical_basis_public_copy','MANUFACTURER','ИДМБ.661142.009РЭ6','публичная копия; применимость зависит от исполнения','REQUIRES_REVIEW','https://rcit.su/techinfoV56.html')
          RM=ref('ER-AUDIT-LEGACY-MSUD-MEMO','Практические рекомендации по 2ЭС5К/3ЭС5К, раннее исполнение МСУД-Н','СИ СЕТЬ / СИ САУТ / СИ СУЛР / СИ di/dt / СМЕ-МСУД','legacy_symptom_crosscheck_only','TRAINING','legacy-public-copy','не источник разрешения ремонтных действий','HISTORICAL','https://rcit.su/techinfoW04.html')
          R2580=ref('ER-AUDIT-NORM-2580R-2025','Регламент взаимодействия работников при аварийных и нестандартных ситуациях, №2580/р от 12.12.2017','редакция №387/р от 18.02.2025','current_emergency_regulation','NORMATIVE','№2580/р','№387/р от 18.02.2025','CURRENT_CONFIRMED')
          RB=ref('ER-AUDIT-NORM-BRAKES-2026','Правила технического обслуживания тормозного оборудования и управления тормозами железнодорожного подвижного состава','Приложение №65 к Протоколу №83; действует с 01.07.2026','current_brake_regulation','NORMATIVE','Приложение №65 к Протоколу №83','25–26.11.2025','CURRENT_CONFIRMED','https://prg.kz/m/amp/document/39816410/')
          RB['version']['effectiveFrom']='2026-07-01'

          def load(p):
              with gzip.open(p,'rt',encoding='utf-8') as f:return json.load(f)
          def dump(p,d):
              raw=json.dumps(d,ensure_ascii=False,separators=(',',':')).encode()
              with p.open('wb') as f:
                  with gzip.GzipFile(filename='',mode='wb',fileobj=f,mtime=0) as z:z.write(raw)
          def addref(s,r):
              a=s.setdefault('sourceRefs',[]); a[:]=[x for x in a if x.get('sourceId')!=r['sourceId']]; a.append(deepcopy(r))
          def proj(s):return s.setdefault('vl80sUiProjection',{})
          def addu(a,x):
              if x not in a:a.append(x)
          def cause(s,x):addu(proj(s).setdefault('probableCauses',[]),x)
          def ban(s,x):addu(proj(s).setdefault('prohibited',[]),x)
          def check(s,t,a,e,b,l='CAB'):
              c=proj(s).setdefault('checks',[])
              if not any(x.get('title')==t for x in c):c.append({'title':t,'action':a,'expected':e,'ifAbnormal':b,'level':l})
          def node(s,nid):return next(n for n in s['graph']['nodes'] if n.get('id')==nid)
          def prompt(s,nid,text):node(s,nid)['prompt']=text
          def labels(s,nid,ls):
              cs=node(s,nid)['choices']; assert len(cs)==len(ls)
              for c,l in zip(cs,ls):c['label']=l

          d=load(APP); p=load(PATCH); assert d==p and len(d['scenarios'])==136
          by={s['id']:s for s in d['scenarios']}; assert ALL<=set(by)
          for sid in ALL:
              s=by[sid]
              if sid in B12:
                  for r in (R996,R1,RM):addref(s,r)
                  s['sourceAgeNote']='Повторный аудит 26.09.2026: №996/р — процедурная база в последней публично подтверждённой редакции №592/р от 05.03.2024; полнота последующих изменений требует контроля. РЭ и старые рекомендации 2010 года используются только для схемной/симптомной сверки исполнения.'
              elif sid in ROOF:
                  for r in (R996,R1,R2580):addref(s,r)
                  s['sourceAgeNote']='Повторный аудит 26.09.2026: крышевые/ВВ действия остаются fail-closed. №2580/р сверено в редакции №387/р от 18.02.2025; №996/р — публично подтверждённая редакция №592/р от 05.03.2024; РЭ применяется только после подтверждения исполнения.'
              elif sid in PROT:
                  for r in (R1,R4,R996):addref(s,r)
                  s['sourceAgeNote']='Повторный аудит 26.09.2026: аппараты сверены с заводской документацией раннего исполнения; перенос на поздние/поосные исполнения только после выбора профиля. Старые обходы и отключения защит не переносятся.'
              elif sid in PNEU:
                  for r in (R6,R996):addref(s,r)
                  s['sourceAgeNote']='Повторный аудит 26.09.2026: пневматические узлы сверены с РЭ/схемой; конкретные аппараты профильны. Числовые уставки ранней документации не становятся универсальными без подтверждения исполнения.'
              elif sid in BRAKES:
                  for r in (RB,R6):addref(s,r)
                  s['sourceAgeNote']='Повторный аудит 26.09.2026: нормативная база по тормозам — новые Правила, приложение №65 к Протоколу №83, действующие с 01.07.2026. Правила 2014 года не используются как действующая база; заводские/учебные материалы — только аппаратная и профильная сверка.'
              s['sourceAudit']={'auditedAt':V,'scope':'completed41_external_crosscheck','status':'IMPROVE' if sid in IMP else 'KEEP'}

          s=by['ER-DIAG-002']; cause(s,'Для раннего профиля: отсутствие питания/разрешения цепи через SF21 либо связанный с KV44 разрешающий канал; применимость обозначений подтверждать по схеме исполнения.'); check(s,'Ранний профиль цепи подъёма','Если подтверждено раннее исполнение, сопоставить штатное состояние SF21 и разрешающего канала KV44 без шунтирования блокировок.','Понятно, теряется питание/разрешение или неисправность дальше по пневмоприводу.','Не переключать и не шунтировать цепи по одному совпадению обозначений.'); ban(s,'Не шунтировать блокировки ВВК и не использовать резервные переключения старого алгоритма без подтверждённого профиля и действующего источника.')
          s=by['ER-DIAG-003']; prompt(s,'common-permission','Есть конкретное сообщение/признак общей блокировки (для подтверждённого раннего профиля — SF22 «ГВ», SF23 «Тяга», «Цепи управления», KV44 либо запрет от положения контроллера)?'); cause(s,'Для раннего профиля: общий запрет через SF22 «ГВ», SF23 «Тяга», цепи управления/KV44 либо разрешение, связанное с нулевым положением контроллера; обозначения не переносить между профилями.'); check(s,'Ранний профиль разрешения ГВ','При подтверждённом раннем исполнении сопоставить штатную индикацию/состояние SF22, SF23, цепей управления и KV44, не воздействуя на ВВ-аппараты.','Локализован общий разрешающий канал.','Не выполнять ручное включение аппаратов и не обходить блокировки.','AUTHORIZED_ONLY')
          s=by['ER-DIAG-004']; prompt(s,'command','МСУД/управление выдаёт штатное разрешение и команду включения именно этой секции (в раннем профиле отдельно различаются цепь KV43/QF1-UA1 и разрешающий канал KV44)?'); cause(s,'Для раннего профиля: неисправность цепи включения KV43/QF1-UA1 либо разрешающего канала KV44; точное назначение подтверждать по схеме исполнения.'); check(s,'Команда раннего профиля','После подтверждения исполнения различить отсутствие команды, цепь KV43/QF1-UA1 и отсутствие разрешения KV44 только по схеме/штатной индикации.','Причина локализована без ручного воздействия на ГВ.','Не нажимать KV43 и другие аппараты вручную ради проверки.','AUTHORIZED_ONLY'); ban(s,'Не нажимать KV43 или другой аппарат вручную для принудительного включения ГВ.')
          s=by['ER-DIAG-005']; prompt(s,'first-protection','Какая первая защита/индикация появилась до отключения ГВ: ВИП U1 (KA1–KA3), ВИП U2 (KA4–KA6), земля, ВУВ/KA8, РМТ, KA9/вспомогательный канал либо иной профильный код?'); cause(s,'Для раннего профиля: защиты ВИП U1 (KA1–KA3), ВИП U2 (KA4–KA6), ВУВ/KA8, РМТ и KA9 дают разные дочерние направления; обозначения не универсальны.'); check(s,'Классификация первой защиты','После уже произошедшего отключения сопоставить первую индикацию с группой защиты конкретного профиля: KA1–KA3, KA4–KA6, земля, KA8, РМТ, KA9 или иной канал.','Выбран корректный дочерний маршрут.','Не повторять включение ради получения кода и не изолировать защиту.')
          s=by['ER-DIAG-015']; prompt(s,'messages','Есть профильное сообщение/признак конкретного силового канала; для раннего группового исполнения отдельно проверяются МПК1/МПК2 и цепь F17 как возможные причины отсутствия нагрузки?'); cause(s,'Для подтверждённого раннего группового исполнения: отказ/неработоспособность МПК1 или МПК2 либо цепь питания через F17; не переносить на поосное исполнение.'); check(s,'МПК/F17 — только ранний профиль','Если профиль подтверждён, сопоставить доступность МПК1/МПК2 и цепи F17 по схеме и штатной диагностике.','Кандидат подтверждён схемой/диагностикой, а не одной лампой.','Не переключать МПК и не заменять F17 пробно без допуска.','AUTHORIZED_ONLY'); ban(s,'Не переключать МПК1/МПК2 и не заменять F17 пробно только ради проверки гипотезы.')
          s=by['ER-DIAG-041']; prompt(s,'start','МСУД показывает «СМЕ/МСУД», «Нет связи в системе МСУД» либо ведомая секция перестала обмениваться состоянием/командами?'); cause(s,'Для раннего МСУД-Н: локальный отказ питания/блока сопряжения или межсекционного информационного соединения; конкретные SF/МПК и разъёмы только после подтверждения схемы.'); check(s,'Код потери связи','Зафиксировать точную штатную надпись («СМЕ/МСУД», «Нет связи в системе МСУД» и эквивалент профиля) и сравнить с фактической доступностью секции.','Различена потеря обмена и потеря питания/работоспособности секции.','Не переподключать межсекционные цепи под напряжением.')
          s=by['ER-DIAG-049']; prompt(s,'cause-kind','К какому типу относится первичная индикация: «СИ СЕТЬ»/высоковольтная часть, «СИ САУТ»/«СИ СУЛР»/иной safety-запрет, «СИ di/dt»/токовая защита или «СМЕ/МСУД»/потеря обмена?'); labels(s,'cause-kind',['СИ СЕТЬ / высоковольтная часть','СИ САУТ / СИ СУЛР / safety','СИ di/dt / токовая защита','СМЕ / МСУД / потеря обмена']); cause(s,'Профильные сообщения «СИ СЕТЬ», «СИ САУТ», «СИ СУЛР», «СИ di/dt», «СМЕ/МСУД» требуют разных маршрутов; числовые пороги старых памяток не универсальны.'); ban(s,'Не использовать числовой порог di/dt из старой памятки как универсальную уставку для всех исполнений.')
          s=by['ER-DIAG-050']; cause(s,'Для раннего группового исполнения при сохранённой связи и реальной потере тяги возможны профильные МПК1/МПК2/F17; только после исключения потери команды и отказа измерения.'); check(s,'Ранний групповой профиль','При подтверждённом раннем исполнении сопоставить МПК1/МПК2/F17 со схемой и первичным сообщением.','Кандидат подтверждён и не подменяет диагностику связи/измерения.','Не выполнять пробные переключения/замену предохранителя без допуска.','AUTHORIZED_ONLY')
          s=by['ER-DIAG-054']; cause(s,'Для раннего группового исполнения силовые контакторы KM41/KM42 — профильные кандидаты; в поздних исполнениях состав аппаратов может отличаться.'); check(s,'KM41/KM42 — ранний профиль','Если профиль подтверждён, сопоставить команду и обратную связь KM41/KM42 по схеме без принудительного включения.','Различены отсутствие команды, отказ аппарата и обратной связи.','Не включать контактор вручную и не подавать питание в обход управления.','AUTHORIZED_ONLY')
          s=by['ER-DIAG-055']; cause(s,'Для раннего группового исполнения при полном отсутствии тяги без явной индикации возможны МПК1/МПК2 и F17; это не универсальная причина.'); check(s,'Скрытый профильный отказ','При раннем профиле сопоставить МПК1/МПК2/F17 со штатной диагностикой и схемой после подтверждения нулевого фактического тягового тока.','Кандидат подтверждён без подмены физического признака одной лампой.','Не выполнять пробную замену F17/переключение МПК без допуска.','AUTHORIZED_ONLY')
          s=by['ER-DIAG-056']; cause(s,'Для раннего исполнения общая цепь питания/разрешения обоих БВ может включать F37; обозначение только после подтверждения профиля.'); check(s,'Общая цепь двух БВ','При подтверждённом раннем исполнении сопоставить F37 и общую разрешающую цепь обоих БВ по схеме/штатной диагностике.','Подтверждён общий канал вместо двух независимых отказов.','Не заменять F37 пробно и не обходить защиту.','AUTHORIZED_ONLY')
          s=by['ER-DIAG-078']; cause(s,'Для ранней пневмосхемы продувка главных резервуаров/маслоотделителя связана с У21–У24 и КН10–КН13; локализация только по подтверждённой схеме.'); cause(s,'Повышенный конденсат может требовать проверки МО1/МО2/МО3 и профильных сливов КН28/КН29.'); check(s,'У21–У24 / маслоотделители','При подтверждённом профиле сопоставить команду и фактический сброс У21–У24, состояние соответствующего маслоотделителя/слива.','Локализован клапан, команда либо источник влаги.','Не разбирать пневмоаппаратуру под давлением и не менять краны по догадке.','AUTHORIZED_ONLY')
          s=by['ER-DIAG-080']; cause(s,'Для ранней пневмосхемы профильными элементами вспомогательной цепи являются KM2, KO3, KP3 и SP7; применимость подтверждать по исполнению.'); check(s,'Вспомогательная цепь воздуха','Если профиль подтверждён, сопоставить вспомогательную подачу через KM2/KO3 и контроль SP7/KP3 только по схеме/безопасной индикации.','Различены общий дефицит воздуха и отказ профильной вспомогательной цепи.','Не создавать искусственное давление и не вмешиваться в арматуру без допуска.','AUTHORIZED_ONLY')
          s=by['ER-DIAG-098']; cause(s,'В раннем исполнении профильное реле земли силовых цепей обозначено KV1; не переносить обозначение без схемы.'); check(s,'Идентификатор защиты','При подтверждённом раннем профиле сверить KV1/реле земли силовых цепей.','Не перепутана земля силовой и вспомогательной сети.','Не отключать реле земли и не продолжать проверку под напряжением.','AUTHORIZED_ONLY')
