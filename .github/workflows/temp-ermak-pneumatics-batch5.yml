name: Temp Ermak pneumatics batch5

on:
  push:
    branches:
      - ermak-batch5-work
    paths:
      - .github/workflows/temp-ermak-pneumatics-batch5.yml

permissions:
  contents: write

jobs:
  deepen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: 77d74866f61079524b8c6da7952353afb552c314
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ermak-batch5-work"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Apply Ermak pneumatics batch5
        shell: bash
        run: python3 tools/deepen_ermak_p0_pneumatics_batch5.py

      - name: Verify scoped asset diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain --untracked-files=all | cut -c4- | sort -u)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "app/src/main/assets/technical/ermak_diagnostics.json.gz"
          test "${changed[1]}" = "patch/app/src/main/assets/technical/ermak_diagnostics.json.gz"
          cmp app/src/main/assets/technical/ermak_diagnostics.json.gz patch/app/src/main/assets/technical/ermak_diagnostics.json.gz
          git diff --check

      - name: Run Ermak diagnostic contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/verify_ermak_p0_deepening.py
          python3 qa/verify_ermak_p0_batch2.py
          python3 qa/verify_ermak_p0_roof_batch3.py
          python3 qa/verify_ermak_p0_protections_batch4.py
          python3 qa/verify_ermak_p0_pneumatics_batch5.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract base and overlay candidate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Run full unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Run Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain

      - name: Recheck branch before commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ermak-batch5-work
          test "$(git rev-parse origin/ermak-batch5-work)" = "$GITHUB_SHA"

      - name: Commit Ermak pneumatics batch5 and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-ermak-pneumatics-batch5.yml
          git add \
            app/src/main/assets/technical/ermak_diagnostics.json.gz \
            patch/app/src/main/assets/technical/ermak_diagnostics.json.gz
          mapfile -t staged < <(git diff --cached --name-only | sort -u)
          printf '%s\n' "${staged[@]}"
          test "${#staged[@]}" -eq 3
          git commit -m "feat: deepen Ermak pneumatic supply diagnostic routes"
          git push origin HEAD:ermak-batch5-work
