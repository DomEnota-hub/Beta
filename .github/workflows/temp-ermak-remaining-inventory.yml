name: Temp Ermak remaining inventory

on:
  push:
    branches: [ermak-comprehensive-audit]
    paths: [.github/workflows/temp-ermak-remaining-inventory.yml]

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Print remaining audit inventory
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip,json
          p='app/src/main/assets/technical/ermak_diagnostics.json.gz'
          with gzip.open(p,'rt',encoding='utf-8') as f:d=json.load(f)
          GENERIC='Отказ локальный (одна секция/узел) или общий?'
          generic=[]; no_audit=[]; source_actions=[]
          for s in d['scenarios']:
              prompts=[n.get('prompt','') for n in s.get('graph',{}).get('nodes',[]) if n.get('type')=='question']
              row=(s['id'],s.get('title',''),s.get('category',''),s.get('symptom',''),','.join(r.get('sourceId','') for r in s.get('sourceRefs',[])))
              if GENERIC in prompts: generic.append(row)
              if not s.get('sourceAudit'): no_audit.append(row)
              if any(n.get('type')=='source_action' for n in s.get('graph',{}).get('nodes',[])): source_actions.append(row)
          print('GENERIC_COUNT',len(generic))
          for x in generic: print('GENERIC|'+ '|'.join(x))
          print('NO_SOURCE_AUDIT_COUNT',len(no_audit))
          for x in no_audit: print('NOAUDIT|'+ '|'.join(x))
          print('SOURCE_ACTION_COUNT',len(source_actions))
          for x in source_actions: print('SOURCEACTION|'+ '|'.join(x))
          PY
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-ermak-remaining-inventory.yml
          git commit -m "chore: remove temporary Ermak inventory workflow"
          git push origin HEAD:ermak-comprehensive-audit
