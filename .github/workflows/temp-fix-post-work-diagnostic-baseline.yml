name: Temp fix post-Work diagnostic baseline

on:
  push:
    branches:
      - ermak-diagnostic-rework-fix
    paths:
      - .github/workflows/temp-fix-post-work-diagnostic-baseline.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_PARENT: c034e95d92800dbe15f849490ae807f67eb6add6
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ermak-diagnostic-rework-fix"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Apply baseline fix
        shell: bash
        run: python3 tools/fix_post_work_diagnostic_baseline.py

      - name: Verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain --untracked-files=all | cut -c4- | sort -u)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "app/src/main/java/ru/railbrake/calculator/core/DiagnosticRepository.kt"
          test "${changed[1]}" = "patch/app/src/main/java/ru/railbrake/calculator/core/DiagnosticRepository.kt"
          cmp app/src/main/java/ru/railbrake/calculator/core/DiagnosticRepository.kt patch/app/src/main/java/ru/railbrake/calculator/core/DiagnosticRepository.kt
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract base and overlay candidate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Run full unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Run Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain

      - name: Recheck branch before commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ermak-diagnostic-rework-fix
          test "$(git rev-parse origin/ermak-diagnostic-rework-fix)" = "$GITHUB_SHA"

      - name: Commit baseline fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DomEnota-hub"
          git config user.email "domenota6212@gmail.com"
          git add app/src/main/java/ru/railbrake/calculator/core/DiagnosticRepository.kt patch/app/src/main/java/ru/railbrake/calculator/core/DiagnosticRepository.kt
          git commit -m "fix: preserve deepened VL80S diagnostic routes"
          git push origin HEAD:ermak-diagnostic-rework-fix
