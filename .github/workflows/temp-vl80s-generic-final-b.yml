name: Temp VL80S final generic cleanup

on:
  push:
    branches:
      - diagnostic-rework
    paths:
      - .github/workflows/temp-vl80s-generic-final-b.yml

permissions:
  contents: write

jobs:
  deepen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: b5875117c4445fdfe0d6713012e2167c3253753d
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "diagnostic-rework"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Apply final VL80S generic cleanup
        run: python3 .github/scripts/apply_vl80s_generic_final_b.py

      - name: Verify scoped diff and mirrors
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain --untracked-files=all | cut -c4- | sort -u)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 8
          for p in \
            app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt \
            patch/app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt \
            app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericRouteRegressionTest.kt \
            patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericRouteRegressionTest.kt \
            app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericFinalBatchBTest.kt \
            patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericFinalBatchBTest.kt \
            app/src/test/java/ru/railbrake/calculator/core/DiagnosticUniversalRouteAuditTest.kt \
            patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticUniversalRouteAuditTest.kt; do
              printf '%s\n' "${changed[@]}" | grep -Fxq "$p"
          done
          cmp app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt patch/app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt
          cmp app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericRouteRegressionTest.kt patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericRouteRegressionTest.kt
          cmp app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericFinalBatchBTest.kt patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericFinalBatchBTest.kt
          cmp app/src/test/java/ru/railbrake/calculator/core/DiagnosticUniversalRouteAuditTest.kt patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticUniversalRouteAuditTest.kt
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract base and overlay candidate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Run full unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Report zero-universal audit
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          grep -Rho 'VL80S_STRICT_GENERIC_[A-Z_]*=[^<]*' app/build/test-results/testDebugUnitTest || true
          grep -Rho 'VL80S_LEGACY_GENERIC_HITS=[^<]*' app/build/test-results/testDebugUnitTest || true
          grep -Rho 'VL80S_DUPLICATE_QUESTION_TREES=[^<]*' app/build/test-results/testDebugUnitTest || true

      - name: Run Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain

      - name: Recheck branch before commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin diagnostic-rework
          test "$(git rev-parse origin/diagnostic-rework)" = "$GITHUB_SHA"

      - name: Commit final VL80S generic cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt \
            patch/app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt \
            app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericRouteRegressionTest.kt \
            patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericRouteRegressionTest.kt \
            app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericFinalBatchBTest.kt \
            patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericFinalBatchBTest.kt \
            app/src/test/java/ru/railbrake/calculator/core/DiagnosticUniversalRouteAuditTest.kt \
            patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticUniversalRouteAuditTest.kt
          mapfile -t staged < <(git diff --cached --name-only | sort -u)
          test "${#staged[@]}" -eq 8
          git commit -m "feat: eliminate remaining VL80S universal diagnostic routes"
          git push origin HEAD:diagnostic-rework
