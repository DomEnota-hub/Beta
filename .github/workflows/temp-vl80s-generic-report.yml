name: Temp VL80S strict generic report

on:
  push:
    branches:
      - diagnostic-rework
    paths:
      - .github/workflows/temp-vl80s-generic-report.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_PARENT: 0e559d04a650fdbef45464779abaae3345a34732
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "diagnostic-rework"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract candidate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Instrument copied regression test with exact IDs
        shell: bash
        run: |
          set -euo pipefail
          cat > buildsrc/RailBrakeCalculator/app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericRouteRegressionTest.kt <<'KOTLIN'
          package ru.railbrake.calculator.core

          import org.junit.Assert.assertTrue
          import org.junit.Test

          class DiagnosticGenericRouteRegressionTest {
              @Test
              fun reportStrictGenericRoutes() {
                  val genericRoot = "Признак относится только к одной секции, тележке или группе?"
                  val strictGeneric = DiagnosticRepository.scenarios.filter { scenario ->
                      scenario.questions.firstOrNull()?.text == genericRoot
                  }
                  val ids = strictGeneric.map { it.id }.sorted()
                  println("VL80S_STRICT_GENERIC_IDS=" + ids.joinToString(","))
                  println("VL80S_STRICT_GENERIC_ROUTES=" + ids.size)
                  assertTrue("expected checkpoint <= 9 but got ${ids.size}: $ids", ids.size <= 9)
              }
          }
          KOTLIN

      - name: Run exact runtime report
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --tests ru.railbrake.calculator.core.DiagnosticGenericRouteRegressionTest --console=plain
          grep -Rho 'VL80S_STRICT_GENERIC_[A-Z_]*=[^<]*' app/build/test-results/testDebugUnitTest || true

      - name: Ensure repository remained read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all | grep -v '^?? buildsrc/' || true)"
