name: Temp VL80S P0 deepening batch 1

on:
  push:
    branches:
      - diagnostic-rework
    paths:
      - .github/workflows/temp-vl80s-p0-batch1.yml
      - .github/scripts/deepen_vl80s_p0_batch1.py

permissions:
  contents: write

jobs:
  deepen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: 612ffe4d43bb50d62df57755d8a1a2e2f1f17956
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "diagnostic-rework"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Apply P0 deepening batch 1
        run: python3 .github/scripts/deepen_vl80s_p0_batch1.py

      - name: Verify scoped diff and mirrors
        shell: bash
        run: |
          set -euo pipefail
          allowed=(
            app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt
            patch/app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt
            app/src/test/java/ru/railbrake/calculator/core/DiagnosticP0DeepeningTest.kt
            patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticP0DeepeningTest.kt
          )
          mapfile -t changed < <(git status --porcelain --untracked-files=all | cut -c4- | sort -u)
          test "${#changed[@]}" -eq 4
          for path in "${changed[@]}"; do
            ok=false
            for candidate in "${allowed[@]}"; do
              if [[ "$path" == "$candidate" ]]; then ok=true; break; fi
            done
            $ok || { echo "Unexpected changed path: $path"; exit 1; }
          done
          cmp app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt patch/app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt
          cmp app/src/test/java/ru/railbrake/calculator/core/DiagnosticP0DeepeningTest.kt patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticP0DeepeningTest.kt
          python3 qa/verify_diagnostic_graphs.py app/src/main/assets

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract base and overlay candidate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Run unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Run Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain

      - name: Recheck branch before commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin diagnostic-rework
          test "$(git rev-parse origin/diagnostic-rework)" = "$GITHUB_SHA"

      - name: Commit guarded diagnostic batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt \
            patch/app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt \
            app/src/test/java/ru/railbrake/calculator/core/DiagnosticP0DeepeningTest.kt \
            patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticP0DeepeningTest.kt
          mapfile -t staged < <(git diff --cached --name-only | sort -u)
          test "${#staged[@]}" -eq 4
          git commit -m "feat: deepen first VL80S P0 diagnostic routes"
          git push origin HEAD:diagnostic-rework
