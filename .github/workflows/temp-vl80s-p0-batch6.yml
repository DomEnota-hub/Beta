name: Temp VL80S P0 deepening batch 6

on:
  push:
    branches:
      - diagnostic-rework
    paths:
      - .github/workflows/temp-vl80s-p0-batch6.yml
      - .github/scripts/deepen_vl80s_p0_batch6.py

permissions:
  contents: write

jobs:
  deepen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: e059bef6d8414dbd4021749388054e1fe4288341
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "diagnostic-rework"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
      - name: Apply P0 deepening batch 6
        run: python3 .github/scripts/deepen_vl80s_p0_batch6.py
      - name: Verify scoped diff and mirrors
        shell: bash
        run: |
          set -euo pipefail
          allowed=(
            app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt
            patch/app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt
            app/src/test/java/ru/railbrake/calculator/core/DiagnosticP0DeepeningBatch6Test.kt
            patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticP0DeepeningBatch6Test.kt
            app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericRouteRegressionTest.kt
            patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericRouteRegressionTest.kt
          )
          mapfile -t changed < <(git status --porcelain --untracked-files=all | cut -c4- | sort -u)
          test "${#changed[@]}" -eq 6
          for path in "${changed[@]}"; do
            ok=false
            for candidate in "${allowed[@]}"; do
              if [[ "$path" == "$candidate" ]]; then ok=true; break; fi
            done
            $ok || { echo "Unexpected changed path: $path"; exit 1; }
          done
          cmp app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt patch/app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt
          cmp app/src/test/java/ru/railbrake/calculator/core/DiagnosticP0DeepeningBatch6Test.kt patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticP0DeepeningBatch6Test.kt
          cmp app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericRouteRegressionTest.kt patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericRouteRegressionTest.kt
          python3 qa/verify_diagnostic_graphs.py app/src/main/assets
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract base and overlay candidate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/
      - name: Run unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain
      - name: Report strict generic route count
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          XML=$(find app/build/test-results/testDebugUnitTest -name 'TEST-ru.railbrake.calculator.core.DiagnosticGenericRouteRegressionTest.xml' -print -quit)
          test -n "$XML"
          grep -o 'VL80S_STRICT_GENERIC_ROUTES=[0-9]*' "$XML" | tail -n1
      - name: Run Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain
      - name: Recheck branch before commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin diagnostic-rework
          test "$(git rev-parse origin/diagnostic-rework)" = "$GITHUB_SHA"
      - name: Commit guarded diagnostic batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt \
            patch/app/src/main/java/ru/railbrake/calculator/core/DiagnosticDeepening.kt \
            app/src/test/java/ru/railbrake/calculator/core/DiagnosticP0DeepeningBatch6Test.kt \
            patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticP0DeepeningBatch6Test.kt \
            app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericRouteRegressionTest.kt \
            patch/app/src/test/java/ru/railbrake/calculator/core/DiagnosticGenericRouteRegressionTest.kt
          mapfile -t staged < <(git diff --cached --name-only | sort -u)
          test "${#staged[@]}" -eq 6
          git commit -m "feat: deepen final VL80S P0 generic routes"
          git push origin HEAD:diagnostic-rework
