name: Trigger Beta26 safe build

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/trigger-beta26-safe-build.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Dev14 safe build v2 at current branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dev14-safe-build-v2.yml --repo DomEnota-hub/Beta --ref dev14-integration
