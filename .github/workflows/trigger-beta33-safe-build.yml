name: Trigger Beta33 safe build

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/trigger-beta33-safe-build.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stale branch state
        shell: bash
        run: |
          set -euo pipefail
          expected="e27e2f0feddc600858374cc13a3097b01442e475"
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$expected" || { echo "Expected dispatcher parent $expected, got $parent"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before safe-build dispatch'; exit 1; }

      - name: Dispatch main safe build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/dev14-safe-build-v2.yml/dispatches" \
            -d '{"ref":"dev14-integration"}'
