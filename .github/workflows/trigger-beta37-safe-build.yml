name: Trigger Beta37 safe build

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/trigger-beta37-safe-build.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev14-integration
      - name: Guard Beta37 source
        shell: bash
        run: |
          set -euo pipefail
          expected="339d0d9f4790b11f488daf8adce187a04dd0737f"
          test "$(git rev-parse HEAD^)" = "$expected" || { echo "Unexpected trigger parent: $(git rev-parse HEAD^)"; exit 1; }
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)" || { echo 'Branch moved before Beta37 safe-build dispatch'; exit 1; }
      - name: Dispatch Dev14 safe build v2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run dev14-safe-build-v2.yml --ref dev14-integration
          echo 'Dispatched Dev14 safe build v2 for Beta37'
