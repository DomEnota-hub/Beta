name: Trigger current emulator smoke

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/trigger-current-emulator-smoke.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify source and dispatch emulator smoke
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_HEAD: 326e4b27420a7088f1fc40e2366a195be3a3f7f8
          EXPECTED_VERSION_CODE: "199"
          EXPECTED_VERSION_NAME: 1.2.2-dev14-beta50.3
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE_HEAD"
          git fetch origin dev14-integration
          test "$(git rev-parse origin/dev14-integration)" = "$GITHUB_SHA"
          for build_file in app/build.gradle.kts patch/app/build.gradle.kts; do
            grep -Fq "versionCode = $EXPECTED_VERSION_CODE" "$build_file"
            grep -Fq "versionName = \"$EXPECTED_VERSION_NAME\"" "$build_file"
          done
          gh workflow run dev14-emulator-smoke.yml --ref dev14-integration
