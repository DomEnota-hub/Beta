name: Trigger current safe build

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/trigger-current-safe-build.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-safe-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Guard source HEAD, branch HEAD, mirrors and version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE_HEAD="212f35a0ac8a4a2a60476be8ec2fa786b5fb1e2d"
          EXPECTED_VERSION_CODE='versionCode = 191'
          EXPECTED_VERSION_NAME='versionName = "1.2.2-dev14-beta46"'

          git fetch origin dev14-integration --no-tags
          ACTUAL_PARENT="$(git rev-parse HEAD^)"
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          ORIGIN_HEAD="$(git rev-parse origin/dev14-integration)"

          test "$ACTUAL_PARENT" = "$EXPECTED_SOURCE_HEAD" || {
            echo "Source HEAD mismatch: expected $EXPECTED_SOURCE_HEAD, got $ACTUAL_PARENT" >&2
            exit 1
          }
          test "$ACTUAL_HEAD" = "$ORIGIN_HEAD" || {
            echo "Branch moved: trigger HEAD=$ACTUAL_HEAD origin/dev14-integration=$ORIGIN_HEAD" >&2
            exit 1
          }

          grep -Fq "$EXPECTED_VERSION_CODE" app/build.gradle.kts
          grep -Fq "$EXPECTED_VERSION_NAME" app/build.gradle.kts
          grep -Fq "$EXPECTED_VERSION_CODE" patch/app/build.gradle.kts
          grep -Fq "$EXPECTED_VERSION_NAME" patch/app/build.gradle.kts

          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/java/ru/railbrake/calculator/core/KnowledgeRepository.kt patch/app/src/main/java/ru/railbrake/calculator/core/KnowledgeRepository.kt
          cmp app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          cmp app/src/main/java/ru/railbrake/calculator/core/TechnicalPresentation.kt patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalPresentation.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt patch/app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/FirstAidScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/FirstAidScreen.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/HomeScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/HomeScreen.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/KnowledgeBaseScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/KnowledgeBaseScreen.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt

          echo "Guard passed"
          echo "source_head=$EXPECTED_SOURCE_HEAD"
          echo "trigger_head=$ACTUAL_HEAD"

      - name: Dispatch Dev14 safe build v2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run dev14-safe-build-v2.yml --ref dev14-integration
