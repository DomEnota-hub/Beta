name: Trigger current safe build

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/trigger-current-safe-build.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard source and version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE_SHA="7347ed6d8c6d13f2cd11be8e1ab8bd4c2af2eaf7"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE_SHA"
          git fetch origin dev14-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev14-integration)"
          grep -Fq 'versionCode = 193' app/build.gradle.kts
          grep -Fq 'versionName = "1.2.2-dev14-beta47.1"' app/build.gradle.kts
          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/java/ru/railbrake/calculator/core/KnowledgeRepository.kt patch/app/src/main/java/ru/railbrake/calculator/core/KnowledgeRepository.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/KnowledgeBaseScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/KnowledgeBaseScreen.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/SafetyScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/SafetyScreen.kt
          grep -Fq 'SafetyScreen(onBack = { screenName = AppScreen.HOME.name })' app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt

      - name: Dispatch Dev14 safe build v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dev14-safe-build-v2.yml --ref dev14-integration
