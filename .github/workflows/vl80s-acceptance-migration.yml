name: Migrate VL80S acceptance packs

on:
  workflow_dispatch:
  push:
    branches:
      - modular-rebuild
    paths:
      - 'qa/migrate_vl80s_acceptance.py'
      - 'qa/validate_vl80s_acceptance.py'
      - '.github/workflows/vl80s-acceptance-migration.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Ensure branch has not moved
        run: |
          git fetch origin modular-rebuild
          test "$(git rev-parse origin/modular-rebuild)" = "$GITHUB_SHA"

      - name: Export verified donor
        run: python3 qa/export_vl80s_donor.py

      - name: Generate modular acceptance packs
        run: python3 qa/migrate_vl80s_acceptance.py

      - name: Validate generated acceptance and relations
        run: |
          python3 qa/validate_vl80s_acceptance.py
          python3 qa/validate_vl80s_diagnostics.py
          python3 qa/validate_vl80s_equipment_migration.py
          python3 qa/validate_vl80s_schemes.py
          git diff --check

      - name: Reject unreviewed generated content changes
        run: git diff --exit-code -- content-packs/electric/vl80s
