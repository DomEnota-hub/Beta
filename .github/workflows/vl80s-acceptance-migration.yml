name: Migrate VL80S acceptance packs

on:
  workflow_dispatch:
  push:
    branches:
      - modular-rebuild
    paths:
      - 'qa/migrate_vl80s_acceptance.py'
      - 'qa/validate_vl80s_acceptance.py'
      - '.github/workflows/vl80s-acceptance-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Ensure branch has not moved
        run: |
          git fetch origin modular-rebuild
          test "$(git rev-parse origin/modular-rebuild)" = "$GITHUB_SHA"

      - name: Export verified donor
        run: python3 qa/export_vl80s_donor.py

      - name: Generate modular acceptance packs
        run: python3 qa/migrate_vl80s_acceptance.py

      - name: Validate generated acceptance
        run: |
          python3 qa/validate_vl80s_acceptance.py
          python3 qa/validate_vl80s_equipment_migration.py
          python3 qa/validate_vl80s_schemes.py
          git diff --check

      - name: Commit generated VL80S acceptance
        id: generated
        run: |
          git add content-packs/electric/vl80s
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Acceptance packs already match the pinned donor."
            exit 0
          fi
          git config user.name "DomEnota-maker"
          git config user.email "dk3093706@gmail.com"
          git commit -m "feat: migrate full VL80S acceptance"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push only if branch is still ours
        if: steps.generated.outputs.changed == 'true'
        run: |
          git fetch origin modular-rebuild
          remote_head="$(git rev-parse origin/modular-rebuild)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "modular-rebuild moved to $remote_head; refusing non-fast-forward push."
            exit 1
          fi
          git push origin HEAD:modular-rebuild
