name: Wire Ermak Stage 7 links into technical cards

on:
  push:
    branches: [dev14-integration]
    paths:
      - '.github/workflows/wire-ermak-stage7-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev14-integration
          fetch-depth: 0

      - name: Apply canonical Stage 7 link wiring
        run: python3 .github/scripts/wire_ermak_stage7_links.py

      - name: Verify mirrors and canonical graph contract
        shell: bash
        run: |
          set -euo pipefail
          cmp app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt \
              patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          python3 - <<'PY'
          import gzip,json
          from pathlib import Path
          kt=Path('app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt').read_text(encoding='utf-8')
          required=[
            'json("technical/ermak_links.json").obj("indexes")',
            'private fun ermakEquipmentLinks(equipmentId: String)',
            'private fun ermakSystemLinks(systemId: String)',
            'private fun ermakKnowledgeLinks(article: JSONObject)',
            'block("Статья", listOfNotNull(canonicalLinks.optString("equipmentArticleId")',
            'block("Диагностика", canonicalLinks.array("diagnosticIds").strings())',
            'block("Схемы", canonicalLinks.array("schemeIds").strings())',
          ]
          for needle in required:
              assert needle in kt, needle
          # Scheme -> diagnostics is intentionally not wired here: Stage 7 requires
          # selected execution/profile filtering before hotspot diagnostic exposure.
          with gzip.open('app/src/main/assets/technical/ermak_links.json.gz','rt',encoding='utf-8') as f:
              links=json.load(f)
          stats=links['statistics']
          assert stats['equipment']==111
          assert stats['equipmentWithExactlyOneEquipmentArticle']==111
          assert stats['equipmentWithDiagnostics']==111
          assert stats['equipmentWithSchemes']==111
          idx=links['indexes']['byEquipment']
          expected={
            'ER-EQ-HV-004':('ER-KB-EQ-ER-EQ-HV-004','ER-DIAG-003','ER-SCH-EL-BASE-POWER'),
            'ER-EQ-TR-004':('ER-KB-EQ-ER-EQ-TR-004','ER-DIAG-007','ER-SCH-EL-BASE-POWER'),
            'ER-EQ-BR-014':('ER-KB-EQ-ER-EQ-BR-014','ER-DIAG-091','ER-SCH-PN-BRAKE-395'),
            'ER-EQ-SF-001':('ER-KB-EQ-ER-EQ-SF-001','ER-DIAG-089','ER-SCH-SAFETY-BASE'),
          }
          for eid,(article,diag,scheme) in expected.items():
              row=idx[eid]
              assert row['equipmentArticleId']==article,(eid,row['equipmentArticleId'])
              assert diag in row['diagnosticIds'],(eid,diag)
              assert scheme in row['schemeIds'],(eid,scheme)
          br=idx['ER-EQ-BR-014']
          assert 'ER-SCH-PN-BRAKE-395' in br['schemeIds']
          assert not any('130' in x for x in br['schemeIds']),br['schemeIds']
          print('Stage 7 canonical equipment/system/article/diagnostic contract verified')
          PY
          expected=$(printf '%s\n' \
            app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt \
            patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"
          git diff --check

      - name: Commit repository wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt \
                  patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt \
            patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt | sort > /tmp/expected.txt
          cmp /tmp/changed.txt /tmp/expected.txt
          git commit -m 'Wire Ermak Stage 7 links into technical cards'
          git push origin HEAD:dev14-integration

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: true

      - name: Extract base and overlay patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain

      - name: Debug build
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:assembleDebug --stacktrace --console=plain
